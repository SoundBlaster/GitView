id: GITVIEW-SPEC-0045
title: GitView - Confirm and recover repository selection
kind: spec
created_at: '2026-11-14T14:00:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0022
depends_on:
- GITVIEW-SPEC-0025
- GITVIEW-SPEC-0036
- GITVIEW-SPEC-0038
sources:
  parent: docs/drafts/GITVIEW-SPEC-0022.yaml
  lifecycle: docs/drafts/GITVIEW-SPEC-0025.yaml
  github_user_access: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/authenticating-with-a-github-app-on-behalf-of-a-user
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Selecting repositories does not create saved Projects until the operator confirms a nonempty selection.
- Each confirmed selection entry has an individually attributable result: saved or reused when supported, pending or unresolved when the outcome is not established, or failed when non-application is confirmed. A saved or reused default Project contains that same confirmed Repository.
- A partial save followed by retry does not duplicate already saved default associations or roll back unrelated saved Projects.
- Cancelling an unconfirmed selection preserves saved Projects; cancellation after partial saving does not imply that already completed saves were undone.
- Submitted entries retain enough durable evidence to reconcile uncertain effects; saving or restoring the entire pending multi-selection is not required.
specification:
  objective: Make the results of a multi-repository setup confirmation recoverable and attributable to the correct source identities.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:GitHub
  contract:
    default_design_status: This setup protocol refines the agent-authored persistent-association candidate of 0025. Its detailed batch and recovery behavior is not independently selected by the owner; preserve the agreed default, correct identities and safe, attributable outcomes if an alternative is adopted. See project-default-association-review-20261115.md.
    pending: A pending selection is separate from saved Project membership. An empty selection cannot be confirmed as a saved empty Project. Cancel before confirmation discards pending choices only.
    identity: Evaluate each selected entry by confirmed source Repository identity under 0002 and 0038. A duplicate reference to the same confirmed Repository in one selection is one entry; equal names or incomplete IDs do not prove two entries are identical.
    confirmation: On explicit confirmation, for each eligible selected Repository reuse its existing default association under 0025 if the associated Project still contains that Repository; if no association exists and no earlier save remains indeterminate, establish a separate single-repository default Project. An inconsistent or unreadable association is unresolved under 0052, not evidence of absence. Before confirmation, disclose whether the currently known result is reuse, creation or unresolved, including creation of a separate Project when the Repository already belongs to a non-default Project; reevaluate at execution because the configuration may change. Any disclosed Project and Repository details remain subject to 0036. The operation does not silently add the selected Repository to an arbitrary custom Project or combine selected Repositories into a multi-member Project.
    changed_reviewed_outcome: The reviewed outcome is part of the operator's confirmation for that batch entry. If the operator confirmed creation of a new default but another valid association is established before this entry's own effect, do not silently present reuse of that different Project as the reviewed creation. Report the changed situation or recoverable conflict, identify the eligible existing Project only where its details are permitted, and offer a new explicit review and confirmation for a reuse intent. The earlier submitted operation retains its own outcome or indeterminate status under 0103 and 0052; reconcile any effect that may still commit before admitting a conflicting new one. Independently completed batch entries remain intact. This candidate does not prevent safe idempotent redelivery of the same operation or imply that an existing default has been deleted.
    reviewed_reuse_disappears: If the operator confirmed reuse of a particular valid default Project but that association or required membership is removed or becomes unverifiable before the operation's coordinated effect, do not turn the old confirmation into creation of a new Project or reuse of a different Project. Report a supported conflict or uncertainty, retain independent completed entries, and offer a new review of the actual permitted choices after any possibly committing earlier operation has been reconciled. A historical reuse receipt that already committed remains attributable to that earlier operation, but does not establish the association is still current.
    durable_intent: The selected minimal working design retains the information needed to reconcile each submitted Project mutation and its supported outcome; it does not require saving the whole selected set or a persistent batch journal before starting. Unsubmitted selections may remain in memory and can be lost on process termination. This choice preserves the saved default association and safe retries under 0052 and 0103; it is not a claim that a specific provider has already implemented recovery.
    name_before_admission: For a new default Project, prepare the proposed initial name from the permitted observed Repository name under 0022 and validate it under 0111. If the name is unavailable or invalid, leave that entry unresolved and allow the operator to provide and explicitly confirm a valid name before submitting its creation; other eligible batch entries remain independent. A pending name is not a saved Project or authorization to bypass current identity and access checks. Bind the actual proposed name and confirmed Repository identity to the entry's logical creation operation under 0103 before the effect can commit. The batch recovery record need not retain source text; any durable name or operation binding required for reconciliation is protected local Project-related data under 0036 and the storage policy, not a diagnostic. If an unsubmitted pending name is not recoverable after restart, request it again rather than substitute one. If a submitted creation has an indeterminate outcome, reconcile that original named operation before accepting a replacement that could duplicate it. If an independently valid default association becomes available before commit, apply changed_reviewed_outcome and 0052 without renaming its Project.
    unresolved_identity_recovery: Do not submit an entry until its Repository identity is supported. A pending unsubmitted identity that is lost on restart may be selected and confirmed again; do not reconstruct it from a name or position. Submitted effects are reconciled under their own supported operation and identity evidence. Retaining an unresolved pending batch entry across restart is optional.
    outcomes: Each selected Repository has an observable result of saved, reused, pending, failed or unresolved identity/access. A multi-selection is complete only when all selected entries have a saved or reused result. The exact UI may summarize these outcomes but must permit the operator to identify entries needing attention.
    local_recovery_feedback: Per-entry setup results distinguish a confirmed non-application or conflict from an indeterminate local outcome and from source identity or access failure. For confirmed contention, insufficient capacity or protected storage unavailability, offer an accessible appropriate recovery route where supported without exposing private identifiers; if the cause is unknown, do not invent a specific diagnosis. An admitted indeterminate entry is reconciled under its original operation identity before a retry that might duplicate it; an unsubmitted pending choice needs no submitted-operation reconciliation. Already confirmed entries retain their own recoverable outcomes, subject to independent later changes. Do not silently reset local configuration or claim that a GitHub login alone resolves a local write failure.
    interrupted: If a failure or interruption occurs after some entries have saved, keep those completed saves and record or present unresolved entries as not yet confirmed. Retry works from the current saved associations and is idempotent for already completed entries. Do not claim an all-or-nothing rollback when saves have actually occurred.
    cancel_after_start: If the operator cancels after saves have started, no further unsaved entry is intentionally submitted. A save already confirmed remains saved; an in-flight outcome whose completion is not yet known must be resolved or reported unknown before retry can safely claim no Project exists. Exact in-flight cancellation mechanics are implementation decisions.
    restart: After process termination, read confirmed saved Projects independently and reconcile submitted effects whose outcome remains uncertain under 0052. Do not automatically submit previously unstarted selections. If an unsubmitted selection was not retained, the operator can select it again; its absence is neither a confirmed failed save nor proof that an already submitted write did not commit.
    cancelled_durably: Cancellation stops further admissions from the active selection in the running process. An already admitted write can still commit and its result must be reconciled; cancellation does not claim rollback. On restart an unretained selection is not automatically resumed, so a persistent batch-cancellation record is not required solely to stop its unsubmitted entries. A future deliberate selection uses current identity, access and confirmation; reconcile a conflicting uncertain prior effect first. A stronger durable batch and cancellation protocol remains optional.
    recovery_access: Any retained submitted-operation evidence remains subject to current disclosure rules under 0036 and does not itself restore GitHub access. If the saved configuration or evidence required to reconcile an admitted write is unreadable, show a local recovery problem and avoid a potentially duplicating retry; do not claim a complete list of prior unsent choices.
    access_change: If identity or relevant access cannot be confirmed for a selected entry at processing time, do not create a Project under a fabricated or substituted Repository identity. Keep the entry unresolved or failed with a retry or recovery route; already completed entries remain intact. A temporary network failure alone is not an explicit access denial.
    admission_evidence: Before admitting an entry, evaluate the latest applicable locally accepted source identity and access evidence against the active account, Repository and setup policy. Coordinate that admission with locally established account replacement, denial or cancellation; if a conflicting local change takes effect first, the earlier evidence alone cannot authorize a new entry. If the policy cannot determine whether the evidence is adequate, return an unresolved entry rather than assume access. This is a local ordering guarantee, not an atomic transaction with GitHub.
    remote_change_window: A source grant can change after the last successful observation and before a local commit without GitView knowing. A saved Project may therefore reflect the supported access context used at admission, but the save must not claim uninterrupted or newly verified GitHub access at the local commit time. When a later applicable denial or changed grant is established, immediately apply 0036 to source-derived data, retain the already saved local Project and membership under 0025, and report the source limitation separately. The criteria for sufficient evidence and any refresh policy remain to be specified; do not invent a numeric freshness threshold.
    account_change: If the confirmed source account changes while a selection is pending or a confirmed batch still has unsubmitted entries, do not silently apply the earlier confirmation under the new identity. Preserve known completed and indeterminate outcomes for reconciliation without disclosing restricted data. Remaining entries need explicit operator confirmation in the new account context and fresh applicable source identity and access evidence; previously submitted writes may still complete and are reconciled independently. Returning to the same source identity does not by itself prove Repository access or authorize automatic restart after process termination.
    privacy: Any saved Project or source data remains subject to the private-cache and explicit denial rules in 0036. Setup failures do not delete source GitHub objects.
    provenance: The owner chose default one Project per Repository; explicit confirmation, per-entry outcomes and interrupted-save recovery are agent-authored proposals.
  scenario_scope: Scenarios mentioning a durably retained complete batch or durable cancellation describe an optional stronger implementation, not a first-version requirement. The ephemeral_batch_restart scenario expresses the selected minimum.
  scenarios:
    ephemeral_batch_restart:
      given: The operator confirmed R1 and R2; the R1 Project saved, and R2 was not submitted when the app process terminated. No durable batch selection exists.
      when: The app restarts and reads the saved Project configuration.
      then: R1 remains available, R2 is not automatically submitted, and the operator can select R2 again. No failure or missing Project is inferred from the lost pending selection. An already submitted uncertain effect must be reconciled separately before a duplicating retry.
    two_selected:
      given: Two distinct accessible Repositories are selected and neither has an existing default Project.
      when: The operator confirms and both saves succeed.
      then: Two separate saved Projects each contain their corresponding Repository and both entries report success.
    readded_to_former_default:
      given: P formerly held R's default association; R was removed from P and explicitly added back, while P survives and no active association or indeterminate save for R exists.
      when: The operator reviews and explicitly confirms default setup for R, and the conditions still hold at save time.
      then: Setup discloses and may create a separate single-repository default Project for R; P and its membership remain intact, and the former association is not silently restored.
    association_changes_after_review:
      given: Setup initially indicates that a new default Project for R may be created, but a valid default association is established before its save.
      when: The confirmed entry is processed against current durable configuration.
      then: The changed outcome is reported as a recoverable conflict or equivalent review state; a second default is not created and the existing Project is not silently substituted for the reviewed creation. Reuse requires a new explicit reviewed intent after any possibly committing prior effect is reconciled.
    storage_outcome_uncertain:
      given: One selected Repository's Project save may have committed, its acknowledgement is lost, and the local store is temporarily unavailable.
      when: The operator reviews setup progress or requests a retry.
      then: The entry is identified as having an unresolved local outcome, not as definitely failed or saved; an accessible recovery route reconciles the same operation before any duplicating submission and does not label the problem as a GitHub denial without source evidence.
    name_lost_before_admission:
      given: One batch entry needs a manually supplied valid Project name, the operator typed but has not submitted it, and the process stops without retaining that pending text.
      when: The batch is restored.
      then: The entry remains unresolved until a valid name is provided and explicitly confirmed again; no Project name is invented and independently saved batch entries remain governed by their own results.
    named_creation_acknowledgement_lost:
      given: A valid user-confirmed fallback name and Repository identity were bound to a creation operation whose acknowledgement is lost.
      when: The operator attempts to change the name and retry while the original outcome remains indeterminate.
      then: GitView first reconciles the original operation before a conflicting replacement could be submitted; it does not silently reinterpret the old operation as having the new name or create a duplicate default.
    identity_resolved_after_restart:
      given: A confirmed batch durably saved a default Project for R, while another unsubmitted entry's Repository identity remained unresolved when the process stopped.
      when: After restart supported source evidence establishes that the second entry is the same Repository R and the operator explicitly retries it under a still-valid account context.
      then: Both entries retain their own batch provenance, the valid existing default is reused or a recoverable conflict is reported under 0052, and no second default is created; matching names alone would not have supported this association.
    identity_still_ambiguous_after_restart:
      given: A confirmed batch contains one saved entry and one unsubmitted entry whose retained source context cannot establish a Repository identity after restart.
      when: The operator reviews or retries the unresolved entry.
      then: It remains unresolved with a permitted recovery path, is not automatically submitted or substituted by a similarly named Repository, and the independently confirmed entry remains subject to its own current configuration and access.
    retry_after_partial:
      given: R1 was saved successfully and its default association remains valid; R2 is confirmed not applied, has no earlier indeterminate effect and remains eligible.
      when: The operator explicitly retries the entries under their applicable reviewed intent.
      then: R1 may be reused and R2 may be saved under the current confirmation and admission rules, without duplicating R1 or changing unrelated Projects. A changed reviewed outcome requires renewed review rather than silent substitution.
    cancel_during_unknown:
      given: A Project save for R is in flight and its completion has not been observed.
      when: The operator cancels the batch.
      then: The outcome for R is not asserted failed or rolled back until the original operation is reconciled. A durably cancelled batch does not resume admissions; a later intentional attempt needs a separately reviewed and confirmed batch and must not duplicate an effect that can still commit.
    access_lost:
      given: R was selectable but its access is explicitly denied before its entry is processed.
      when: The confirmation continues.
      then: The entry is not reported as a successful new Project under an assumed identity; other already saved entries remain intact and denial is distinguishable from offline.
    stopped_before_second_entry:
      given: A two-entry selection is durably confirmed; R1 was saved and R2 was not submitted before the process stopped.
      when: The app restarts and reads the operation and Project configuration.
      then: R1's saved Project is recoverable, R2 is shown as not completed, and R2 is not automatically submitted solely due to restart.
    record_unavailable_before_start:
      given: A newly confirmed selection cannot be durably recorded before any of its entries is submitted.
      when: The app attempts to start that selection.
      then: No Project mutation from that selection is submitted and the local persistence problem is identifiable; other existing Projects are unaffected.
    identity_resolves_after_cancel:
      given: A confirmed batch contains an unsubmitted identity-unresolved entry, cancellation becomes durable, and later source evidence establishes its Repository identity.
      when: The operator returns after restart and asks to process that Repository.
      then: The cancelled batch does not submit the entry; a separately reviewed and confirmed new batch may use the supported current identity and access after any earlier in-flight effect is reconciled.
    cancellation_unknown_after_identity_resolution:
      given: An unsubmitted entry's identity becomes known after restart but the prior batch's cancellation outcome is indeterminate.
      when: The operator requests processing.
      then: The old batch is not automatically resumed and the uncertain cancellation and any possibly in-flight effect are reconciled before authorizing a new effect that could conflict; the identity fact alone does not settle cancellation.
    cancelled_before_restart:
      given: A selection has one confirmed saved entry and another not yet submitted, and cancellation was durably recorded.
      when: The app restarts.
      then: The saved Project remains and the unsubmitted entry is not automatically submitted; any in-flight entry is reconciled separately.
    cancellation_between_read_and_submission:
      given: A worker reads an active selection, then cancellation becomes durable before that worker begins an unsubmitted entry.
      when: The worker attempts to start the entry using its earlier read.
      then: The stale read alone cannot authorize the entry; it is not submitted after the confirmed cancellation.
    account_changed_before_next_entry:
      given: A batch was confirmed under account A, the first entry was saved, and another entry was not submitted before account B becomes active.
      when: The application considers processing the remaining entry.
      then: The completed Project remains, the remaining entry is not silently submitted under B, and any new attempt requires explicit confirmation and applicable B access evidence without revealing restricted A data.
    remote_revocation_not_yet_observed:
      given: An entry is admitted using source-supported access for account A, GitHub revokes that access before local commit, and GitView has not yet observed the revocation or received a locally applicable denial.
      when: The entry commits under its admitted context and the denial is subsequently established.
      then: The saved local Project is not falsely claimed to prove uninterrupted GitHub access; once denial is known, restricted source-derived content is hidden and the local membership remains subject to its separate configuration rules.
  unresolved:
  - Select and verify the storage mechanism and operation identity needed to reconcile an admitted uncertain effect; restoring unsubmitted selection is optional.
  - Source-specific evidence sufficient to establish accessible Repository identity and the detailed recovery interaction.
  - Atomic coordination of a connection change with entry admission and the exact user-facing account-change recovery interaction.
