id: GITVIEW-SPEC-0045
title: GitView - Confirm and recover repository selection
kind: spec
created_at: '2026-11-14T14:00:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0022
depends_on:
- GITVIEW-SPEC-0025
- GITVIEW-SPEC-0036
- GITVIEW-SPEC-0038
sources:
  parent: docs/drafts/GITVIEW-SPEC-0022.yaml
  lifecycle: docs/drafts/GITVIEW-SPEC-0025.yaml
  github_user_access: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/authenticating-with-a-github-app-on-behalf-of-a-user
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Selecting repositories does not create saved Projects until the operator confirms a nonempty selection.
- Each confirmed repository is associated with a saved or existing default Project containing that same Repository, or is individually reported as unresolved or failed.
- A partial save followed by retry does not duplicate already saved default associations or roll back unrelated saved Projects.
- Cancelling an unconfirmed selection preserves saved Projects; cancellation after partial saving does not imply that already completed saves were undone.
- A confirmed multi-selection retains enough durable context to identify its entries and recover their outcomes after process termination, subject to local storage availability and access policy.
specification:
  objective: Make the results of a multi-repository setup confirmation recoverable and attributable to the correct source identities.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:GitHub
  contract:
    pending: A pending selection is separate from saved Project membership. An empty selection cannot be confirmed as a saved empty Project. Cancel before confirmation discards pending choices only.
    identity: Evaluate each selected entry by confirmed source Repository identity under 0002 and 0038. A duplicate reference to the same confirmed Repository in one selection is one entry; equal names or incomplete IDs do not prove two entries are identical.
    confirmation: On explicit confirmation, for each eligible selected Repository reuse its existing default association under 0025 if the associated Project still contains that Repository; otherwise establish a separate single-repository default Project. The operation does not silently add the selected Repository to an arbitrary custom Project or combine selected Repositories into a multi-member Project.
    durable_intent: Before submitting any entry of a newly confirmed selection for a Project mutation, durably record the confirmed operation and its selected entries, retaining enough stable source identity or explicitly unresolved identity to distinguish entries, relate outcomes to the selection and recover their processing state. Record the confirmed source account context or sufficient non-secret evidence to determine whether a later active connection is the same account. This does not prescribe a schema or store credentials or source text as part of the contract. If that durable record cannot be confirmed, do not begin this selection's Project mutations or claim confirmation succeeded; any earlier unrelated operation remains independently recoverable.
    outcomes: Each selected Repository has an observable result of saved, reused, pending, failed or unresolved identity/access. A multi-selection is complete only when all selected entries have a saved or reused result. The exact UI may summarize these outcomes but must permit the operator to identify entries needing attention.
    interrupted: If a failure or interruption occurs after some entries have saved, keep those completed saves and record or present unresolved entries as not yet confirmed. Retry works from the current saved associations and is idempotent for already completed entries. Do not claim an all-or-nothing rollback when saves have actually occurred.
    cancel_after_start: If the operator cancels after saves have started, no further unsaved entry is intentionally submitted. A save already confirmed remains saved; an in-flight outcome whose completion is not yet known must be resolved or reported unknown before retry can safely claim no Project exists. Exact in-flight cancellation mechanics are implementation decisions.
    restart: After process termination, recover the confirmed selection and its per-entry known or uncertain outcomes when its durable record is readable. Reconcile each submitted or indeterminate entry against durable Project configuration under 0052; never infer a failed save merely from a missing acknowledgement. Do not automatically submit entries that were not yet submitted or resume a cancelled batch solely because the app restarted. The operator may explicitly retry eligible entries after recovery.
    cancelled_durably: Record cancellation so a later session cannot treat a cancelled batch as permission to submit further entries. Once cancellation is confirmed durable, no new entry from that batch may be submitted; an entry whose submission had already begun may still complete and must be reconciled. Cancellation is not a claim that such work rolled back. If cancellation's durable outcome is unknown, disclose uncertainty and avoid automatic submission until reconciled. Coordinate admission of an entry with durable cancellation so each admission is ordered before or after cancellation; reading an active batch before cancellation is not sufficient authorization to begin that entry after cancellation. The coordination mechanism is not prescribed.
    recovery_access: A readable operation record does not itself authorize display of source-derived private identifiers or restore GitHub access. Apply 0036 to its presentation; if local configuration or the operation record cannot be read, show a local recovery problem and do not claim an exhaustive list of batch outcomes.
    access_change: If identity or relevant access cannot be confirmed for a selected entry at processing time, do not create a Project under a fabricated or substituted Repository identity. Keep the entry unresolved or failed with a retry or recovery route; already completed entries remain intact. A temporary network failure alone is not an explicit access denial.
    admission_evidence: Before admitting an entry, evaluate the latest applicable locally accepted source identity and access evidence against the active account, Repository and setup policy. Coordinate that admission with locally established account replacement, denial or durable cancellation; if a conflicting local change takes effect first, the earlier evidence alone cannot authorize a new entry. If the policy cannot determine whether the evidence is adequate, return an unresolved entry rather than assume access. This is a local ordering guarantee, not an atomic transaction with GitHub.
    remote_change_window: A source grant can change after the last successful observation and before a local commit without GitView knowing. A saved Project may therefore reflect the supported access context used at admission, but the save must not claim uninterrupted or newly verified GitHub access at the local commit time. When a later applicable denial or changed grant is established, immediately apply 0036 to source-derived data, retain the already saved local Project and membership under 0025, and report the source limitation separately. The criteria for sufficient evidence and any refresh policy remain to be specified; do not invent a numeric freshness threshold.
    account_change: If the confirmed source account changes while a selection is pending or a confirmed batch still has unsubmitted entries, do not silently apply the earlier confirmation under the new identity. Preserve known completed and indeterminate outcomes for reconciliation without disclosing restricted data. Remaining entries need explicit operator confirmation in the new account context and fresh applicable source identity and access evidence; previously submitted writes may still complete and are reconciled independently. Returning to the same source identity does not by itself prove Repository access or authorize automatic restart after process termination.
    privacy: Any saved Project or source data remains subject to the private-cache and explicit denial rules in 0036. Setup failures do not delete source GitHub objects.
    provenance: The owner chose default one Project per Repository; explicit confirmation, per-entry outcomes and interrupted-save recovery are agent-authored proposals.
  scenarios:
    two_selected:
      given: Two distinct accessible Repositories are selected and neither has an existing default Project.
      when: The operator confirms and both saves succeed.
      then: Two separate saved Projects each contain their corresponding Repository and both entries report success.
    retry_after_partial:
      given: R1 was saved successfully and R2 failed during one confirmation.
      when: The operator retries both entries.
      then: R1's existing default is reused and R2 may be saved, without duplicating R1 or changing unrelated Projects.
    cancel_during_unknown:
      given: A Project save for R is in flight and its completion has not been observed.
      when: The operator cancels the batch.
      then: The outcome for R is not asserted failed or rolled back until the actual saved association is resolved; a later retry does not create a duplicate.
    access_lost:
      given: R was selectable but its access is explicitly denied before its entry is processed.
      when: The confirmation continues.
      then: The entry is not reported as a successful new Project under an assumed identity; other already saved entries remain intact and denial is distinguishable from offline.
    stopped_before_second_entry:
      given: A two-entry selection is durably confirmed; R1 was saved and R2 was not submitted before the process stopped.
      when: The app restarts and reads the operation and Project configuration.
      then: R1's saved Project is recoverable, R2 is shown as not completed, and R2 is not automatically submitted solely due to restart.
    record_unavailable_before_start:
      given: A newly confirmed selection cannot be durably recorded before any of its entries is submitted.
      when: The app attempts to start that selection.
      then: No Project mutation from that selection is submitted and the local persistence problem is identifiable; other existing Projects are unaffected.
    cancelled_before_restart:
      given: A selection has one confirmed saved entry and another not yet submitted, and cancellation was durably recorded.
      when: The app restarts.
      then: The saved Project remains and the unsubmitted entry is not automatically submitted; any in-flight entry is reconciled separately.
    cancellation_between_read_and_submission:
      given: A worker reads an active selection, then cancellation becomes durable before that worker begins an unsubmitted entry.
      when: The worker attempts to start the entry using its earlier read.
      then: The stale read alone cannot authorize the entry; it is not submitted after the confirmed cancellation.
    account_changed_before_next_entry:
      given: A batch was confirmed under account A, the first entry was saved, and another entry was not submitted before account B becomes active.
      when: The application considers processing the remaining entry.
      then: The completed Project remains, the remaining entry is not silently submitted under B, and any new attempt requires explicit confirmation and applicable B access evidence without revealing restricted A data.
    remote_revocation_not_yet_observed:
      given: An entry is admitted using source-supported access for account A, GitHub revokes that access before local commit, and GitView has not yet observed the revocation or received a locally applicable denial.
      when: The entry commits under its admitted context and the denial is subsequently established.
      then: The saved local Project is not falsely claimed to prove uninterrupted GitHub access; once denial is known, restricted source-derived content is hidden and the local membership remains subject to its separate configuration rules.
  unresolved:
  - Exact storage mechanism, concurrency and operation identity needed to enforce durable intent and reconcile an in-flight unknown outcome after process termination.
  - Source-specific evidence sufficient to establish accessible Repository identity and the detailed recovery interaction.
  - Atomic coordination of a connection change with entry admission and the exact user-facing account-change recovery interaction.
