specification:
  objective: Support a Photos-inspired overview that scales density within a stable scope.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - Allow multiple grid densities within the same project or object scope and use pinch to increase or
    decrease detail.
  - Support a dense bird's-eye view on the order of eight cells per row and around 100 items as an illustrative
    target, not fixed constants.
  - Distinguish PR and Issue at compact scale; reveal more information as cells grow without silently
    changing the selected set.
  - Offer a way to inspect and open an object while retaining scope, filters and meaningful return position.
  - Use native iOS appearance, system colors and typography, SF Symbols and restrained Liquid Glass.
  review_scenarios:
  - Given a project with 100 items, zooming from a dense grid to larger cards preserves the same scope
    and selected filter.
  - Given a compact cell, the user can reach its object overview without needing to identify it by color
    alone.
  unresolved:
  - Native collection behavior, zoom anchoring, gesture arbitration and measured performance need device
    validation.
  evidence_boundary: Scenarios are expectations for future verification, not executed tests. The ontology
    selection and specification remain drafts; implementation is not claimed.
  pilot_contract:
  - The grid supports several density levels within the same selected scope; pinch changes scale and visible
    detail without silently changing selected objects or filters.
  - A small scale can show approximately eight cells per row and around 100 objects as a design example,
    not a fixed layout or performance benchmark.
  - Use distinct type and meaningful state cues; color alone is not required to identify an object. Text
    can expand as density permits.
  - Entering an object is distinguishable from changing density; return retains scope, filters and scale,
    restoring position when possible.
  - When content or data changes, preserve the focused object's identity where possible; do not claim
    all items are present when data coverage is incomplete.
  pilot_scenarios:
    same_scope:
      given: A filtered Project grid has 100 known objects at a dense scale.
      when: The operator pinches to make cells larger.
      then: The scope, filter and underlying 100-object selection remain unchanged.
    density_not_navigation:
      given: The operator changes density within a Repository.
      when: The gesture ends without choosing an object.
      then: The app remains in the same Repository scope.
    large_text:
      given: The user enables a large text size.
      when: The grid cannot fit eight legible columns.
      then: The layout adapts rather than shrinking required content to preserve eight columns.
  pilot_provenance: The owner authorized autonomous pilot specification in excerpt-72. Working details
    are specification choices, not claims that the app exists or that every detail was separately discussed.
acceptance:
- The grid supports several density levels within the same selected scope; pinch changes scale and visible
  detail without silently changing selected objects or filters.
- A small scale can show approximately eight cells per row and around 100 objects as a design example,
  not a fixed layout or performance benchmark.
- Use distinct type and meaningful state cues; color alone is not required to identify an object. Text
  can expand as density permits.
- Entering an object is distinguishable from changing density; return retains scope, filters and scale,
  restoring position when possible.
- When content or data changes, preserve the focused object's identity where possible; do not claim all
  items are present when data coverage is incomplete.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
