sources:
  parent: docs/drafts/GITVIEW-SPEC-0060.yaml
  owner_counters: docs/drafts/pull-request-ontology-options.md
  source_research: docs/drafts/github-field-access-research-20261114.md
  github_graphql_checks: https://docs.github.com/en/graphql/reference/checks#checkconclusionstate
  github_graphql_status_context: https://docs.github.com/en/graphql/reference/commits#statuscontext
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Each confirmed current status-check entry contributes at most once to a displayed category and once to the stated total.
- Failure, pending and success counts use explicit category meanings and retain special or unrecognized results without inventing success.
- A skipped or neutral check remains distinguishable from a check that executed successfully even when GitHub branch protection accepts the former in a documented context.
- Incomplete, unknown or incompatible source observations are not turned into a complete current count or merge decision.
- The counts and their limitations are understandable without relying on color alone.
specification:
  objective: Give the requested compact status-check counters an explicit conservative interpretation while retaining source outcomes.
  ontology_refs:
  - gitview:PullRequest
  - gitview:CIStatus
  contract:
    scope: Apply these categories only after entry identity, source family, applicable PR revision and current-attempt selection are established under 0060. Record observation time and coverage. A known entry with an unrecognized result is distinct from a wholly unobserved source portion; neither proves that the PR has no failure.
    known_success: Count a check run with a supported completed success conclusion, or a commit-status context with a supported success state, in success. The count says the source reported success for those entries in their stated context, not that all tests ran or that the PR is mergeable.
    known_failure: Count a check run with a supported completed failure, timed-out or startup-failure conclusion and a commit-status context with a supported failure or error state in the failure category. GitHub GraphQL documents STARTUP_FAILURE for a check suite or run; count it as one entry only when the observed source object is an applicable distinct check run, not merely because a suite reported that conclusion. Preserve the original outcome so a timeout, startup failure or status error is not presented as a failed test. This category can support the failed-CI attention predicate only for the observed applicable entry and scope. This working classification does not assert REST schema equivalence or full PR status-box coverage.
    suite_level_failure: When the source independently establishes an applicable suite-level startup failure without a corresponding source-confirmed current check-run entry, retain and make the suite-level problem discoverable as such where access permits. It is not itself an individual check entry, a fabricated failed test, or evidence of how many runs exist. The selected 0057 failed-CI PR count based on individual entries cannot count that suite alone as a confirmed qualifying check; expose the source limitation or separate suite attention instead of calling CI healthy or hiding the known failure. A later established applicable check-run entry is evaluated independently without double-counting the suite as another run.
    known_pending: Count a check run with a supported nonterminal queued, requested, pending, waiting or in-progress state, or a commit-status context with a supported pending or expected state, as pending. Preserve the actual source state; waiting is not proof that execution has begun. Mapping is conditional on the selected source schema and type supporting that value.
    graphql_entry_mapping: As a source-specific candidate for an already identified and applicable GraphQL entry, interpret a CheckRun's successfully returned `status` and `conclusion` together. With `status` COMPLETED, map SUCCESS to success and FAILURE, TIMED_OUT or STARTUP_FAILURE to failure; retain NEUTRAL, SKIPPED, CANCELLED, STALE and ACTION_REQUIRED as distinct special results outside these three counts. With status QUEUED, REQUESTED, PENDING, WAITING or IN_PROGRESS and a successfully returned null conclusion, map the entry to pending. A missing, omitted, error-affected, unknown or incompatible status/conclusion remains unclassified, not success; a returned null conclusion is distinct from a missing or error-affected field, and a completed run with null conclusion is unclassified. An unrecognized future enum remains explicit. For an independently identified GraphQL StatusContext, map SUCCESS to success, FAILURE or ERROR to failure, and PENDING or EXPECTED to pending; an unknown or unavailable state is unclassified. This mapping preserves the actual source family and value and does not say a raw aggregate state is an individual entry. It applies only after 0060 establishes identity, applicable revision and current selection; it does not establish GraphQL permissions, complete coverage or GitHub UI equivalence.
    classification_exchange: The proposed pure classification boundary accepts one already identified applicable source entry and a source-family-specific observation with field-presence and error context. It returns exactly one success, failure, pending, special or unclassified result with enough source context to preserve the reported outcome and its limitations. It performs no fetching, source authorization, retry selection, deduplication or merge decision. The caller supplies independently established entry identity, revision applicability, current selection and collection coverage under 0060 and 0044; a category result alone establishes none of them. An aggregate may report a complete category total only when the necessary input set and each relevant category are sufficiently established under count_consistency. This is an information boundary, not a chosen Swift type or evidence of implementation.
    combined_status_is_not_entry: GitHub's REST combined commit-status state can be pending when there are no statuses as well as when an observed context is pending. That aggregate state is not an individual status context and does not itself contribute one pending check. A complete empty set can have zero individual entries even when a source aggregate says pending; an incomplete or ambiguous set remains unknown. This aggregate covers its documented commit-status scope, not automatically check runs or the whole PR status box.
    other: Completed neutral, skipped, cancelled, stale and action-required results are retained as distinct special outcomes outside the three counts in this initial conservative proposal. Unknown values and unsupported or inconsistent status/conclusion combinations are unclassified rather than forced into a color. A source-reported startup failure on a suite is not silently converted into an additional check-run entry.
    result_semantics: GitHub documents that skipped or neutral may satisfy required-check policy in the documented branch-protection context. That policy result is not equivalent to a check having executed successfully; retain the original outcome. A visual summary is not a branch-protection or merge decision. Future source-verified UX may choose different color grouping only if the meaning and special outcomes remain explicit.
    total: The total counts all source-confirmed distinct current entries in the stated scope, including known special outcomes and entries with unclassified result. It is exact only with sufficient entry identity and collection coverage. Thus failure plus pending plus success can be less than total. Make the existence and number of other or unclassified entries discoverable without requiring a separate prominent counter on the compact cell.
    count_consistency: The relation between category counts and total applies only to the same compatible entry set, revision context and evaluation. Do not manufacture a coherent current set by combining independently refreshed categories, pages or retries whose ordering or applicability is unresolved. A source-confirmed entry with incompatible unordered pending and failure observations is not simultaneously counted in both categories; its current category remains uncertain under 0053. Independently supported earlier observations can remain identifiable with their own context under 0046, without presenting their arithmetic as a single current rollup.
    compact_color_proposal: For the compact PR cell, use an agent-authored CI-only visual summary rather than a combined PR health state. An applicable confirmed failure can be emphasized in red even with partial coverage, provided its incompleteness remains discoverable. With sufficient compatible complete coverage and no failure, a pending entry can be emphasized in yellow. Green requires a nonempty sufficiently complete applicable entry set whose entries are all classified success under this proposal and no independently known applicable suite-level startup failure that would contradict a healthy-CI implication. If coverage is insufficient without a known failure, or the complete set is empty, special-only, unclassified or mixed success with special outcomes and no failure or pending, use a neutral or explicitly limited treatment instead of suggesting all checks succeeded. A known suite-level startup failure remains separately discoverable even if no individual failure entry can be counted. The PR lifecycle, review outcome, merge policy and the original special outcomes remain independently available. Exact colors and system symbols require native evaluation.
    last_known_cell_color: If the only permitted CI result is a last-known observation whose applicability to the current PR revision or requested current context is not established, do not use its success, pending or failure color as an unqualified current CI state. Prefer a neutral or visibly qualified limited representation; the prior result may remain inspectable with its own time and revision where permitted. A newer title, a visible cell or the absence of a newer result does not establish current applicability. A separately supported current failure can still receive the partial-coverage treatment above; neither case is presented as a complete healthy rollup.
    contradictory: A completed run without a usable conclusion, a nonterminal state paired with an incompatible terminal result, or insufficient evidence to associate a result with the applicable revision is not silently classified as success or a confirmed failure. Show the relevant uncertainty or incompleteness. Preserve raw source provenance for later reconciliation under 0053.
    accessibility: Counts are available through non-color labels or accessible descriptions and retain the difference between zero, unavailable, incomplete and special outcomes. Exact glyphs and placement follow the native design and accessibility specifications.
    provenance: The owner chose compact red/yellow/green/total counters and GitHub as an orienting behavior. The conservative mapping of special outcomes is an agent-authored working proposal, not a claim that GitHub renders every entry with the same color.
  scenarios:
    null_conclusion_is_not_field_error:
      given: Two independently identified applicable GraphQL CheckRuns have status IN_PROGRESS; one has a successfully returned null conclusion and the other's conclusion field is error-affected or omitted.
      when: Each entry is classified with its field evidence.
      then: The first can be pending in this proposed mapping, while the second is unclassified rather than assumed null; either can contribute to a source-supported total only with independently adequate identity and coverage. Neither result by itself establishes a complete CI collection.
    graphql_context_and_run_are_distinct:
      given: A source-supported current GraphQL StatusContext reports EXPECTED, and a different applicable CheckRun reports COMPLETED with SKIPPED. Entry identity, revision and complete collection coverage are established independently.
      when: The individual entries are classified and counted.
      then: The context contributes one pending entry, the skipped run remains a special entry, and total is two; neither is reported as successful or as a workflow-run count. The result does not imply that a pull request is mergeable.
    special_outcomes:
      given: A complete current entry set contains one success, one failure, one pending, one skipped and one neutral check run.
      when: Compact counters are displayed.
      then: Success, failure and pending are each one, total is five, and the two special outcomes remain discoverable as skipped and neutral without claiming either executed successfully.
    status_error:
      given: A complete current entry set includes one commit-status context with error state and no other entries.
      when: The counters are calculated.
      then: The failure category is one and total is one, while the original error remains distinguishable from a test failure.
    startup_failure_source_type:
      given: An applicable completed GraphQL CheckRun has the supported STARTUP_FAILURE conclusion; its CheckSuite also reports a startup failure but is not itself a counted check-run entry.
      when: Current individual check counters are calculated with sufficient identity and coverage.
      then: The CheckRun contributes one failure and one total entry, the suite does not create a second entry, and the outcome is identified as startup failure rather than a failed test.
    suite_failure_without_run:
      given: An applicable CheckSuite reports STARTUP_FAILURE, but no source-confirmed applicable CheckRun establishes a corresponding failure entry.
      when: The PR's compact CI and individual-check counters are inspected.
      then: The suite-level problem is discoverable as a separate source observation and does not fabricate a failed run or healthy CI; exact individual totals follow their independently supported coverage.
    waiting_and_missing:
      given: A current check run is observed waiting while another applicable source family is unavailable.
      when: The counters are shown.
      then: The observed run contributes one pending entry with its waiting state, and the total is not claimed complete.
    completed_without_conclusion:
      given: A source response identifies a current check run as completed but omits its conclusion.
      when: The response is interpreted.
      then: The run is not classified as success or failure and the unclassified result is distinguishable from a known zero.
    zero_checks:
      given: A sufficiently complete source observation proves no current entries for the selected context.
      when: Counters are displayed.
      then: Total and category counts can be shown as known zero without implying that checks passed or that the PR is mergeable.
    pending_aggregate_without_entries:
      given: The source reports a pending combined commit-status state because there are no status contexts, and independent sufficient evidence establishes that no other applicable check entries exist.
      when: Individual status-check counters are evaluated.
      then: The aggregate pending state does not become a fabricated pending entry; individual totals can be zero with the aggregate and its scope separately identifiable, without asserting success or merge eligibility.
    unordered_category_change:
      given: Two incompatible observations of the same identified current entry say pending and failure, and no evidence orders them.
      when: Current counters are evaluated.
      then: The entry is not counted as both pending and failure or silently assigned a current category; an applicable earlier value may remain last known with conflict and its own context, while any affected exact current category count remains uncertain.
    success_and_skipped_compact:
      given: A complete applicable current set has one successful check and one skipped check, with no failed or pending entry.
      when: Its PR cell and accessible status are presented.
      then: The success and skipped entries remain independently discoverable and the cell does not claim that every check succeeded or that the PR is ready to merge.
    partial_pending_compact:
      given: One applicable check is pending while another check source is unobserved and no failure has been observed.
      when: The compact CI status is presented.
      then: The pending observation is available with incomplete coverage, but the cell does not imply that a complete current set has no failures.
  unresolved:
  - Verify the selected source schemas, applicability, retry selection and handling of special outcomes against actual GitHub PR observations.
  - Whether a future design groups special outcomes differently and how the compact interface exposes them require native UX and accessibility evaluation.
  - Required-check and merge policies are outside this candidate and require distinct evidence if later brought into product scope.
