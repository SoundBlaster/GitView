  source_research: docs/drafts/github-field-access-research-20261114.md
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Each confirmed current status-check entry contributes at most once to a displayed category and once to the stated total.
- Failure, pending and success counts use explicit category meanings and retain special or unrecognized results without inventing success.
- A skipped or neutral check remains distinguishable from a check that executed successfully even when GitHub branch protection accepts the former in a documented context.
- Incomplete, unknown or incompatible source observations are not turned into a complete current count or merge decision.
- The counts and their limitations are understandable without relying on color alone.
specification:
  objective: Give the requested compact status-check counters an explicit conservative interpretation while retaining source outcomes.
  ontology_refs:
  - gitview:PullRequest
  - gitview:CIStatus
  contract:
    scope: Apply these categories only after entry identity, source family, applicable PR revision and current-attempt selection are established under 0060. Record observation time and coverage. A known entry with an unrecognized result is distinct from a wholly unobserved source portion; neither proves that the PR has no failure.
    known_success: Count a check run with a supported completed success conclusion, or a commit-status context with a supported success state, in success. The count says the source reported success for those entries in their stated context, not that all tests ran or that the PR is mergeable.
    known_failure: Count a check run with a supported failure or timed-out conclusion and a commit-status context with a supported failure or error state in the failure category. Preserve the original outcome so a timeout or error is not presented as a failed test. This category can support the failed-CI attention predicate only for the observed applicable entry and scope.
    known_pending: Count a check run with a supported nonterminal queued, requested, pending, waiting or in-progress state, or a commit-status context with a supported pending or expected state, as pending. Preserve the actual source state; waiting is not proof that execution has begun. Mapping is conditional on the selected source schema and type supporting that value.
    combined_status_is_not_entry: GitHub's REST combined commit-status state can be pending when there are no statuses as well as when an observed context is pending. That aggregate state is not an individual status context and does not itself contribute one pending check. A complete empty set can have zero individual entries even when a source aggregate says pending; an incomplete or ambiguous set remains unknown. This aggregate covers its documented commit-status scope, not automatically check runs or the whole PR status box.
    other: Completed neutral, skipped, cancelled, stale and action-required results are retained as distinct special outcomes outside the three counts in this initial conservative proposal. Unknown values and unsupported or inconsistent status/conclusion combinations are unclassified rather than forced into a color. A source-reported startup failure is not silently treated as a check-run outcome without establishing its actual source type.
    result_semantics: GitHub documents that skipped or neutral may satisfy required-check policy in the documented branch-protection context. That policy result is not equivalent to a check having executed successfully; retain the original outcome. A visual summary is not a branch-protection or merge decision. Future source-verified UX may choose different color grouping only if the meaning and special outcomes remain explicit.
    total: The total counts all source-confirmed distinct current entries in the stated scope, including known special outcomes and entries with unclassified result. It is exact only with sufficient entry identity and collection coverage. Thus failure plus pending plus success can be less than total. Make the existence and number of other or unclassified entries discoverable without requiring a separate prominent counter on the compact cell.
    count_consistency: The relation between category counts and total applies only to the same compatible entry set, revision context and evaluation. Do not manufacture a coherent current set by combining independently refreshed categories, pages or retries whose ordering or applicability is unresolved. A source-confirmed entry with incompatible unordered pending and failure observations is not simultaneously counted in both categories; its current category remains uncertain under 0053. Independently supported earlier observations can remain identifiable with their own context under 0046, without presenting their arithmetic as a single current rollup.
    contradictory: A completed run without a usable conclusion, a nonterminal state paired with an incompatible terminal result, or insufficient evidence to associate a result with the applicable revision is not silently classified as success or a confirmed failure. Show the relevant uncertainty or incompleteness. Preserve raw source provenance for later reconciliation under 0053.
    accessibility: Counts are available through non-color labels or accessible descriptions and retain the difference between zero, unavailable, incomplete and special outcomes. Exact glyphs and placement follow the native design and accessibility specifications.
    provenance: The owner chose compact red/yellow/green/total counters and GitHub as an orienting behavior. The conservative mapping of special outcomes is an agent-authored working proposal, not a claim that GitHub renders every entry with the same color.
  scenarios:
    special_outcomes:
      given: A complete current entry set contains one success, one failure, one pending, one skipped and one neutral check run.
      when: Compact counters are displayed.
      then: Success, failure and pending are each one, total is five, and the two special outcomes remain discoverable as skipped and neutral without claiming either executed successfully.
    status_error:
      given: A complete current entry set includes one commit-status context with error state and no other entries.
      when: The counters are calculated.
      then: The failure category is one and total is one, while the original error remains distinguishable from a test failure.
    waiting_and_missing:
      given: A current check run is observed waiting while another applicable source family is unavailable.
      when: The counters are shown.
      then: The observed run contributes one pending entry with its waiting state, and the total is not claimed complete.
    completed_without_conclusion:
      given: A source response identifies a current check run as completed but omits its conclusion.
      when: The response is interpreted.
      then: The run is not classified as success or failure and the unclassified result is distinguishable from a known zero.
    zero_checks:
      given: A sufficiently complete source observation proves no current entries for the selected context.
      when: Counters are displayed.
      then: Total and category counts can be shown as known zero without implying that checks passed or that the PR is mergeable.
    pending_aggregate_without_entries:
      given: The source reports a pending combined commit-status state because there are no status contexts, and independent sufficient evidence establishes that no other applicable check entries exist.
      when: Individual status-check counters are evaluated.
      then: The aggregate pending state does not become a fabricated pending entry; individual totals can be zero with the aggregate and its scope separately identifiable, without asserting success or merge eligibility.
    unordered_category_change:
      given: Two incompatible observations of the same identified current entry say pending and failure, and no evidence orders them.
      when: Current counters are evaluated.
      then: The entry is not counted as both pending and failure or silently assigned a current category; an applicable earlier value may remain last known with conflict and its own context, while any affected exact current category count remains uncertain.
  unresolved:
  - Verify the selected source schemas, applicability, retry selection and handling of special outcomes against actual GitHub PR observations.
  - Whether a future design groups special outcomes differently and how the compact interface exposes them require native UX and accessibility evaluation.
  - Required-check and merge policies are outside this candidate and require distinct evidence if later brought into product scope.
