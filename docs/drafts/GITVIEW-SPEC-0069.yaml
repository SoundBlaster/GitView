acceptance:
- Under the agent-proposed initial history presentation, open-PR, open-Issue, merged-PR and closed-Issue series and their different units are identified separately; the initial presentation remains a candidate.
- Under the agent-proposed calendar-day buckets, the time-zone interpretation, boundaries and current-day incompleteness are explicit.
- A daily state display uses actual supported observation times and does not invent a day-end snapshot or fill missing days.
- Outcome buckets count distinct eligible objects for their own interval, with separate closure reasons when supported and uncertainty otherwise.
- A history period opened from a summary retains its actual originating boundaries rather than silently converting a rolling interval into calendar days.
specification:
  current_intent_boundary: Aggregate metrics and graphs remain desired. The calendar presets, daily buckets and navigation from historical buckets to object lists below are candidate designs, not selected Today semantics or mandatory first-version historical object viewer. Preserve scope, evidence, unit, gaps and disclosure; graph period and drill-down remain open.
  objective: Propose an initial legible set of history series and explicit day buckets without asserting unobserved history or changing agreed metric scope.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    initial_series: As the agent-authored first-version working presentation, offer four separately labeled series for open PR observations, open Issue observations, distinct PRs merged and distinct Issues closed. Open PR and open Issue values are state observations; merged PR and closed Issue values are period outcomes. Where source evidence supports it, closure outcomes can be broken down by reason, including unknown. Candidate 0097 specifies discoverable access and capture expectations for the other agreed Project summary metrics; the initial presentation is not an exhaustive metric catalog.
    retained_inputs: Candidate 0066 proposes retaining applicable accepted open-state observations and event evidence for these four series. Source success, source coverage, local retention and availability of event identities remain independent; lack of a stored sample is not evidence of zero work or zero outcomes. A stored aggregate alone does not guarantee that a contributing-object selection is available under 0056.
    source_and_first_install: For open-state series, use eligible retained observations of the applicable count under 0066 and 0097; a current GitHub open state alone does not supply a prior day's point. For outcomes, use a supported PR merge time or independently identified Issue closure event and its event time under 0102 and 0056; a recently updated object alone does not establish a merge or closure. On first connection, previously existing work may lack saved state samples and the selected discovery may not cover all past outcomes. Show missing state days as gaps and outcome buckets as incomplete or unavailable when their event population is unproven; individually supported permitted past events may be shown with their actual coverage. Do not report an empty graph or missing bucket as a confirmed zero, and do not promise a seven-day backfill merely because a seven-day period is selectable. Subsequent accepted observations can add supported points without inventing the intervals between them.
    today_breakdown_boundary: A current breakdown of the dynamic Today selection under 0057 uses a potentially changing population and its own selected filters; it is not a daily merge-event bucket or the fixed cohort in 0055. Historical Today-breakdown points require evidence for the exact selection, membership, time and lifecycle at each point; the four initial series alone do not reconstruct those values. Do not use an event count or present-day breakdown as a substitute for a missing past point.
    membership: Use the explicitly stated Project membership basis under 0064; a working current-member retrospective uses a fixed captured Repository set for that evaluation and must not claim to be the Project's membership in each past day. Missing or restricted member evidence affects each applicable point or bucket.
    calendar_presets: As the agent-authored first-version working choice, offer the last seven and last thirty local calendar days including the current local day, initially selecting seven days when entering history without an existing period. Each day begins at the local calendar start and ends at the next local calendar start; use the selected time zone's calendar rather than assuming every day lasts exactly 24 hours. These are calendar presets, not the previously proposed rolling 24-hour, seven-day or thirty-day intervals.
    current_day: At period evaluation, the current-day outcome bucket is the half-open interval from that day's local start inclusive to the evaluation instant exclusive, not the future part of the day. An event exactly at that instant is eligible only for a later evaluation whose interval includes it. Its end and provisional nature are visible or discoverable. Advancing time can expand that bucket only through a new evaluation; source coverage determines whether its value is complete for the elapsed interval. A day that has not elapsed is not a confirmed zero for its full calendar interval.
    event_unit: Each daily merged-PR bucket counts distinct PR identities with a confirmed merge event in that bucket; each daily closed-Issue bucket counts distinct Issue identities with at least one confirmed closure event in that bucket. Event time rather than retrieval time determines the bucket. An Issue closed twice on the same day contributes once to that day's distinct-object count, while an event-count series would have a different unit. A period-wide distinct-Issue total must be deduplicated across days rather than inferred by summing daily counts.
    completed_issue_series: Make the agreed completed-Issue outcome series discoverable for the selected period and scope when supported event-specific reason evidence exists. Its unit is distinct Issues with a closure event supported as completed in the bucket, not all closed Issues or a count of independent tasks. Identify the source condition and coverage; if reason or event coverage is insufficient, show an applicable partial result, gap or unavailable state rather than a complete zero. A known non-completion reason does not match, and an unknown reason is not silently classified. Opening an eligible point preserves this reason condition under 0056; do not require a separately stored copy or claim source availability.
    closure_reasons: A reason-specific bucket includes a closure only when evidence establishes the reason for the relevant event. Unknown reason remains unknown. If one Issue has different closure reasons within the same bucket, it can appear in more than one reason-specific distinct-object subset; those subsets must not be added and labeled as distinct Issues without deduplication. Completion is not inferred from closed state alone.
    state_samples: For a daily open-work presentation, show eligible retained observations whose actual observation times fall within that calendar bucket. An initial compact view may select the latest recorded eligible sample within each bucket for the displayed metric and scope, only where the recorded observation times and applicable ordering evidence establish which eligible sample is later; wall-clock values alone need not establish order if a clock adjustment or another supported ambiguity makes it unreliable. If ordering is unprovable, preserve uncertainty rather than choose a sample as latest; this selection does not itself establish source freshness or a coherent simultaneous Project snapshot. Keep the actual observation time, component times and completeness discoverable. If competing samples share an ordering timestamp and no evidence establishes a single applicable result, preserve that uncertainty rather than selecting a value arbitrarily. A later partial or conflicting sample must not be silently replaced by an earlier complete sample labeled as the latest or current value. If no eligible sample exists, show a gap; do not move an observation to midnight or invent a day-end state.
    partial: Apply 0044 and 0065 separately to every series and bucket. A known event or sample from one Repository may be available as partial information, but it does not prove the total for all members. Do not treat partial or stale observations as current lower bounds. A complete zero requires sufficient evidence for the exact metric, elapsed period, identity and scope.
    fixed_period: When a summary or chart origin supplies an explicit period, retain its actual start, end, time-zone interpretation and condition under 0056 and 0068. A seven-day rolling interval supplied by an origin is not relabeled as the seven-calendar-day preset. For a historical period already selected when device time zone changes, this proposal retains its captured absolute boundaries and original time-zone label until the operator explicitly changes or re-evaluates the period; dynamic Today remains governed by 0049.
    captured_buckets: Capture the absolute half-open boundaries of the selected historical day buckets together with their original calendar and time-zone interpretation. A device time-zone or system-calendar change does not silently rebucket the displayed historical events, change the current-day evaluation cutoff or relabel the old result as if it used the new context. A refresh of source data for that fixed selection preserves its bounds; an explicit period reevaluation can create a newly identified evaluation under the then-current context. The relevant original context and any resulting coverage limitations remain discoverable.
    end_exclusive: A historical event at one bucket's end belongs to a subsequent bucket beginning at that same instant if it otherwise qualifies; it is not counted in both. Foundation's documented closed DateInterval semantics do not replace this product half-open rule under 0049. Use local calendar boundaries for daily buckets, including daylight-saving transitions; retain absolute event instants unchanged.
    uncertain_event_time: If the supported source meaning for one event supplies only a possible time range that overlaps a captured bucket boundary, do not assign the event as a confirmed contribution to either daily bucket by rounding or by selecting a representative instant. Preserve it as uncertain for each affected bucket and apply its actual scope, identity and event coverage; another independently supported in-bucket event for the same subject may still support that subject's positive distinct-object contribution. When the whole supported range lies within one bucket, it can support that bucket's event-time condition subject to its other evidence. Do not sum uncertain bucket assignments or infer a complete zero. This conditional rule does not assert that a GitHub event timestamp has range-valued precision.
    navigation: Opening a daily outcome bucket can show the corresponding distinct-object selection for that exact bucket under 0056, preserving source scope and coverage. A graph with state samples does not imply an event-based list or a past object snapshot unless evidence supports it. Returning from objects preserves the graph context under 0024.
    visual_and_access: Labels, times, gaps and units are available through non-color and accessible paths under 0032 and 0068. Exact chart form, ordering, controls and treatment of dense data require native design and device evaluation.
    provenance: The owner accepted Project summary metrics and graphs with sufficient history. The four initial series, calendar presets, sample selection and fixed-period time-zone rule are agent-authored working choices; the earlier repository proposal described rolling periods and was not itself an owner selection.
  scenarios:
    first_history_without_prior_samples:
      given: A Project is connected for the first time on Friday. Its permitted open-PR observation is accepted on Friday; an identified PR merge from Wednesday is also observed, but earlier state samples and exhaustive prior event coverage are unavailable.
      when: The operator opens the seven-day history.
      then: Friday can show its supported open-PR observation with its actual time; earlier state days remain gaps. Wednesday can show the supported merge only with its incomplete outcome coverage, and no other past day or exact total is fabricated as zero. The period selector does not claim that all seven days were observed.
    completed_issues_separate_from_closed:
      given: In one selected day a supported Issue closure has reason completed, a second has a non-completion reason, and a third closure has an unknown reason; the applicable identities and event times are known.
      when: The operator inspects the completed-Issue series and its available point selection.
      then: Only the first Issue is a confirmed completed-reason match; the second is not and the third remains uncertain for that predicate. The value is not described as the total of all closed Issues or as an exact complete result while the unknown reason could affect it, and an eligible destination retains the completed-reason condition and period.
    event_range_crosses_bucket_boundary:
      given: An identified Issue has a permitted closure whose source-supported possible time range overlaps the boundary between two captured historical day buckets; no other event for that Issue is known in either bucket.
      when: The daily distinct-Issue outcomes are prepared from recovered evidence.
      then: The event is uncertain for each affected day rather than counted confidently on a day chosen by rounding, and neither bucket is claimed complete solely from this observation. Its subject and temporal limitation remain associated without inventing a second event or a precise source instant.
    current_day:
      given: A seven-calendar-day history is evaluated at local 15:00 with sufficient data for elapsed time only.
      when: Today's outcome bucket is shown.
      then: It is identified as covering from the day start inclusive to that evaluation instant exclusive, not as a complete value for the future remainder of the day.
    same_time_conflict:
      given: Two incompatible samples for the same metric and scope have the same observation timestamp and no evidence orders them.
      when: The latest daily sample is selected.
      then: Their conflict remains uncertain and neither value is selected merely by file or arrival order.
    two_closures_same_day:
      given: One Issue has two confirmed closure events on the same local day and complete identity evidence.
      when: The daily distinct-Issue closure series is computed.
      then: The Issue contributes once to the day's object count; an event count of two is a different measurement.
    one_issue_closed_on_two_days:
      given: One confirmed Issue has a closure on each of two distinct local days, with a reopening between and sufficient event and identity coverage.
      when: Daily distinct-Issue closure buckets and a distinct-Issue total covering both days are computed.
      then: The Issue contributes once to each applicable daily bucket but once to the period-wide distinct-Issue total; a supported event count is two and does not become two distinct Issues.
    ambiguous_sample_order_after_clock_change:
      given: Two eligible samples for the same metric and scope have conflicting recorded wall-clock times after a device clock adjustment and no independently reliable ordering evidence establishes which was observed later.
      when: The daily latest-sample view is assembled.
      then: The sample order remains uncertain rather than choosing the numerically larger wall-clock timestamp as proof; neither value is assigned an invented source revision or continuous trend.
    sample_is_not_midnight:
      given: The only eligible open-PR observation on Tuesday was recorded at 10:30 local time.
      when: The daily state series is shown.
      then: Its actual time remains discoverable and it is not represented as a day-end snapshot or as evidence of the rest of Tuesday.
    later_partial_sample:
      given: A Project had a complete open-Issue observation at 09:00 and a partial observation at 17:00 for the same day.
      when: The latest-sample presentation is evaluated.
      then: The later partial result is not silently replaced by the earlier complete value labeled latest; each available observation retains its own coverage and time.
    rolling_origin:
      given: A Project summary opens a rolling interval ending at a specific instant.
      when: The history surface receives that selection.
      then: It retains the original boundaries and does not label them as a calendar-day preset or silently widen the interval.
    time_zone_change:
      given: A historical calendar period was selected in one device time zone and its absolute boundaries were captured.
      when: The device time zone changes while the period remains open.
      then: The selected historical interval and original time-zone label remain until explicit re-evaluation, while dynamic Today may change separately.
    exact_daily_boundary:
      given: Two adjacent historical daily buckets share a captured boundary and a confirmed Issue closure event occurs exactly at that instant.
      when: Distinct-Issue outcome counts are evaluated with adequate evidence for both buckets.
      then: The event contributes to the second bucket and not the first; it is not double-counted by an inclusive-end interval helper.
    refresh_after_zone_change:
      given: A historical seven-day selection and its bucket boundaries were captured in time zone A, and the device then changes to time zone B.
      when: The operator refreshes source data for that existing selection without asking to reevaluate its period.
      then: The refreshed selection retains the original absolute boundaries and A interpretation; an explicitly requested reevaluation under B is a separate period context with independently assessed coverage.
  unresolved:
  - Confirm source-specific completeness, object and event identity, state-sample timestamps and retention for each series.
  - Candidate 0097 proposes discoverable selection of other agreed summary metrics; resolve its exact native presentation and required source evidence without silently removing those metrics from product scope.
  - Native chart, period controls, accessible inspection, DST boundaries and device behavior require evaluation; these working defaults are not separately owner-selected.
