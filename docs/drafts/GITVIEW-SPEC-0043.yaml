acceptance:
- The end-to-end path preserves source identity, Project membership and explicit scope from setup to overview, preview and source navigation.
- Same-day outcomes remain visible without lifecycle exclusions and can be explicitly filtered without deleting work records.
- Partial, stale, failed and explicitly denied data remain distinguishable throughout the overview and recovery paths.
- Shared Repositories are included in each relevant Project and deduplicated in portfolio-wide unique totals.
- If the optional open non-draft PR filter is selected for release, it remains distinct from unrestricted Today, review assignment and merge eligibility throughout preview and return.
- Evidence distinguishes a planned scenario, a deterministic test with doubles, a real source integration observation and a native device observation.
specification:
  objective: Combine selected user journeys into verifiable expectations across the refined specification branches.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    composition: Each scenario assumes the applicable parent and dependency rules; no scenario's successful outcome implies that another branch or the entire application is implemented or accepted.
    observations: Counts and selections are evaluated only for the source scope and coverage stated in the scenario. Unknown, partial or denied information remains visible as such rather than being converted to a successful zero.
    identity: PR and Issue identity is resolved in source Repository context; Project identity is local and multiple Projects may share a Repository.
    evidence: A later run must record test inputs, actual outputs, scope, implementation version and test level. User-facing and platform behavior requires native observations; a mock-only result is not proof of GitHub or iOS behavior.
    provenance: The owner requested a dense overview with explicit filters, source navigation and retained completed work. These composite scenarios are agent-authored checks derived from those requirements.
    optional_long_thread_proxy_boundary: The 24-hour comment-age interpretation in 0094 is an agent-authored option; scenarios specifically evaluating it apply only if it is selected. The initial long-discussion volume interpretation is defined in 0062; duration and inactivity remain distinct unresolved meanings.
    optional_history_clear_boundary: The all-local-history clear in 0067 and its protocol in 0117 are agent-authored optional candidates with undecided first-release inclusion. Scenarios involving this clear apply only if it is included; chart history and local observations remain independently required. Other deletion and access rules are unaffected.
    optional_review_stage_boundary: The agent-proposed open non-draft filter in 0125 is conditional, not a prerequisite for the core Today journey. Its acceptance scenario applies only if it is included; the owner's broader ready-work need remains unresolved.
    optional_cross_scope_zoom_boundary: The targeted pinch transition between scopes in 0120 is conditional and not a prerequisite for the initial navigation and density-change journey. Its scenario applies only if the interaction is selected; ordinary explicit opening, return and within-scope pinch remain independently required.
    optional_cohort_boundary: The dynamic Today journey and its acceptance do not require capturing a fixed PR cohort. Candidate 0055 describes a separate proposed view whose first-release scope is unresolved; its conditional scenarios apply if that capability is included, without making it a prerequisite for the core journey.
    proposed_github_app_boundary: Scenarios that describe GitHub App installation, user-token renewal or its rotation apply to the agent-proposed connection direction in 0098 and 0099 if selected. They do not make this specific authorization method a prerequisite for understanding or accepting the core product journey; independently applicable access, refresh and recovery expectations remain in force.
    dependency_model_limitation: The declared depends_on list nevertheless includes 0098 and 0099 directly and also reaches them through candidate 0108 and 0100. These are ordinary graph edges, not tool-understood conditional dependencies. The prose above does not make the edges conditional or prove that a SpecGraph readiness computation would omit them. Treat this node's graph-level prerequisite closure as coupled to the GitHub App candidate until a reviewed decomposition or supported conditional dependency model resolves the mismatch; do not use that closure as proof that the owner selected GitHub App or that another connection method is impossible.
    dependency_model_evidence: In installed runtime 3593bd75, SG-SPEC-0014 describes depends_on as declared blocking and relates_to as non-blocking context. The inspected supervisor work_dependencies_ready evaluates every direct dependency against its ready statuses without interpreting this prose; candidate-file checking is a separate limited operation and this is not an executed readiness result for 0043. A relates_to edge could preserve non-blocking references for genuinely optional scenarios, but moving only the two direct edges would not resolve transitive paths, for example 0043 -> 0115 -> 0108 -> 0098 or 0043 -> 0101 -> 0100 -> 0099. Decomposing general outcomes and selected GitHub App integration, then reviewing each affected prerequisite, is a candidate repair; do not simply delete the named edges and declare readiness.
  scenarios:
    review_stage_filter_preview_and_return:
      given: The optional open non-draft filter is included. A single-Repository Project P's permitted unrestricted Today view contains an open non-draft PR A, an open draft PR B and a same-day merged PR C, with independently supported typed identities and applicable facts. The operator selected a dense layout; source evidence and permissions are sufficient for these three objects but do not establish an exhaustive population or merge policy.
      when: The operator explicitly selects the open non-draft filter, uses an accessible preview to open A, returns to the work grid and clears only that filter.
      then: Initially all three supported cards remain visible. The filtered selection includes A without asserting a review request, approval or merge eligibility; the preview and overview remain bound to A and its Repository. On return P, Today and density remain; clearing the condition makes B and C eligible again under current independently applicable evidence. No complete Project count is inferred from these three observations, no unrelated filter or GitHub object is changed, and any source or access limitations remain discoverable where permitted.
    check_count_to_changed_project_selection:
      given: At T1 Project P contains Repositories A and B. Two distinct permitted open PRs, one in each Repository, have five applicable failure-category check entries between them; the separately identified Project failed-CI signal counts two affected PRs while the check total is five. Both values carry their actual T1 scope and sufficient T1 evidence.
      when: Before opening the Project signal, a later independently supported observation establishes that the A PR no longer matches failed CI while the B PR still does; the operator opens the signal and then explicitly clears its failure condition.
      then: The origin retains its two-PR T1 meaning and is not labeled five PRs. The destination is independently evaluated for its actual later context and can identify the B PR as one supported current match, with any unproven population coverage exposed separately. Clearing the condition makes the actual new selection identifiable and does not change either PR, its checks or the historical T1 signal. The app does not infer the membership of an otherwise unobserved population, promise a complete destination solely from the origin, or infer that the B PR has only one failed check.
    sole_member_replacement_preserves_route_and_scope:
      given: Project P has sole member A, is A's default and is open on its Project-wide Today grid with an explicit filter and density. Another Project Q also contains A; an A PR preview is open and permitted, while B is an eligible Repository whose work is unobserved.
      when: One reviewed local edit replaces A with B in P, its complete effect is durably confirmed, and the operator dismisses the preview and returns to the work collection.
      then: The preview remains bound to the A PR until dismissal; P retains its identity, its current Project-wide scope becomes B with the same period, filter and density, and incomplete B coverage is discoverable. The old A observation is not relabeled as B or proof of B's empty work, and the former A default association is removed without assigning B as default. Q and both source Repositories remain unchanged; the route does not silently switch to Q, invent a replacement anchor or infer an individual ontology-action sequence.
    discovery_gap_after_scope_and_access_change:
      given: Project P formerly contained A and B and has a retained recent-work gap for B under account X and an earlier local day. A repair for B began, then P changes to A and C and B becomes restricted before that repair returns; C has not yet been observed.
      when: The operator opens P's current Today collection and the old repair response arrives.
      then: The active selection retains P and its valid filters with current A-and-C membership; C remains unobserved and B is not disclosed or presented as a current member. The old gap and response keep their original account, Repository and day context and cannot restore B's private content, complete C or relabel old-day work as the current Today coverage. Independently permitted A facts retain their own times and a non-sensitive applicable limitation remains discoverable.
    portfolio_configuration_recovers_during_refresh:
      given: The local identity set contains P and Q but Q's configuration is unreadable; P is independently available, and a source refresh for a previously known Q Repository finishes while Q's configuration remains unavailable.
      when: The overview shows P with a local limitation, the operator moves to P, a newer local read establishes Q's valid configuration, and an older local read then finishes.
      then: Q becomes available only with its actual saved configuration and current disclosure, the supported source observation keeps its own Repository scope and time, and it is not treated as proof of Q's complete work or Project-wide refresh. P remains the operator's position when valid; the older read does not replace the newer overview, assert Q deleted or establish an empty portfolio.
    upgrade_and_recover_portfolio:
      given: A supported older local schema contains Projects P and Q sharing Repository R and independently retained PR observations for R.
      when: The app completes a supported upgrade under 0122 and the overview reads the migrated configuration while GitHub is offline.
      then: P and Q retain their identities and shared membership; permitted observations remain scoped to R with their original freshness and coverage, and the offline state is distinguishable from a failed migration or a new empty portfolio.
    unsupported_schema_at_startup:
      given: A previously installed application version encounters a local store created by a newer incompatible version.
      when: It starts the Project overview and a background refresh opportunity is offered.
      then: It preserves the store, admits neither incompatible writes nor a first-run reset, identifies a local compatibility limitation and offers an available update or recovery route without claiming that GitHub or the Project collection is empty.
    today_typed_decision_to_overview:
      given: In a Project-wide Today selection, a permitted identified PR is confirmed merged today and has a failed check observed earlier for revision R1, but its current applicable revision or checks cannot be established. The operator has activated a failed-CI filter and another Repository's work population is not fully observed.
      when: The caller evaluates the normalized PR under 0110 and renders the filtered Project collection.
      then: The merge supports base Today inclusion while the earlier failed check retains its own revision and time. The CI filter remains uncertain, so the PR is an uncertain candidate rather than a confirmed current failure or exclusion. The unobserved population remains an independent coverage limitation, and the overview does not claim an exact zero or a complete failed-CI count. A top-level rule unexpectedly returning no result is an integration limitation rather than that domain uncertainty.
    source_revoked_between_admission_and_save:
      given: A Repository selection is locally admitted under source-supported access for account A, and GitHub revokes access before local save without GitView yet observing the revocation.
      when: The Project save succeeds and an applicable denial is observed afterward.
      then: The saved Project remains under its own local identity, the earlier admission does not prove continuous source access, and restricted source-derived data is hidden under the current policy.
    empty_status_rollup_on_fork:
      given: A fork-based PR has a source combined commit-status state pending because no status contexts exist, and check-run association and coverage are not established.
      when: The Project and PR CI summaries are evaluated.
      then: The aggregate pending state does not fabricate an individual pending check, an empty pull_requests array does not prove no checks apply, and the complete CI total remains unknown.
    source_labels_do_not_imply_other_facts:
      given: A source PR observation supplies a head ref name without confirming that the ref is still accessible, and a linked Issue has a sub-issue summary whose completed value is not established as equivalent to all closed children.
      when: Their selected overview facts are displayed.
      then: The PR name retains its own context without asserting branch availability, and the Issue's closed-child count remains unknown or independently established rather than silently taking the completed value.
    confirmed_setup_to_offline_work:
      given: Under a confirmed GitHub identity the operator explicitly selects eligible Repository R and its default Project is durably saved; its work has not yet been observed.
      when: The operator enters that Project and its first PR and Issue refresh fails while offline.
      then: The same saved Project and R remain identifiable where permitted, the work scopes remain unobserved with a visible refresh limitation, and neither an empty source nor a failed Project creation is inferred.
    late_history_for_former_members:
      given: A history graph request uses Project members A and B; after membership changes the operator explicitly selects an A and C graph, with C's historical coverage incomplete.
      when: The older A and B result arrives after the new graph is selected.
      then: The old result is not presented as the A and C graph, C is not treated as zero, and any permitted earlier result retains its own scope and observation context.
    stale_source_link_and_later_denial:
      given: A permitted PR has a previously source-associated link with no verified current resolution, and the operator starts a share flow using the last-known link.
      when: Explicit denial occurs before any app-controlled delayed provider supplies that link.
      then: The earlier address is not promoted to a confirmed current destination, the restricted payload is withheld before provision, and the application makes no claim that already handed-off content can be revoked.
    preview_reopened_while_old_request_finishes:
      given: The operator dismisses a PR preview and opens a new preview for the same PR while the first preview's request is still in flight.
      when: Its old callback arrives after the new preview has appeared.
      then: It cannot directly mutate the new presentation instance; any independently accepted result retains its original source and access context and is rendered only through a valid current read.
    portfolio_return_with_partial_local_read:
      given: The operator opened Project Q from a portfolio containing P and Q, and Q's local configuration cannot currently be verified while P is independently readable.
      when: The operator returns to the portfolio.
      then: P remains available where permitted, the incomplete local read is discoverable, and Q is neither declared deleted nor silently replaced by P as the originating Project.
    retention_recovery_after_restart:
      given: Project P has independently readable permitted T1 data. A T2 source observation is accepted, its history-retention operation O may have committed, and the acknowledgement is lost; no durable source-attempt outcome is established.
      when: The operator can discover the local uncertainty through an accessible status route, restarts the app and requests recovery; durable evidence then confirms O and its correctly associated T2 sample.
      then: Before recovery the app neither claims O failed nor promises T2 was durable. After recovery it can show that one T2 sample with its actual source context and retain T1 where independently readable, without creating a second sample from reconciliation. The post-restart latest source-attempt outcome remains unknown unless independently recovered; the confirmed history receipt is not presented as a new GitHub success. The affected status and return path remain available without color or a transient notice, and current access restrictions apply.
    retention_recovery_still_unreadable:
      given: A T2 historical write may have committed and its operation identity is known, but after restart neither its durable outcome nor the prior T1 fact and context can be read.
      when: The operator uses the accessible recovery route.
      then: The affected history remains unavailable or indeterminate, neither a T1 baseline nor T2 rollback or success is invented, and retry does not submit a distinct duplicating effect while O may still commit. The independently readable Project and permitted unrelated scopes remain available.
    local_recovery_without_assumed_baseline:
      given: A Project's PR observations were once saved at T1, a T2 local write was interrupted, and restart cannot validate either observation while Project configuration is independently recoverable.
      when: The operator opens the Project overview.
      then: The Project remains available with the affected PR scope unknown or unavailable and a permitted recovery path; neither T1 nor T2 is asserted recovered, and no source-empty result or silent Project deletion is invented.
    summary_to_incomplete_destination:
      given: A Project has a permitted source-supported failed-CI PR signal at T1; a later paged traversal succeeds but cannot establish complete coverage at T2.
      when: The operator opens the signal and inspects its matching PR collection.
      then: The signal's supported reference remains T1, the destination retains the failed-CI condition and exposes its own uncertainty, and success of the traversal is not represented as an exact current count or a confirmed empty list.
    resolved_pr_association_survives_restart:
      given: A permitted GitHub issue-shaped record is known to represent a PR, but its association with an independently identified PR is initially unresolved. A later source-supported association is prepared for the same Repository; its retention operation may have committed but its acknowledgement is lost.
      when: The app restarts and independently recovers the association, required evidence and the original operation outcome under 0124; current access still permits the PR.
      then: The representations can identify the same PR once in the applicable selection, with their original fact and observation contexts. Recovery does not create a new GitHub observation, infer a separate Issue or establish full Today population coverage; the current Project and access context are checked independently.
    github_issue_representation_of_pr:
      given: A source-confirmed PR is observed through both PR and PR-marked Issues representations, alongside a separate Issue linked to that PR in the same Repository.
      when: The Project Today grid and its counts are built from those observations.
      then: The PR contributes once and the independent Issue contributes separately when each matches the selection; unsupported association or incomplete coverage cannot establish an exact total.
    partially_approved_github_data_categories:
      given: A Project has a source-confirmed permitted PR and an independently accessible Issue, but the check collection is unavailable or its permission update has not been approved.
      when: The operator opens the Project and a PR overview.
      then: Available facts retain their own source times, the missing check category is discoverable and is not shown as healthy, green or zero, and a specific permission cause is asserted only if source evidence supports it.
    first_setup_partial_github_installation:
      given: A GitHub identity is confirmed, Repository A is accessible through one app installation, and a separate organization-scope approval remains pending with source-supported evidence.
      when: The operator explicitly selects A for default setup while the other scope remains unresolved.
      then: A can become one local default Project under per-entry persistence rules; its PR and Issue data remain unobserved until fetched, while the pending scope is not presented as an empty organization or an approved installation.
    github_token_rotation_response_lost:
      given: A Project shows previously permitted cached observations while an expiring GitHub App user token is being renewed, and GitHub may have rotated the pair before the response is lost.
      when: The operator opens the Project after an interrupted restart and requests refresh.
      then: GitView does not claim that the old credential remains valid or that source data was refreshed; saved Projects and eligible observations retain their actual context, and an accessible reauthorization route is available when necessary.
    aged_comment_signal_navigation_at_new_time:
      given: At T1 a Project signal counts two qualifying review threads belonging to one PR; by T2 one thread is source-confirmed resolved and the other still qualifies under applicable state evidence.
      when: The operator opens the current signal and the PR selection is reevaluated at T2.
      then: The Project and named 24-hour comment-age condition remain identifiable, the origin keeps its two-thread T1 context, and the destination can represent one remaining thread on one PR at T2 without inferring a missing PR or source failure.
    aged_comment_with_incomplete_thread_history:
      given: An open PR has one observed unresolved review thread containing a confirmed submitted comment created 25 elapsed hours before the reference instant; other threads and comments are only partly observed.
      when: The Project's proposed 24-hour comment-age attention and its history are inspected.
      then: The supported thread can contribute one observed positive with incomplete coverage, without asserting the thread was continuously unresolved for 25 hours or treating the observed count as a complete Project total.
    attention_history_units:
      given: One Project's supported observation has three unresolved review threads on one open PR, while a separate PR's failed CI was observed for a different revision and time.
      when: The operator inspects the corresponding historical summary metrics.
      then: Thread and affected-PR series retain their distinct units and actual contexts; the CI result is not backdated or substituted for an unobserved historical PR state, and unavailable or restricted inputs remain incomplete.
    historical_point_access_and_return:
      given: A historical outcome point is inspectable with permitted partial evidence and an object selection is open when access to a contributing private Repository becomes restricted.
      when: The restriction is applied, the operator returns using an accessible navigation path, and later only the Repository name is newly permitted without restoring the historical inputs.
      then: Restricted details and inferable totals are not newly exposed, the earlier point is not mislabeled as a new scope, and a safe limitation or recovery route retains the permitted period and context where valid. The restored name alone does not unlock the older historical point or prove its underlying event coverage; independently supported permitted values keep their own scope and evidence.
    closure_chart_distinct_period_and_navigation:
      given: An identified Issue closes on two different days in a selected fixed historical period, with a reopening between them and sufficient permitted event, identity and coverage evidence for that Issue; after the second closure it is independently observed open again. Another Repository in the same Project has no eligible historical evidence.
      when: The operator inspects daily closure buckets, the period-wide distinct-Issue total and the supported object selection for one bucket without requiring pinch or long press.
      then: The Issue contributes once to each supported daily bucket but only once to a distinct total over those days; its separately supported current open state does not erase either closure. The Project-wide result remains incomplete because of the unobserved Repository. The destination retains the selected bucket's actual bounds and predicate and does not fabricate an object count or a complete Project history.
    captured_chart_period_after_zone_change:
      given: The operator opened a historical outcome chart with local-day bucket boundaries captured in time zone A and a permitted event exactly on the boundary of two adjacent buckets.
      when: The device changes to time zone B, the operator refreshes that existing selection without explicitly reevaluating its period, and inspects the boundary event.
      then: The chart and eligible destination retain the captured absolute boundaries and A interpretation; the event belongs only to the later half-open bucket. A newly requested period in B is separately identified and does not silently rewrite the earlier selection or its coverage.
    history_retry_across_restart:
      given: A permitted source refresh yields an open-PR history observation, its retention may have committed, and its acknowledgement is lost before restart.
      when: GitView recovers the retention attempt and retries or reconciles it.
      then: Source success remains distinct from local retention outcome, the same attempt does not create a second independent sample, and an unreadable outcome stays uncertain. A confirmed clear under 0067 prevents pre-clear work from silently restoring cleared history.
    clear_then_late_response_and_backfill:
      given: An old refresh is in flight when an explicit all-local-history clear is confirmed, and a separate source-history retrieval starts after the clear.
      when: Both responses arrive and the operator opens a historical chart.
      then: The old refresh cannot silently recreate cleared points; separately supported events from the new retrieval may appear with their original event times and new retrieval context, without claiming complete history or that deleted local records survived.
    identity_changes_during_inspection_and_refresh:
      given: Project P contains private Repository R; identity A has a PR preview and an accessible focus open while a refresh under A is in flight. A different identity B becomes active without confirmed R access.
      when: The old refresh completes and the operator dismisses the preview or returns to the Project collection.
      then: A's response does not establish B's access or coverage; restricted app-controlled details, accessible labels, pending announcements and revealing counts are not exposed under B. P and its saved membership remain, the previous anchor is not relabeled as a different object and a permitted recovery context is reachable. Speech already delivered and content already handed to another app cannot be recalled.
    shared_history_clear_is_explicit:
      given: Projects P and Q both use historical evidence for the same Repository and retain their own local configurations.
      when: The operator opens the proposed all-local-history clear from a Project context, reviews its disclosed scope and confirms it successfully.
      then: The action does not claim to affect P alone, the disclosed historical scope is cleared for both Projects, their configurations and permitted current observations remain, and graphs do not turn the cleared history into zero source activity.
    current_refresh_with_missing_history:
      given: A Project has a previously retained open-PR sample, the next day's background opportunity does not occur and no other sufficient evidence establishes that day's open-PR state; a later source refresh succeeds while retaining its new history sample fails.
      when: The operator opens the Project overview and the historical series.
      then: The current source observation and local retention failure are distinguishable, the prior retained point keeps its time, and neither the day without an observation nor the failed write is represented as a durable zero or invented sample.
    today_breakdown_changes_without_cohort:
      given: A fully covered Project-wide Today selection contains 100 PRs, of which 95 are observed merged and five open in a compatible context, with no fixed cohort captured.
      when: A new eligible distinct open PR is observed and the dynamic Today selection is completely reevaluated.
      then: The current Today breakdown can show 101 PRs with 95 merged and six open without creating a cohort; those counts alone prove neither a historical trend nor the number of merge events today.
    today_partial_refresh_and_membership_change:
      given: Project P previously held 100 permitted open PR observations across members A and B, and a Project-wide Today refresh begins.
      when: The saved membership changes to A and unobserved C, then the older A-B refresh returns an open-only subset and B's later request fails.
      then: The A-C selection does not claim completeness or a new complete time; applicable A facts keep their own evidence, C remains unobserved, B's failure retains its old request scope, and missing open-list entries are not invented as merges or deletions.
    complete_multi_repository_today_journey:
      given: Project P has two confirmed Repositories with 100 distinct permitted open PRs in total, and relevant Today, lifecycle and identity coverage is sufficient.
      when: The operator enters P's all-members Today work collection, 95 PRs merge today, then the operator previews and opens one of those PRs and returns without applying a lifecycle exclusion.
      then: The selection still contains the same 100 PRs subject to the stated observations, the 95 merged PRs retain their distinct identities and current source states, the opened PR retains its Repository and Project context, and return preserves the collection's valid scope, filters, density and identity-based position.
    project_summary_at_dense_scale:
      given: A two-Repository Project is represented at dense scale; one Repository has known open PRs and the other's CI scope is unobserved.
      when: The operator opens the same Project's summary and then requests its open-PR history without a pinch or long press.
      then: Available facts and their coverage remain attributable to that Project, unobserved CI is not a healthy zero, and missing historical evidence is shown as a gap or incomplete rather than backfilled from the current count.
    project_summary_mixed_category_coverage:
      given: Project P contains A and B, the open-PR category is sufficiently observed for both, and B's applicable CI data is unavailable.
      when: The operator inspects P's open-PR and failed-CI signals.
      then: The open-PR value can retain its own supported completeness while failed-CI coverage is incomplete or unavailable; one successful category does not turn the other into zero or healthy.
    targeted_zoom_single_member_return:
      given: The optional targeted zoom interaction is included and identifies Project P containing one confirmed Repository R, and P's origin is the Projects overview.
      when: The transition is committed and the operator later returns by an available zoom-return or Back action.
      then: P's work opens without a redundant Repository screen, the same P and R remain attributable, and return follows the actual origin rather than a fabricated intermediate step.
    share_boundary_then_denial:
      given: A private PR's source link has crossed the actual platform handoff boundary, and a source access restriction is established before the operator chooses a recipient.
      when: GitView applies the restriction and handles any later app-controlled provider request.
      then: Future app-controlled provisions are independently checked and restricted where applicable, while the app does not claim that the earlier platform payload was never supplied or retracted.
    discovery_search_and_custom_intent:
      given: Existing Projects are visible and the operator starts custom Project creation, selects Repository A, then searches a partially observed discovery scope for B.
      when: The current search has no observed matches and a late response for an earlier query arrives.
      then: A and the custom-creation intent remain pending, no source-wide absence or saved Project is asserted, the earlier response is not labeled as the current query, and the existing portfolio remains intact.
    create_custom_project_from_shared_repositories:
      given: The proposed custom-creation route is selected, and two eligible Repositories each already have a saved default Project and belong to different organizations.
      when: The operator explicitly creates a separate custom Project containing both and opens it from the overview.
      then: The new Project has its own identity and both members, the prior Projects and defaults remain intact, and its initial multi-member route is scoped to that new Project.
    project_purpose_across_edit:
      given: A Project has a permitted locally saved purpose description and multiple Repository members.
      when: The operator saves a valid membership edit without changing the description, then opens a Project preview.
