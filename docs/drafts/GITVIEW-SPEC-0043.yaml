acceptance:
- The end-to-end path preserves source identity, Project membership and explicit scope from setup to overview, preview and source navigation.
- Same-day outcomes remain visible without lifecycle exclusions and can be explicitly filtered without deleting work records.
- Partial, stale, failed and explicitly denied data remain distinguishable throughout the overview and recovery paths.
- Shared Repositories are included in each relevant Project and deduplicated in portfolio-wide unique totals.
- Evidence distinguishes a planned scenario, a deterministic test with doubles, a real source integration observation and a native device observation.
specification:
  objective: Combine selected user journeys into verifiable expectations across the refined specification branches.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    composition: Each scenario assumes the applicable parent and dependency rules; no scenario's successful outcome implies that another branch or the entire application is implemented or accepted.
    observations: Counts and selections are evaluated only for the source scope and coverage stated in the scenario. Unknown, partial or denied information remains visible as such rather than being converted to a successful zero.
    identity: PR and Issue identity is resolved in source Repository context; Project identity is local and multiple Projects may share a Repository.
    evidence: A later run must record test inputs, actual outputs, scope, implementation version and test level. User-facing and platform behavior requires native observations; a mock-only result is not proof of GitHub or iOS behavior.
    provenance: The owner requested a dense overview with explicit filters, source navigation and retained completed work. These composite scenarios are agent-authored checks derived from those requirements.
  scenarios:
    review_conflicting_project_edit:
      given: The operator drafted removal of Repository B from Project P while another confirmed edit added Repository C.
      when: The operator reviews the newer saved configuration and explicitly retries removal of B against it.
      then: A valid confirmed result retains C, removes B only from P, and does not change another Project or the source Repositories.
    conflicting_project_edits:
      given: Two edits of the same Project start from the same saved membership, and the first adds a Repository shared with another Project.
      when: The first edit is confirmed and the second stale edit attempts to save.
      then: The second edit cannot silently erase the confirmed addition; a conflict or separately specified safe merge is reported, and the other Project and source Repository are unchanged.
    address_conflict_recheck:
      given: A Repository is included in two Projects and has two unordered conflicting address observations.
      when: The operator requests a recheck and the source response does not resolve the ordering.
      then: Both Project memberships remain, source success and address uncertainty are distinguishable, and any source action follows the independently established link and access rules.
    same_id_address_uncertain:
      given: A Repository in two Projects has two conflicting source addresses observed under the same confirmed numeric ID without source ordering evidence.
      when: Its Projects and source navigation are displayed.
      then: Both Project memberships remain attached to the same Repository, the current address is uncertain rather than chosen by arrival order, and no unverified source link is asserted current.
    cross_cutting_evidence:
      given: A Project grid scenario passes controlled tests while native accessibility and live source integration have not been checked.
      when: Its verification result is summarized.
      then: Controlled results are identified at their actual boundary and the applicable native and source evidence remains explicitly unverified under 0079.
    issue_link_denied:
      given: An accessible Issue in Project P has a previously observed link to a private PR outside P, and the link and target become restricted.
      when: The operator opens the Issue and its related-work section.
      then: Restricted link and PR details or revealing counts are not exposed, no confirmed empty result is fabricated, and the external Repository is not added to P.
    partial_issue_discussion:
      given: An Issue overview has a recent title observation and an older partial discussion observation with an unknown comment author.
      when: The operator opens the Issue from its Project grid.
      then: The title and discussion keep their respective contexts, the exact participant count and latest comment time remain uncertain, and missing discussion data is not shown as zero.
    description_edit_after_assessment:
      given: A participating PR had a structurally conforming description and GitView displayed its original permitted body.
      when: The PR description changes but the new body has not yet received an applicable external assessment.
      then: The earlier result is not attributed to the new body, GitView preserves available source text and independent CI status, and no GitView source mutation is implied.
    grid_pinch_not_preview:
      given: The operator begins touching a PR cell in a filtered Project grid but has not activated preview.
      when: A second contact results in a recognized pinch that changes density.
      then: The pending preview does not open, no object is entered and the same Project, selection and filters remain identifiable.
    direct_signal_return:
      given: The operator opens a failed-CI signal on Project P in the portfolio and the affected PRs are in two different member Repositories.
      when: The operator inspects the cross-repository selection and returns without entering a member Repository separately.
      then: The destination retains P and the signal scope and distinguishes the Repositories; return goes to the originating portfolio and preserves its valid density and position.
    accessible_focus_after_refresh:
      given: A VoiceOver user is inspecting one of two same-numbered PRs from different Repositories in a filtered Project grid.
      when: A refresh reorders the grid and the selected PR's filter result becomes uncertain.
      then: The same permitted PR remains inspectable through the uncertainty path with its Repository context; a different PR is not substituted and the incomplete selection remains discoverable.
    portfolio_return_after_refresh:
      given: Projects P and Q are visible in stable order and the operator opens Q.
      when: A background refresh changes P's signals and the operator returns.
      then: P and Q retain their relative order and Q is restored as the position anchor if still available, with current access and observation limitations applied.
    local_retention_failure_restart:
      given: A Project has a previously saved PR observation and a later refresh obtains new PR facts while local retention fails.
      when: The operator sees the refresh outcome and restarts the application.
      then: Source success and retention failure remain distinguishable; after restart the Project uses only confirmed recoverable facts and their own coverage and times, without inventing a new durable history point or an empty source.
    first_overview:
      given: No Projects exist; the operator connects one source identity and confirms two accessible repositories in different organizations.
      when: Two single-repository default Projects are saved and source observations are obtained.
      then: Both Projects are identifiable, each has the confirmed source Repository, and available work can be reached without conflating organizations with Projects.
    setup_changes_account:
      given: A connected account A has a partial discovery result and a confirmed two-entry setup whose first Project was saved; the second entry has not been submitted.
      when: The active connection changes to B before the second entry starts and an old A discovery response arrives.
      then: The saved Project remains subject to access policy, the response does not become B's discovery or unlock A data, and the remaining entry requires explicit confirmation and applicable access evidence under B before a new submission.
    shared_repository:
      given: Repository R belongs to both Project P and Project Q and contains one observed open PR under complete coverage.
      when: P, Q and a portfolio-wide unique total are displayed.
      then: The PR contributes once to each Project and once to the unique portfolio total; the source Repository is unchanged.
    work_completes:
      given: Today contains 100 distinct PRs in the selected Project with complete coverage.
      when: Ninety-five become merged today and the unfiltered selection is refreshed successfully.
      then: All 100 remain visible with current observed states; excluding merged explicitly retains only the other matching PRs without deleting the merged records.
    preview_and_source:
      given: A filtered dense Project grid contains PR 42 in Repository R2, and another Repository has a different PR 42.
      when: The operator previews R2's PR, opens it and requests its original source.
      then: Preview, overview and source request all refer to R2's PR; returning preserves the originating context under 0024.
    offline_and_denial:
      given: A private Repository has a prior permitted observation and belongs to a Project.
      when: A refresh first fails offline and a later source response explicitly denies access.
      then: During offline the previously permitted data can remain visible with time and failure; after denial the restricted private data is hidden while the Repository and membership are retained.
    result_after_denial:
      given: A refresh of a private Repository was started before an explicit source access denial.
      when: Its response arrives after denial without access having been re-established.
      then: The response alone does not unlock the restricted private data or change the denial into a successful empty result.
    interrupted_setup_restart:
      given: A confirmed two-repository setup has durable selection context; the first Project is saved and the second outcome is unknown when the process stops.
      when: A new session reads local configuration and the operation record.
      then: The first Project remains available, the second outcome is reconciled or remains explicitly unknown, and no second default association or automatic submission is invented.
    deferred_and_coalesced_refresh:
      given: A Project view requests refresh of PRs and Issues while an existing request covers PRs only, and the Issue request cannot start because of a known budget constraint.
      when: The PR request succeeds and the operator opens another Project.
      then: Only the original Project's covered PR scope receives that result; its Issue scope remains deferred or incomplete and the other Project is not marked refreshed.
    retry_with_unresolved_conflict:
      given: A Project has a permitted last-known PR state and an unresolved conflicting observation; an unrelated Repository has its own successful observation.
      when: The operator discovers the affected scope and requests refresh, and the source responds but its value cannot be ordered against all conflicting observations.
      then: The response is distinguishable from resolving the conflict, the affected state remains uncertain with its last-known context, and neither its complete-scope time nor the unrelated Repository's state is advanced by that response alone.
    membership_changes_during_refresh:
      given: Project P contains A and B, Project Q also contains B, and P has a failed-CI filter and an in-flight refresh for A and B; C is unobserved.
      when: The operator saves an edit replacing B with C in P and the original refresh completes without covering C.
      then: P retains the filter but evaluates A and C with incomplete coverage; B remains in Q and its observations are not erased, and the result for A and B is not described as a complete refresh or count for P's new membership.
    restart_after_membership_edit:
      given: P's membership edit from A and B to A and C may have committed, an old A and B summary exists, and the process stops before reporting the save outcome.
      when: A new session cannot yet read P's durable configuration.
      then: The overview identifies P's saved scope as uncertain and does not present the old summary as a complete current Project count; once a valid saved configuration is confirmed, coverage is evaluated for that membership under 0046 and access policy.
    partial_signal_navigation:
      given: A Project has an observed failed check on one identified PR and another PR has unknown checks, with incomplete Project coverage.
      when: The operator opens the failed-CI signal.
      then: The observed PR is available under the failed-check condition, the unknown portion is not silently excluded as healthy, and the destination does not claim an exhaustive current total.
    timeout_signal_to_preview:
      given: A Project's complete observed CI summary contains one open PR with a timed-out current entry and a second open PR with a skipped entry, with no source changes during navigation.
      when: The operator opens the failure-category signal, previews the matching PR, then inspects the second PR in the unfiltered grid.
      then: The timeout contributes one affected PR and remains identifiable as a timeout; the skipped result is not described as a successful execution or hidden from an accessible inspection path.
    review_signal_to_preview:
      given: One open PR has a current changes-requested assessment and zero unresolved threads, while another has two unresolved threads and unknown assessment.
      when: The operator opens each Project review-attention signal and previews its matching PR with no intervening source change.
      then: The changes-requested destination identifies the first PR; the thread destination identifies the second as one affected PR with two threads, and neither signal invents the other's review assessment.
    blocked_issue_external_source:
      given: Project P contains Repository A with one open Issue blocked by an accessible open Issue in Repository B, which is outside P.
      when: The operator opens P's blocked-Issue signal and previews its affected Issue without intervening source changes.
      then: The Issue in A is shown once, B does not become a Project member, and the permitted blocker information retains its source context.
    denied_preview_and_share:
      given: A private PR preview is open and a source link was eligible before explicit access denial.
      when: Denial is applied and the operator attempts to share the link.
      then: Restricted content is absent from visual and assistive representations, the link is not supplied to the share flow after denial, and an accessible recovery path is available.
    historical_outcome_reopened:
      given: An Issue was closed in the selected past week and subsequently reopened, with source evidence sufficient for that event.
      when: The operator opens the week's distinct-Issue closure selection.
      then: The Issue can appear once with its separately observed open state; the historical condition and original period remain identifiable under 0056 and are not silently replaced with a current-closed or Today filter.
    format_and_external_objects:
      given: A participating authoring process requires the agreed PR sections and a separate external Issue has an unstructured description.
      when: A new participating PR is evaluated and GitView displays the external Issue.
      then: The required PR format is evaluated under the participating process, while the Issue's original text remains visible without invented sections; the presence of a template alone is not reported as proof of enforcement.
  unresolved:
  - Precise device and source fixtures, credentials, test levels and executable acceptance procedures depend on implementation and platform decisions.
  - Exact source mapping, refresh concurrency reconciliation and view composition remain open in dependency branches.
  - These scenarios sample critical paths but do not establish complete coverage of the graph.
