acceptance:
- A local operation is distinguishable from its delivery attempts and from a separately initiated operation even when content or timestamps match.
- A confirmed durable outcome is supported by evidence connecting the same operation and its effect or terminal rejection in the applicable scope.
- A repeated delivery of the same operation cannot create a second logical effect, while a distinct operation is not silently deduplicated by equal content.
- An unavailable outcome or an operation identity bound to incompatible intent does not become an assumed success, failure or new operation.
- Reconciliation respects confirmed later edits, deletion, access restrictions and history-clear boundaries without replaying stale intent as a new action.
specification:
  objective: Define a technology-independent local operation and recovery contract for Project configuration and retained observation effects.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    scope: Apply this contract to local operations whose uncertain outcome or repeated delivery can duplicate a Project creation, overwrite a later configuration, duplicate an observed history sample or undo an explicit history clear. This is a persistence boundary contract, not a new product ontology entity, source event ID or claim that GitHub supports the same operation identity.
    logical_identity: Assign a stable opaque identity to a logical operation before it can produce its effect. Distinguish this identity from each transport or local delivery attempt, the affected Project or Repository identity and any source object or source event identity. A repeat of the same logical intent reuses its operation identity; another intentional creation, another newly initiated source observation or a newly reviewed conflict-resolution submission receives a distinct identity even when values or timestamps happen to match. Identity construction and representation are not selected.
    bound_intent: The storage boundary binds operation identity to its operation kind, target and the essential immutable intent and applicable preconditions or source-observation context. It must detect incompatible reuse of an identity and reject or report a conflict, without applying the changed intent as a retry. Evidence may use a canonical representation or another collision-safe binding; a payload hash alone is not a semantic identity or evidence that two separately initiated operations are the same. Do not expose restricted values merely to explain a mismatch.
    commit_evidence: For a confirmed successful local effect, retain or be able to recover an authoritative association between the operation identity, its bound intent, its actual scoped effect and sufficient outcome context. The effect and the evidence used to claim that effect must have a consistency guarantee across interruption; the system must not report a durable success when only one can be established. This is an observable guarantee; an atomic transaction, idempotent unique constraint or another design may satisfy it if it covers the actual operation and recovery cases.
    outcomes: Distinguish confirmed applied with its actual result, confirmed not applied or rejected when supported, and indeterminate when durable evidence or absence of a still-possible late commit cannot be established. An in-flight attempt and a missing acknowledgement are not confirmed failure. A past receipt is not proof that the effect is currently readable after corruption; 0071 governs present recovery. Claims of absence require a valid read and evidence that no matching effect or pending commit can still materialize in the relevant scope.
    replay: Re-delivery of the same identity and same bound intent returns or reconciles the established result when enough durable evidence exists, rather than producing another Project, event or independently observed sample. If the result is indeterminate, do not claim a second effect or a rollback; a safe replay is allowed only if the chosen boundary can preserve the same logical effect under concurrent or late attempts. It need not block unrelated scopes. A fresh explicit operation can proceed only under its own domain preconditions and without overriding unresolved prior effects where doing so would violate an invariant.
    reviewed_edit: An edit rejected as stale is not silently replayed against a different base. Once the operator reviews a new intention against the confirmed current Project under 0083, that new submission is a distinct operation with a new identity and new preconditions. A lost acknowledgement for the earlier submission must be reconciled first when its late effect could invalidate the review or overwrite another change. Identity reuse does not authorize applying the old intent to the new base.
    creation_and_deletion: Separate explicit custom Project creations remain separate operations even if their names and members match. For default setup, per-Repository association uniqueness under 0052 applies across different operation identities as well as retries; idempotency alone does not enforce that invariant. A late edit cannot recreate a confirmed deleted Project under 0082. A batch selection has its own context and independently reconciled entry operations; no all-or-nothing batch outcome is inferred.
    observations_and_clear: A retry of one accepted observation retention is not a new source observation or event, even after restart. A fresh source observation has its own source and temporal context; equal values do not merge distinct observations. Admission of historical effects respects the confirmed or indeterminate clear boundary in 0067 and 0071; old work cannot be reclassified as post-clear solely by retrying it. An operation record or receipt cannot reveal restricted private content or restore source access.
    retention_and_compaction: Reconciliation evidence must remain sufficient for as long as the operation can be retried or a late effect can still arrive. Before discarding or compacting evidence, the chosen mechanism must establish that doing so cannot turn an unresolved or replayable operation into an assumed new one or undo a clear. When that cannot be established, keep the affected outcome uncertain; exact retention duration, representation and storage budget remain open.
    verification: Specify deterministic boundary tests before implementation for same-ID same-intent replay, incompatible identity reuse, equal-value distinct operations, acknowledgement loss, late commits, stale edit, deleted Project, clear/replay ordering, and interruption between effect and evidence. Include concurrent attempts and restart with injected storage failures. Separate a real persistence and restart observation from controlled doubles and a SpecGraph document check under 0040 and 0079.
    provenance: Default Project behavior, shared membership, local data and TDD were requested by the owner. Opaque local operation identity and outcome binding are agent-authored proposed contracts; they do not choose a database, journal, transaction API or product UI.
  scenarios:
    same_operation_retry:
      given: A custom Project creation operation O committed its Project and durable identity binding, but the completion acknowledgement was lost.
      when: A delivery of O with the same intent is retried after restart.
      then: The confirmed result identifies the same Project once; the missing acknowledgement does not create a second Project.
    two_explicit_creations:
      given: The operator separately confirms two custom Project creations with the same name and members, giving each a distinct operation identity.
      when: Both valid operations commit.
      then: They may create distinct Projects, and equal content does not collapse their explicit intentions into one operation.
    mismatched_reuse:
      given: An operation identity is already bound to creation of a Project with member A.
      when: A delivery reuses that identity while proposing an incompatible creation with member B.
      then: The mismatch is rejected or reported as conflict, with no successful application of the new intent as a retry.
    effect_without_evidence:
      given: A process stops while a local effect and the evidence binding it to its operation are not jointly confirmed recoverable.
      when: The caller asks whether the operation succeeded after restart.
      then: The outcome remains indeterminate unless independent durable evidence establishes it; no second effect or fabricated failure follows merely from the missing receipt.
    distinct_default_setup_operations:
      given: Two independently confirmed setup operations have different identities but both request the default Project for the same confirmed Repository.
      when: Their effects race.
      then: At most one active default association is established under 0052; each operation reports its supported outcome or unresolved conflict without creating a second active default.
    reviewed_conflict:
      given: A Project edit operation is confirmed rejected against a stale base and the operator reviews a revised edit against a newer confirmed base.
      when: The revised edit is submitted.
      then: It is a distinct operation with its own intent and precondition; a late replay of the old operation cannot overwrite the newer base or become the revised edit.
    history_clear_and_retry:
      given: An observation retention operation was initiated before a confirmed all-history clear and its acknowledgement was lost.
      when: That same operation is delivered again after restart.
      then: It cannot recreate cleared history or become a new post-clear observation; reconciliation follows the clear boundary without inventing a successful new sample.
    equal_observations:
      given: Two separately initiated source observations of the same permitted fact produce equal values and the same available timestamp precision.
      when: Their separate local retention operations are reconciled.
      then: Equality alone neither identifies them as one operation nor proves two distinct source events; each keeps its actual supported context and history rules.
  unresolved:
  - Candidate 0113 proposes a SQLite consistency boundary and operation-result coordination; select its provider and concrete operation-binding representation, commit protocol and recovery strategy after upstream data ownership and source contracts are fixed.
  - Define evidence retention and compaction relative to late delivery, process lifetime, storage budgets, private-data policy and history-clear semantics.
  - No concrete persistence, concurrency, fault injection or restart behavior has been implemented or verified.
