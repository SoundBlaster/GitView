acceptance:
- Each displayed aggregate identifies its metric, source scope, coverage and relevant observation time or times.
- Partial and stale observations are not presented as a confirmed current total or an automatic lower bound on current work.
- Confirmed private Repository revocation keeps saved observations and supported derived counts visible as last known under 0019; other disclosure contexts remain open.
- Portfolio-wide aggregation deduplicates source identities without removing a shared Repository from an individual Project summary.
specification:
  objective: Describe what an aggregate may assert when its constituent observations have different completeness, freshness or access.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    inputs: Each metric states its unit, Project or portfolio scope, object type and period where applicable. Its inputs have per-repository or finer observation scope, accepted value, relevant time, coverage and access eligibility under 0044.
    complete: A confirmed aggregate is reported for the stated metric and scope only when every required input is sufficiently covered for the claim and access policy permits use. Its relevant observation times are available; unequal times do not become one invented simultaneous snapshot.
    membership_change: Project coverage is evaluated against its membership for the stated claim, not just the members included in a prior aggregate. Adding a Repository with missing required inputs makes the expanded aggregate incomplete; removing a member changes the scope and does not assert source deletion. A previously complete aggregate remains attributable to its earlier membership and observation context, not to the changed membership.
    aggregate_reconciliation: When an aggregate calculation or source request completes after a membership edit was saved, its original member set remains part of its provenance. Before presenting a current Project claim, evaluate accepted inputs against the saved membership and the metric's other required scope. A result for the former set must not overwrite or be labeled as a complete result for the changed set. Reuse of individual observations for members still present is allowed only when their identity, access, scope and observation context support the new claim; removing a member does not delete its source observations or change another Project.
    claim_time: A complete sum of individually covered inputs observed at unequal times may be reported only with that scope and timing made clear; it is not a point-in-time snapshot unless a separate source guarantee supports the shared time. A change in membership or an unknown identity cannot be hidden by reusing an earlier total.
    population_evidence: Evaluate an aggregate's population using the completeness and reference-time evidence applicable to its own predicate and scope, including candidate 0102 where applicable. A successful traversal with unproven consistency cannot become an exact current aggregate solely through arithmetic. A complete last-known value may retain its earlier supported reference and scope, subject to access, while later individually observed values and the latest request outcome remain distinguishable.
    partial_after_complete: A source-supported complete count at an earlier reference and later individual positive or negative observations are distinct evidence. A later partial response cannot itself advance the earlier count to a new complete reference, nor does it erase the earlier supported claim. Do not derive an exact later total, a current lower bound or a difference by adding or subtracting observed objects from that historical count unless compatible identities, predicate transitions and complete intervening changes are independently established for the requested claim under 0102. Preserve source and attempt outcomes separately under 0044.
    derived_calculation: Bind a derived value to the input contexts actually used, including source identities, applicable membership, predicate version, access decisions and coverage. A late calculation for an older input set cannot overwrite or be presented as a result for a newer context simply because it completed later. If its inputs support neither a coherent shared reference nor a clearly qualified mixed-time observation, report the limitation instead of inventing a snapshot; independently valid input facts may remain usable.
    partial: If some eligible inputs are missing or incomplete, an observed partial value can be shown only with clearly associated supported scope and coverage. Combining inputs requires the applicable identity, disjointness, predicate and time evidence under 0119; overlapping aggregates or observations are not blindly added. The value is not a confirmed complete total, and an unobserved Repository contributes unknown, not zero.
    attention_predicate: For a named attention condition, a confirmed positive observation on an identified permitted PR may contribute that PR once to an observed affected-PR subset even if the Project or the PR's check or thread collection is incomplete. A missing positive observation is not evidence of a negative predicate when the relevant inputs are incomplete or unmapped. Any subset is attributed to its revision and observation context and is not automatically a current lower bound or a complete Project total.
    compound_inputs: If a metric combines independently observed lifecycle, CI or review facts, its claim must preserve the relevant time, revision and coverage of each input. A recently refreshed title or lifecycle does not refresh earlier CI or review facts. Unless supported by source evidence, the combined result is not represented as a single simultaneous current snapshot, even if each separate input was once confirmed.
    stale: A past observation records a fact at its observation time, not a guaranteed present fact. A partial sum containing stale open-work observations is not automatically a lower bound on the number currently open; a previously open PR may have closed or an unseen one may have opened. Show relevant times or stale indication instead of using arithmetic to imply freshness.
    private: Confirmed revocation of a private Repository does not hide its already saved local observations or supported derived counts. Show them as last known with the revocation indication and supported update time when known, and stop synchronization under 0019. Do not present retained values as freshly observed, treat unavailable inputs as zero or claim unsupported coverage. Other account-change and disclosure contexts remain open; no separate access policy is selected here.
    deduplication: Deduplicate confirmed Repository and object identities for a unique portfolio total as in 0029. If identity is insufficient to deduplicate, report the affected uniqueness or coverage as uncertain instead of silently merging by a display name.
    time: A snapshot count and a period outcome count have different input requirements. A current accepted snapshot does not prove a historical event series or fill missing historical buckets; 0030 governs those claims.
    provenance: The owner requested summaries and visible update errors; propagation of coverage, stale counts and restricted derived values is an agent-authored refinement.
  scenarios:
    incomplete_member:
      given: A Project has two Repositories; R1 has a complete Issue observation of three open Issues and R2 has never been observed.
      when: The Project open-Issue metric is displayed.
      then: Three may be identified as the observed R1 contribution with incomplete Project coverage; the Project total is not asserted to be three or to include an implicit zero for R2.
    stale_not_lower_bound:
      given: A Project had three observed open PRs yesterday and no observation since then.
      when: Its current-work summary is displayed.
      then: The time and staleness remain visible and the app does not assert that at least three PRs are open now.
    restricted_total_and_subset:
      given: A previously saved aggregate combines independently supported values for Repository A and private Repository B, and B's access is confirmed revoked.
      when: The current Project summary and an A-only view are prepared.
      then: The supported saved aggregate and its constituent local values remain visible as last known with B's revocation indication and supported update time when known; the mixed value is not claimed as a freshly confirmed total.
    denied_member:
      given: A Project contains one accessible Repository and one private Repository whose access has been explicitly revoked.
      when: The Project summary is displayed.
      then: Previously saved private counts remain visible as last known with the revocation indication and supported time when known; a current aggregate without fresh B data indicates the applicable limitation rather than treating B as zero.
    overlap:
      given: The same confirmed Repository and its one observed PR are members of two Projects.
      when: Both Project summaries and a unique portfolio total are computed with sufficient coverage.
      then: Each Project includes that PR and the portfolio-wide unique total counts it once.
    project_expands:
      given: A Project's open-Issue total was observed with sufficient coverage for Repository A, then Repository B is added without an Issue observation.
      when: Its expanded Project summary is displayed.
      then: The earlier total can be attributed to A's prior scope, but the new Project total is incomplete or unknown; B is not silently counted as zero.
    membership_changes_during_calculation:
      given: A Project contains A and B, a count over A and B is being calculated, and the operator saves an edit replacing B with unobserved C.
      when: The calculation for A and B completes after the edit.
      then: Its result is attributable only to its original scope; the current A and C total is incomplete or unknown, B is not included in that total, and A's permitted observation may be reused within its own context.
    partial_check_attention:
      given: One identified PR has a confirmed failed check in its partially observed relevant revision, while another PR's check results are unknown.
      when: The Project's failed-CI attention is summarized for those observations.
      then: The first PR can be included once in the observed affected subset with incomplete coverage; the second is not silently classified as unaffected and no full current Project total is asserted.
    mixed_time_attention:
      given: A PR's failed CI was last observed at T1 and its lifecycle was separately observed open at T2, with no evidence that the CI value still applies at T2.
      when: A Project summary combines open PRs and failed CI.
      then: The input times and uncertainty remain attributable; GitView does not claim the combined condition was confirmed simultaneously at T2.
    unproven_new_traversal:
      given: A Project has a source-supported complete open-PR count at T1. A later traversal at T2 returns three permitted PRs but does not establish exhaustive coverage for the same scope.
      when: Its open-PR summary is displayed.
      then: The earlier count may retain its T1 scope and reference, the three observations retain their own contexts, and neither the old count nor three is asserted to be the exact current Project total solely because the T2 traversal succeeded.
    partial_change_after_exact_count:
      given: A permitted exact count of three open PRs is supported for Repository R at T1, and a later partial observation establishes that one identified PR is closed at T2 without complete intervening coverage.
      when: The Project summary is evaluated for T2.
      then: The T1 count and the PR's T2 state retain their own contexts; the summary does not subtract one and claim exactly two at T2, because the earlier aggregate membership and other changes are not established.
    later_calculation_for_older_context:
      given: A count calculation uses a T1 evidence set while an independently supported T2 observation changes the relevant count and is accepted first.
      when: The T1 calculation finishes after the T2 result.
      then: T1 cannot replace T2 as the newer supported result merely by finishing later; each result retains its own input and reference context and access restrictions still apply.
  unresolved:
  - Exact representation of coverage and multiple observation times at each density.
  - Per-metric rules establishing sufficiently complete and current source evidence.
  - Presentation and disclosure in account-change or other contexts beyond confirmed private Repository revocation.
