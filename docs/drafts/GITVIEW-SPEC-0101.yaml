acceptance:
- Source observations are normalized as a confirmed PR, a confirmed Issue or an unresolved work representation before Today classification and counting.
- A GitHub REST Issues representation marked as a PR is not also counted as an independent Issue merely because it came from an Issues endpoint.
- Issue-representation IDs, PR IDs, GraphQL IDs and Repository IDs retain their source kinds and are not equated or used interchangeably without supported association.
- A source-confirmed PR and a separately identified Issue remain distinct work objects even when linked or describing the same task.
- Incomplete identity, missing type evidence, omitted fields, unorderable values and missing event times do not become a fabricated match, non-match, lifecycle transition or exact population count.
- Field facts, event times, observation times, source scope and current access retain their distinct contexts through normalization and selection.
specification:
  objective: Define a source-to-domain boundary for PR and Issue observations used by Today without selecting query sizes, API budgets or a storage schema.
  ontology_refs:
  - gitview:GitHub
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    graphql_fact_profile: As a documented candidate for the first source-to-domain profile, accept a usable typed GraphQL Issue or PullRequest observation only with its source instance, confirmed owning Repository identity, typed object Node ID and applicable access and observation context. Map its supported state observation to the same object's observed lifecycle, its `createdAt` to a creation instant, and a PR's supported non-null `mergedAt` to that PR's merge instant. Preserve the original field and context; a GraphQL Node ID is not silently identified with a REST numeric identifier. Separately supported title, number, URL and draft status serve presentation or explicit filters and do not establish the event population. Missing, error-affected, incomparable or restricted fields do not acquire values from another field or the response receipt time. This is a candidate fact mapping, not a chosen complete query, proof of source authorization, or a requirement to use GraphQL exclusively.
    graphql_pr_draft: GitHub documents typed GraphQL PullRequest `isDraft` as `Boolean!`, identifying whether that PR is a draft. For a successfully returned and interpreted field on an independently identified, permitted typed PR, preserve the returned true or false as that PR's draft observation with its source, object and observation context. The schema's non-null declaration does not establish that an operation selected the field or that a usable parent object survived an error; a missing, unselected, error-affected or null-propagated result supplies no false value. Do not infer draft from PullRequest lifecycle, review requests, check conclusions or a REST Issue marker. An older permitted draft observation retains its own applicability and does not become current because another field or page succeeded. A field result can support the optional 0125 predicate but does not establish complete PR population, a merge decision, a selected query or GraphQL grant.
    graphql_datetime: GitHub documents GraphQL `DateTime` as an ISO 8601 UTC date string and separately defines `PreciseDateTime`. For a successfully returned, applicable `DateTime` field, interpret its reported value as a UTC instant for the event identified by that field; apply the captured local calendar day only when evaluating the selection. Preserve the source field and its observation context, including the actual returned representation or equivalent evidence. An absent, invalid or error-affected value is unknown; response receipt time is not the event time. Neither the encoded value nor the number of fractional digits establishes the physical accuracy of the underlying event clock, a rounding rule or a supported uncertainty interval. Do not invent a time range solely because fractional digits are absent. This source-specific interpretation does not prove event-history or population coverage.
    graphql_lifecycle_mapping: For a successfully interpreted typed PullRequest `state`, map `OPEN` to observed open, `CLOSED` to observed closed without merge, and `MERGED` to observed merged, in each case for that object and observation context. For a typed Issue `state`, map `OPEN` and `CLOSED` to their respective observed Issue states; do not apply the PR enum to Issues. Preserve a successfully returned Issue `stateReason` independently, including `COMPLETED`, `DUPLICATE`, `NOT_PLANNED` or `REOPENED`; a known `REOPENED` reason is not itself a closed state. A supported PR `MERGED` state does not supply a merge instant when `mergedAt` is missing or error-affected. An unrecognized future enum value, missing field, field error or conflicting incompatible observation cannot be coerced to one of the known states; retain its limitation or conflict under 0044 and 0053. These mappings are conditional on the actual operation, authorization, field interpretation and subject identity, not proof that a collection or history is complete.
    graphql_close_evidence: GitHub documents `ClosedEvent` with its `closable`, `createdAt` and event `id`, and Issue `timelineItems` can expose timeline events. An applicable, permitted and identity-associated close event provides evidence for its particular closure instant; evaluate it using the captured half-open local day under 0049. It does not establish a later current lifecycle, a successful completion, all closures of that object, or enumeration of all closed objects in a Repository. An empty or partial timeline has no exhaustive meaning without independent scope, access and temporal coverage evidence. An Issue or PR `closedAt` is a separately observed source field, not automatically a complete close-and-reopen history; a null `mergedAt` alone is not a history of every non-merge closure.
    graphql_close_operation_candidates: The accompanying Issue and PullRequest timeline queries are separately scoped examples for a previously identified object; each requests event identity, time and typed closable association with Repository identity. Validate a usable result against the intended source and subject before associating its event. An unexpected subject, unavailable field, null node or incomplete page retains its limitation, not an invented absence. Traversing the timelines of found candidates alone cannot establish complete discovery of every object or event. These are statically schema-checked operations selected as the initial working direction under 0102, not live authorization proof or a history completeness guarantee.
    graphql_close_reason: For an independently identified Issue `ClosedEvent`, preserve a successfully interpreted non-null event `stateReason` as the reason reported for that particular closure, bound to its event identity, subject, event time and observation context. The nullable event reason, an omitted field or a field error must not be filled from the Issue's separately observed current reason. A later `REOPENED` current reason can coexist with an earlier event reason; neither proves completeness of other events or the truth of an outcome beyond the source's reported reason. `ClosedEvent` can concern other `Closable` subjects, so the event type alone does not establish an Issue subject or an Issue-specific reason.
    source_representation: GitHub documents that REST Issues endpoints can return both Issues and PRs and that a PR representation can be identified by the pull_request key. It also states that its id in that representation is an Issue ID, not the PR ID. This describes GitHub source representations; it does not merge the separately modeled GitView PullRequest and Issue concepts or make every linked Issue identical to its PR.
    classify: For a valid, usable REST Issues response under the documented contract, a source-confirmed pull_request marker identifies a PR representation, not an independent Issue card. Classify a record without that marker as an Issue only when the selected operation and response evidence support that interpretation; if the marker or record might be omitted, malformed, inaccessible or affected by an error, leave type unresolved instead of inferring absence. A valid PR-specific source response or another explicitly supported typed source representation may establish PR type within its own documented scope. Do not infer source type from title, labels, URL appearance or a local number alone.
    unresolved_type_handoff: A source record lacking sufficient type or identity evidence is not supplied as a confirmed typed candidate to the 0110 Today decision. Retain a permitted unresolved representation or a safe scope limitation with its own evidence and potential impact on the selected population; do not invent a PR or Issue identity, classify it as a filter non-match, or claim exact exhaustive coverage if it could match. A later independently supported association can make the same source evidence eligible for normal reevaluation without asserting that source content or access changed merely because GitView resolved its identity. An unrecognized future source kind is not automatically a supported PR or Issue.
    later_identity_resolution: When sufficient source evidence associates previously unresolved representations with one confirmed typed object, reconcile those representations under their original source, Repository, access and observation contexts. A previously observed event or field retains its actual time and does not become a new source observation at identity-resolution time. Comparable conflicting field values for the now-confirmed same subject follow 0053; identity resolution alone does not order them or choose a winner. Reevaluate the actual current selection and any supported historical claim using the associated facts and separately established coverage under 0102. Do not infer a new Project membership, source access, current lifecycle, additional event or a fully materialized population merely from resolving the identity. An incompatible attempted association remains a conflict, not an automatic merge.
    identities: Preserve source instance, confirmed Repository identity, object type, repository-local number where supplied, source identifier kind and the actual association evidence. Repository IDs follow 0002 and 0080. The REST Issue ID on a marked PR representation cannot be silently stored or compared as the REST PR ID; GraphQL Node IDs and numeric IDs are separately typed. When the source establishes that two representations refer to the same PR in the same confirmed Repository, retain the association and render or count one PR under the applicable scope. The precise persisted key and cross-API ID conversion are not chosen here; names, a matching title or identical numbers from different Repositories do not prove a match.
    mutable_request_address: A request addressed by `owner/repo` captures an intended Repository identity and an address used to locate it; the address alone does not prove that a later result belongs to that identity. After rename, transfer or address reuse, associate a PR or Issue result only when the actual response or a source-supported association establishes its Repository identity in the same instance and access context. A prior lookup of that name cannot, by itself, rule out a change between requests, and a redirect or HTTP success does not establish identity continuity. If the work operation does not expose enough evidence for the necessary binding, retain the result as unresolved or use a separately justified source method; do not attach it to the old Project, merge it with old work by number, or count it as a confirmed new object. A source-confirmed different Repository at the old address does not inherit membership or evidence under 0080 and 0084.
    graphql_repository_witness: As an agent-authored candidate for individual work facts, use GitHub's typed GraphQL Issue or PullRequest `id` and its documented `repository { id }` association from the same usable object response, in the captured source instance and access context. Compare the returned Repository Node ID with the intended Repository using a source-supported typed association or migration alias under 0080; do not compare it directly to a REST numeric ID. When a typed Repository node is itself used as the parent of its documented `issues` or `pullRequests` connection, its supported identity and the actual connection path may also supply scoped association for usable returned nodes, subject to the exact query, returned identity and error interpretation under 0116. A failed, null-propagated, inaccessible or unassociated parent or repository field leaves the affected association unestablished; neither path or variable alone nor a prior request supplies it. The result can support individual object facts without proving source-wide population coverage, simultaneous state of all fields or access in a future request.
    graphql_pr_fork_context: GitHub describes `PullRequest.repository` as the associated Repository and separately exposes nullable `baseRepository` and `headRepository` for the respective refs. Preserve those relationships and their source IDs independently; a head Repository can be a different fork and cannot automatically become the Project member or the PR's associated Repository. A missing head or base repository is not proof that the PR itself is absent, and a name or matching branch cannot replace its unavailable identity. Do not infer a stable ref revision or CI status solely from Repository association.
    changed_work_repository: If a source-supported later observation associates an already identified work object with a different Repository, preserve each observation's actual subject, association and time and evaluate current Project scope under its own applicable evidence. Do not rewrite an earlier historical observation or infer that Project membership changed. Identity continuity, event order, source transfer semantics and current access still need evidence; an incompatible or unordered association follows 0053 rather than being settled by arrival order. An unavailable linked Repository or different Node ID without an established alias is not automatically a confirmed move.
    source_association: A documented source link or separately validated source response may supply the association between a marked Issues representation and its PR. A same-Repository source number can be used as a lookup locator only in the scope and source contract that supports it; the lookup result and source identity must be confirmed before consolidating observations. An unavailable target, unknown Repository identity, conflicting evidence or address reuse leaves the association unresolved under 0038 and 0053, without inventing a second confirmed PR or assigning another object's data.
    typed_global_node_bridge: When a permitted usable REST representation returns `node_id`, GitHub documents it as a global Node ID usable in GraphQL. Associate it with that exact REST representation and source context, then validate any GraphQL node's actual type and Repository association before treating its fields as the same Issue or PR. In particular, do not assume that a PR-marked Issues representation's numeric Issue ID is the PR numeric ID or that its Node ID is a typed GraphQL PullRequest without supporting type evidence. A null or error-affected lookup does not establish deletion, distinct identity or absence of access. Multiple Node ID formats require an explicit source-supported alias under 0080 rather than prefix decoding or a guess that unequal strings identify different work objects.
    separate_linked_issue: A separately source-identified Issue linked to the PR remains a distinct Issue, even when the objects refer to the same problem or the PR may close it. Its identity, source scope and Today inclusion are evaluated separately; the source relation is not proof of an actor's motive, a merge or an Issue closure. Equal visible numbers in different Repositories remain distinct objects.
    lifecycle_and_events: A typed observation establishes only source fields and times actually supported by that response. An Issues representation of a PR with closed state does not alone establish whether that PR merged or closed without merge; require applicable PR or event evidence. A current closed state or retrieval time does not establish an event occurred Today. Apply 0027 and 0089 to source-confirmed open state, creation and closure or merge event times, preserving later reopenings and independent observation contexts. A missing or contradictory state remains unknown or last known under 0044 and 0053.
    merge_and_coverage: A single object can satisfy several Today alternatives but appears at most once when identity is confirmed. Partial, overlapping or differently timed source observations may contribute supported facts without producing a full source population or simultaneous snapshot. A completed page or one typed list does not prove that other open work, in-day creation or closure or merge alternatives have been enumerated. Unclassified or unresolved records and wholly unobserved source portions prevent an exact complete count when they could affect the result; they are not silently dropped as negative matches. Confirmed false conditions may exclude only in the scope supported by 0027.
    access_and_present: Apply current access rules before exposing object existence, identifier, text, source link or derived counts under 0036 and 0088. A temporary presentation token is not a source identity, a restricted candidate cannot be shown merely to explain uncertainty, and a failed source operation is not a confirmed deletion or empty source. Preserve allowed prior observations with their own source and time context.
    effects_and_verification: Normalize source representations at the domain-aware adapter or composition boundary under 0095 and 0096; pure Today selection consumes prepared typed facts, not live source responses or network effects. Under 0040 and 0079, planned tests inject distinct Repository IDs, marked PR issue representations, independent linked Issues, missing type and timestamps, source conflicts and access changes. A separate real-adapter and authorized GitHub verification must establish actual field semantics and mapping; synthetic fixtures and the public documentation are not a live-source result.
    provenance: The owner chose separate PR and Issue overviews, Today work including same-day completed items, retained cache and multi-Repository Projects. The source normalization and uncertainty rules are agent-authored refinements grounded in GitHub's documentation; 0102 selects the documented initial GraphQL operations, not a verified grant, exhaustive population or implementation.
  scenarios:
    graphql_draft_field_availability:
      given: Two independently identified permitted GraphQL PR observations have applicable open lifecycle. The first successfully returns `isDraft` false; the second operation did not request that field, and a separate response for it later has a null-propagated parent after an error.
      when: The optional open non-draft selection is prepared.
      then: The first field supports a non-draft observation for its own context, while neither the omitted field nor the failed parent establishes false for the second PR. The second candidate remains uncertain unless separate applicable permitted evidence resolves its draft status; neither response establishes full Project population coverage or merge readiness.
    graphql_datetime_day_start:
      given: A permitted identified Issue has a successfully interpreted GitHub GraphQL creation `DateTime` of 2026-05-01T00:00:00Z, and the captured local day corresponds to the UTC half-open interval from 2026-05-01T00:00:00Z to 2026-05-02T00:00:00Z.
      when: The source creation fact is prepared for Today.
      then: The reported instant is included at the start of that day, with its source and observation context preserved; missing fractional digits do not create an invented time range, and the fact alone does not establish population coverage.
    later_resolution_conflicting_lifecycle:
      given: Two permitted unresolved representations observed at T1 and T2 are later source-confirmed to denote the same PR, but their incompatible lifecycle observations have no sufficient source ordering evidence.
      when: Identity is resolved at T3 and the Today selection is recalculated.
      then: They are one identified PR rather than two cards, each lifecycle fact retains its original context, the conflict remains uncertain under 0053, and T3 is not presented as a new lifecycle observation or complete source snapshot.
    typed_graphql_repository_witness:
      given: The current permitted Project contains Repository R with a validated REST numeric-ID-to-Node-ID association, and a typed GraphQL Issue response independently supplies its Node ID and `repository.id` matching the associated Repository Node ID.
      when: The adapter prepares the Issue for the Project's selection.
      then: The supported response can associate that identified Issue with R for that observation context; the issue number and mutable address are not the association, and the single Issue does not prove complete Repository coverage.
    forked_pr_witness:
      given: A typed GraphQL PR response associates the PR with Project member A and separately identifies its head Repository as fork B.
      when: The Project-wide work grid is prepared.
      then: The PR is attributed to A under its supported association, B is retained only as the separately identified head context and is not automatically added as a Project member; no CI result is inferred.
    missing_repository_witness:
      given: A typed PR or Issue contains a usable title but its necessary `repository` association cannot be established because of a GraphQL error or null propagation.
      when: The adapter receives it for a Project route previously addressed by name.
      then: The title alone or requested name does not establish the object's membership in that Project; the object association is unresolved, while unrelated independently supported results remain usable under their own context.
    reused_address_during_work_request:
      given: Project P includes confirmed Repository A which previously used address X, and a work request using X was prepared; independently supported source evidence establishes that X now identifies different Repository B.
      when: The work response returns PR number 42 without sufficient evidence binding its actual Repository to A or B.
      then: GitView does not attach that PR to A, treat it as A's former PR 42 or add B to P; the response remains unresolved until sufficient source association is established and P's existing observations and membership are preserved.
    marked_issue_node_type_unresolved:
      given: A usable REST Issues response contains a PR-marked representation and a `node_id`, but its GraphQL lookup is unavailable and no other source evidence establishes the node's typed PullRequest association.
      when: The adapter prepares a cross-API PR identity.
      then: The record remains a PR representation with its own documented Issue ID and node association, but the adapter does not assert that the Node ID is a GraphQL PullRequest or assign an unrelated PR's fields; a source-supported later association can resolve it.
    graphql_merged_without_merge_time:
      given: A permitted typed PullRequest has a successfully interpreted GraphQL state of MERGED but its `mergedAt` field is affected by an error.
      when: Its current lifecycle and Today event facts are normalized.
      then: Its observed lifecycle is merged in that field's context, but its merge instant and same-day merge alternative remain unknown unless independently supported; no time is copied from response receipt.
    event_reason_and_reopened_current_issue:
      given: A permitted identified Issue is observed OPEN with current reason REOPENED, and its separately identified earlier ClosedEvent has reason NOT_PLANNED and a supported event time.
      when: Its current overview and historical closure facts are normalized.
      then: The current open state and reopened reason remain separate from the event's not-planned closure reason and time; neither is overwritten by the other or establishes a complete timeline.
    unknown_future_lifecycle:
      given: A typed source object supplies an unrecognized lifecycle enum value in a future schema response.
      when: Its source facts are mapped for Today.
      then: The lifecycle remains unsupported or unknown rather than defaulting to open, closed or merged, and source payload and context may be retained only under applicable access and retention policy.
    graphql_creation_and_unknown_closure:
      given: A usable typed GraphQL Issue response identifies its Repository and object, confirms `createdAt` within the captured local day, and has no sufficiently covered closure-event history.
      when: The source facts are mapped for the Today policy.
      then: The creation alternative is supported for that identity and day, while closure history and population coverage remain independently unknown or limited; the object is not duplicated by the two alternatives.
    graphql_close_event_with_later_unknown_state:
      given: A permitted GraphQL ClosedEvent is associated with an identified Issue and its event time is in Today, but a later current lifecycle is not established.
      when: The issue's Today facts are prepared.
      then: The close event can support in-day inclusion while current open or closed state and any separate lifecycle filter remain unknown; event time is not replaced by retrieval time.
    issue_endpoint_pr_and_independent_issue:
      given: A usable source result for Repository R contains a PR-marked Issues representation for work number 10 and a separately identified Issue number 11 linked to that PR; a separately obtained PR representation is source-confirmed to refer to the same PR.
      when: The applicable Today selection is constructed with sufficient source facts.
      then: The PR occurs at most once as a PR and the independent Issue can occur once as an Issue; the PR's Issues representation is not an extra Issue card and the link does not merge the Issue into the PR.
    ids_are_typed:
      given: One marked PR representation contains an Issues-endpoint numeric id, and its source-confirmed PR representation has a PR identifier.
      when: Their observations are associated.
      then: Each identifier retains its source kind; numerical equality is not required or assumed, and the Issue representation id is not presented as the PR id.
    untyped_partial_record:
      given: A partial or error-bearing response omits the field needed to determine whether a work record is a PR representation.
      when: A Today selection is built.
      then: The record is not automatically classified as an Issue or PR, and any affected population claim remains uncertain unless independent source evidence resolves the type.
    closed_pr_without_merge_evidence:
      given: A PR-marked Issues representation reports closed, but no applicable PR merge information or closure event time is available.
      when: The record is mapped for Today.
      then: Its PR type may be known while merge versus unmerged closure and any in-day outcome remain unknown; the retrieval time is not fabricated as a merge or closure time.
    cross_repository_number:
      given: Repository A and Repository B each contain source-confirmed PR number 42, while B also has a separately identified linked Issue.
      when: Project-wide work is deduplicated.
      then: The PRs remain distinct by their respective confirmed Repository and source identity, and the linked Issue remains its own Issue rather than being merged by number or title.
    multiple_inclusion_alternatives:
      given: One confirmed PR was created today and later merged today with supported event times and compatible identity evidence.
      when: Unfiltered Today is evaluated.
      then: It appears once as the same PR with its applicable observed lifecycle, not once for creation and again for merge.
    access_changes_during_normalization:
      given: A source response containing a private PR representation arrives after an applicable access denial was established.
      when: Normalized candidates are projected for display.
      then: Restricted identity, text, link and revealing count are not shown, and the late response does not itself restore access.
  unresolved:
  - Validate actual source representations, ID association evidence and source-event fields against the selected typed GraphQL direction during integration; do not assume GraphQL and REST identifiers are interchangeable.
  - Establish or conservatively represent population and temporal coverage for the chosen requests and reconciliation method, including mutable pages and partial access.
  - No adapter, source integration, durable observation storage or native UI has been implemented or exercised.
