specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Summarize current work, attention and outcomes within an explicit scope.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  requirements:
  - Distinguish open PRs, draft subset and open Issues, plus CI, review, unresolved-thread and Issue-blocker
    attention signals.
  - Count affected PRs separately from individual checks and affected repositories; do not add overlapping
    attention categories as if disjoint.
  - Show merged PRs and closed Issues by reason for a selected period; do not conflate PR and Issue totals
    with independent tasks.
  - A Project summary uses its applicable member scope, including a Repository shared with another Project; portfolio
    totals deduplicate confirmed Repository and object identities. Restricted membership and revealing counts remain subject to access policy.
  - Expose partial coverage and freshness rather than treating an unavailable repository as zero.
  - A preliminary passed-checks-and-review selection remains conditional until its predicate is defined;
    do not label it merge-ready.
  review_scenarios:
  - Given a repository in two projects, it contributes to each project but once to a portfolio-wide unique
    total.
  - Given two PRs with five failed checks, report two affected PRs and keep check count separate.
  unresolved:
  - Exact period default and predicate for a 'checks and review passed' selection remain open; do not
    claim merge readiness.
  pilot_scenarios:
    overlap:
      given: One PR has failed CI, a change request and an unresolved thread.
      when: The three attention signals are summarized.
      then: The PR contributes to each applicable signal but is not presented as three separate PRs.
    partial_project:
      given: A Project contains five repositories and only four have current observations.
      when: Its summary is shown.
      then: The available counts are labeled incomplete and the fifth repository is not silently counted
        as zero.
acceptance:
- Compute each Repository summary from applicable supported observations and distinct confirmed identities; count open PRs, draft subset and open
  Issues separately. An observed subset is not automatically a complete or current total.
- Project summaries aggregate their member repositories without dropping a repository that belongs to
  another Project; portfolio totals use unique repository and object identities.
- A failed-check indicator can count affected PRs and affected repositories, separate from the number
  of failed checks; overlapping signals are not added as independent problems.
- Outcomes are scoped to an explicitly selected period and are distinct from current-state counts. Partial
  or stale coverage is visible. An actionable signal preserves its unit and condition when opening an object selection; checks, threads or events need not equal the number of cards.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
