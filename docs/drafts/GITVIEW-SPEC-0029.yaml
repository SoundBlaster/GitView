acceptance:
- Each summary identifies its Project or Repository scope, relevant object category, observation coverage and applicable time period.
- Each Repository contributes to every Project it belongs to, while a portfolio-wide unique total counts each Repository and source object once.
- Distinct units and overlapping attention signals are not summed as distinct work items.
- Incomplete or unknown source coverage is visible and cannot be treated as a known zero.
specification:
  objective: Make summary scope, identity, units and uncertainty explicit across repositories and Projects.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    repository: A Repository summary covers known distinct objects from that source Repository for a named category and selected period where applicable. Repository rename or transfer with confirmed identity does not produce another repository for counting.
    project: A Project summary covers its distinct current member Repositories. A Repository shared with a different Project contributes to both Project summaries; the contributions are correct within their respective scopes and must not be summed into a unique portfolio total without deduplication.
    membership_context: The membership underlying a previously observed summary is part of that summary's scope. If Project membership changes, coverage and totals must be reassessed for the new set; a formerly complete result does not establish that a newly included Repository has zero work.
    portfolio: A portfolio-wide unique total uses the union of member Repository identities and distinct source object identities within those Repositories. Equal issue or PR numbers in different repositories are separate; a linked PR and Issue are separate object types. Multiple memberships do not create additional source objects.
    units: Open PRs, draft PRs, open Issues, affected PRs, failed checks and affected repositories are separately named units. Draft PRs are a subset of open PRs where the draft flag is known; adding the two counts as independent PRs is incorrect. CI, review and thread attention categories may overlap and are not added into a unique problem count without an explicit deduplication rule.
    time: Lifecycle state is a current observed fact at its own observation time; merged PRs and closed Issues are outcomes within a separately specified period. A closed Issue is not automatically a completed Issue. Reopenings and historical outcome counting require sufficient source history and are not inferred from current state alone.
    coverage: Each metric carries coverage and last relevant observation time for its inputs. Known values from partially observed member Repositories can be presented as partial observed counts but not as a confirmed total or automatic zero for missing members. Explicit access denial follows 0019 and cannot expose restricted private data.
    selection: Navigating from a summary signal retains its originating Project or Repository, period and condition; it does not treat a count as proof that all underlying objects are loaded. Filtering and unknown behavior follow 0007 and 0027.
    selection_unit: A signal measured in checks or review threads can navigate to the distinct PRs associated with those checks or threads, without asserting that the number of PR cards equals the signal count. The destination identifies both the source condition and its own unit. An event-count outcome can likewise lead to distinct affected objects, but multiple events for one object do not become multiple object cards or one event.
    selection_time: Preserve the originating metric's current-state or event-period meaning when opening a signal. A historical outcome selection cannot silently become a Today or currently-closed filter merely because those are the work collection defaults. If a destination cannot represent the origin's condition or period with available evidence, expose the limitation instead of claiming an equivalent selection.
    selection_refresh: The origin count and destination list may describe different observations if data refreshes during navigation. Preserve their observation contexts and make incompleteness or changed data identifiable; do not fabricate equality or imply that a changed value proves an error. Restricted inputs remain subject to 0036 and 0046.
    provenance: Membership overlap and distinct count units follow the owner's discussion; exact presentation and coverage propagation are agent-authored proposals.
  scenarios:
    cross_project_overlap:
      given: Repository R is in Projects P and Q and has one observed open PR.
      when: P, Q and the portfolio unique total are summarized with complete coverage.
      then: Each Project includes the PR once and the portfolio unique total includes it once, not twice.
    same_number:
      given: Two different Repositories each contain one open Issue numbered 42.
      when: Their Project is summarized with complete coverage.
      then: The open Issue count is two and each source Repository remains identifiable.
    overlapping_attention:
      given: One PR has a failed check and an unresolved review thread.
      when: CI and thread attention are summarized.
      then: That PR contributes to each applicable signal but is not represented as two distinct PRs.
    partial_membership:
      given: A Project has two members, one fully observed and one with no Issue observation.
      when: Its Issue count is shown.
      then: The known contribution can be shown with incomplete coverage and the missing member is not treated as zero.
    many_checks_one_pr:
      given: A Project signal counts five failed checks across two distinct PRs under complete matching coverage.
      when: The operator opens the signal as a PR collection without a data change.
      then: The destination identifies two affected PRs and the failed-check condition; it does not claim that its two PR cards are five checks or that three PRs are missing.
    historical_outcome:
      given: An Issue had two confirmed closure events in the selected past week and is currently open after a later reopening.
      when: The operator opens the distinct-Issue selection for that week's closure events.
      then: The Issue remains one eligible object for that event-period condition, with its current open state; the selection is not silently replaced by currently closed Issues or Today.
  unresolved:
  - Precise per-metric coverage representation, freshness classification and historical outcome definitions.
  - How unknown filter inputs affect navigation from a particular summary signal; refine with 0027.
