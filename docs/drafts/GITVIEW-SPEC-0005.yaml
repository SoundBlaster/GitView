specification:
  objective: Maintain a named GitView project containing one or more GitHub-managed repositories.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:GitHubRepository
  - gitview:User
  - gitview:AddRepository
  - gitview:addsRepositoryTo
  - gitview:RemoveRepository
  - gitview:removesRepositoryFrom
  - gitview:projectIncludesRepository
  ontology_reference_boundary: These candidate terms describe available vocabulary for an operator's Project membership changes and membership state. A reference does not assert that a particular action was performed, establish actor identity or motive, or prove a stored state transition.
  requirements:
  - A project has a stable local identity, a name, an optional purpose and references to its member repositories.
  - A repository may be a member of multiple projects; organizations do not constrain membership and repositories
    from different organizations may coexist in one project.
  - The default is one project per repository; project and repository remain distinct identities.
  - Adding a repository targets an existing repository and preserves its identity and other memberships.
  review_scenarios:
  - Given one repository in two projects, changing its source owner does not remove either membership.
  - Given repositories from different GitHub organizations, a project can include both.
  unresolved:
  - 0025 proposes rejecting a saved Project with an empty name or no members and preserving the last saved state; creation drafts, edit interaction and acceptance of this proposal remain open.
  - Automatic synchronization between default Project names and later repository rename is not assumed.
  evidence_boundary: Scenarios are expectations for future verification, not executed tests. The ontology
    selection and specification remain drafts; implementation is not claimed.
  pilot_contract:
  - Project has a stable local ID, name, optional description and a membership set of source-identified
    GitHub repositories; membership does not copy repository data.
  - An existing repository may occur in several projects; a project may contain repositories in different
    organizations.
  - Provide a way to create, rename and edit a project and select its repositories; default discovery
    starts with one project per repository.
  - Removing a membership affects only the selected project; it does not delete the source repository
    or alter other projects. The user must not be left with an invalid empty saved project; exact editing
    flow is open.
  pilot_scenarios:
    shared_membership:
      given: R belongs to Projects P and Q.
      when: R is removed from P while P retains another repository.
      then: R and its history remain intact in Q and on GitHub.
    cross_organization:
      given: R1 and R2 belong to different organizations.
      when: The user selects both for one Project.
      then: Both remain members with their original repository identities.
  pilot_provenance: The owner authorized autonomous pilot specification in excerpt-72. Working details
    are specification choices, not claims that the app exists or that every detail was separately discussed.
acceptance:
- Project has a stable local ID, name, optional description and a membership set of source-identified
  GitHub repositories; membership does not copy repository data.
- An existing repository may occur in several projects; a project may contain repositories in different
  organizations.
- Provide a way to create, rename and edit a project and select its repositories; default discovery starts
  with one project per repository.
- Removing a membership affects only the selected project; it does not delete the source repository or
  alter other projects. The user must not be left with an invalid empty saved project; exact editing flow
  is open.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
