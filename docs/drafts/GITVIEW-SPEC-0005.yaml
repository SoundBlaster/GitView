id: GITVIEW-SPEC-0005
title: "GitView - Project composition and membership"
kind: spec
created_at: '2026-11-10T00:00:00Z'
updated_at: '2026-11-10T00:00:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0001
depends_on:
- GITVIEW-SPEC-0002
sources:
  root_draft: docs/drafts/GITVIEW-SPEC-0001.yaml
  topic: docs/drafts/project-summary-proposal.md
  authorization: conversation:gitview/excerpt-68
  ontology_selection: ontology/candidates/domain-v0.2.0-draft.4/composition-context.yaml
specification:
  objective: "Maintain a named GitView project containing one or more GitHub-managed repositories."
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:GitHubRepository
  - gitview:User
  requirements:
  - "A project has a stable local identity, a name, an optional purpose and references to its member repositories."
  - "A repository may be a member of multiple projects; organizations do not constrain membership and repositories from different organizations may coexist in one project."
  - "The default is one project per repository; project and repository remain distinct identities."
  - "Adding a repository targets an existing repository and preserves its identity and other memberships."
  review_scenarios:
  - "Given one repository in two projects, changing its source owner does not remove either membership."
  - "Given repositories from different GitHub organizations, a project can include both."
  unresolved:
  - "Creation, editing, removal, empty transitional states and synchronization of default project names require design."
  evidence_boundary: "Scenarios are expectations for future verification, not executed tests. The ontology selection and specification remain drafts; implementation is not claimed."
