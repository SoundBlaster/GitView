specification:
  objective: Let the operator leave the overview for GitHub and share useful object context.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - Where an eligible original GitHub URL is available, offer a route to the source object while preserving its observation context.
  - Provide lightweight sharing using the platform's native sharing experience.
  - Keep source URLs and source data associated with the correct object and repository.
  - Do not imply access to private content for a recipient merely because a link is shared.
  review_scenarios:
  - Given a PR with an eligible observed source URL, opening its source requests that URL without claiming the external handler loaded the intended object.
  - Given no source URL, do not construct an unverified URL and present it as confirmed.
  unresolved:
  - Exact UI affordance and optional additional payload require product and privacy review.
  evidence_boundary: Scenarios are expectations for future verification, not executed tests. The ontology
    selection and specification remain drafts; implementation is not claimed.
  pilot_contract:
  - Offer an original GitHub source link for a Repository, PR or Issue when an eligible source URL is available;
    do not manufacture an unverified URL or present a known misdirected address as that object.
  - Use the native share flow for an available source link; sharing a link does not grant recipient access.
  - For the pilot, default to sharing the source link and avoid automatically exporting private descriptions,
    repository contents or screenshots. Additional share payload is a later decision.
  - If a URL is absent, indicate that source opening or link sharing is unavailable, rather than opening
    a different object.
  pilot_scenarios:
    private_link:
      given: A PR belongs to a private repository and has a source URL.
      when: The operator shares it.
      then: The system share flow receives the link; access remains subject to GitHub permissions.
    missing_url:
      given: An Issue has no known source URL.
      when: The operator invokes source navigation.
      then: The app does not invent a URL or navigate to a different issue.
  pilot_provenance: The owner authorized autonomous pilot specification in excerpt-72. Working details
    are specification choices, not claims that the app exists or that every detail was separately discussed.
acceptance:
- Offer an original GitHub source link for a Repository, PR or Issue when an eligible source URL is available;
  do not manufacture an unverified URL or present a known misdirected address as that object.
- Use the native share flow for an available source link; sharing a link does not grant recipient access.
- For the pilot, default to sharing the source link and avoid automatically exporting private descriptions,
  repository contents or screenshots. Additional share payload is a later decision.
- If a URL is absent, indicate that source opening or link sharing is unavailable, rather than opening
  a different object.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
