specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Let the operator leave the overview for GitHub and share useful object context.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - Where an eligible original GitHub URL is available, offer a route to the source object while preserving its observation context.
  - Provide lightweight sharing using the platform's native sharing experience.
  - Keep source URLs and source data associated with the correct object and repository.
  - Do not imply access to private content for a recipient merely because a link is shared.
  provenance_boundary: The owner requested source navigation and lightweight sharing. A source-link-only default and exclusion of automatic private text, repository content or screenshots are agent-authored working choices for the pilot, not individually selected owner requirements. A recipient's actual permissions and external delivery remain outside GitView's control.
  review_scenarios:
  - Given a PR with an eligible observed source URL, opening its source requests that URL without claiming the external handler loaded the intended object.
  - Given no source URL, do not construct an unverified URL and present it as confirmed.
  unresolved:
  - Evaluate the proposed link-only default, optional additional payload and exact UI affordance against product usefulness and privacy; no recipient access is guaranteed by sharing.
  pilot_scenarios:
    private_link:
      given: A PR belongs to a private Repository and has an eligible source-associated URL, with access permitted through the applicable handoff boundary.
      when: The operator explicitly shares it and the platform receives the link.
      then: The app-controlled default payload is the selected PR link without private body text or credentials. Recipient delivery and access remain separate and are not inferred from presenting the share flow.
    missing_url:
      given: An Issue has no known source URL.
      when: The operator invokes source navigation.
      then: The app does not invent a URL or navigate to a different issue.
acceptance:
- Offer an original GitHub source link for a Repository, PR or Issue when an eligible source URL is available;
  do not manufacture an unverified URL or present a known misdirected address as that object.
- Use the native share flow for an eligible source link after applicable handoff admission; sharing a link does not grant recipient access or establish delivery.
- As an agent-authored pilot candidate, default to sharing the source link and avoid automatically exporting private descriptions,
  repository contents or screenshots. Additional share payload is a later decision.
- If no eligible source-associated URL, including a permitted last-known link, is available, indicate that source opening or link sharing is unavailable rather than opening
  a different object.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
