sources:
  root_draft: docs/drafts/GITVIEW-SPEC-0001.yaml
  topic: docs/drafts/product-foundation.md
  authorization: conversation:gitview/excerpt-68
  ontology_selection: ontology/candidates/domain-v0.2.0-draft.4/composition-context.yaml
specification:
  objective: "Let the operator leave the overview for GitHub and share useful object context."
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - "Where an original GitHub URL is available, offer a direct route to the source object."
  - "Provide lightweight sharing using the platform's native sharing experience."
  - "Keep source URLs and source data associated with the correct object and repository."
  - "Do not imply access to private content for a recipient merely because a link is shared."
  review_scenarios:
  - "Given a PR with an available source URL, opening its source leads to that PR in GitHub."
  - "Given no source URL, do not construct an unverified URL and present it as confirmed."
  unresolved:
  - "Exact shared payload, private-context safeguards and missing-link presentation remain open."
  evidence_boundary: "Scenarios are expectations for future verification, not executed tests. The ontology selection and specification remain drafts; implementation is not claimed."
