acceptance:
- The displayed status-check counts identify their PR, relevant source revision or revisions, observation context and coverage.
- A current source check-run entry and a current source commit-status context are distinguishable counted units; equal display names alone do not combine them.
- Success, pending, failure and unmapped or other results retain distinct evidence and do not imply merge eligibility.
- When source identity, current-attempt selection, revision applicability or required source coverage cannot be established, the affected exact total or absence of failure remains uncertain.
specification:
  objective: Specify the user-visible unit of a GitHub-like status-check overview without conflating source types, historical attempts or merge decisions.
  ontology_refs:
  - gitview:PullRequest
  - gitview:CIStatus
  contract:
    unit: An entry in this working proposal is one current GitHub status-check result in the identified PR observation context. It can be a check run or a commit-status context. Count source-confirmed distinct entries, not workflow runs, jobs as an assumed one-to-one mapping, repositories or a sum of all historical attempts. Source names and types remain available for disambiguation where observed.
    types_and_identity: Preserve the source family and source-supported identity of an entry. A check run and a commit-status context with the same displayed name are not merged merely by that name; two different integrations can also use similar names. Conversely, repeated observations of the same source entry are not additional checks. Equivalence across different source representations or successive attempts requires evidence rather than a guessed name match.
    current_selection: The counted set describes source entries selected as current for the stated PR and revision context. A historical attempt is not added as a separate current result solely because it was retained locally. Exact equivalence, retries and source rules for selecting a current entry require verification; when these cannot establish the set, report incomplete or uncertain counts rather than choose by arrival order.
    revision: Keep the revision or revisions to which each result applies distinct. A head-commit rollup and checks associated with a test merge commit are not automatically equivalent. The GitHub PR status box can use a test merge commit or head depending on circumstances; source evidence and a product mapping must identify the applicable set before claiming equivalence to the PR's complete current status checks. A prior head result is not silently attached to a newer head.
    source_options: As the agent-authored initial working source, use the documented GraphQL PR head-ref statusCheckRollup contexts operation linked in sources, with separately typed check runs and commit status contexts. This selects an acquisition direction, not proof that the connection, permission and revision reproduce every visible PR status or that pages form a coherent snapshot. A later source change requires its own applicability evidence; no page size or request budget is fixed.
    fork_association: GitHub documents that the REST check-run listing can return an empty pull_requests array for pushes to a fork. That array alone cannot prove a check run is unrelated to a fork-based PR, that the PR has no checks, or that the source Repository is absent. Associate checks with a PR only using sufficient source, repository and applicable revision evidence; missing association evidence remains uncertain rather than an inferred negative.
    source_filter_scope: GitHub documents latest and all filters for relevant check-run listing operations. The selected filter and source reference are part of observation context; a latest-filtered result is not a history of every prior attempt, and all results must not be blindly summed as the current check set. Neither a filter name nor successful pagination alone proves exact equivalence to the PR status box or coverage of commit statuses and other revisions.
    combined_status_is_not_entry: GitHub documents a REST combined commit-status state that can be pending when no statuses exist, and separately describes the latest status for contexts. Treat that combined state as its own scoped source aggregate, not as one pending check entry or proof that a pending individual status exists. An independently established empty status-context collection can support zero status-context entries for its exact source scope, but does not establish an empty check-run collection or the full PR status box. Conversely, a pending combined state or a total count alone does not provide the individual identities needed for the counters. The REST endpoint's semantics and permissions do not automatically establish equivalent GraphQL rollup behavior; the actual revision, access and currentness must be established separately.
    categories: For source entries whose meaning and current applicability are sufficiently established, show failure, pending and success counts and a total as in 0028. The 0061 working mapping treats special outcomes conservatively; preserve these outcomes or mark them unclassified rather than forcing them into success to make three categories add up. Mapping requires source and UX validation and must not infer merge permission.
    partial: A confirmed current failure in the covered revision may establish a positive observed failure even with other entries missing. No observed failure, an empty response or a single available source family cannot establish a complete zero or absence of failure while any applicable entry, family, identity or revision remains unobserved. Retain applicable time and coverage under 0044 and 0046.
    action: Present the counters as status-check observations for review and navigation, not as a branch-protection decision or authorization to merge. Required-check policy, review state, thread resolution and merge eligibility remain distinct.
    graphql_head_rollup_candidate: The selected initial working query retrieves the PR head-ref rollup, its separately returned commit OID, typed CheckRun and StatusContext entries and page information. The saved public schema statically accepts the shape; require a usable identified PR and Repository witness, applicable entry and revision context and actual response interpretation before counting. A missing rollup or commit, an unassociated entry, unknown union type or incomplete page is not zero or success. This query alone does not establish a coherent snapshot, retry selection, test-merge results or equivalence to the full GitHub PR status box; no live source operation or permission is proven.
    paged_revision_change: For a multi-page candidate traversal, associate every usable page and its entries with the PR and Repository witness, the returned head and rollup revision evidence, account and observation context actually supported for that page. If a later page establishes a different head or rollup revision, do not combine the pages into one complete current set or transfer the earlier failures or successes to the later revision. Independently supported earlier results may remain inspectable as last known for their own revision under 0061; evaluate the newer revision from its own applicable evidence, retaining an incomplete or uncertain set where necessary. Matching revision identifiers across pages is necessary for a same-revision claim but does not by itself establish that the mutable entry set or retry selection was a coherent snapshot. A null, error or unresolved association does not prove that the head changed or stayed the same. A separate refresh or retrieval may be initiated under 0048, without requiring a specific page size, polling cadence or API budget.
    provenance: Counting individual current checks and following GitHub were selected by the owner. The cross-family entry definition is an agent-authored working interpretation; source-specific mapping and behavior are not yet verified against a real PR.
  scenarios:
    same_name_different_families:
      given: A source confirms a current check run named build and a distinct current commit-status context also named build for the relevant revision.
      when: The status-check entries are counted.
      then: Both source-confirmed entries remain distinct and count once each; their shared name is not deduplication evidence.
    pending_aggregate_without_statuses:
      given: For an identified commit the documented REST combined status reports pending because no status contexts exist, and the source independently supports that empty status-context scope. Check runs for the PR have not been observed.
      when: GitView prepares individual pending and total check counters.
      then: The combined pending state does not become one pending entry; the source-supported status-context count can be zero for its own scope, while the overall PR check total and absence of failures remain unknown until the other applicable families and revision context are supported.
    repeated_observation:
      given: The same confirmed current source entry is returned in two observations for the same PR and revision.
      when: The current entry count is calculated.
      then: That entry contributes once, subject to conflict and observation ordering rules.
    retry_identity_unknown:
      given: Two check-run observations may be successive attempts for one logical check but their source equivalence and current selection are not established.
      when: A total of current entries is requested.
      then: The exact count remains uncertain rather than blindly counting both or merging them by name.
    merge_revision_distinct:
      given: A PR head and its test merge commit have different identifiers and the available results are only associated with the head.
      when: The app presents check information.
      then: The head results retain their scope and are not asserted to be the complete status-box result for the test merge commit.
    head_changes_between_pages:
      given: One permitted PR's first check-rollup page supports a failing entry for head H1; before the continuation is read, the PR head changes to H2, and the next response supports a rollup for H2. Neither traversal independently establishes complete entry coverage.
      when: The app prepares the current compact CI signal and the check counters.
      then: H1's failure remains last known for H1 where permitted and is not an unqualified current H2 failure. H2 facts are evaluated under their own applicable context; the mixed pages cannot produce an exact combined current total or a complete success, and the limitation remains discoverable.
    partial_failure:
      given: A relevant source entry is confirmed failed while another applicable source family has not been observed.
      when: The failure signal and total are presented.
      then: The observed failure may be shown with incomplete coverage while neither a full current total nor a complete set of failures is asserted.
    fork_empty_pr_array:
      given: A check run for a commit has an empty source pull_requests array and the candidate PR head comes from a fork.
      when: GitView evaluates whether the run belongs to that PR's applicable check context.
      then: The empty array is not treated as proof of unrelatedness or no PR checks; supported repository and revision association is required before counting the run for that PR.
  unresolved:
  - Validate the working classification in 0061 against GitHub source semantics and native presentation; required-check semantics remain separate.
  - Source-supported attempt equivalence and precise PR head versus test-merge selection under all observed cases.
  - GraphQL and REST permissions, pagination consistency and empirical equivalence to the GitHub PR status box.
