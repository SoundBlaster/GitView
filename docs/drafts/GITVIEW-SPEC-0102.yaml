acceptance:
- A claim of complete population identifies its scope and supported reference time or interval; completing a traversal does not imply a continuously current snapshot.
- A source-specific completeness argument accounts for changes and access across the entire claimed scope and does not infer absent objects from an incomplete traversal.
- Incremental results may extend a prior coverage claim only when a documented source guarantee and retained evidence close the relevant interval without gaps.
- Interrupted, delayed, overlapping or unorderable results cannot advance a complete-coverage boundary past an unaccounted gap.
- Last-known results, new supported facts and request outcomes remain available under their own access, scope and time contexts when completeness cannot be established.
specification:
  objective: Define what an overview can claim about population coverage when observations arrive over time, without choosing an API or synchronization algorithm.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    observation_claim: A coverage claim names the confirmed Repository set and identity context, object categories, relevant Today alternatives and filters, access context, and the source-supported reference time or interval. Describe it as a last-known observation at that reference rather than a continuously live state; the time at which the last page or local save completed is not automatically the source reference time. Individual object and field observations retain their own contexts under 0044 and 0089.
    population_basis: Complete coverage requires a source-backed method covering the relevant union under 0027 and all active filter inputs that can affect the claimed selection. A simultaneous snapshot, a consistent baseline followed by an uninterrupted complete change stream, or another method is sufficient only to the extent its actual source guarantees establish the claim. A traversal or a nonempty cursor alone is not such a guarantee. A method may support a scoped historical or bounded observation without supporting a present instantaneous state.
    alternative_coverage: The Today union requires evidence for still-open work, items created during the selected local day and eligible closure or merge events during that day. A source query for currently open objects alone cannot account for objects merged or closed today; a query for recent updates alone is not an event history or a demonstrated complete union. Each active filter adds its own applicable evidence needs. Known positive objects may be shown with their supported facts while missing branches and unobserved Repository scopes remain independently incomplete.
    mutable_traversal: A collection can change while pages are requested. Overlap or duplicate records may be reconciled using confirmed identities, but their removal does not prove that unseen records were not skipped. A successful terminal page or repeated traversal without a documented sufficiency argument does not alone establish an exhaustive population. Preserve supported observations and communicate unproven coverage without inventing a missing record.
    incremental_extension: If an implementation uses a baseline and incremental changes, preserve enough evidence to establish the baseline scope, applicable ordering or bounds and complete coverage of all relevant changes to the proposed new reference. An update timestamp, an inclusive or exclusive cursor boundary, or an overlap window is sufficient only for the source operations and data kinds for which its documented semantics cover all required changes, including visibility and late indexing where relevant. Do not derive event time or merge from an update timestamp alone. Failure to prove a gap-free extension leaves the new completeness unknown or partial; no particular endpoint, cursor or overlap duration is required.
    invalidation_and_scope: Reassess claims when source identity, access, Repository membership, selected day, categories or filters change. Newly gained access and newly added scope are not covered by an earlier restricted baseline; an explicit denial restricts content immediately under 0036. The earlier permitted scope and its historical context may remain separately identifiable where allowed. A change after a reference time does not rewrite that historical claim, but it prevents describing that earlier observation as a newly verified current state.
    continuation_and_durability: If an implementation persists progress or a checkpoint, a restart may use it for complete coverage only when both its supported boundary and all prerequisite accepted data and coverage evidence are durably consistent. A partial page, failed save, expired continuation or unknown checkpoint must not silently advance the coverage boundary. Supported individual facts can still be retained separately. The persistence mechanism and transaction design are deferred.
    deletion_and_absence: An item missing from a later partial result, a changed access context, a filtered list or an unproven traversal is not a confirmed deletion, closed state or merge. Absence becomes evidence only within a source-backed complete scope and reference context that supports the specific conclusion; a source-confirmed deletion or restriction follows its own evidence and access rules.
    usability: The operator may inspect permitted last-known objects and explicitly request refresh even where exact completeness cannot be established. Show the latest supported observation context and any applicable refresh failure or coverage limitation without implying a live count; do not disable the overview solely because a stronger snapshot claim is unavailable. Presentation detail remains a UX refinement.
    verification: Before implementation, evaluate each selected source operation against its documented population and ordering guarantees and explicitly record unresolved limits. Planned deterministic cases use controlled pages, late changes, duplicate identities, missing ranges, access changes and failed durable saves. Actual GitHub integration and native presentation require separate evidence; neither documentation nor a synthetic test establishes the behavior of the product.
    provenance: The owner requested local cached data, a visible last update and error, a dense Today overview including completed work, and restrained API use. This coverage-evidence contract and candidate strategies are agent-authored refinements, not a choice of source API or storage implementation.
  scenarios:
    moved_between_pages:
      given: During a successful multi-page traversal an object changes position so that the observed pages do not establish whether it was seen, and the selected source contract provides no consistency guarantee.
      when: The final page succeeds and the Project Today count is evaluated.
      then: Valid observed objects remain available, but successful pagination and deduplication alone do not support an exact complete population or a new complete snapshot time.
    baseline_gap:
      given: A source-backed baseline is complete for the stated scope at T1; a later incremental observation has an unaccounted interval after T1.
      when: The operator refreshes at T2.
      then: Supported new observations may be shown with their own contexts, the T1 claim remains historical, and completeness is not advanced across the gap.
    open_only_refresh:
      given: The source successfully returns a supported collection of currently open PRs, but no source-backed coverage of PRs merged or closed during today was obtained.
      when: The Project-wide unfiltered Today selection is displayed.
      then: Eligible observed open PRs remain usable while the completed-today branch is unobserved; the app does not call the displayed collection the complete Today population or claim zero completed work.
    proven_extension:
      given: A documented source method establishes a complete baseline and all relevant changes through T2 for the unchanged scope and access context, with accepted consistent evidence.
      when: The selection and coverage are recomputed.
      then: The observation may claim complete coverage through the supported T2 reference, without implying that no source changes occurred afterward.
    tied_boundary:
      given: Two relevant updates share the finest source timestamp supported by an incremental query, and its boundary semantics do not prove that both were enumerated.
      when: A later page succeeds.
      then: The affected interval remains unproven unless independent source evidence closes it; a higher locally recorded time alone is insufficient.
    newly_granted_access:
      given: A previous Project observation covered only Repository A under an earlier grant and the source later grants access to B, which is also in the selected Project.
      when: Today is evaluated for A and B.
      then: A's supported historical claim retains its context and B requires applicable evidence; the earlier claim cannot prove an exhaustive A-and-B result.
    save_failure_before_checkpoint:
      given: A refresh receives a source page and the application cannot durably save all data and evidence needed to support its proposed new coverage boundary.
      when: The process restarts and resumes.
      then: The failed boundary is not treated as durably complete; any independently persisted permitted facts retain their own provenance and recovery remains possible.
    latest_update_without_snapshot:
      given: A successful traversal finishes at T2 but its source cannot establish an exhaustive snapshot or gap-free coverage; an earlier supported complete observation exists at T1.
      when: The overview reports its status.
      then: It can distinguish the T2 request outcome and newly observed facts from the T1 complete observation and the current coverage limitation; it does not label T2 as a new complete snapshot.
  unresolved:
  - For each chosen GitHub source operation, document pagination consistency, update visibility, ordering, deletion, access and applicable temporal guarantees; absence of evidence is not a claim that GitHub lacks a capability.
  - Determine an adequate source-backed method, its feasible freshness and an understandable accessible presentation of limited coverage without assuming continuous live consistency.
  - Actual source, storage, process-restart and native behavior remain unimplemented and unverified.
