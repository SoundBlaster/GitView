id: GITVIEW-SPEC-0038
title: GitView - Repository identity under incomplete observations
kind: spec
created_at: '2026-11-14T13:46:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0002
depends_on:
- GITVIEW-SPEC-0036
- GITVIEW-SPEC-0037
sources:
  parent: docs/drafts/GITVIEW-SPEC-0002.yaml
  identity_decision: conversation:gitview/excerpt-60-reply
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Confirmed same numeric GitHub REST repository ID within the same instance preserves the existing Repository, history and Project memberships across a source address change.
- A changed source address alone or an incomplete observation without the identifying source ID is not proof that two Repository records are the same.
- Reuse of an old address by a different ID is not allowed to inherit the earlier Repository's history or memberships.
- Conflicting or insufficiently ordered source observations remain uncertain and do not silently overwrite a confirmed newer source identity or address.
specification:
  objective: Preserve Repository identity and historical context when addresses change or observations are incomplete.
  ontology_refs:
  - gitview:Repository
  - gitview:GitHub
  - gitview:Project
  contract:
    confirmed_identity: The selected rule in 0002 compares a numeric GitHub REST Repository ID within one GitHub instance. A valid matching ID is evidence of the same Repository even if its owner or name changes; a different ID identifies a distinct Repository even at a previously used address.
    address: Current owner, name and URL are observed source attributes, not the Repository identity key. Earlier observations keep their recorded source addresses. A newly observed address is associated with an existing Repository only when source identity is sufficiently established.
    incomplete: An observation without the ID needed to apply the selected rule does not by itself merge records, transfer Project memberships or replace a different confirmed Repository. Keep it unresolved or retry source identification; do not manufacture a match from name or URL alone.
    reuse: If a source address earlier associated with Repository A is later confirmed to identify Repository B with a different numeric ID in the same instance, B is a separate Repository. A's accumulated history and Project memberships remain with A; a source address lookup may show B only with its confirmed identity.
    conflict: If same-identity source observations disagree about the current address and source evidence does not establish their ordering, retain prior accepted information and mark the current address uncertain rather than choosing a winner based only on response arrival. Refresh ordering follows 0037.
    unavailable: HTTP 404 or incomplete discovery does not by itself establish deletion or loss of access; retain last-known identity and memberships. Explicit access denial and cached private display follow 0036.
    boundary: Comparison across GitHub instances, API ID-scheme migration, local key encoding, alias retention mechanism and deletion policy require separate specification.
    provenance: Identity continuity, same-instance numeric ID and 404 handling follow the owner's selected rule. Handling of incomplete and conflicting observations is an agent-authored refinement.
  scenarios:
    missing_id:
      given: Repository A has a confirmed ID and Project memberships and a later observation reports only a matching name.
      when: The new observation has no source ID establishing its identity.
      then: GitView does not silently merge it with A or change A's memberships solely based on the matching name.
    reused_address:
      given: Repository A with ID 42 was observed at an address and belongs to Project P.
      when: The same GitHub instance reports ID 99 at that address.
      then: ID 99 is a different Repository and does not inherit A's history or membership in P.
    conflicting_addresses:
      given: Two incomplete observations for the same confirmed ID report different addresses without reliable freshness ordering.
      when: They arrive out of order.
      then: Current address is marked uncertain instead of silently selecting the last response as authoritative.
  unresolved:
  - How to represent and resolve unresolved candidate observations without inventing source identity.
  - Source-specific evidence for ordering address changes, cross-instance matching and API ID-scheme migration.
