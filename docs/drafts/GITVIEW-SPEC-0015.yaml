specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Inspect a card quickly without losing the bird's-eye overview.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - In the first version, long press opens an expanded preview, from which the user can open the same
    object.
  - Dismissing the preview returns to the originating grid and scope when valid, or offers an available fallback when that origin is no longer valid.
  - A later sliding-preview direction would use one rich preview that changes the shown object as the finger moves from cell to
    cell, without navigating into each object; it is not a first-version prerequisite.
  - Long press is a hypothesis for activating the sliding interaction; resolve its conflict with scrolling
    and Peek and Pop through native prototyping.
  - Optional pointer hover must not be assumed on all devices.
  review_scenarios:
  - Given a PR cell, long press previews that PR; opening it retains the identity of that PR.
  - Given the later sliding mode, moving across three cells updates one preview without opening three
    object screens.
  unresolved:
  - Later sliding activation, edge behavior, long-press/pan coordination and release behavior need native
    prototyping.
  pilot_scenarios:
    same_object:
      given: The user long-presses PR 42 in repository R.
      when: The preview is opened and then committed.
      then: The preview and object overview both refer to PR 42 in R.
    dismiss:
      given: A filtered dense grid is visible under the preview.
      when: The user dismisses the preview.
      then: The same filtered scope and density remain available without navigating.
  future_scenarios:
    future_slide:
      given: The later sliding mode is active across three cells.
      when: The finger moves between them.
      then: One preview changes object without navigating into any of them.
  future_acceptance_candidates:
  - The later sliding rich preview changes one preview as the user inspects neighboring cells without automatically opening them; long press is a proposed activation, not settled gesture arbitration.
acceptance:
- 'First version: a recognized long press on an eligible Project, Repository, PR or Issue presents that same object as a static preview, with an
  explicit way to open it and a way to dismiss without navigation; access and changed-origin limitations remain applicable.'
- On dismissal or return retain the originating scope, filter and density and restore position where valid and available; if the origin no longer exists, provide a meaningful available fallback.
- Accessible non-long-press paths can invoke and dismiss the eligible preview and can also open the object directly; opening directly does not replace preview access.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: same_object and dismiss describe expected first-version results for future verification; future_slide is explicitly later. No app test has run.
