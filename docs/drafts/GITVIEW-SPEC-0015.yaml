id: GITVIEW-SPEC-0015
title: GitView - Peek and Pop and future sliding preview
kind: spec
created_at: '2026-11-10T00:00:00Z'
updated_at: '2026-11-10T07:33:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0014
depends_on:
- GITVIEW-SPEC-0008
- GITVIEW-SPEC-0009
sources:
  root_draft: docs/drafts/GITVIEW-SPEC-0001.yaml
  topic: docs/drafts/ux-preview-interactions.md
  authorization: conversation:gitview/excerpt-68
  ontology_selection: ontology/candidates/domain-v0.2.0-draft.5/composition-context.yaml
  pilot_autonomy: conversation:gitview/excerpt-72
specification:
  objective: Inspect a card quickly without losing the bird's-eye overview.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - In the first version, long press opens an expanded preview, from which the user can open the same
    object.
  - Dismissing the preview returns to the originating grid and scope.
  - Later, support a single rich preview that changes the shown object as the finger moves from cell to
    cell, without navigating into each object.
  - Long press is a hypothesis for activating the sliding interaction; resolve its conflict with scrolling
    and Peek and Pop through native prototyping.
  - Optional pointer hover must not be assumed on all devices.
  review_scenarios:
  - Given a PR cell, long press previews that PR; opening it retains the identity of that PR.
  - Given the later sliding mode, moving across three cells updates one preview without opening three
    object screens.
  unresolved:
  - Later sliding activation, edge behavior, long-press/pan coordination and release behavior need native
    prototyping.
  evidence_boundary: Scenarios are expectations for future verification, not executed tests. The ontology
    selection and specification remain drafts; implementation is not claimed.
  pilot_contract:
  - 'First version: long press presents a preview of the same Project, Repository, PR or Issue, with an
    explicit way to open it and a way to dismiss without navigation.'
  - On dismissal or return retain the originating scope, filter and density and restore position where
    available.
  - The later sliding rich preview changes one preview as the user inspects neighboring cells without
    automatically opening them; long press is a proposed activation, not settled gesture arbitration.
  - An accessible non-long-press path to inspect or open the object is required.
  pilot_scenarios:
    same_object:
      given: The user long-presses PR 42 in repository R.
      when: The preview is opened and then committed.
      then: The preview and object overview both refer to PR 42 in R.
    dismiss:
      given: A filtered dense grid is visible under the preview.
      when: The user dismisses the preview.
      then: The same filtered scope and density remain available without navigating.
    future_slide:
      given: The later sliding mode is active across three cells.
      when: The finger moves between them.
      then: One preview changes object without navigating into any of them.
  pilot_provenance: The owner authorized autonomous pilot specification in excerpt-72. Working details
    are specification choices, not claims that the app exists or that every detail was separately discussed.
acceptance:
- 'First version: long press presents a preview of the same Project, Repository, PR or Issue, with an
  explicit way to open it and a way to dismiss without navigation.'
- On dismissal or return retain the originating scope, filter and density and restore position where available.
- The later sliding rich preview changes one preview as the user inspects neighboring cells without automatically
  opening them; long press is a proposed activation, not settled gesture arbitration.
- An accessible non-long-press path to inspect or open the object is required.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
