acceptance:
- A multi-repository Project provides a reachable grid of its permitted members and a route to each permitted member's PR and Issue objects, with access-safe limitations where needed.
- The agent-authored ordinary-entry proposal opens the Project-wide work collection directly for one or several repositories, without requiring a repository or signal selection; its selection remains open.
- A single-repository Project reaches its work without a redundant repository step; Project and Repository
  remain distinct.
- An actionable Project signal opens its corresponding selection across the applicable member scope, identifying source repositories where permitted and preserving uncertainty and coverage limitations.
- Changing density does not silently change Project, repository scope, period or filter; return restores
  context and location when possible.
- Incomplete observations do not remove a member or present unknown work as an empty repository.
acceptance_evidence:
- criterion: Project entry for one or several repositories
  evidence: single_repository and multiple_repositories scenarios specify expected outcomes, not executed
    tests.
- criterion: Cross-repository signal filtering
  evidence: signal_across_repositories is an expected outcome, not an executed test.
- criterion: Navigation continuity and incomplete observations
  evidence: return_to_origin and incomplete_project specify expected outcomes, not executed tests.
specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Navigate from project overview to its repositories and work without losing context.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  navigation_contract:
    entry: The visible context identifies the GitView Project. Membership follows repository identity,
      not organization or the current owner and name.
    multiple: Offer a secondary grid of the Project's permitted repositories and a route to the PR and Issue collection of each permitted member.
      Repositories from different organizations remain in the same Project; restricted identities and revealing counts follow 0074 and 0036.
    all_members: As an agent-authored working navigation proposal, open an explicitly identifiable Project-wide work collection directly on ordinary Project entry across its confirmed current members independently of a signal shortcut. Its initial Today selection and lifecycle defaults follow 0074 and 0007; an unobserved member makes the applicable coverage incomplete rather than empty. This direct-entry route is not independently established as an owner-selected interaction; the agreed summary, member-specific routes and single-member shortcut remain available product obligations.
    single: Skip a redundant intermediate repository screen while retaining Project and Repository as
      separate identities and retaining sufficient source context.
    signal_route: An actionable Project signal opens the corresponding selection within its applicable member scope. The active signal
      or filter and each object's repository are identifiable where permitted. Unknown predicates or incomplete coverage remain distinguishable; the destination is not claimed exhaustive or equal to the earlier signal count without supporting evidence under 0092.
    return: Restore the originating Project, filter and scale, and prior location when still valid and available.
      If data or membership changed, preserve the valid context and provide an understandable position; if the originating Project or selected member is no longer valid or cannot be verified, follow 0024 rather than silently switching scope.
      Exact mechanics remain open.
    zoom: Changing density within a scope does not itself change membership or filters. Entry into a different
      scope is distinguishable from a density change.
    unknown: An unavailable member remains in the Project; unknown data is not an observed empty result.
  requirements:
  - A multi-repository project can reveal its permitted repositories and their permitted PRs and Issues without exposing restricted membership.
  - A single-repository project opens its work without a redundant intermediate repository screen, while
    retaining both identities.
  - A project summary signal opens the corresponding filtered work across project repositories, with each
    object's repository identifiable.
  - Returning from an object restores the originating scope, filters, position and scale where feasible.
  review_scenarios:
  - Given a project with two repositories, selecting failed CI opens the matching PRs from both with repository
    context.
  - Given a single-repository project, entering its work does not require traversing two equivalent screens.
  scenarios:
    single_repository:
      given: Project P contains Repository R.
      when: The operator opens P.
      then: Its PR and Issue collection is reachable without a duplicate Project/Repository screen; R
        remains identifiable.
    multiple_repositories:
      given: P includes R1 and R2 from different organizations.
      when: The operator opens P under the proposed direct Project-wide entry route.
      then: P opens directly to Project-wide work across R1 and R2, with each source identifiable where permitted and member-specific routes available.
    signal_across_repositories:
      given: P has failed-CI PRs in R1 and R2.
      when: The operator opens the failed-CI Project signal.
      then: The filtered collection uses P's scope and distinguishes R1 from R2.
    return_to_origin:
      given: The operator opens an object from a filtered and zoomed collection in P.
      when: The operator returns.
      then: The Project, filter and density remain, and the previous location is restored when available.
    incomplete_project:
      given: P contains two permitted repositories and one has incomplete observations; the proposed direct Project-wide entry is selected.
      when: The operator enters P.
      then: The Project-wide work view can show permitted observed work and its incomplete coverage; the unobserved member is not presented as an empty repository.
  unresolved:
  - Evaluate the proposed direct Project-wide entry for multi-repository Projects alongside member and signal routes; exact transition remains open. Restoration after data changes and initial work ordering are proposed in 0024 and 0042, with their unresolved cases retained.
