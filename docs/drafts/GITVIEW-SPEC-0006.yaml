  ontology_selection: ontology/candidates/domain-v0.2.0-draft.4/composition-context.yaml
specification:
  objective: "Navigate from project overview to its repositories and work without losing context."
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - "A multi-repository project can reveal its repositories and their PRs and Issues."
  - "A single-repository project opens its work without a redundant intermediate repository screen, while retaining both identities."
  - "A project summary signal opens the corresponding filtered work across project repositories, with each object's repository identifiable."
  - "Returning from an object restores the originating scope, filters, position and scale where feasible."
  review_scenarios:
  - "Given a project with two repositories, selecting failed CI opens the matching PRs from both with repository context."
  - "Given a single-repository project, entering its work does not require traversing two equivalent screens."
  unresolved:
  - "Exact transition, restoration behavior after data changes, and ordering remain to be refined."
  evidence_boundary: "Scenarios are expectations for future verification, not executed tests. The ontology selection and specification remain drafts; implementation is not claimed."
