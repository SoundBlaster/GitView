acceptance:
- Pinch changes density within the current overview as described by 0035 and 0075; moving between scopes remains an intentional, distinguishable action.
- A zoom-based scope transition is a candidate interaction, not an established first-version requirement or a prerequisite for ordinary navigation.
- If adopted, a transition opens the intended eligible target and retains the actual origin and applicable context; an ambiguous, cancelled or no-longer-permitted target is not silently substituted.
- Opening and returning remain accessible without pinch, and static preview remains separate from the deferred sliding preview.
- The interaction and its native feasibility require evaluation; no implementation or device behavior is claimed.
specification:
  objective: Keep the Photos-inspired possibility of zoom navigation reviewable without prematurely fixing its gesture mechanics.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    scope: The owner requested a Photos-inspired overview with multiple densities and navigation between Projects and their work. Whether pinch itself should also cross navigation scopes, and whether that interaction belongs in the first version, remain open. Explicit opening and return under 0074 and 0024 provide the established route.
    possible_interaction: A targeted pinch beyond a density boundary, with an indication of the target and confirmation on gesture completion, is one agent-authored possibility. It is not a selected threshold, recognizer design or required sequence; other interactions or no cross-scope pinch may better fit the platform.
    identity_and_origin: If zoom navigation is selected, resolve the intended permitted object by stable identity, use the same destination as an explicit open, and preserve the real origin and applicable context under 0024 and 0074. Do not replace an ambiguous, cancelled, removed or restricted target with another object at the same position. Apply current access rules before showing content.
    interaction_and_accessibility: In-scope scaling must not itself silently navigate. A chosen transition must be distinguishable from scaling, scrolling and static preview; support opening and returning without pinch under 0032. Sliding rich preview remains a later concept under 0015.
    verification: Compare viable navigation interactions using native and accessibility evaluation before selecting mechanics. Check identity and origin across reflow, source and access changes, cancellation and return; do not claim device behavior from this proposal.
    provenance: Multi-density overview and navigation are owner direction. Cross-scope pinch and the detailed boundary interaction are agent-authored options, not individually confirmed choices.
  scenarios:
    density_only:
      given: A filtered Project work grid is shown at a dense scale.
      when: The operator performs an in-scope pinch.
      then: Density may change, but the scope, period and filters remain and no object opens solely from that scaling.
    conditional_targeted_entry:
      given: A zoom navigation interaction is selected and identifies an eligible Project.
      when: The operator intentionally completes that navigation.
      then: The same Project opens through 0074 with its actual origin; ambiguous or ineligible targets do not open a different Project.
    conditional_return:
      given: Project P has one confirmed member R and was entered from the Projects overview.
      when: The operator returns through a supported route.
      then: The actual Projects overview and its valid context are restored without inventing a separate R screen.
    accessible_open_and_return:
      given: An operator cannot use pinch and a permitted Repository cell is available inside a multi-member Project.
      when: The operator uses an accessible open action and then the available return action.
      then: The same Repository and original Project context are preserved without requiring pinch, color or animation.
  unresolved:
  - Decide whether cross-scope pinch is useful and belongs in the first version; compare it with explicit opening and return before selecting a gesture.
  - If selected, choose and verify native gesture arbitration, visual continuity, focus and accessibility on supported iOS versions; no system API or device behavior is assumed.
  - If selected, resolve interaction with live source changes and applicable route restoration after the prerequisite access and navigation contracts are ready.
