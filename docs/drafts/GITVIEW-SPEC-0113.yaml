acceptance:
- The proposed local persistence direction supports one coordinated commit for a Project effect and its operation evidence while exposing domain-facing interfaces to callers.
- Default association uniqueness and operation identity are enforced in the chosen local consistency boundary rather than inferred from a prior read.
- Known conflict, unavailable storage and indeterminate outcomes remain distinguishable across interruption and retry.
- If SQLite is selected, its build, journal and durability configuration are not assumed safe without target-specific evidence, including applicable WAL defects.
- Credential storage, source access and local database commits retain their distinct boundaries and recovery outcomes.
specification:
  objective: Define provider-independent local persistence obligations and a reviewable SQLite option before implementation readiness.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    direction: Choose a local persistence provider and coordinated consistency boundaries behind injected Project, operation and observation storage interfaces before implementing them. SQLite is an agent-authored candidate, not a product requirement or selected provider. Another design is permissible if it establishes the same applicable observable guarantees, access ordering and recovery behavior under 0106 and its dependencies. Logical data responsibilities are not product ontology entities. The chosen provider, schema and concrete protocol must be specified and verified before the corresponding implementation leaf is ready.
    default_creation: After durable batch confirmation and applicable local entry admission under 0045, one coordinated durable commit, such as a suitable database transaction, validates the bound operation identity and intent, checks the current default association for the confirmed source Repository, and establishes either a valid new Project with membership and association or an explicitly bound reuse or terminal conflict outcome under 0052 and 0104. The durable operation result and any applied Project effect commit together within the same applicable consistency boundary. No source network request or system authorization UI runs while holding a database transaction.
    project_overview_order: For each newly created default or custom Project, include the unique local creation-order key under 0072 in that same effect and receipt boundary. Successful reuse and redelivery do not allocate or change a key. Coordinate creation with any ordering-baseline repair, and enforce uniqueness and strictly later placement for new committed identities within the continuing store. An allocation that cannot be committed or whose result is uncertain follows the operation outcome rules; do not infer commit order from caller acknowledgement order or use source metadata as the key. A restored older database does not prove its key history includes later decisions under 0122.
    uniqueness_and_revisions: Enforce at most one active default association for a confirmed Repository within its source identity scope at the database boundary, including concurrent writers; a uniqueness constraint or equivalent verified mechanism is required, not merely a preflight query. Distinct custom Projects can include the same Repository. A Project configuration version must distinguish successive committed states even if values return to an earlier state; an edit compares its reviewed base to the current version at its coordinated write boundary. Exact schema, identifier encoding and migration representation remain open.
    operation_recovery: Persist a stable logical operation binding and terminal outcome together with its effect or reuse decision. After an interrupted commit or lost acknowledgement, recover that operation from the durable store or keep its outcome indeterminate; a current association or a current Project read alone does not prove the historical result of that operation. Safe redelivery follows 0103 and does not create a second effect. An old applied receipt is not an independently current readable Project.
    observation_retention: Use the coordinated boundary in 0105 for a retained field or event, its necessary interpretation evidence and its local operation outcome. A separate coverage claim can commit only when its required scoped evidence is durably recoverable or part of that same commit; source-supported aggregate evidence is acceptable only to the extent it actually establishes the claim. Facts, source scopes and history samples may have separate commits and outcomes. A storage transaction does not prove a collection was complete or that its contents were simultaneous at GitHub.
    admission_ordering: Coordinate locally established account replacement, denial and durable batch cancellation with entry admission and write eligibility under 0045 and 0112. A local authorization or cancellation state held outside the database cannot be assumed atomically ordered with its transaction just because SQLite serializes database writers. The composition must specify and verify a coordinator or durable generation fence spanning the actual participating boundaries; if that ordering cannot be established, do not submit the affected new entry. An unobserved remote GitHub grant change remains outside any local transaction.
    proposed_local_fence: As a working single-process design, route entry admissions and durable changes to their account or batch eligibility through one serialized admission coordinator. The durable database stores non-secret account-generation and per-batch active or cancelled evidence. In the same write transaction as an entry's Project effect and receipt, compare its confirmed account generation and active batch with the current durable fence before admission. A cancellation or account replacement becomes durably effective for new admissions through its own ordered fence change; an earlier Project transaction that has already passed admission may finish and is reconciled under its original context. All application scenes and background entry producers must use this same boundary; uncoordinated writers and separate processes are outside the proposed guarantee until a shared protocol is defined and verified.
    immediate_restriction: When an applicable denial, disconnect or account replacement is observed in the running process, immediately block new affected admission requests and restrict app-controlled private presentation under 0036. Do not wait for the database or Keychain before applying this in-memory restriction. An already admitted transaction may have a separately recoverable local outcome and cannot itself restore source visibility. Account B is not reported as the confirmed active replacement for new admissions until its credential binding under 0086 and the applicable local fence are consistently established. If a fence update fails or its result is uncertain, retain the restriction and fail closed for affected new admissions; surface a recovery problem instead of claiming the change was durably recorded.
    async_serialization: An actor, serial dispatch label or enqueue order alone does not prove exclusivity across a suspended asynchronous database operation. The coordinator's concrete protocol must prevent another entry from passing admission while a conflicting fence operation is pending, including while an await or database error occurs, while allowing immediate presentation restriction without waiting for the write. Do not hold a database write transaction across Keychain, network, UI or another unbounded operation. Define ordering at actual admission and durable fence boundaries, not at the time a task was created or a button was tapped.
    restart_gap: After a confirmed durable fence, restart must respect that fence before allowing new entries. If the process terminates after a denial or disconnect was observed in memory but before its durable fence or equivalent recovery evidence was established, SQLite and Keychain cannot by themselves prove that the event occurred. The initial offline policy in 0036 permits eligible last-known data when durable context is consistent and no restriction or pending transition is known, explicitly accepting that the unrecorded event may be lost and affected cached content may reappear. Do not describe this as a guarantee that denial survives every crash, or as current GitHub access. A confirmed durable or recoverably pending restriction still applies; a previously unseen remote grant change is a separate limitation.
    local_disconnect_acknowledgement: A disconnect request restricts affected content in the running process immediately. Report its durable local restriction as confirmed only after the applicable fence is known committed; credential deletion remains a separate outcome under 0086. If interruption occurs before any durable evidence exists, the later process cannot establish the requested disconnect from an earlier tap alone. Do not label it completed based on a missing result or infer an unrecorded request; recovery uses the working offline policy and its explicitly acknowledged limitation.
    source_and_credential: Repository observations and access evidence retain source and account scope; local membership or a database receipt cannot establish present GitHub permissions. Store OAuth secrets in the platform secure credential store under 0019 and 0086, not in this database or its diagnostics. Database commit and secure-store changes have separate outcomes; no cross-store atomicity is asserted. Protect retained private source data and all database-associated files with an explicitly chosen platform policy before implementation readiness.
    errors: A busy or locked database, full volume, inaccessible protected file, failed read, corruption signal, failed commit and unconfirmed acknowledgement are not automatically equivalent. Map each to known non-application only where the chosen transaction and subsequent evidence establish that no effect can still commit; otherwise preserve an indeterminate operation and a safe recovery route. Do not delete, recreate or silently reset an unreadable database to satisfy first-run behavior. Retry or backoff policy and concrete source of each status remain open.
    sqlite_transaction_error_boundary: If SQLite is selected, SQLite documents that a COMMIT failing with SQLITE_BUSY because another reader holds the database can leave the transaction active for a later commit retry. For SQLITE_FULL, SQLITE_IOERR, SQLITE_INTERRUPT and SQLITE_NOMEM within a transaction, SQLite documents that either the statement or the entire transaction may be rolled back depending on circumstances. The selected provider must expose sufficient connection and transaction state or otherwise establish the actual outcome; the error code alone is not proof that the logical operation was rolled back, committed or can be safely resubmitted as a new identity. Stop uncoordinated use of that transaction, decide whether to retry the same still-active commit or perform and verify rollback under the provider's supported behavior, and reconcile durable operation evidence under 0103 before reporting a terminal outcome. After connection loss or process restart, in-memory transaction state alone is not a durable receipt. Preserve supported error classification without leaking restricted payloads. Exact provider API and retry limits remain unselected.
    sqlite_assumptions: If SQLite is selected, SQLite documentation describes atomic commits and single-writer isolation under its stated assumptions, not an unconditional guarantee for every filesystem, library build or configuration. Identify the actual SQLite version and compile configuration on each supported iOS environment and select a journal and synchronization policy compatible with the contract. Do not assume WAL mode. Investigate the documented WAL-reset defect and fixes for the actual library and connection pattern, and treat its associated files as part of database state if WAL is chosen. No filesystem power-loss or iOS behavior is claimed verified.
    initial_sqlite_profile: As an agent-authored candidate for the initial on-device store, investigate the platform-provided SQLite API with a single persistent main database, rollback journal mode DELETE and synchronous EXTRA. SQLite documents that FULL with rollback journal mode may lose a recently committed transaction after power loss; EXTRA requests an additional directory sync in DELETE mode, subject to VFS and filesystem assumptions. This profile avoids reliance on WAL for new stores but does not establish power-loss durability or exclude other defects. The iPhoneOS 27.1 SDK inspected locally includes sqlite3.h and a libsqlite3 linker stub; this establishes neither the runtime library version nor support on every target device. The exact adapter and iOS runtime evidence remain open.
    profile_admission: If the proposed SQLite profile is selected, before a connection performs application writes or migrations, establish its effective main-database journal mode, synchronous setting and foreign-key enforcement; set and read back the applicable settings through the selected provider outside any active transaction. SQLite can return the original journal mode if a requested change fails and can ignore unknown PRAGMAs, so successful command submission alone is insufficient. If the required profile cannot be established, deny affected writes and report a local storage limitation without resetting the store. A temporary in-memory database or mock is not evidence that the persistent profile is supported. Opening an existing store in another mode, including WAL with companion files, requires a separately verified safe transition and recovery path; do not delete associated files or force conversion solely to satisfy this profile.
    protected_store_candidate: Evaluate completeUntilFirstUserAuthentication for the database and all sensitive associated files as a candidate compatible with background work after the first unlock, subject to actual file creation, inheritance, temporary-file and restore behavior. It does not permit access before first unlock after reboot, does not prove Keychain accessibility or background scheduling, and is not yet an adopted backup or protection policy. If protected storage is unavailable, preserve the existing store and distinguish unavailable from empty under 0122.
    verification: Before implementation readiness, define schema and migration obligations, transaction and fence pseudocode, exact outcomes and storage-error interpretation, and deterministic tests of two concurrent default operations, stale Project edits, lost acknowledgement, cancellation and account-change ordering, process termination, inaccessible storage and recovery. Later run real persistence and restart checks on supported iOS versions separately from injected doubles. Do not infer such evidence from this candidate or vendor documentation.
    provenance: Local saved observations, default Projects, DI, testability and TDD follow the owner's choices. SQLite, the single consistency boundary and coordination approach are agent-authored working decisions; no product implementation, system setting or dependency has been created.
  scenario_scope: Provider-independent outcomes apply to any chosen implementation. SQLite error and profile scenarios are conditional on selecting SQLite or the particular profile; an alternative must provide its own meaningful failure and recovery evidence.
  scenarios:
    competing_default:
      given: Two confirmed operations for the same source Repository execute through the local storage boundary.
      when: Both attempt to establish a default association.
      then: At most one active association is committed, and each operation's result is durably bound as created, reused, conflict or indeterminate according to the established facts.
    lost_acknowledgement:
      given: A transaction commits the default Project and its bound operation result, but the caller loses its acknowledgement.
      when: The same operation is reconciled after restart.
      then: Its established result can be recovered without creating a duplicate, while navigation still requires an independently readable current Project.
    outside_database_race:
      given: A Repository was selected under account A and the app establishes account B before A's not-yet-admitted entry begins its coordinated write.
      when: The old entry attempts admission.
      then: A's earlier access observation alone cannot authorize the entry; SQLite serialization alone is not treated as proof that the external account change was ordered.
    restriction_while_write_in_flight:
      given: A Project entry has already passed coordinated admission for account A but its local transaction has not yet returned, and an applicable denial is observed.
      when: The app applies the denial while the earlier transaction eventually commits.
      then: Affected private content is restricted immediately, the earlier operation is reconciled as a local outcome without undoing the restriction, and no later entry is admitted on the earlier access evidence.
    denial_fence_write_uncertain:
      given: An applicable denial is observed and presentation is restricted, but writing its durable admission fence has an indeterminate outcome.
      when: A new affected entry requests admission in the same process.
      then: It remains blocked with a recoverable uncertainty rather than using the old generation or reporting the denial durably persisted.
    termination_before_fence:
      given: A denial was observed only in process memory and the process stops before its fence or equivalent recovery evidence is established.
      when: The app later starts with last-known local data and no evidence of that denial.
      then: The retained database does not prove the event occurred. Under the working policy of 0036 previously permitted cached data may reappear with its last observation and no claim of current access if no persisted restriction or pending transition is known; the app does not claim that this unrecorded denial survived the crash.
    inaccessible_after_reboot:
      given: The database cannot be opened because its selected file-protection policy does not permit access in the current device state.
      when: A background refresh or the user opens the app.
      then: The database is unavailable rather than a confirmed empty portfolio, and the app does not delete or replace it; the permitted recovery or unlock path remains distinguishable.
    busy_commit_remains_active:
      given: A transaction has applied a logical operation but COMMIT returns SQLITE_BUSY in a documented circumstance where the same transaction remains active.
      when: The storage boundary handles the result.
      then: It does not call the operation rolled back or start a second logical operation solely from BUSY; it resolves the same transaction by an applicable retry or verified rollback and reports a terminal outcome only with sufficient evidence.
    statement_error_requires_transaction_state:
      given: A write statement returns SQLITE_FULL or SQLITE_IOERR after earlier statements in the same transaction, and the provider has not established whether the transaction remains active or was rolled back.
      when: The caller asks for the logical operation outcome.
      then: The outcome remains indeterminate until the transaction and durable operation evidence are reconciled; neither a partial statement error nor an earlier statement success is a durable operation receipt.
    uncertain_commit:
      given: A database commit reports an error and neither its terminal effect nor safe non-application is established after the attempted recovery.
      when: The caller requests the entry outcome.
      then: The operation remains indeterminate, its previous identity is retained, and no unrelated new operation is reported as a safe retry.
    journal_profile_refused:
      given: The persistent store opens but the provider returns WAL or another mode when DELETE is requested, or cannot confirm EXTRA and foreign-key enforcement for the writing connection.
      when: A Project change or migration requests a write.
      then: The write is not admitted under the candidate profile, the existing database and its associated files are preserved, and the local storage limitation is reported without claiming that the store is empty.
    first_unlock_unavailable:
      given: After a reboot, protected local data or the independently stored credential is unavailable before first unlock.
      when: iOS gives GitView an opportunity to refresh in the background.
      then: GitView does not treat the inaccessible data as absent, does not replace the store, and waits for a later eligible opportunity without claiming an update occurred.
  unresolved:
  - Select the actual iOS SQLite provider, version and wrapper, validate relevant security and WAL fixes, and select and verify journal, synchronization and backup behavior.
  - Define physical schema, the actual migration path and concrete coordinator; 0122 proposes observable migration and recovery obligations but does not establish provider behavior. Verify the selected offline tradeoff and transactional recovery semantics across the unrecorded-denial crash gap before treating this boundary as implementation-ready.
  - Choose and test iOS file protection, background availability, credentials/database reconciliation and actual interruption behavior on supported devices.
