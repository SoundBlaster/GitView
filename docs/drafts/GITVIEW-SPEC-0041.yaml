acceptance:
- A PR overview retains the exact source Repository context and selected available source facts.
- Lifecycle, draft flag, review assessment, review-thread counts and check counts remain separate, with unknown values not asserted as zero or success.
- Additions, deletions, changed files and commits are separate counters and are not treated as a code diff or a list of commit details.
- Event timestamps and observation timestamps are distinguished, and authored Validation text is not treated as independently observed CI.
- The operator can inspect each permitted, available selected PR field from the same PR overview, including details omitted from the cell or preview.
specification:
  objective: Present the selected PR facts and change counters for quick review while preserving their source and uncertainty.
  ontology_refs:
  - gitview:PullRequest
  - gitview:Repository
  - gitview:ReviewThread
  - gitview:CIStatus
  contract:
    identity: The overview refers to a specific source PR in its target Repository. Display its available source ID, repository-local number, title, original description and source URL; an unknown field remains unknown. A PR with the same number in another Repository is a different object.
    state: Show source lifecycle as open, closed without merge or merged when established; draft is a separate flag and labels are separate characteristics. Closed without merge is not merged, and draft, review and CI do not form one shared status scale.
    context: Preserve available target Repository, source and target branches, observed revision, author, requested reviewers and linked Issues. A source author or requested reviewer is not automatically the GitView User or an identified coding agent. A link to an Issue alone does not establish a motive.
    inspect_selected: Make the owner's selected permitted PR facts inspectable within the PR overview, without requiring all of them to fit at once. These include source ID and repository-local number, title, original description, available source link, lifecycle, draft, labels, target Repository, source and target branches, observed head revision, author, requested reviewers and linked Issues; review assessment and total and unresolved thread counters; current CI category and total counters; additions, deletions, changed files and commits; and creation, update, closure or merge times and relevant source observation context. An expandable section or other accessible route in the overview may expose less prominent facts. A source-link action follows 0033; sending the operator to GitHub is not the sole way to inspect an already available selected fact in GitView.
    initial_overview_presentation: As an agent-authored first-version presentation proposal, put the permitted title, Repository context and local number at the top of the in-app overview, followed by the separately identified lifecycle and draft status and the independently supported CI and review summaries. Make the permitted authored description or its original-text excerpt reachable immediately after the primary state; an excerpt offers access to the original body under 0034. Present change counters, people, branches, linked Issues, labels and times in clearly identified sections or equivalent standard native arrangements below or through accessible disclosure controls. Keep the original-source action and Share distinguishable from each other and from in-app navigation under 0033. A missing or error-affected group has a scoped unknown, stale or incomplete meaning instead of disappearing as if it were zero or passed; current access is reevaluated before projection. Layout may adapt to Dynamic Type and available space without requiring color, long press or a particular custom component. The exact native controls, field order inside secondary sections and rendering of source text remain subject to platform and UX evaluation.
    context_availability: A missing or inaccessible source branch, revision, reviewer, linked Issue or actor has its own source and access status. A branch name is not a stable Repository identity, and an inaccessible fork or deleted branch is not replaced by a same-named branch. Do not infer a current revision, reviewer assignment, absence or participant identity from a title, author display name or another independently refreshed field. A known permitted subset retains its own coverage and time; restricted identities and revealing derived data follow the access policy.
    branch_name_evidence: GitHub documents that a PR's GraphQL head and base ref names may remain available after the corresponding ref is deleted. If an applicable response supplies such a name, it may be shown as the observed PR branch name with its source context, but its presence alone does not establish that the branch or fork still exists, is accessible or resolves to an available current revision. A missing or error-affected ref object is assessed independently; do not infer deletion solely from an unavailable object.
    linked_issue_meaning: When displaying a permitted linked Issue, preserve any separately supported source meaning such as an explicit closing connection or a mention. An unknown connection kind is not labeled as either; a link alone proves neither Issue completion nor an actor's motive. Opening an eligible target follows the related-object route and independent access checks in 0078, including when it lies outside the Project; source handoff follows 0033. Neither action silently changes Project membership or substitutes a same-numbered Issue.
    compact_and_bounds: Cell and static preview can show a subset under 0050 and 0093. Opening the same PR through an accessible route exposes the selected facts and their availability, without requiring diff, file or commit lists, check details, review-thread contents or an editing action. Source text remains the author's original under 0034; an abbreviated rendering offers access to the available original. Presenting a retained stale value does not make it a current observation.
    review: Present available aggregate review assessment and total and unresolved thread counters independently. Individual thread content is outside this overview. Lack of an available assessment differs from a known absence of reviews; the source must support either claim.
    checks: Show current-check counts under 0028. Do not equate those counts to a list of workflow runs, individual run details, past attempts or merge eligibility.
    check_counter_interpretation: For a compatible applicable entry set, expose the selected failure, pending, success and total counters with their units, revision or source context, observation time and coverage under 0060 and 0061. Special or unclassified current entries may make the total greater than the three category counts; make that difference and its meaning discoverable without requiring a list of runs. Do not subtract differently scoped or independently timed counters to infer a number of special entries. A complete zero-entry set does not say checks passed. An independently established suite-level problem remains discoverable without creating a fabricated check entry or overriding an unavailable total.
    change_counts: Show additions and deletions separately, along with changed-file and commit counts when observed. Unknown counts are not zero. These are measurements scoped to the observed PR state or revision; they do not include a diff, file browser or commit-by-commit view.
    graphql_change_count_candidates: GitHub documents GraphQL PullRequest `additions`, `deletions` and `changedFiles` as separate PR counts, and `commits.totalCount` for the commits connection with the head-versus-base population described below. A successfully interpreted field can support its corresponding permitted counter with the source object and observation context; an omitted, error-affected, invalid or restricted field remains independently unavailable rather than zero. Respect GraphQL error propagation and the actual returned object or field paths when determining which sibling values exist; a failed non-null field cannot be assumed to leave its parent object and siblings intact. Independently supported earlier or separate observations retain their own contexts. A count does not establish a complete file or commit list, a diff, a test result or another counter. GitHub's field descriptions alone do not establish atomic evaluation of all fields or a particular revision association in a nested response; source and integration evidence must justify any stronger claim.
    commit_count_source_candidate: GitHub describes the GraphQL PR commits connection as commits in the head branch absent from the base branch and exposes a connection totalCount. This is a possible source for a count with that stated meaning, not a count of every commit ever associated with the PR or proof of a chosen REST/GraphQL operation. Use it only when the response, identity, applicable source semantics and time or revision context are valid; an inaccessible or error-affected field remains unknown under 0044. Do not sum it with an independently enumerated subset or infer a commit list from a count.
    base_and_head_context: When supported and permitted, retain the observed GraphQL `headRefOid` and `baseRefOid` as distinct source facts with their own observation context. Their field descriptions do not by themselves prove that a counter was calculated atomically for that exact pair or that the corresponding live ref remains accessible. A later base change can affect a head-versus-base commit count even when the head is unchanged; neither an unchanged head alone nor a fresh title establishes that an older count still applies. Preserve the earlier count as contextual last-known evidence or show a limitation until a sufficiently applicable counter observation is available. The same cautious applicability rule covers additions, deletions and changed files without assuming undocumented comparison mechanics.
    timestamps: Preserve available creation, update, closure or merge event times and source observation time as distinct values. A refresh of one scope does not update another scope's observation time.
    partial_fields: Apply 0044 per fact. A response with the PR's title or head revision does not by itself refresh omitted review, check, thread or change-count observations. A retained value remains tied to its own observation and applicable revision; if its relationship to the current revision or access cannot be established, expose that limitation rather than presenting it as a current success or zero.
    description: The selected authored Problem, Motivation, Expected outcome, Changes, Validation and References sections follow 0034. A validation statement is not proof of observed CI success.
    provenance: The selected property groups and counters follow the owner's choices; detailed uncertainty and source-observation behavior are agent-authored refinements.
  scenarios:
    independent_state_in_initial_overview:
      given: A permitted PR has an applicable merged lifecycle, a supported failed-CI observation, a separate approved review assessment and incomplete thread coverage; its original description is available.
      when: The operator opens the same PR from its work cell or static preview.
      then: The overview identifies the same Repository and PR, makes merged, failed CI, approval and thread limitation distinguishable, and provides access to the authored description and separately identified source action. It does not combine those facts into a single healthy or merge-ready status or require a diff, check list or thread contents.
    selected_context_after_preview:
      given: A permitted PR preview shows its title and CI while available branch names, head revision and requested reviewers do not fit.
      when: The operator opens the same PR overview without relying on long press.
      then: The available selected context can be inspected with its source and observation limits, the PR identity remains unchanged and no list of checks or thread content is required.
    unavailable_source_branch:
      given: A PR has a known target branch and an unavailable source branch from a formerly accessible fork.
      when: Its context is inspected.
      then: The target remains available and the source branch is unavailable or retains its correctly attributed last-known status; a same-named local or unrelated source branch is not substituted.
    name_after_ref_removed:
      given: A source-confirmed PR observation supplies its head ref name but the corresponding ref object is unavailable and the response does not establish why.
      when: Its branch context is displayed.
      then: The observed name may remain available with its own context, while branch existence and accessibility remain unknown rather than being inferred from the name or the missing ref object.
    commit_count_population:
      given: A usable source observation supplies the documented total count for the PR commits connection at a supported context.
      when: Its commit counter is displayed.
      then: It retains the connection's head-versus-base meaning and is not described as a count of every historical commit ever associated with the PR or merged into the repository.
    base_changes_head_unchanged:
      given: A PR's commit count was observed at T1 with head H and base B1; at T2 the head remains H but an independently supported observation identifies base B2, without a new applicable commit count.
      when: The change counters are displayed.
      then: The T1 count keeps its earlier context or is unavailable for the new comparison; GitView does not assert it applies to B2 solely because H did not change, and does not fabricate a new count.
    independent_graphql_counters:
      given: One permitted PR observation successfully supplies additions and changedFiles; a separate later request for deletions fails, and no applicable deletions value is available.
      when: Its selected change counters are displayed.
      then: The supported additions and changed-file values retain their own source context and deletions remains unavailable rather than zero; neither successful field proves a complete diff or file list.
    separate_states:
      given: An open draft PR has a failed check and an unavailable review assessment.
      when: Its overview is displayed.
      then: Open, draft and failed CI remain distinct and unavailable review is not presented as approval.
    special_check_entries:
      given: An applicable complete current PR check set contains one successful, one failed and one skipped entry; the source separately establishes their identities and compatible context.
      when: The operator inspects the PR's selected counters.
      then: The success and failure categories each show one, total shows three and the skipped entry is identifiable as a special outcome without requiring its run details or calling it a successful test.
    incomparable_check_counts:
      given: A previously complete total was observed for one PR revision and only a failure-category subset is available for a later revision.
      when: The overview is displayed after the revision change.
      then: Each permitted value retains its own revision and coverage context or is unavailable; the app does not subtract the later failure subset from the earlier total to create a current special-outcome count.
    closed_without_merge:
      given: A PR is closed without merge and its merge timestamp is unavailable.
      when: Its lifecycle and timestamps are displayed.
      then: It is shown as closed without merge and no merged event or merge time is invented.
    missing_changes:
      given: A PR has a known commit count but additions and deletions are unavailable.
      when: Change counters are shown.
      then: The commit count remains known while additions and deletions are unknown, not zero.
    authored_validation:
      given: A PR description claims validation passed while observed CI has a failure.
      when: Both appear in its overview.
      then: The authored text and failed CI are separately represented without converting the claim into CI success.
    title_only_refresh:
      given: A PR had a review assessment and check counts observed at T1; a later response at T2 contains only a changed title.
      when: The PR overview is displayed.
      then: The title may carry T2 while review and checks retain their T1 context or are unavailable; they are not silently assigned T2 or cleared.
  unresolved:
  - Source mapping and availability of the selected facts, including revision association for counters.
  - Display priority, truncation and behavior for removed or inaccessible source branches.
