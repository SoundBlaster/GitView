acceptance:
- A startup route distinguishes a confirmed empty Project collection from partial or unreadable local configuration and connection state.
- Connection, discovery and explicit Project save remain independently evidenced and owned throughout setup; app installation is a distinct step only under the proposed GitHub App direction.
- Default batch setup and custom Project creation preserve their distinct intent, identities and outcomes.
- Interrupted or cancelled batch work is recovered without automatic submission of unstarted entries or duplication of confirmed Projects.
- The page composes connection, discovery and local save through injected public boundaries without sibling-feature dependencies or raw credentials in presentation state.
- Controlled tests can independently vary local storage, source, access, time and interruption; actual GitHub and native behavior remain separately verified.
specification:
  objective: Assign ownership and data flow for the first setup and Project creation routes in the selected FSD composition.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Project
  - gitview:Repository
  contract:
    candidate_scope: This composition is an agent-authored candidate combining the proposed persistent default-association setup, explicit per-entry review and recovery, a custom-creation route and the FSD composition below. Its dependencies and setup-specific scenarios describe that candidate; they do not establish those mechanisms as owner decisions or as requirements for every alternative. Any alternative must separately preserve the owner's Project composition, source-identity, access and truthful recovery outcomes.
    startup_owner: App composition supplies local configuration, connection and access capabilities. The overview or its setup route reads the Project collection through the 0104 domain-aware boundary and retains its own route state. A complete valid empty collection offers setup; a partial read may expose independently valid permitted Projects with a coverage limitation; unreadable or inconsistent configuration offers local recovery without declaring first launch or erasing data. A local empty collection, expired credential and failed GitHub discovery are distinct conditions.
    empty_portfolio_prior_operation: A complete empty local Project read and an independently known unresolved submitted setup operation may coexist. Present the setup path and a discoverable route to reconcile that operation without presenting the portfolio as proof of first-ever use. Before resubmitting its intended effect, apply 0103, 0045 and 0052; a new independent action is not evidence that the earlier operation failed or succeeded. If the operation record cannot be read, communicate the local recovery limitation and do not bypass the same applicable admission safeguards. Do not force a source refresh or authorization merely because the operator opens recovery.
    store_and_connection_startup: Compose local store opening and schema evolution under 0122 with connection recovery under 0086 as independent outcomes. A usable credential does not turn an unreadable, migrating or newer incompatible store into an empty Project collection or authorize writes to it; a successfully migrated store does not prove its secure item or source connection usable. Where the relevant store is not ready for writes, keep setup mutations pending or unavailable with a local recovery path. Independently eligible connection or source observations may proceed only where their own boundaries allow, but their success does not create a Project or complete migration. Once the store is ready, reread and reconcile saved Projects and pending operations before offering a retry; do not automatically submit an unstarted selection or treat a recovered receipt as a current Project read.
    recovery_and_current_route: A pending local recovery or earlier startup read is not permission to replace a newer explicit user route when its result arrives. Apply a recovered Project collection and operation evidence to their appropriate state and current access context; preserve the actual current route when still valid under 0024, and offer setup recovery as a discoverable action instead of automatically reopening it or submitting a pending entry. If the current route is no longer valid, use the permitted fallback rather than a stale route or arbitrary Project. A recovered historical operation outcome does not establish a current readable Project or a source refresh.
    source_ownership: The connection responsibility owns the user-authorized account session and credential lifecycle, with recoverable local binding under 0086; 0098 describes a candidate GitHub App flow. Under that candidate, installation and Repository discovery provide separately scoped source observations under 0059 and 0099. They do not own local Project configuration and an external return does not establish a grant, a selected Repository or a Project. App-level composition supplies access-scoped capabilities; setup presentation and Project domain policies do not hold raw tokens or directly import an authentication sibling feature.
    external_return: Under the proposed GitHub App flow, keep the user-authorization callback in the connection responsibility under 0098 and installation access review under 0099. Other authorization designs require their own applicable return and recovery semantics. An installation setup redirect, its untrusted installation identifier or a manual return is not an authorization-code callback and cannot establish account, grant or a local Project. The setup page can offer a user-initiated recheck using the current confirmed identity, preserve the permitted pending intent and receive separately attributed discovery outcomes; account replacement, lost state and unavailable source evidence follow their own recovery rules. No automatic Project confirmation follows a browser return or foreground transition.
    recheck_to_selection: Discovery returns supported per-scope observations and limitations to the setup route with their source, account, attempt and coverage context under 0059; 0099 gives an example for the proposed GitHub App path. The route retains the pending intent separately and projects each selected identity as eligible, unresolved or restricted only to the extent applicable evidence and current disclosure permit. It does not map an unreturned entry to an empty account, a denial or a removed selection. Confirmation and 0113 admission independently reevaluate eligible entries; a recheck alone does not submit a Project mutation or refresh PR and Issue observations.
    presentation_owner: The setup or discovery page owns the active presentation, query, pending selected Repository identities, original connection context and explicit intent as either default setup or custom Project. The selection is a draft and does not mutate saved membership or GitHub. Extract connection, discovery or confirmation actions as features only where useful; a page or higher composition joins them without direct sibling-feature dependencies. Closing an unsubmitted selection does not delete unrelated saved Projects.
    picker_empty_and_search: As an agent-authored first-version presentation proposal, distinguish a search with no currently displayed permitted matches from a source-supported empty eligible Repository scope, incomplete discovery, missing installation or grant evidence, and a failed request. A no-match search offers a clear-search action and retains permitted pending selections across query changes; it does not imply that the account or GitHub has no Repositories. Show a supported genuinely empty scope only for the access and discovery context that establishes it, and offer an applicable access-review or retry route when the source outcome supports one. If there are no known matches while discovery is incomplete or failed, expose that limitation and recovery without inventing hidden entries or a total. Previously selected eligible identities remain reviewable even when the active query hides them; confirmation remains an explicit action and never follows clearing a query or recovering discovery. Source-restricted names, selection existence and revealing counts remain withheld according to current access. Exact matching algorithm, online versus local search and system controls remain open.
    explicit_repository_lookup: As a working setup proposal, make an explicit GitHub.com Repository locator lookup available alongside the applicable discovery route; 0099 describes the GitHub App example. Present a returned candidate only with its supported identity and current permissible metadata; merge it with a discovered candidate only when identity evidence supports the association. A lookup, visible public metadata or clearing search never confirms a pending selection or creates a Project. The page preserves the pending default or custom intent and uses the same review, local admission, account-change and access rules as other eligible candidates. A missing or error-affected result has a safe lookup limitation, not a claim that the address or Repository is nonexistent, private or uninstalled. This is not a commitment to global search, arbitrary URLs or a fallback credential mechanism.
    initial_setup_presentation: As an agent-authored first-version route proposal, a confirmed empty local portfolio presents a clear system-styled action to connect GitHub or, when an applicable connection already exists, to choose Repositories. A connection or installation-review interruption returns to a usable setup or recovery state rather than creating a Project. The Repository picker shows permitted source names and context where known, supports search and multiple pending selections across query changes, and keeps its current default-setup or custom-Project intent discoverable. A visible review route allows inspection of permitted pending selections and safe limitations without requiring a fully covered discovery result; an empty confirmed selection cannot be saved. The route's state does not disclose restricted selection existence or count. Discovery limitations and connection recovery remain available without relying only on color or transient messages. Use standard native navigation, text controls and selection affordances where suitable; exact screen division and API choice remain open.
    review_and_outcome_presentation: Before confirmation, the default route presents each permitted selected entry's supported expected outcome as existing default reuse, separate default creation or unresolved; the custom route presents one proposed Project name, optional purpose and selected membership instead. Unavailable or restricted selections remain represented only to the extent safe and do not become silently deselected or a fabricated count. After explicit confirmation, show per-entry saved, reused, failed or unresolved outcomes according to 0045 and 0104, with an accessible recovery route; independent successful saves remain usable when another entry is incomplete. The operator can return to the portfolio without discarding saved Projects, and can explicitly open an independently readable permitted Project. A multi-selection does not silently enter an arbitrary Project or create a combined one. Returning or dismissing the outcome view is not itself another confirmation, a source refresh success or cancellation of an admitted write. Exact copy, progress layout and native focus behavior remain to be validated.
    eligibility: Before an entry can be submitted for local save, apply its confirmed source identity, current applicable account and access evidence under 0036, 0038, 0045 and 0112, and evaluate the Project proposal under 0111. If the GitHub App direction is selected, 0099 supplies its source-specific access context. Discovery success for one installation does not establish another installation's coverage or PR and Issue observations. A disappeared item in partial discovery is not necessarily deleted; a changed account or denied access cannot be bypassed by stale page state. Access-check and entry admission must be coordinated with applicable account and cancellation changes under 0113 so an old read alone cannot authorize a newly submitted entry after the change.
    external_change_limit: Coordination orders admission against locally established connection, denial and cancellation facts; it cannot make an external GitHub grant change and local database commit one atomic event. Attribute a save to the source evidence actually used and apply a later learned restriction without rewriting that evidence or silently deleting the saved local Project. Unknown remote changes do not justify a claim of continuously verified access.
    default_batch: An explicitly confirmed nonempty default selection processes entries independently under 0045, 0103, 0104 and 0052; each establishes or reuses at most one active default association for its confirmed Repository. Record enough evidence to reconcile each admitted mutation, but do not require persisting the whole selection or its unsubmitted entries. The selection is not an implicit multi-Repository Project or an all-or-nothing transaction.
    default_name_resolution: For an entry requiring a new default Project, compose the permitted source-name proposal and the 0111 validity decision; if no usable valid name is available, keep that entry unresolved and make explicit name entry and confirmation available under 0045. Bind the submitted name to its own operation without making the batch intent record a store for source text. A lost unsubmitted name can be re-entered; an indeterminate submitted named operation is reconciled before a changed intent is submitted. An existing default association is not renamed by repeated setup.
    custom_creation: A distinct explicit custom-Project intent presents and confirms one valid name, optional purpose and one or more eligible Repository identities. It submits a separate local creation operation under 0025, 0103 and 0104; matching a previous Project's name or members does not make it a default setup or a retry. An unknown prior creation outcome is reconciled before an unsafe retry; a later independently confirmed intentional creation remains distinct.
    custom_partial_eligibility: Unlike default batch entries, custom creation submits one reviewed configuration. If an included Repository lacks required current applicable identity or access evidence before admission, preserve the intended composition and report the affected safe limitation; do not create a smaller Project or split it into defaults. A user may explicitly revise and confirm the composition under 0025 and 0111, using a new operation identity when replacing an already submitted intent and reconciling any indeterminate earlier effect under 0103. A source denial observed only after admission is handled separately under external_change_limit and current disclosure.
    result_and_transition: A confirmed Project configuration can appear in the normal overview as soon as it is independently readable and permitted, even when other batch entries fail or remain unresolved. Its PR and Issue observations remain unobserved until separately obtained. Moving from setup to the overview or a Project preserves the actual saved Project identity and scope; it does not treat source authorization, installation or a save receipt as a successful data refresh. The local Project boundary remains authoritative after navigation under 0107.
    outcome_projection: Present a confirmed new default as saved and a confirmed independently existing default as reused, following the distinct durable results in 0104. A known rejection or conflict provides a recoverable failure route; a submitted entry whose outcome is indeterminate remains visibly unresolved rather than reported failed, rolled back or saved. An unsubmitted pending entry remains distinct. A past applied receipt may be explained as historical evidence, but the transition requires an independently current readable and permitted Project. Under 0045, a retained batch does not automatically submit an unstarted entry after restart; an unretained selection can be chosen again.
    resolved_pending_identity: A pending unsubmitted entry requires source-supported Repository identity before admission. If it was not retained across restart, the operator can select it again; do not infer its identity from a name or position. Reconcile any earlier admitted uncertain effect before a potentially duplicating retry, and apply current account and access rules.
    restart_and_cancel: On restart, read saved Projects and reconcile any previously submitted uncertain operation. Previously unsubmitted selections may be lost and are never automatically submitted; the operator may choose them again. Cancellation stops further admissions from the active selection, without asserting rollback of an already admitted effect. Saving a persistent batch cancellation or full selection is not mandatory for this minimum.
    account_change_and_denial: A pending selection and submitted batch retain their initiating account context. A new account requires fresh identity, access evidence and explicit confirmation for remaining entries; a late response or receipt from the earlier account cannot create a selection for the new account or lift a current denial. Reconciliation of a prior local outcome does not require presenting restricted source-derived details. Existing Project configuration and accessible observations follow their own saved identity and access policies.
    account_scoped_search: Setup presentation applies 0059 to discovery query as well as results when the active source account changes. Do not automatically reuse or resubmit prior-account search text in the new account; keep any permitted prior context separately attributed and apply current disclosure before showing it. Starting a new search is not confirmation to reuse an earlier pending Project selection.
    accessibility: Connection, discovery scope and limitations, distinct creation intents, confirmation, per-entry outcomes, cancellation and recovery must be available without relying only on color, long press or a timed gesture. The exact native controls, screen allocation and announcements remain open; source-restricted identities and counts are not exposed to explain a limitation.
    verification: Under 0040 and 0079 specify TDD scenarios with injected local configuration, source, access, clock and operation outcomes for empty versus unreadable startup, partial discovery, account switch, durable intent failure, cancellation race, lost acknowledgement and later work refresh failure. Check actual authorization, source grant changes, persistent restart and native accessibility separately. These are planned tests, not executed product evidence.
    provenance: One default Project per Repository, custom multi-Repository Projects, retained local data and FSD with DI and TDD are owner choices. The setup page ownership and composition are agent-authored proposals; they do not claim a selected screen hierarchy, live installation, database or implementation.
  scenarios:
    empty_search_with_pending_selection:
      given: A permitted Repository A was selected in setup, the operator searches for another name, and no currently observed permitted result matches while one installation's discovery is incomplete.
      when: The picker shows the search result and the operator clears the query.
      then: The view distinguishes no visible match from incomplete discovery, offers an applicable recovery route, and retains A as a pending selection without creating a Project. It does not say that the account has no Repositories or invent a missing-result count; current access is checked before A is shown or confirmed.
    first_setup_system_route:
      given: The local Project collection is confirmed empty, the operator has not connected GitHub, and a later authorized discovery yields two permitted Repositories from different organizations.
      when: The operator connects, selects both for default setup, reviews the distinct creation outcomes and explicitly confirms.
      then: Each eligible Repository can produce its own default Project under its independent local outcome, with no implicit combined Project or GitHub work observation. The operator can return to the portfolio or explicitly open a confirmed readable Project without being forced into one of the two.
    setup_outcomes_with_partial_save:
      given: Two default entries were confirmed, the first has a supported saved Project and the second has an indeterminate local outcome.
      when: The operator inspects the outcome view and returns to the portfolio.
      then: The first Project is available where independently readable and permitted, the second remains visibly unresolved with recovery under its original operation, and neither dismissal nor retry creates a duplicate or reports the second as failed or saved without evidence.
    recovery_after_newer_navigation:
      given: An optional retained batch left Project A saved and entry B unsubmitted; recovery of the batch record is pending while the operator explicitly opens a separately readable permitted Project C.
      when: Recovery later reads the batch record and confirms A's saved outcome while C remains eligible and the original account context is unchanged.
      then: C remains the current route, the recovered A and B outcomes are available through an appropriate recovery path, and B is not automatically submitted. The recovered receipt alone does not establish A's current configuration or any work refresh.
    connection_ready_store_incompatible:
      given: A recoverable connection is usable, but the local Project store has a newer incompatible schema and its saved contents cannot be read by this app version.
      when: The operator opens setup or a source discovery result arrives.
      then: Connection and local incompatibility remain separate, no empty portfolio or failed login is asserted, and no Project creation is admitted to that store. An available compatible-reader or update route is offered without deleting the store.
    store_ready_connection_unavailable:
      given: A supported local schema upgrade completes and saved Projects can be read, but the active connection's secure item cannot be recovered.
      when: The operator returns to the overview.
      then: The saved Projects remain locally configured, connection recovery is offered separately, and source-derived content is shown only to the extent allowed by current access policy without claiming a successful source refresh.
    unreadable_startup_with_saved_data:
      given: A valid Project was previously saved but the current local Project collection read is unavailable.
      when: The app starts while GitHub is also offline.
      then: Local recovery and source connectivity remain distinguishable, the app does not assert an empty portfolio or reset configuration, and it can show independently recoverable permitted Projects if supported.
    public_candidate_and_installation_discovery:
      given: An active confirmed connection has no applicable installation entry for Repository R, but an explicit user lookup separately returns a source-confirmed public R with metadata and independently sufficient admission evidence.
      when: The operator selects R for a default Project and reviews the proposed result.
      then: The route can present R as an eligible public-observed candidate without fabricating installation membership; only explicit confirmation followed by a valid local save creates or reuses a Project. No work data or complete Repository inventory is inferred from the lookup.
    authorized_without_installation:
      given: The user identity is confirmed but no applicable installation or Repository grant has yet been established.
      when: The operator enters discovery.
      then: Setup can offer a permitted user-initiated access-review route, but does not create a Project or assert an empty GitHub account from authorization alone.
    installation_return_then_recheck:
      given: An authorized user initiated installation review while a Repository selection was pending; GitHub returns an unverified installation hint or the operator manually returns without a callback.
      when: The setup route becomes active and the operator requests a recheck.
      then: The connection and pending intent retain their supported contexts, current-user installation and grant evidence are assessed independently, and no Project is saved or authorization exchanged solely because of the return or hint.
    partial_batch_restart:
      given: An optional retained two-entry batch durably saved the first default Project and did not submit the second before termination.
      when: The app restarts and independently reads the Project and batch records.
      then: The saved Project appears under its identity, the remaining entry retains its actual status and is not automatically submitted, and no work observation is fabricated.
    connection_changes_during_confirmation:
      given: A selection was confirmed under account A and the active account changes to B while one entry is not yet admitted for save.
      when: The setup composition attempts to continue.
      then: The old confirmation does not authorize submission under B; completed or in-flight A outcomes are reconciled separately and remaining work requires the applicable new confirmation and access evidence.
    local_save_succeeds_refresh_fails:
      given: A selected Repository's default Project is durably saved and its first PR refresh later fails.
      when: The operator enters that Project.
      then: The saved Project remains identifiable, the refresh failure and unobserved work are distinguishable, and neither empty PR data nor failed Project creation is inferred.
    indeterminate_then_reconciled:
      given: After a default creation submission the acknowledgement is lost, the outcome is indeterminate, and the current local Project configuration is unavailable.
      when: The setup route is restored and later independently establishes the same operation's applied result and a permitted current Project read.
      then: The entry is initially unresolved rather than failed or saved; only the later supported evidence makes that Project available for navigation, and no separate duplicate creation is submitted in between.
    binding_unavailable_after_saved_project:
      given: A Project save is confirmed before interruption, but after restart the active account binding cannot be reconciled because the required securely stored credential is unavailable.
      when: The operator returns to the overview and attempts to open the saved Project.
      then: The saved configuration is not erased or relabeled as a failed creation; connection recovery and any independently permitted last-known content follow 0036, 0113 and 0086, without presenting the binding as usable or claiming a new source refresh. A known pending restriction remains effective.
    custom_selection_partially_unavailable:
      given: A custom Project containing A and B was reviewed, A remains eligible, and B's access is unresolved before local admission.
      when: The setup route attempts creation.
      then: No A-only Project or pair of default Projects is silently created; the full intended composition remains unresolved, an access-safe revision or recovery route is available, and a changed configuration needs explicit confirmation.
    explicit_custom_and_default:
      given: Two Repositories have existing default Projects and the operator explicitly confirms a custom Project containing both.
      when: The custom save is durably confirmed.
      then: One distinct Project with both members becomes available; the existing default associations remain unchanged and no extra source grant is inferred.
  unresolved:
  - The startup and setup outcomes and ownership are defined above; choose concrete native presentation, accessibility focus APIs, callback handling and storage recovery interfaces during implementation and verify them against these contracts.
  - Verify source-specific eligibility, account-change coordination and the eventual selected authorization flow against actual operations and permissions; if GitHub App is selected, verify the 0098–0100 candidate.
  - No FSD modules, source or persistence adapter, controlled product tests or native behavior have been implemented or verified.
