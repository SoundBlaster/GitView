acceptance:
- Today includes each source-confirmed matching object once when any inclusion rule is confirmed; unresolved identity is not represented as confirmed uniqueness.
- An unknown input alone cannot establish a confirmed match, a confirmed non-match or an empty unobserved source; an independently true inclusion or false required condition can still determine the applicable result.
- Explicit filter exclusions affect the selection without changing stored objects or rewriting source timestamps.
- Under the agent-proposed local-day interpretation, time group recalculation uses the device local calendar and does not rewrite recorded source timestamps; the product time-zone interpretation remains open.
- A complete Today selection requires evidence that the selected population and all applicable inclusion alternatives are adequately covered, not merely that one source list was fetched successfully.
specification:
  objective: Define a checkable Today selection over known work and explicit filters while retaining uncertainty.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    identity: Distinguish each source-confirmed PR or Issue by source object identity within its repository; source numbers are not globally unique. A linked PR and Issue are distinct objects and repeated inclusion rules do not duplicate a confirmed object's card. If identity cannot establish whether two observations refer to the same object, preserve that uncertainty rather than claiming two confirmed distinct objects or silently merging by title.
    source_representation: Candidate 0101 distinguishes a GitHub REST Issues representation marked as a PR from an independently identified Issue. Different source ID kinds retain their meaning; an untyped or unassociated record cannot silently become a confirmed second work object or a confirmed exclusion.
    today: Under the agent-proposed local-day interpretation, the day is the interval from the start of the device local calendar day to the start of the following local day, inclusive at the start and exclusive at the end. Re-evaluate on local day or time-zone change without rewriting stored timestamps. The product time-zone interpretation remains open under 0049; the examples using local days illustrate this candidate rather than establish an owner decision.
    base_inclusion: A confirmed source-open PR or Issue is included as unfinished, including one created earlier. A PR with a confirmed merge or unmerged closure event in Today, an Issue with a confirmed closure event in Today, or an object with a confirmed creation timestamp in Today is included under the corresponding same-day alternative. Observation today alone does not prove an event occurred today. A draft PR is still an open PR with a separate draft flag. Current state is shown; close reason and merge state remain distinct.
    observed_event: A confirmed source event may be observed after it happened; evaluate its event time against Today rather than using retrieval time. An object's current closed state and its observation time without a confirmed closure event time do not prove that it closed today. A currently open object still qualifies through the unfinished alternative, without proving when or how many times it reopened.
    population_coverage: To claim that Today contains every matching permitted object in a stated Project or Repository scope, establish sufficient source and identity evidence for the union of its applicable inclusion alternatives, including currently open work, eligible creation events and eligible merge or closure events in the captured Today interval, for each included Repository and object category. The device-local day is one proposed interpretation, not a settled product choice. An independently supported source or reconciliation method may establish the union directly; otherwise each alternative and its overlapping identities require sufficient coverage. Apply explicit filters and independently supported known-false conditions to their actual scope, without demanding evidence for alternatives proven irrelevant to the claimed filtered selection. A complete open-only list, a complete created-today list, successful traversal or a complete single Repository alone is not proof of the whole union. A cache of previously seen objects cannot by itself prove no unseen matching object exists.
    incomplete_population: When some required population or applicable filtering evidence is incomplete, retain permitted known objects and their own observation times and show the selection as incomplete or uncertain. An object absent from a later open-only result is not thereby assigned a merge, closure, deletion or same-day event; its earlier accepted observation may remain last known under 0026 and 0089. Do not assert a complete empty selection or an exact total from the visible subset. A sufficiently evidenced same-day event can establish an individual inclusion even while population coverage is incomplete.
    scope_change: Coverage is associated with the actual Repository identities, object categories, local-day interval and filters it establishes. A Project membership change, local day or time-zone transition requires reevaluation of the relevant scope; prior coverage for a different set or interval is not automatically transferable. Independently applicable per-Repository observations may be reused under 0044 and 0049 while the resulting Project-wide selection remains incomplete where needed.
    unknown: Evaluate the inclusion alternatives and each active filter using known values. If at least one inclusion alternative is confirmed, inclusion is confirmed even if another alternative is unknown. If no alternative is confirmed and one or more cannot be evaluated, base inclusion is unknown rather than false. If all applicable alternatives are known false, base inclusion is false. An active filter with unavailable input is unknown, not an automatic match or rejection.
    unrestricted_lifecycle: No lifecycle restriction adds no requirement to know the current lifecycle. An independently confirmed Today creation, merge or closure can therefore support inclusion even when the current lifecycle is unavailable; its displayed state remains unknown and coverage is separate. If the operator restricts the lifecycle to a subset, evaluate that actual condition and keep an unavailable or unrecognized current lifecycle uncertain under 0110. Re-enabling all supported lifecycle choices in the first-version control restores unrestricted treatment rather than creating a hidden filter on future or unknown values.
    composition: A known-false scope, inclusion or active filter excludes the object. When all required conditions are known true, the object is a confirmed match. Otherwise it is an uncertain candidate. Presentation can group uncertain candidates or indicate affected coverage, but must not claim an exhaustive result or display an unknown condition as passing.
    access_boundary: Candidate evaluation and presentation are subject to current access policy under 0036 and 0088. An uncertain predicate does not authorize revealing a restricted object's identity, title, link, existence or a derived count when that fact is restricted. Permitted candidates remain inspectable with their uncertainty; otherwise expose only a non-sensitive scope-level limitation or recovery route where allowed. A restriction does not prove a confirmed filter non-match, source deletion or an empty repository.
    observed_match_context: Confirmed match or exclusion means that the supplied evidence determines that result within its stated observation context; it does not by itself establish the object's state now. If inputs are stale, expose their relevant time or freshness. If inputs were observed at different times or revisions, do not present their conjunction as a confirmed simultaneous source state unless the source evidence supports that claim. An unavailable or inapplicable current filter input stays unknown even if an older value is retained as last known; an old false value cannot by itself establish a current exclusion. Temporal applicability is refined in 0089.
    explicit_exclusions: The operator can exclude applicable lifecycle states. When every applicable state is explicitly excluded, show an intentional filtered empty selection without claiming that source work is absent; scope freshness or failure remains accessible.
    boundary: This defines the Today selection only. Older completed history, ordering and how unknown candidates are visually arranged require separate refinement. Source fetch, exact fields and pagination are not selected here.
    provenance: The inclusion of unfinished and same-day work and explicit filtering follow the owner discussion; the three-valued evaluation rules are agent-authored proposals.
  scenarios:
    open_only_refresh_after_completion:
      given: One Repository has 100 previously observed open PRs and a later source-supported observation covers only the current open-PR list containing five of them; no merge or closure events for the other 95 are established.
      when: Unfiltered Today is evaluated after that refresh.
      then: The five supported open observations can be shown; the other permitted PRs retain their prior observation contexts or are uncertain, their absence from the open-only list is not labeled 95 merges or deletions, and the 100-item Today population is not asserted complete without sufficient event and identity evidence.
    directly_covered_union:
      given: A separately justified source observation establishes the complete distinct union of all applicable Today inclusion alternatives for one Repository and category with compatible time, identity and filter evidence.
      when: The Today selection for that exact scope is evaluated.
      then: That direct union evidence can support complete coverage without inventing separate independently fetched lists for every alternative; other Repositories and categories keep their own coverage.
    project_scope_changes:
      given: Today coverage was sufficiently established for Project members A and B, then B is removed and unobserved C is added.
      when: Project-wide Today is evaluated for confirmed current members A and C.
      then: Compatible permitted A observations can be reused, B is not included as a current member, and C's unobserved scope prevents claiming a complete A-C population.
    one_true_alternative:
      given: An Issue is confirmed open, was created before Today and has unknown closure time.
      when: Today is evaluated without a lifecycle exclusion.
      then: The Issue is included once as unfinished; unknown closure time does not remove it.
    unknown_filter:
      given: A PR is included by Today and its CI status is unavailable.
      when: A failed-CI filter is active.
      then: The PR is not asserted to pass or fail the filter; the selection communicates uncertainty or incomplete coverage.
    known_false_filter:
      given: A PR is confirmed merged today and the operator excludes merged PRs.
      when: The selection is evaluated.
      then: The PR is excluded from the view, while its underlying observed data remains unchanged.
    time_zone_change:
      given: An Issue has a stored UTC creation time and the device time zone changes.
      when: Today is recalculated.
      then: The Issue is evaluated against the new local day boundaries and its stored timestamp is unchanged.
    uncertain_identity:
      given: Two observations have insufficient source identity to decide whether they refer to one PR or two.
      when: Their scope and selection are presented.
      then: Their unresolved identity remains explicit; the app neither claims a precise unique-object count nor merges them solely because their titles match.
    observed_today_closed_earlier:
      given: An Issue created before Today is observed closed during Today, but its confirmed closure event occurred yesterday.
      when: Its unfiltered Today inclusion is evaluated.
      then: Today's retrieval time does not make yesterday's closure a Today result; the Issue matches only if another Today inclusion alternative is confirmed.
    unknown_closure_time:
      given: An Issue created before Today is observed closed but its closure event time is unavailable.
      when: Its unfiltered Today inclusion is evaluated with no other confirmed alternative.
      then: The result is uncertain rather than a confirmed Today closure or a confirmed exclusion.
    stale_failed_ci:
      given: A PR was observed with failed CI at T1 and its title alone was refreshed at T2, without a current CI observation.
      when: The failed-CI filter is evaluated for current work.
      then: The T1 failure may be represented as last known with its own context, but the T2 title does not establish a current failed-CI match or a confirmed current exclusion.
    denied_candidate:
      given: A private PR was previously included in Today, its current CI filter input is unknown and access to its existence, identity and CI facts is explicitly restricted.
      when: The failed-CI selection is evaluated.
      then: Restricted identity, link and revealing counts are not exposed as an uncertain candidate; an allowed general limitation or recovery path remains, and the restriction is not reported as a confirmed non-match or source deletion.
  unresolved:
  - Source field semantics and sufficient history for same-day transition claims, especially reopenings.
  - Concrete UI arrangement of uncertain candidates; an initial accessible treatment and ordering are proposed in 0042 and remain subject to review.
  - Historical periods and semantics beyond the first Today selection.
