acceptance:
- The candidate GitHub App permission profile relates each proposed read permission to a selected product data category without presenting it as a proven exhaustive minimum.
- The selected first-version product performs no source work writes and does not request a write grant to support its read-only overview.
- GitHub App registration permissions, a particular installation's approved permissions, user access and an actual successful field observation remain separate facts.
- Missing review, checks, status, Issue links or discussion evidence affects the corresponding information and derived claims without silently erasing independently permitted data.
- Source-provided fields and counts are substituted for a product metric only when their population, identity, time, visibility and semantic meaning match its contract.
- A newly requested but unapproved permission or a successful grant update does not itself provide historical data, advance an observation time or prove every operation is accessible.
specification:
  objective: Bound a reviewable least-privilege starting profile for the selected GitHub App user-token direction while keeping field-level coverage and source behavior explicit.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:CIStatus
  - gitview:Metric
  contract:
    proposed_profile: As an agent-authored working registration candidate for GitHub App user-token access, consider repository-level Metadata read, Pull requests read, Issues read, Checks read and Commit statuses read. Document why each is requested and ask for no source work write permissions. This is a starting hypothesis supported by examples in the permission matrix, not a proven minimum, a complete GraphQL permission mapping, a registration action or a guarantee that every selected field is available. GitHub's actual consent and installation capabilities must be represented accurately rather than implying that every listed permission can necessarily be opted into independently.
    rationale: Metadata read supports the documented per-installation accessible-Repository listing; Pull requests read is documented for listed PR and requested-review operations; Issues read is documented for Issue, sub-Issue and dependency operations; Checks read and Commit statuses read cover separately documented REST status families. Some operations admit alternative permission sets or public-resource access; those facts do not make the candidate profile a unique minimum. The app does not need to clone source code or display file contents for the agreed overview, so do not add Contents access merely because GitHubRepository and Code occur in the ontology. A later operation needing a different grant requires its own evidence and disclosure.
    fields_and_limits: Map approved PR A through G and Issue A through G to source-supported observations or explicitly identified open evidence using the selected-field coverage and source research. A documented list or object operation can establish only fields and semantics it actually returns in its supported context; it does not automatically cover each linked object, GraphQL field, historical event, source revision or complete collection. In particular, obtaining Issue participants is not automatically equivalent to counting distinct authors of the selected comment population, and an Issue-to-PR connection with a default open-PR filter cannot establish the full set of closed and open PR links. Explicit source contexts and parameters need verification before claiming a complete result.
    reviews_threads_and_ci: Treat review requests, aggregate review assessment and unresolved threads as separate facts under 0062; GraphQL schema documentation does not itself prove the permission needed by a particular composed query. A long-thread proxy under 0094 additionally needs permitted submitted-comment timestamps and applicable thread and PR states. CI combines distinct check runs and status contexts under 0060 and 0061, preserving applicable revision and retry semantics. One available source family does not establish the other's absence, a complete CI count or merge readiness.
    relations_and_discussion: Direct blocked-by links, source parent or children, closing connections, mentions and milestones retain distinct scope, access and semantics under 0063 and 0078. A permitted Issue does not grant access to every linked private target. Issue comment counts, distinct comment-author counts and latest-comment times follow 0077 and require their own source population and coverage; a User-only participant connection is not automatically equivalent to all eligible authors, which can include other actor types. Do not require comment bodies, a comment browser or diff viewer merely because source evidence is needed for counters.
    grant_lifecycle: The app registration's requested permission profile is distinct from the permissions approved for a particular installation and from the user's current access. GitHub documents that new requested permissions can require approval and that an installation may retain previously approved permissions while the new permissions are not approved. If source evidence supports that state, explain it at the applicable scope; do not treat all prior observations as lost, mark new categories observed or silently request approval on the user's behalf. When the reason for a failure is uncertain, expose a general access or refresh problem rather than a fabricated permission diagnosis. Details and cancellation follow 0099 and 0088.
    unknown_and_privacy: For each selected category retain its source, Repository, permission and coverage context where supported, plus the actual source observation time. Missing, denied, partial, unrequested and unobserved are distinguished to the extent source and policy allow. A restricted fact or revealing aggregate is not disclosed through a Project summary, preview, share or accessible label. Independently permitted data remains usable under 0036 and 0088; absence of one family or one inaccessible organization is not a confirmed empty account, passed CI or lack of work.
    verification: Before this profile is adopted for a real registration or called complete, trace every chosen first-version field and exact planned REST or GraphQL operation to its actual supported permission and returned semantics, account and installation scope, optional public access, partial failure and coverage. Review any requested addition for necessity and disclose it. Then validate with an authorized source and representative permissions and separately test native behavior and secure storage; no live source access, credentials, registration, network budget or product implementation is implied here. Controlled source doubles exercise category isolation and unknown behavior but do not prove GitHub permissions.
    provenance: The owner selected the PR and Issue field groups and read-oriented overview. This candidate permission profile, its mapping and partial-access treatment are agent-authored proposals informed by public GitHub documentation; they are not source proof for every field or an owner-selected authorization grant.
  scenarios:
    checks_grant_missing:
      given: A GitHub App installation supports observing PR and Issue metadata while the applicable Checks category is unavailable or its permission change remains unapproved.
      when: The operator inspects a Project and a PR.
      then: Independently permitted metadata retains its actual observation context, checks are unavailable or incomplete instead of green or zero, and a specific permission explanation is used only when supported.
    independent_status_families:
      given: A PR's applicable check-run data is available but its commit-status context data is unobserved.
      when: GitView evaluates the compact CI total.
      then: Supported check-run facts can remain visible with their context, but the combined exact count or absence of failures is not asserted solely from that family.
    permission_increase_not_approved:
      given: An existing installation retains an older permitted scope while an additional requested repository permission has not been approved.
      when: A supported existing category and the new category are displayed.
      then: Previously permitted data remains governed by its own current access and observation evidence, the new category is not declared available or empty, and the reason is named only when independently supported.
    linked_private_target:
      given: An accessible Issue contains a source-supported link to a target whose identity or fields are restricted.
      when: The Issue and its relationship summary are shown.
      then: Restricted details and revealing counts are not exposed and the relation coverage is not presented as complete merely because the source Issue was readable.
    participants_population_mismatch:
      given: A source participant aggregate counts Users in a discussion while GitView's selected proposed metric counts distinct eligible comment authors including supported non-User actors.
      when: The two populations are not proven equivalent.
      then: GitView does not substitute the participant aggregate as the exact comment-author count; it shows supported data with its own definition or retains uncertainty.
    omitted_closed_prs:
      given: An Issue-to-PR source connection was observed with a default that excludes closed PRs, while the product requests the applicable related PR set without that lifecycle restriction.
      when: Related PR coverage is summarized.
      then: Open PR links can remain known but the all-state relationship set is incomplete until supported evidence covers the omitted scope.
  unresolved:
  - Trace exact selected operations and field-level GraphQL permissions, particularly review threads, comment-age proxy, relationship links, identity and historical outcomes; perform authorized source validation before declaring a complete grant set.
  - Decide exact permission disclosure and installation-update experience with real GitHub and iOS; no registration, permission approval or app behavior has been executed.
  - Source pagination completeness, permission-change timing and access to related private objects remain separate evidence requirements.
