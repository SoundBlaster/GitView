id: GITVIEW-SPEC-0037
title: GitView - Refresh ordering and access changes
kind: spec
created_at: '2026-11-14T13:43:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0026
depends_on:
- GITVIEW-SPEC-0036
sources:
  observations: docs/drafts/GITVIEW-SPEC-0026.yaml
  access: docs/drafts/GITVIEW-SPEC-0036.yaml
  autonomy: conversation:gitview/excerpt-77
acceptance:
- An older source observation cannot silently replace a confirmed newer observation for the same fact and scope.
- When freshness or coverage of competing observations cannot be ordered, the application does not report the combined result as a confirmed newer complete snapshot.
- A response from a refresh begun before explicit denial or local disconnect cannot make newly restricted private content visible without re-established access.
- A conflict or interrupted refresh does not erase previously retained observations or silently advance the complete-observation time.
specification:
  objective: Define observable safety boundaries when refreshes overlap or access changes before a response is applied.
  ontology_refs:
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    identity: Compare observations only for the same source identity, object or collection scope and relevant fact. A request for one category or Repository cannot establish freshness for another.
    ordering: When source evidence establishes that an incoming value is older than an accepted value for the same fact, retain the newer accepted value. Request start order or response completion order alone does not establish source freshness. Reliable source revision, observation evidence or a separately specified comparison rule is required.
    unordered: If two overlapping results cannot be ordered for the same fact, retain enough previously accepted information to avoid silently asserting that either is newer. Mark the affected fact or scope uncertain or incomplete, and do not advance the last complete observation time as though a coherent newer full result were established. The exact conflict-resolution mechanism remains open.
    partial_scope: A result can improve the observed facts in a subset without proving the entire collection complete. Absence from a partial result does not delete other records; a complete observation time applies only to a sufficiently covered scope.
    denial_during_refresh: Apply current access restrictions before presenting response data. If explicit denial or disconnect was established after a request began, completion of that request alone does not restore authorization or unlock previously restricted private observations. A later authorized connection must re-establish the relevant source identity and Repository access under 0036.
    failure: An interrupted, cancelled or failed request does not manufacture a success time. Its visible failure or incomplete outcome is scoped separately from other successful observations.
    provenance: These concurrency and access-ordering guarantees are agent-authored refinements of the user's requirements for cached observations and visible refresh failure.
  scenarios:
    later_completion_older_value:
      given: Two observations concern the same PR and source evidence confirms B represents a newer revision than A.
      when: B is accepted before A's response arrives.
      then: A does not replace B or make A's older value appear newer merely because it completed later.
    unordered_results:
      given: Two overlapping partial responses contain conflicting values for a PR without reliable freshness ordering.
      when: Both are processed.
      then: The conflict or affected coverage remains uncertain and no complete newer scope is asserted solely from response arrival order.
    denied_mid_request:
      given: A refresh for a previously accessible private Repository is in flight.
      when: Explicit access denial is established before its response is applied.
      then: The response alone does not unlock or display restricted private content and the denial remains visible.
    disjoint_scopes:
      given: A PR refresh and an Issue refresh address distinct scopes for the same Repository.
      when: The Issue refresh succeeds and the PR refresh is interrupted.
      then: The Issue success is retained while the PR scope keeps its own prior observation time and incomplete outcome.
  unresolved:
  - Concrete source freshness evidence, conflict storage and eventual reconciliation policy require source-specific design.
  - Exact execution and cancellation semantics when account identity changes during a request require authorization design.
