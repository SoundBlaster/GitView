acceptance:
- Organize the app according to the selected FSD iOS responsibility and dependency direction without requiring
  empty layers or premature modules.
- Separate GitHub and persistence adapters, typed observed facts, domain decisions and UI effects.
- Use SpecificationCore for suitable stable named domain policies while preserving their complete domain outcomes;
  do not create a specification for every control-flow branch.
- Preserve source, scope, freshness and uncertainty through domain decisions and presentations.
- Design product code for testability and inject replaceable network and data dependencies at explicit boundaries.
- Develop product behavior using TDD and provide deterministic network and data test doubles.
- Verify adapter behavior and essential integration paths separately; passing mocks alone does not prove GitHub integration.
acceptance_evidence:
- criterion: Architecture boundaries and policy outcomes can be reviewed independently.
  evidence: The scenarios below describe future architecture and behavioral checks, not an implemented
    dependency graph.
specification:
  objective: Define initial responsibility and policy boundaries without prescribing a concrete app implementation.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  pilot_contract:
    layers: 'Follow FSD iOS direction app to pages to widgets to features to entities to shared, composing
      sibling slices above their layer. Lower layers do not depend on higher layers; shared infrastructure
      does not depend on GitView domain concepts. Create a layer or module only when its responsibility exists.

      '
    decisions: 'Candidate domain decisions include Today inclusion, filter match with unknown, repository
      identity continuity and summary coverage. Keep external I/O, parsing, serialization and UI actions
      outside the decision itself. Use SpecificationCore for suitable stable named policies where it makes
      them clearer and independently testable; retain typed unknown and other distinct outcomes rather than
      forcing them into an inadequate Boolean representation. Exact policy selection remains to be justified.

      '
    dependency: 'SpecificationCore and FSD iOS are intended tools; exact versions, module decomposition
      and integration method are implementation work. No compiled dependency or concrete module is claimed.

      '
    testability: 'Use dependency injection to supply networking, data storage and other nondeterministic
      dependencies where needed. Select a simple composition mechanism during implementation; no DI
      framework, global service locator or protocol per type is mandated. Domain decisions can be tested
      independently of network, disk and UI. Provide mocks, stubs or fakes appropriate to each test, with
      deterministic data and controllable failures and time where relevant.

      '
    development_workflow: 'Use TDD for product behavior: establish a failing behavioral test, implement
      the smallest change to pass it, then refactor with tests green. Keep tests focused on observable
      behavior and meaningful failure modes. Supplement isolated tests with adapter, integration and
      device checks as appropriate; test doubles do not establish live API, OS or device behavior.

      '
    evidence: 'Architecture checks and policy tests should examine actual production boundaries when code
      exists; source references and this draft are not proof of compliance.

      '
  scenarios:
    unknown_filter:
      given: A PR's CI state is unavailable.
      when: A failed-CI selection is evaluated.
      then: A decision can preserve unknown rather than return a misleading confirmed match or non-match.
    project_scope:
      given: Two Projects share one Repository.
      when: A portfolio total is computed.
      then: The decision receives identities and coverage explicitly and counts that Repository once.
    offline_refresh_test:
      given: A test injects saved observations and a network dependency that fails deterministically.
      when: The application refreshes the observations.
      then: It preserves the last known data and reports the failure and last successful update time.
    real_adapter_check:
      given: Isolated behavior tests pass using test doubles.
      when: The actual adapter and authorized GitHub integration are checked separately.
      then: Evidence distinguishes those results from the isolated tests and does not infer live success from mocks.
  unresolved:
  - Concrete module layout, resolved package versions and actual architecture-tool integration.
  - Exact policy types and test strategy after implementation technology is selected.
  boundary: These are proposed architecture obligations, not application code or measured compliance.
