artifact_kind: gitview_scenario_level_pilot
status: agent_proposal
description: >-
  Review-only classification of selected existing scenarios. The level describes
  their principal purpose, not truth, maturity, release inclusion, test execution
  or an accepted SpecGraph schema. A scenario can be mixed; its level does not
  determine the level of its entire specification.
levels:
  product: Explains a user-visible outcome, meaningful choice or consequence.
  technical: Specifies an implementation-facing mechanism or its failure boundary.
  mixed: Connects a user-visible outcome to a particular technical mechanism.
scenarios:
- spec: GITVIEW-SPEC-0127
  scenario: project_membership_is_local
  level: product
  rationale: Removing membership affects one Project without deleting the source or changing the other Project.
- spec: GITVIEW-SPEC-0127
  scenario: dynamic_today_and_fixed_cohort
  level: product
  rationale: Distinguishes a changing Today view from a proposed fixed set of PRs.
- spec: GITVIEW-SPEC-0043
  scenario: dense_grid_zoom_preview_round_trip
  level: product
  rationale: Connects density, object inspection and return through a user journey.
- spec: GITVIEW-SPEC-0043
  scenario: github_token_rotation_response_lost
  level: mixed
  rationale: Connects an optional token-rotation mechanism to offline data and user recovery.
- spec: GITVIEW-SPEC-0117
  scenario: old_response_after_clear
  level: technical
  rationale: Describes generation ordering when an optional history-clear feature is used.
- spec: GITVIEW-SPEC-0114
  scenario: secure_write_before_commit
  level: technical
  rationale: Describes interruption recovery for one optional credential-storage protocol.
- spec: GITVIEW-SPEC-0048
  scenario: manual_offline
  level: product
  rationale: Explains saved data and a visible refresh failure when the operator is offline.
- spec: GITVIEW-SPEC-0048
  scenario: source_success_local_storage_full
  level: mixed
  rationale: Connects a local retention failure to the user's view of successful source data and recovery.
- spec: GITVIEW-SPEC-0048
  scenario: secondary_limit_without_retry_header
  level: technical
  rationale: Specifies retry policy for a particular GitHub rate-limit response.
- spec: GITVIEW-SPEC-0093
  scenario: same_number
  level: product
  rationale: Shows how the operator inspects the intended PR when repository-local numbers coincide.
- spec: GITVIEW-SPEC-0093
  scenario: late_different_object
  level: mixed
  rationale: Connects a late response to preventing wrong-object display and access violations.
- spec: GITVIEW-SPEC-0092
  scenario: checks_and_objects
  level: product
  rationale: Explains why five failing checks can open two PR cards without inventing missing cards.
- spec: GITVIEW-SPEC-0064
  scenario: different_membership_not_one_trend
  level: product
  rationale: Distinguishes a scope change from a decrease in work on a historical chart.
- spec: GITVIEW-SPEC-0025
  scenario: edit_acknowledgement_lost
  level: mixed
  rationale: Connects a lost save acknowledgement to the Project state shown after restart.
- spec: GITVIEW-SPEC-0061
  scenario: success_and_skipped_compact
  level: product
  rationale: Explains how successful and skipped checks remain distinguishable to the operator.
- spec: GITVIEW-SPEC-0061
  scenario: graphql_context_and_run_are_distinct
  level: technical
  rationale: Classifies distinct GitHub source entry types for a check counter.
