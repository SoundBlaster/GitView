acceptance:
- Opening an actionable signal retains its originating Project, condition, unit, period and observation limitations where applicable.
- A signal's unit and the destination's distinct-object unit remain distinguishable; changing data or coverage does not manufacture equality.
- The operator can identify and explicitly change or clear active filter conditions without altering source objects or rewriting the original signal observation.
- Once a signal condition is explicitly changed or cleared, the destination is not presented as though the original condition still applies to all displayed objects.
- Refresh, membership changes, incomplete coverage and access restrictions preserve their own scope and do not silently substitute another Project or period.
- Return uses the actual originating surface, preserving valid context without exposing restricted source details.
specification:
  objective: Make signal-origin navigation and subsequent explicit filter changes understandable across updates without prescribing UI controls.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    origin: At activation capture enough permitted context from the applicable 0119 measurement result to identify the Project or Repository, predicate and metric unit, relevant period or reference, membership basis, coverage or limitation and actual navigation origin. Capture the result's own context rather than assigning the activation time to it. This context identifies what the earlier signal represented; it is not a promise that every underlying object has been loaded or is currently accessible. Restricted facts and revealing counts must not be retained for display solely to explain origin.
    initial_selection: Initialize the destination with the signal's applicable condition and scope, retaining any required lifecycle predicate and event period under 0029, 0047 and 0056. If the destination cannot represent the originating condition or the scope is unknown, identify the limitation and offer a permitted route rather than silently using an unrelated filter or claiming an equivalent list.
    units: Destination cards represent distinct source PRs or Issues under their Repository identities. A signal counted in checks, threads or events can correspond to a different number of cards. A signal already counted in affected PRs or Issues uses that object unit but can still differ after observation or scope changes. A separately identified Issue and its linked PR remain distinct work objects; multiple Project memberships do not create new source identities.
    editable_filters: The operator can inspect and explicitly change or clear active filter conditions using the supported filter interaction. As an agent-authored initial proposal, the signal condition is an identifiable initial selection, not an immutable hidden condition. Once it is removed or changed, label the current selection according to its actual conditions; retaining provenance that the user arrived from a signal must not imply that all current cards still satisfy the original signal. No filter edit changes source data or the historical meaning of the origin.
    no_implicit_reset: Opening an object, returning to its work collection, changing density or accepting unrelated refresh does not silently clear or reapply an explicitly modified filter. Preserve valid selection, period, scope and position under 0024 and 0042. Leaving the destination returns to the actual origin; whether an explicitly modified selection persists after the route itself is closed or across a cold launch is not selected here.
    current_refresh: A refreshed destination may have different objects, values or coverage than the earlier signal. Apply the current applicable condition to current permitted evidence under 0027 and 0089, expose unknown or incomplete portions and retain the origin's own time and scope where display is permitted. Do not force the list to match an old count or treat a changed number as proof of an error or a source mutation.
    uncertainty_portions: Apply 0042's proposed confirmed and needs-verification portions to the destination under its current filter, with collection coverage exposed separately. The earlier signal does not authorize treating uncertain candidates as matches, and a known uncertain candidate does not measure unobserved source population. Clearing or changing the filter reevaluates both portions without changing the historical meaning of the signal.
    coverage_transition: Under 0102, preserve the source-supported scope and reference of a signal separately from the destination's newly evaluated population coverage. A completed but unproven traversal does not transfer its completion time to the earlier signal or establish an exact current list. Where permitted, the operator can inspect observed matching objects and understand the limitation; a complete historical count is not by itself an object-level membership list.
    aggregate_to_selection: The 0119 result and any associated scope or coverage identify the origin measurement, not necessarily its contributing object identities. Initialize the requested predicate without fabricating its members, then independently obtain or reuse allowed normalized object facts and evaluate the destination through the applicable selection contract, including 0110 for Today. If only aggregate evidence is available, offer the permitted signal context and an explicit selection limitation; do not synthesize cards from a count. For a partial origin, distinguish an actual observed subset from unobserved population, and do not present the latter as a known number of missing cards. Destination evidence collected later keeps its own times, coverage and access context; a result with matching numeric count alone does not prove equal object membership.
    membership_and_time: A current Project signal opened after a confirmed membership change follows the current scope and limitations in 0091 without relabeling its old count as current for new members. While a historical event-origin condition remains active, retain its explicit period and stated membership basis under 0056. If the operator explicitly removes that event condition, do not label the resulting selection as the original event set; retain the earlier period only as permitted origin context. Dynamic Today, a historical closure and a current closed-state filter are distinct conditions.
    aged_comment_signal: For the current attention proxy in 0094, retain the origin's 24-hour comment-age condition, thread or affected-PR unit, reference instant, applicable state-observation contexts and coverage. The current work destination can evaluate that same predicate at a later reference instant with currently applicable permitted evidence; it must identify that reevaluation and distinguish it from the origin's prior time and count. An old unresolved-state observation does not become current solely because a comment crosses the threshold. If inputs are insufficient, show permitted uncertainty or a scope limitation rather than forcing equality with the old count. A thread-count origin may open fewer distinct PR cards; neither destination nor origin implies continuous unresolved duration or an unanswered reply.
    aged_comment_history: Opening a historical proxy sample follows its captured predicate version, threshold, reference instant, membership basis and access context under 0097. A saved aggregate alone is not a historical selection of PR identities; when the exact qualifying object set cannot be supported, show the aggregate and an explicit navigation limitation instead of silently opening a current 24-hour filter as its historical contents. A separately labeled current selection may be offered without changing the old sample. If the operator explicitly clears or changes the proxy condition, use editable_filters and do not reapply it merely because the route originated at the historical point.
    privacy: Apply 0036 and 0088 before displaying or announcing any origin detail, count, candidate, target object or shareable link. A later denial may make an earlier signal or target unavailable; do not keep a restricted value visible to maintain numerical continuity or reveal inaccessible object existence. Provide a non-sensitive limitation or recovery route where permitted.
    accessibility: Signal meaning, active conditions, scope, uncertainty, clear or change actions and an available return route must be discoverable without relying solely on color, pinch, long press or transient feedback. Focus follows identity and access rules under 0073; native controls and exact announcements remain open.
    verification: Apply 0040 and 0079 to controlled scenarios for different metric units, filter changes, updated source observations, changed membership, historical event periods and explicit denial. Source mappings and native navigation or accessibility require separate evidence; this contract is not evidence of implemented behavior.
    provenance: Signal-based navigation and explicit filtering derive from the owner's overview direction. Editable signal selection, context retention and update handling are agent-authored proposals requiring UX review.
  scenarios:
    unproven_destination_traversal:
      given: A Project's permitted failed-CI signal has a source-supported count of two affected PRs at T1, and a subsequent destination traversal at T2 has unproven population coverage.
      when: The operator opens the signal and inspects the destination.
      then: The signal retains its T1 context, supported T2 matches may be inspected with their own contexts, and the current list is identified as incomplete or uncertain rather than asserted equal to two or exhaustive at T2.
    partial_signal_with_no_object_identities:
      given: A permitted partial signal reports an observed affected-PR count with its source scope and time, but the supporting aggregate does not establish the contributing PR identities and other Repository coverage is unknown.
      when: The operator activates that signal and no independently supported object-level evidence is available.
      then: The origin remains an attributed partial measurement, the destination explains its selection limitation without invented cards or a number of unseen PRs, and a permitted refresh or return route remains available.
    equal_count_different_objects:
      given: A signal at T1 and a later destination at T2 both report two affected PRs, but the source establishes that one PR recovered and another began failing between observations.
      when: The operator opens the signal after the later evaluation.
      then: The T1 origin and T2 destination keep their own supported contexts and object identities; equal counts are not proof that the two sets are identical.
    linked_issue_and_pr:
      given: A separately identified Issue and its linked PR both satisfy a permitted destination selection with sufficient evidence.
      when: The operator follows an applicable signal to the object collection.
      then: Each qualifying object remains separately represented in its own source identity; their link does not collapse them into one card or manufacture a third object.
    checks_and_objects:
      given: A permitted Project signal counts five failed checks across two distinct PRs under the same complete observation context.
      when: The operator opens it without intervening source changes.
      then: The destination identifies the failure condition and two PR cards without claiming five PRs or that three cards are missing.
    clear_signal_condition:
      given: The operator opened a failed-CI Project signal and its failure condition is identifiable as active in the destination.
      when: The operator explicitly clears that condition.
      then: The resulting collection reflects its remaining actual scope and filters and is not labeled as though every displayed PR has failed CI; the earlier signal remains attributable to its original observation.
    refresh_changes_result:
      given: A signal described two affected PRs at T1 and a later sufficiently supported observation at T2 shows one affected PR.
      when: The destination is displayed after T2.
      then: The current selection may show one while the earlier count retains T1 context; no error or missing card is inferred solely from the difference.
    unknown_filter_input:
      given: A signal opens the failed-CI selection and one permitted PR's applicable check result is unobserved.
      when: The destination is evaluated.
      then: The PR is available through the permitted uncertain portion or equivalent path, not counted as a confirmed failure or silently treated as healthy.
    historical_origin:
      given: An Issue closed in a selected past period and is now independently observed open.
      when: The operator opens the period's distinct-Issue closure signal and then explicitly applies a current-closed filter.
      then: The period condition remains identifiable, the Issue is excluded only by the explicit current-state filter and the historical event is unchanged.
    clear_historical_condition:
      given: The operator opened a historical closure selection with a specific period and membership basis.
      when: The operator explicitly removes the historical closure condition.
      then: The resulting collection is not labeled as the original closure-event selection; the prior period remains available only as permitted origin context and no event is altered.
    denial_after_tap:
      given: A signal and one target PR were permitted when the operator activated the signal.
      when: Explicit source denial restricts the PR's identity and revealing counts before the destination is presented.
      then: Restricted facts do not appear in visual or app-controlled accessible output, and an allowed general limitation or recovery path remains.
    aged_comment_reevaluated:
      given: At T1 a Project signal counts two qualifying threads on one PR; at T2 one thread is confirmed resolved and the other remains applicable and unresolved with its qualifying comment.
      when: The operator opens the current signal and the destination is evaluated at T2.
      then: The origin remains attributable to two threads at T1, while the destination can show one currently qualifying thread on one PR at T2; the differing count is not described as a missing PR or an application error.
    aged_comment_clock_without_state:
      given: A PR and its thread were last observed open and unresolved when a submitted comment was 23 hours old; no later state observation is available.
      when: The comment crosses the 24-hour threshold and the signal destination is evaluated.
      then: The elapsed comment age can be known, but the thread is not asserted to be confirmed unresolved now solely from the older state; current matching or coverage remains uncertain.
    historical_aged_comment_aggregate:
      given: A permitted historical proxy point records two qualifying threads but no independently supported PR identities or per-thread facts for that point.
      when: The operator attempts to open the contributing PRs.
      then: The earlier aggregate retains its time and units and an explicit selection limitation is shown; a current live filter is not substituted and labeled as the past PR set.
  unresolved:
  - Exact native presentation of origin, edited filters and differing observation times requires UX and accessibility evaluation.
  - Source-specific completeness and applicability of CI, review, linked-Issue and historical predicates remain unverified.
  - No application, native navigation, source or privacy scenario has been executed.
