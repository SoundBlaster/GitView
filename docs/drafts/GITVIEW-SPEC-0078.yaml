acceptance:
- Issue links retain their observed type, direction, source context and independent coverage without inferring motive or actor actions.
- A partial or inaccessible relationship collection is not represented as a confirmed empty collection or as a complete set.
- Direct sub-Issue totals and closed totals count distinct eligible direct children, not grandchildren, and do not imply completed work.
- Identifiable permitted relationships can remain visible with their own limitations without exposing restricted linked objects or derived private details.
- A linked object outside a GitView Project does not become a Project member and is never replaced by a same-numbered object from another Repository.
specification:
  objective: Specify observable Issue relationship and direct-child summary behavior under partial observations and unequal source access.
  ontology_refs:
  - gitview:Issue
  - gitview:PullRequest
  - gitview:Repository
  - gitview:Project
  contract:
    relationship_kinds: Treat a source-reported PR mention, explicit closing connection, parent, direct child, blocked-by and blocking connection as distinct directional source facts when the source establishes each meaning. An object pair may have more than one independently supported source-link kind; do not collapse them into one generic cause or invent a reciprocal link merely from its inverse without the applicable source semantics. Source links do not establish an Ontology actor-action relation or a particular actor's motive.
    ontology_link_boundary: The working package places several Issue and PR domain-range links in its relations section. In the owner's narrower terminology, an actor-action-derived relation needs an actor, action and supported arising property; merely observing a source link or resolving its ontology declaration does not establish those facts. A source event can support only its own attributable action and context, without automatically establishing a code-changing action or motive. This distinction does not require GitView to display individual event histories or create new domain entities.
    graphql_dependency_candidates: GitHub describes `Issue.blockedBy` as Issues that block the selected Issue and `Issue.blocking` as Issues blocked by it. A successfully interpreted, identity-associated eligible edge can therefore support its corresponding directed source relation in that field's captured context. An accessible related Issue, its current lifecycle and the relation are separately supported facts; an edge alone does not prove that the blocker is currently open. Each connection retains its own arguments, pages, errors, access and coverage. A failed non-null field can propagate an error to its parent according to the actual GraphQL response; do not assume a usable sibling or a confirmed empty connection when the parent is absent. Neither field is a claim of complete relation history or a reason for an actor's work.
    dependency_events: GitHub documents separate timeline events for adding and removing blocked-by and blocking relationships. An event may identify the actor who changed the relationship, its direction, target and time when those fields are available and permitted; its actor and target are nullable. This is evidence about that relationship change, not automatically evidence of the actor changing code, the actor's motive, an Issue causing a PR, or the relationship's current existence. Reconstructing a current relationship from events requires independently sufficient history, ordering, identity, scope and access evidence. A missing event or nullable actor does not establish that no action or actor existed. GitView need not retrieve or display these events in the first version.
    current_parent: The GitHub Issue parent field represents at most one current direct parent in its source context; a sub-issue collection describes direct children of its selected parent. A relationship observed at an earlier time does not establish that the same parent is current after a possible reassignment. When two incompatible parent observations cannot be ordered or otherwise reconciled under 0053, preserve the conflict rather than assert two simultaneous current parents or choose by response arrival. Source parent cardinality does not turn a failed, omitted, restricted or error-bearing parent response into confirmed absence.
    hierarchy_evidence: When source semantics and compatible identity, scope, access and timing evidence establish that B is a direct child of A, that relationship has the inverse interpretation that A is B's direct parent. A separately fetched child list and parent field can nevertheless be partial, inaccessible, stale or conflicting; no independent successful fetch, matching count or currently complete inverse collection follows merely from the relationship. Do not infer a transitive direct-child relationship from a longer chain.
    identity_and_scope: Resolve each endpoint by its confirmed source identity and Repository context. A repository-local number or a matching title is not global identity, and uncertain correspondence cannot be silently deduplicated. A linked object in a Repository outside the current Project does not change membership or automatically broaden the active work selection.
    evidence: Attribute every relationship collection to the source object, relation kind and direction, observed scope, time, coverage and access context. A known positive link and its target's separately observed state are different facts and may have different freshness. Missing, omitted, null-like error-bearing or partial data is not an empty set. A confirmed absence requires sufficient source evidence for that specific relationship kind and scope.
    closing_pr_scope: GitHub documents that Issue.closedByPullRequestsReferences excludes closed PRs by default unless requested otherwise. A result obtained with that default may support applicable open-PR observations but cannot establish an exhaustive all-lifecycle set of related PRs. Even an expanded result needs independently sufficient identity, relationship-type, access and collection coverage; it does not by itself establish every mention or actor motive.
    closing_pr_arguments: GitHub also documents `excludeUserLinked` and `userLinkedOnly` arguments on that connection. Record their effective values with `includeClosedPrs` and other applicable query, identity, pagination and access context. A source observation excluding manually linked PRs, or limited to them, cannot alone establish the full connection across both modes; requesting closed PRs does not undo a separate manual-link filter. A returned permitted object is evidence only for the semantics supported by that actual connection and arguments, not a comprehensive history or guarantee of a future closure. Defaults and whether a caller explicitly chose an argument must not be silently changed when interpreting an earlier result.
    closing_keyword_context: GitHub documents both manually linked PRs and description keywords, with keyword interpretation depending on the PR targeting the default branch. An authored string resembling a closing keyword is a source-text observation, not by itself proof that GitHub recognized a current closing association or that a merge will close the Issue. Preserve the actual supported link meaning, target and branch context; if recognition or applicability cannot be established, show only the permitted source text or a limited unconfirmed reference. A target-branch change or a newer body requires independent reevaluation of an earlier claim rather than silently transferring it.
    commit_message_limit: GitHub documents that a closing keyword in a commit message can close an Issue on merge into the default branch without listing the containing PR as a linked PR. Consequently an Issue's observed closing-PR connection is not an exhaustive list of every commit-based path to closure, and absence from that connection is not proof that no commit refers to the Issue. This distinction does not require GitView to display commit details or infer a future closure from a commit message.
    link_label_and_target: A source-confirmed reference, a source-confirmed closing association and a candidate text mention have distinct labels and evidence; the source field's name alone is not evidence of an actual future merge, closure, branch context or complete relation history. Show a confirmed relation only to the extent that its source semantics support that label. If target identity or access is unavailable, do not fabricate an openable target, a permitted count or a same-number substitute; preserve any separately permitted source text without identifying a restricted destination.
    access: Check current eligibility separately for the source Issue, the existence and type of a link, the target identity and its individual fields. A permitted Issue does not automatically authorize exposing a private target, even if a prior response mentioned it. Do not reveal restricted identity, link existence, title, URL or a derived count where that fact is restricted. If a permitted incomplete or unavailable indication can be shown without revealing a restricted fact, use it; otherwise use an access-safe general status. This does not assert that GitHub supplies a distinct permission signal for each fact.
    known_subset: Permitted and source-supported known links can be presented with their own time and incomplete coverage when other links are unavailable. An observed subset is not the complete current collection merely because its retrieval succeeded, and it is not automatically a current lower bound when observations are stale or incompatible. Do not display a source-provided total that reveals restricted inputs.
    direct_children: A direct sub-Issue counter concerns distinct source-confirmed immediate children of the selected Issue only. A separate closed-direct-child counter requires known child lifecycle and sufficient association and identity evidence. Grandchildren do not become direct children, and closed state is not proof of successful completion. Unknown child state is not open or closed by default; no percentage of work completed follows from the two counts.
    count_evidence: A source-provided aggregate may support a count without enumerating every child only when its documented population, access and semantics match the stated metric and its use is permitted. Enumeration can support an exact count only with sufficient coverage and stable identities. Partial lists, unknown identity, mixed observation times or missing child states cannot establish a complete exact current total unless independent source evidence establishes it. A visible subset and source aggregate are not automatically additive.
    link_change: A later complete sufficiently comparable observation may establish that a link is absent in its own scope; an omitted field, unavailable target or partial response does not by itself remove a prior link. Conflicting or unorderable observations follow 0053, and old permitted facts retain their original context rather than being labeled current from an unrelated title refresh.
    navigation: A permitted linked object or source URL can be opened through an explicitly identifiable route where available, following 0024 and 0033. Preserve its source identity and distinguish the originating Project from any external Repository; if the target or URL is unavailable, do not fabricate one, silently open another object, or infer removal from a 404 alone. Return preserves the valid original Issue context or reports an origin change under 0024.
    related_object_route: As an agent-authored first-version navigation proposal, an explicit in-app open of an eligible linked Issue or PR creates a target-object route whose origin is the actual source-object route and whose target retains its own confirmed source Repository identity. The originating Project is navigation context only; it does not confer target access, establish target membership or change the current Project-wide selection. Target identity, the relationship and each target field require their own applicable evidence and disclosure checks. A separately eligible GitHub URL can instead use the platform handoff under 0033; launching that handler is not proof of loading the intended target. No implicit opening, Project creation or membership edit follows merely from observing a link.
    related_open_admission: Before an in-app target route commits, revalidate that the originating route and requested target identity remain applicable and that the relationship reference and target content are eligible for the intended disclosure. An old observed relationship may be offered as last known only with its actual context when policy permits; it is not presented as source-confirmed current merely because the target remains accessible. If current evidence confirms removal of the relationship before admission, do not represent the old link as current or silently redirect to another endpoint. An explicit separately permitted target-open action may still be offered with the changed relationship explained; otherwise remain in the source context. If the source route was closed, target identity is unresolved or access is denied, do not commit its old pending action or fabricate a substitute. Dismissal of a system control as part of accepting an action is not by itself cancellation under 0031.
    relationship_changes_after_open: Once an eligible target route is committed, a later removal, conflict or loss of evidence for the relationship does not itself change the target's identity, prove source-object deletion or automatically close an otherwise permitted target. Update or withdraw the relationship claim according to its own current evidence and disclosure policy, then return to the actual originating object route if that route remains valid. If the target becomes restricted, apply access immediately even if the source and relationship remain permitted. If the originating Project or source object is no longer valid on return, use 0024's changed-origin or safe recovery behavior rather than selecting a different Project containing the target.
    target_source_action: An explicit source open or share from a committed target overview uses the target's independently eligible link and access context under 0033 and 0121, not the originating object's link. A change to the relationship alone does not establish target denial; restricted origin or relationship details are withheld independently, including from app-controlled sharing metadata. Handoff does not create Project membership or verify a recipient's access.
    graphql_relationship_query_candidates: The accompanying five statically schema-checked examples separately request parent, direct children, blocked-by, blocking and closing PR references. They preserve source and target identity witnesses and independent page and access contexts; closing-reference arguments explicitly include closed PRs without choosing either manual-link-only restriction. A connection does not enumerate mentions, prove a future closure or an actor motive, or establish permission, source completeness or simultaneous snapshot. Do not expose an inaccessible target or reveal its existence merely to explain incomplete coverage.
    graphql_cross_reference_candidate: A usable, permitted GitHub CrossReferencedEvent supplies source and target Issue-or-PR subjects, event identity and source-reported reference and event times; interpret its actual typed endpoints and source-supported association rather than assuming the timeline parent made the reference. Preserve `willCloseTarget` as an event-context source value without promoting it to an observed merge or closure. A reference event is not proof of current body text, a current closing link, every mention, a specific actor motive or complete history. The accompanying query examples are statically schema-checked candidates only; access and actual event semantics require live verification.
    provenance: The owner selected related PRs, hierarchy and blocking directions. The detailed coverage, identity and access rules are agent-authored refinements; the exact source permissions, relationship mapping and UI remain to be verified.
  scenarios:
    graphql_dependency_direction:
      given: A usable GraphQL observation of Issue A returns Issue B in A's `blocking` connection, while A's `blockedBy` connection is unobserved.
      when: GitView prepares A's related-work view and blocked-Issue predicate.
      then: The supported fact is that A blocks B; B is not inferred to block A, the unobserved blocked-by scope is not called empty, and neither Issue's open state is invented from the relation.
    filtered_closing_connection:
      given: An Issue's closing PR connection is successfully observed with `includeClosedPrs` enabled and `excludeUserLinked` enabled; manually linked PRs have no separately sufficient observation.
      when: GitView reports related-PR coverage for all lifecycle and link modes.
      then: Returned permitted links retain their actual argument scope, but the combined manual-and-other relation set is not claimed complete or empty merely because closed PRs were included.
    dependency_event_then_removal:
      given: A permitted source timeline reports that actor A added a blocked-by connection at T1 and removed the same connection at T2, with compatible identity and ordering, while no later current-relationship observation is available.
      when: GitView evaluates historical evidence for the link and the current blocked-Issue signal.
      then: The two events remain distinct evidence of relationship changes; the T1 addition alone does not establish a current link, an open blocker, code changes by A or A's motive. Current state requires sufficient later or complete historical evidence and otherwise remains uncertain.
    dependency_event_missing_actor:
      given: A source-confirmed dependency-change event is visible but its nullable actor or target field is unavailable.
      when: Its supported meaning is considered.
      then: GitView does not invent an actor or target, infer motive, or conclude that the corresponding actor or target never existed.
    parent_reassigned:
      given: Issue C was observed with parent A at T1 and is later source-confirmed with parent B at T2, with ordering and applicable identity established.
      when: The current parent is displayed.
      then: B is the current observed parent, the older A observation retains its own context, and the app does not claim that A and B are simultaneously current parents.
    parent_conflict:
      given: Two otherwise compatible observations associate the same Issue C with different parents A and B but provide no sufficient ordering evidence.
      when: The current parent is requested.
      then: The parent is conflicted or uncertain, neither observation is selected by arrival order, and the result is not presented as two confirmed simultaneous current parents.
    parent_inaccessible:
      given: Retrieval of an Issue's parent is omitted, restricted or fails without sufficient independent evidence of absence.
      when: Its hierarchy is shown.
      then: The current parent is unknown or unavailable rather than confirmed absent.
    two_relationship_types:
      given: A source Issue has independently confirmed mention and closing connections to the same PR.
      when: Related work is displayed.
      then: Both supported meanings can be identified for that PR without treating either as proof of merge or the actor's motive.
    keyword_on_nondefault_branch:
      given: A PR description contains a closing keyword for an Issue, but source evidence establishes that the PR targets a non-default branch and no independently supported closing association is observed.
      when: GitView displays the permitted description and related-work section.
      then: The authored text can remain visible, but the keyword alone is not promoted to a confirmed active closing association or a promise that merging this PR closes the Issue.
    commit_closes_without_linked_pr:
      given: A commit-message keyword is applicable to an Issue under GitHub's documented rules, but the associated PR is not returned as a linked PR.
      when: GitView presents the observed Issue links.
      then: Absence from the PR connection is not reported as proof that no commit can close the Issue or that every relevant source reference was enumerated; GitView does not invent an unobserved PR link.
    removed_target_access:
      given: An accessible Issue has a previously permitted closing association whose private PR target and link existence are now restricted.
      when: The Issue's related-work section is opened or announced.
      then: Restricted identity, association and revealing counts are withheld without describing the relation as absent; an access-safe general limitation is offered where permitted.
    incomplete_children:
      given: Two distinct permitted direct children are observed, one closed and one with unknown lifecycle, and the relationship collection is incomplete.
      when: Direct-child metrics are displayed.
      then: The known observations retain their coverage; neither two total nor one closed is claimed as the complete current count, and the unknown child is not classified as open.
    grandchild:
      given: Issue A has direct child B and B has direct child C, each relationship sufficiently observed.
      when: A's direct-child count is evaluated.
      then: B contributes once, C does not contribute solely through B, and the result does not express a completion percentage.
    restricted_target:
      given: An accessible Issue previously had a known connection to a private linked PR but the relevant link and target facts are now restricted by applicable access policy.
      when: The Issue overview is displayed.
      then: Restricted identity, URL, link fact and revealing counts are not exposed; no confirmed empty relationship collection is invented and an access-safe limitation can be discovered.
    outside_project:
      given: Issue A belongs to Project P and has a permitted direct blocker in Repository B outside P.
      when: The blocker is inspected through an available route.
      then: Its own source context is retained, B is not silently added to P and returning preserves A's valid originating context.
    target_access_during_link_open:
      given: A permitted Issue A in Project P displays a link to PR B in a Repository outside P, and an in-app open of B is pending.
      when: B's identity and existence become explicitly restricted before the target route commits.
      then: The restricted target is not rendered or announced and no same-number substitute is opened; a safe limitation is provided where allowed, while A's Project membership remains unchanged.
    link_removed_after_target_open:
      given: An eligible target PR B outside P is already open from Issue A through a previously supported closing link.
      when: A later comparable observation confirms that the link was removed while both objects remain permitted.
      then: B remains the same open target if still eligible, the old link is not labeled current, and returning goes to A's actual valid route without adding B's Repository to P or claiming either object was deleted.
    stale_link_removed_before_open:
      given: A permitted related-object link was shown from Issue A, but a sufficiently comparable observation confirms its removal before an in-app open is admitted and the target remains independently accessible.
      when: The pending link action is evaluated.
      then: GitView does not represent the link as current or invent another target; it may offer a separately explicit permitted target-open action with the changed link context.
    omitted_link_refresh:
      given: Closing PR links were observed at T1 and a later Issue response at T2 contains only a changed title.
      when: Related work is displayed.
      then: Permitted T1 link evidence retains its own context or is unavailable; the T2 title does not prove those links were refreshed or removed.
    closed_prs_outside_default:
      given: A source Issue-to-PR connection was read with its documented default excluding closed PRs, while GitView is describing related PRs without an open-only limitation.
      when: Relationship coverage is presented.
      then: Supported open-PR links retain their context, but the all-lifecycle relation set is incomplete unless separately sufficient evidence covers omitted closed PRs.
  unresolved:
  - Source-specific relationship types, directionality, per-field access, pagination and aggregate semantics need documented and real-source evidence.
  - Exact UI for related objects, restricted facts and returning from an external Repository needs accessibility and native evaluation.
  - Individual source dependency events can provide limited actor and relationship-change evidence; complete historical membership, sufficient event ordering and the motive or code-changing action are not established by the current source links or by an isolated event.
