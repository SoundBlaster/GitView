acceptance:
- Completed lifecycle outcomes, a PR's draft stage and review or CI signals are identifiable as distinct facts with their own evidence.
- A discoverable first-version open non-draft PR filter is named by its actual predicate and is not described as a request to the operator, approved work or merge readiness.
- Missing, stale, restricted or incompatible lifecycle and draft inputs do not create a confirmed stage, completed outcome or zero count.
- Any selection or count preserves its scope, observation context, coverage and current access; it does not change GitHub data.
- A merge-readiness decision remains unspecified until its subject, governing rules, permissions and source evidence have a separate contract.
specification:
  objective: Give the initial request to see what is ready a bounded, inspectable interpretation while keeping unestablished merge eligibility explicit.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    distinction: The owner asked what is ready without separately defining review readiness, completion or merge eligibility. As an agent-authored candidate, first expose established lifecycle outcomes and a narrowly named PR review-stage selection; this supports useful inspection without declaring that it fully resolves the owner's broader ready-work need. These are properties or selection predicates over existing objects, not new ontology entities or actor actions.
    completion: Show a source-confirmed merged PR as merged, a PR closed without merge as closed without merge, and an Issue as closed with an applicable reason when supported. A closed Issue without a supported completed reason is not called successfully completed; an unobserved or conflicting lifecycle is not relabeled as an outcome. This current lifecycle is distinct from an event occurring in a selected interval under 0057 and 0056. Do not equate closed PRs or linked Issues with independent completed tasks.
    review_stage: As an agent-authored working first-version direction, offer a discoverable explicitly identified open non-draft PR filter within the Project or Repository work selection. The condition is true only when applicable permitted evidence for the same PR and requested context establishes open lifecycle and draft false. A supported draft PR or a supported non-open PR is a known non-match for this condition, while insufficient evidence remains unknown except where an independently supported false condition decides the conjunction. A closed PR is not a current review-stage match even if its last observed draft flag was false. Selection is based on individual applicable source observations, not on the existence of a review request or a later unrelated title update.
    naming: Identify this condition as open non-draft PRs or an equally precise localized label with its meaning reachable; do not use the unqualified label ready as a proxy. Non-draft describes the source stage, not proof that a particular reviewer was requested, the operator must act, review is complete, checks passed, all changes are complete or the PR can be merged. GitHub documents marking a draft ready for review as a stage change; the converse product predicate here is a narrow agent-authored selection over observed open and draft fields, not a promise that every non-draft PR needs a new review.
    stage_inputs: The caller supplies stable source PR identity, applicable current access, Project or Repository scope, sufficiently current and mutually applicable lifecycle and draft facts, and each fact's provenance and observation context. A null, missing, error-affected, restricted, stale or otherwise inapplicable draft fact is unknown rather than false. A newly observed lifecycle alone does not make an older draft observation applicable; no source-wide atomic snapshot is assumed. The exact source-to-domain mappings and applicability evidence remain open under 0041 and 0089.
    counts_and_filters: If offered as a Project or Repository summary, count distinct confirmed matching PR identities within the stated selection and scope under 0057 and 0119. A safely presentable observed subset is visibly qualified; an unknown candidate or unobserved population cannot be converted to zero or a fabricated number of missing PRs. Opening the count independently evaluates the same named condition with current facts, selection scope and coverage under 0092 and 0110, so the later destination need not equal the origin. Until the destination can represent this condition, show its limitation rather than substitute review-requested or approved PRs. The filter is a working first-version direction; a separate summary count or graph remains optional and is not a claim that the count is available from GitHub as a single field.
    merge_readiness_boundary: Do not infer merge readiness from non-draft, an approval, zero unresolved threads or all observed checks succeeding, alone or combined. GitHub branch protections can include required reviews, specific checks, conversation resolution, deployments and a merge queue; actor permissions and applicability may also matter. A later explicitly scoped source-backed eligibility feature needs its own documented meaning, requested actor and source mappings. Do not infer that these examples are an exhaustive or universally applicable ruleset, and do not represent lack of those inputs as a positive or negative merge decision.
    experience: Make the explicitly named filter discoverable alongside the other work filters without enabling it by default; the ordinary Today view continues to include draft and completed work under 0007. Applying it retains the active Project or Repository scope, Today context and density, makes the condition identifiable, and changes neither the source nor stored object state. Clearing it removes only this condition while preserving other active filters, day and membership; a separate clear-all action follows 0092 and 0110. Preview and PR overview may show established lifecycle and draft status without forcing the filter into a compact cell. The filter and its limitation are operable without color or long press under 0032 and 0042. Reassess access before presentation; restricted facts and revealing counts remain withheld. Exact native control remains open.
    verification: Specify deterministic decision examples for known non-draft, draft, merged, missing draft, differing observation contexts and partial population, and separately evaluate source mapping, permissions, usability and native presentation. These are expectations, not executed app tests or evidence that the proposed label answers the owner's whole question.
    provenance: Completion visibility and the initial ready-work question come from the owner; the non-draft selection, its label and availability as a potential summary are agent-authored candidates. No GitHub source setting, PR, issue or repository is modified.
  scenarios:
    first_entry_and_explicit_filter:
      given: A Project's ordinary Today view contains a confirmed open non-draft PR, an open draft PR and a same-day merged PR, with the default filters unchanged and all three independently permitted.
      when: The operator explicitly selects the open non-draft PR filter and then clears it.
      then: Before filtering all three remain in the unfiltered selection; while active the confirmed non-draft PR matches and the other two do not. Clearing the filter restores the ordinary applicable Today selection without changing Project, day, density or GitHub objects. The filter does not claim approval, review assignment or merge eligibility.
    non_draft_not_mergeable_claim:
      given: A permitted PR has applicable open lifecycle and draft false; its required branch rules and actor permissions are unobserved.
      when: The review-stage condition is evaluated.
      then: It is an open non-draft match while merge eligibility remains unknown; no approval, requested reviewer or passing CI is inferred.
    known_draft:
      given: A permitted PR is open and has an applicable draft true observation.
      when: The open non-draft condition is evaluated.
      then: It is a confirmed non-match and its draft state remains inspectable without claiming a review request or CI failure.
    unknown_draft:
      given: A permitted PR is open but its applicable draft field was not observed.
      when: The open non-draft condition is evaluated.
      then: The candidate remains uncertain rather than confirmed non-draft or excluded solely due to the missing field; population coverage remains separately attributed.
    merged_with_old_draft:
      given: A PR is currently confirmed merged and an earlier permitted observation said draft false.
      when: Its current review-stage condition and lifecycle are presented.
      then: Merged remains an identifiable outcome, the PR is a confirmed non-match for open non-draft, and the old draft fact is not promoted to a current stage.
    old_draft_new_lifecycle:
      given: An older draft-false observation and a newer open-lifecycle observation are permitted, but there is no evidence that the draft observation applies in the newer context.
      when: A current open non-draft count is prepared.
      then: That PR is not asserted as a confirmed match and the affected count retains its appropriate limitation; the older observation can remain explicitly last known.
    partial_project:
      given: Project P has members A and B; one A PR is confirmed open and non-draft, another eligible A PR has unknown draft, and B's relevant PR population is unobserved.
      when: The operator inspects an offered candidate stage count and opens its selection.
      then: One may be presented as a qualified observed subset, the identified uncertain PR is inspectable as uncertain where permitted, and B's missing population is a separate coverage limitation rather than zero or a known missing-card count.
    closed_issue_unknown_reason:
      given: An Issue is confirmed closed but the reason at the applicable closure is unavailable.
      when: Its outcome is shown.
      then: It is identifiable as closed without asserting completed work or synthesizing a closure reason.
  unresolved:
  - Evaluate the discoverability and usefulness of this working first-version filter in native UX; whether it addresses the owner's broader intended ready-work view remains unconfirmed.
  - Establish GitHub source mapping, observation applicability, permission and partial-coverage semantics for lifecycle and draft before claiming a current selection.
  - Define a separately justified merge-eligibility product scope if needed; no decision procedure or merge action is specified here.
