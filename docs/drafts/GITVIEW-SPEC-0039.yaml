id: GITVIEW-SPEC-0039
title: GitView - Issue state, links and discussion counters
kind: spec
created_at: '2026-11-14T13:47:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0009
depends_on:
- GITVIEW-SPEC-0002
- GITVIEW-SPEC-0026
- GITVIEW-SPEC-0034
- GITVIEW-SPEC-0044
sources:
  parent: docs/drafts/GITVIEW-SPEC-0009.yaml
  selected_fields: docs/drafts/issue-ontology-options.md
  autonomy: conversation:gitview/excerpt-77
acceptance:
- An Issue is identified in its source Repository and presents selected available identity, state, description and participant fields without inventing missing values.
- Closure state and source reason remain distinct, and a closed Issue is not automatically described as successfully completed.
- Explicit closing links, mentions, parent or child links and blockers retain their different source meanings without inferring an actor's motive.
- Discussion and direct-sub-issue counters use distinct units; unknown or partial values are not zero or a completion percentage.
specification:
  objective: Show the selected Issue overview and its observed relationships without inventing causes, completion or missing details.
  ontology_refs:
  - gitview:Issue
  - gitview:Repository
  - gitview:PullRequest
  contract:
    identity: A source Issue is identified in its Repository context by available source identity and repository-local number. Two Issues with the same number in different Repositories remain distinct. Title, source URL and body are exposed when observed; missing is not an invented value.
    lifecycle: Show source open or closed state and separately show the reason if supplied. A closed state with unknown or non-completion reason does not establish successful completion. Source Issue type and labels are distinct characteristics; GitView Project is not GitHub Projects state.
    participants: Author and assignees are source roles. An assignee is not proof that work has begun, and author or assignee does not automatically identify the GitView User, a coding agent or the actor behind a change.
    links: Preserve source distinctions among an explicit closing PR reference, mention, direct parent or sub-issue and blocking links when known. A mention alone is not a closing link; a closing link is not proof of merge, issue completion or an actor's motive. Unknown relationships and partial lists are not asserted empty.
    milestone: Show the source milestone reference when available without introducing a separate GitView domain identity or inferring completion.
    discussion: Show comment and participant counts as distinct units when observed. Issue comments are not PR review threads; no unresolved-review-thread count is fabricated for an Issue. A known zero is distinct from missing or incomplete count data.
    direct_children: Show total direct sub-issues and closed direct sub-issues as separate counts when available. These are not transitive descendants and their ratio is not a percentage of completed work; closed children can have different source reasons.
    timestamps: Creation, update, closure, last comment and observation times have different meanings. A source update time is not automatically a last-comment time; an unavailable time remains unknown.
    partial_fields: Apply the field evidence and refresh rules in 0044 independently to state, reason, participants, links, counters and body. A newer title or state observation does not make omitted links, counts or description current. Preserve previously accepted permitted facts with their own context or indicate unavailability; a null-like error or omitted association is not automatically a known empty set.
    description: Structured sections follow 0034. Authored motivation remains a statement, not proof of an actor's motive or observed result.
    provenance: The selected fields and role distinctions follow the owner's accepted Issue field set; the detailed unknown and evidence handling are agent-authored refinements.
  scenarios:
    reason_unknown:
      given: An Issue is known closed and the closure reason is unavailable.
      when: Its overview is shown.
      then: Closure is shown and successful completion is not asserted.
    distinct_links:
      given: An Issue mentions PR A and has an explicit closing reference to PR B.
      when: Related work is presented.
      then: A and B retain their different link meanings and no actor motive is inferred.
    child_counts:
      given: An Issue has four directly observed children, two closed with unknown reasons, and additional grandchildren.
      when: Direct-child counters are shown.
      then: The counters are four total and two closed, exclude grandchildren and do not claim 50 percent of work is complete.
    discussion_unknown:
      given: An Issue's comment count is unavailable while its participant count is known.
      when: Discussion metrics are shown.
      then: The participant count remains available and the comment count is unknown, not zero.
    partial_title_and_links:
      given: An Issue's closing links and discussion counts were observed at T1, and a later response at T2 supplies its new title but omits those fields.
      when: The Issue overview is displayed.
      then: The title can use T2 while the earlier permitted links and counts keep their T1 context or are shown unavailable; GitView does not clear them or claim they were refreshed at T2.
    partial_children:
      given: Two direct sub-issues are observed but the source does not establish that all direct sub-issues were returned.
      when: The Issue's direct-sub-issue summary is shown.
      then: The observed contribution can be presented with incomplete coverage, without asserting two is the complete total or inferring a completion percentage.
  unresolved:
  - Source availability and exact mapping for direct hierarchy, blocking links, participants and last-comment time require source-specific verification.
  - Display priority, paging of related objects and treatment of ambiguous source links require product refinement.
