acceptance:
- An Issue is identified in its source Repository and presents selected available identity, state, description and participant fields without inventing missing values.
- Closure state and source reason remain distinct, and a closed Issue is not automatically described as successfully completed.
- Explicit closing links, mentions, parent or child links and blockers retain their different source meanings without inferring an actor's motive.
- Discussion and direct-sub-issue counters use distinct units; unknown or partial values are not zero or a completion percentage.
- The operator can inspect each permitted, available selected Issue field from the same Issue overview, including fields omitted from the cell or preview.
specification:
  objective: Show the selected Issue overview and its observed relationships without inventing causes, completion or missing details.
  ontology_refs:
  - gitview:Issue
  - gitview:Repository
  - gitview:PullRequest
  contract:
    identity: A source Issue is identified in its Repository context by available source identity and repository-local number. Two Issues with the same number in different Repositories remain distinct. Title, source URL and body are exposed when observed; missing is not an invented value.
    lifecycle: Show source open or closed state and separately show the reason if supplied. A closed state with unknown or non-completion reason does not establish successful completion. Source Issue type and labels are distinct characteristics; GitView Project is not GitHub Projects state.
    participants: Author and assignees are source roles. An assignee is not proof that work has begun, and author or assignee does not automatically identify the GitView User, a coding agent or the actor behind a change.
    inspect_selected: Make the owner's selected permitted Issue facts inspectable within the Issue overview without requiring them all to fit simultaneously. These include source ID and repository-local number, title, original description, available source link, lifecycle and source reason, labels and type, source Repository, author and assignees; available related PRs with their source-supported link meaning, direct parent and children, blocked-by and blocking relationships and milestone; comment and discussion-participant counters, direct-sub-issue total and closed counters; and creation, update, closure, last-comment and relevant observation times. An expandable section or equivalent accessible route may expose less prominent facts. Source opening or sharing follows 0033; already available selected Issue facts are not accessible only by leaving GitView.
    initial_overview_presentation: As an agent-authored first-version presentation proposal, put the permitted title, Repository context and local number at the top of the in-app overview, followed by its supported open or closed lifecycle and separately available reason, type or labels. Make the permitted authored description or its original-text excerpt reachable near that context; an excerpt offers access to the original body under 0034. Present independently supported discussion and direct-sub-Issue counters, author and assignees, typed relationships, milestone and times in identified sections or equivalent standard native arrangements below or through accessible disclosure controls. Make unavailable, partial and restricted groups distinguishable where safely discloseable, without inventing an empty relationship or zero count. The source-opening and Share actions remain separate under 0033; linked targets use their own eligible identity and access. Adapt to text size and available space without making color, long press or a custom component necessary. Exact native controls, secondary field order and source-text rendering remain subject to platform and UX evaluation.
    selected_relationships: When permitted, the available known endpoints and source-supported meanings for the selected relationships are inspectable under 0078, not replaced solely by a count. Partial collections and unavailable targets retain their own coverage, identity and access limits. A relationship or target outside the originating Project does not make that Repository a member or silently widen the Project selection. A permitted target or eligible source link may be opened under 0078 and 0033 without inventing a destination.
    initial_relationship_presentation: As an agent-authored first-version proposal, make related work reachable from the Issue overview in an identified section or accessible disclosure. Identify each permitted known target by its available title, Repository context and local number, and identify each supported relationship meaning and direction in text or an equivalent accessible label; distinguish a closing PR, mention, parent, direct child, blocked-by and blocking without relying on color or position alone. When the same target has multiple supported meanings, make each meaning discoverable without presenting it as multiple different objects. Label an unknown relationship as such rather than guessing. Show a safely disclosable coverage or freshness limitation with the affected group when applicable; distinguish an evidenced empty group from a partial or unavailable group. Open an eligible target through an explicit action under 0078, with the target's own identity and access; source opening remains separate. A restricted target or even the fact of a relationship is withheld when disclosure is not permitted. Exact grouping, ordering, pagination and native controls remain open.
    compact_and_bounds: A cell or static preview may omit selected details for space; opening the same Issue through an accessible route makes them and their availability inspectable. Selected discussion fields are counters and a last-comment time, not a requirement to expose individual comments, participant lists or PR review threads. The available original body remains reachable under 0034 when an excerpt or structured section is shown; missing and restricted facts are not asserted to be empty.
    links: Preserve source distinctions among an explicit closing PR reference, mention, direct parent or sub-issue and blocking links when known. A mention alone is not a closing link; a closing link is not proof of merge, issue completion or an actor's motive. Unknown relationships and partial lists are not asserted empty.
    source_issue_representation: GitHub REST issue collections may include a pull request represented as an issue. When that source identifies an entry as a PR, do not count or present the same source PR as an independent Issue merely because it appeared in an issue collection. The issue-representation ID is not assumed to equal the pull-request ID; establish correspondence with source-supported identity evidence and preserve uncertainty if it cannot be established. A genuinely separate Issue linked to a PR remains a separate object.
    milestone: Show the source milestone reference when available without introducing a separate GitView domain identity or inferring completion.
    discussion: Show comment and participant counts as distinct units when observed. Issue comments are not PR review threads; no unresolved-review-thread count is fabricated for an Issue. A known zero is distinct from missing or incomplete count data.
    discussion_label_and_provenance: The selected discussion-participant concept is not automatically identical to the count of distinct comment authors proposed in 0077. As a first-version source-aligned candidate, make an available permitted GitHub participating-Users count inspectable under its own explicit source meaning and observation context. It does not assert coverage of every possible discussion actor or equivalence with comment authors. Label an available author-based candidate separately with its actual population and coverage, and do not add the counts. If the source count or its applicability is unknown, expose that limitation instead of inventing a zero or a broader participant count.
    direct_children: Show total direct sub-issues and closed direct sub-issues as separate counts when available. These are not transitive descendants and their ratio is not a percentage of completed work; closed children can have different source reasons.
    source_summary_semantics: GitHub documents a sub-issue summary with a total and a value named completed. The documented label alone does not establish that completed equals the owner's selected count of all closed direct sub-issues, including non-completion reasons, or that it has the required visibility and timing. Use a source aggregate for the closed count only after establishing its exact equivalence for the applicable scope; otherwise use sufficiently supported individual child states or retain an unknown or incomplete count. A separate source-labeled completed value is not silently renamed closed.
    source_reason_semantics: GitHub's current Issue state reason includes completed, duplicate, not planned and reopened values. Preserve the observed current state and reason separately; a reopened reason is not a closed or completed outcome. A current reason does not by itself identify the reason for a historical closure event or establish completeness of prior events.
    timestamps: Creation, update, closure, last comment and observation times have different meanings. A source update time is not automatically a last-comment time; an unavailable time remains unknown.
    partial_fields: Apply the field evidence and refresh rules in 0044 independently to state, reason, participants, links, counters and body. A newer title or state observation does not make omitted links, counts or description current. Preserve previously accepted permitted facts with their own context or indicate unavailability; a null-like error or omitted association is not automatically a known empty set.
    graphql_overview_candidate: The accompanying typed Issue overview query is a statically schema-checked example for individual selected scalar facts, authored body, comment total and Repository witness. Attribute each usable fact only to the confirmed Issue and Repository with its actual access and response context under 0101 and 0116. Null, omitted, failed and unavailable fields follow their actual semantics and error paths; a body does not prove an outcome and a comment count is not a participant count or a complete timeline. The example does not cover all selected relationships and fields, select a production operation, or establish permissions or runtime behavior.
    graphql_labels_candidate: The accompanying separately paged Issue labels query is accepted by the recorded public schema snapshot. Associate usable labels with the confirmed Issue and source Repository and preserve identity, actual page, field, access and observation context. Null, error, omitted or partial data does not become a confirmed empty set; color is not Issue type or lifecycle. This example establishes neither permission nor complete source coverage.
    description: Structured sections follow 0034. Authored motivation remains a statement, not proof of an actor's motive or observed result.
    provenance: The selected fields and role distinctions follow the owner's accepted Issue field set; the detailed unknown and evidence handling are agent-authored refinements.
  scenarios:
    closed_issue_with_partial_relationships:
      given: A permitted Issue is source-confirmed closed with a not-planned reason, its authored description is available, and its linked-PR collection is only partially observed.
      when: The operator opens the Issue overview from a cell or static preview.
      then: The same Issue and Repository remain identifiable; closed state and the source reason are distinguishable, the original description is reachable, and known permitted PR links carry their partial limitation. The screen does not call the Issue successfully completed or the relationship collection empty, and does not require individual comment contents.
    selected_details_after_preview:
      given: An Issue preview shows title and state but its permitted author, assignees, milestone and selected discussion counts are available only outside the compact preview.
      when: The operator opens the same Issue overview without relying on long press.
      then: Those available fields and their applicable observation limits can be inspected in GitView without exposing individual comment contents or inventing missing values.
    link_and_count_differ:
      given: Two permitted direct sub-Issues are observed but the full relationship collection and one child's lifecycle are incomplete.
      when: The operator inspects the Issue's selected relationships and direct-child counters.
      then: The two known endpoints retain their source contexts and incomplete coverage, while total and closed counters do not claim an exact complete result or a percentage of work completed.
    pull_request_in_issue_feed:
      given: A source Issue collection returns an entry explicitly identified as a pull request, with an issue-representation ID distinct from the ID in a PR response.
      when: GitView normalizes the source observations for PR and Issue summaries.
      then: It does not count the PR as a separate ordinary Issue or assume the two IDs are directly interchangeable; correspondence requires sufficient source identity evidence.
    relationships_in_context:
      given: An Issue has a permitted closing connection and a separate permitted mention to PR A in another Repository, plus a partially observed blocked-by collection containing Issue B.
      when: The operator inspects related work visually or using accessibility services.
      then: PR A is identifiable in its own Repository with both supported meanings, B is identified as blocking the source Issue, and the blocked-by collection's incomplete coverage is discoverable without implying the closing-link collection has the same coverage. An eligible explicit action opens A without changing Project membership; returning follows the source Issue route. No restricted endpoint or revealing count is exposed.
    child_counts:
      given: Complete applicable direct-child identity and lifecycle coverage establishes four direct children, two closed with unknown reasons, and additional grandchildren.
      when: Direct-child counters are shown.
      then: The counters are four total and two closed, exclude grandchildren and do not claim 50 percent of work is complete.
    completed_summary_is_not_closed_count:
      given: A source supplies a sub-issue summary total and completed count, but the available evidence does not establish whether the completed value includes every closed child regardless of closure reason.
      when: GitView presents the selected direct closed-sub-issue counter.
      then: The completed value is not silently substituted as the closed count; a sufficiently evidenced separate count is used or the closed counter remains unknown or incomplete.
    reopened_reason:
      given: An Issue is observed open with a source reason indicating it was reopened, and the previous closure reason is unavailable.
      when: Its current state and historical outcomes are inspected.
      then: The current open state and reopened reason retain their observation context, and no earlier closure reason or completed outcome is invented.
    discussion_unknown:
      given: An Issue's comment count is unavailable while its participant count is known.
      when: Discussion metrics are shown.
      then: The participant count remains available and the comment count is unknown, not zero.
    author_proxy_is_labeled:
      given: The permitted comment population supports two distinct known comment authors, while equivalence to the requested discussion-participant population and a source's participating-Users count is unproven.
      when: The Issue discussion section is inspected visually or with accessibility services.
      then: The supported value is identified as comment authors with its own coverage, the requested participant total remains unproven, and the source User count is not added or silently substituted.
    partial_title_and_links:
      given: An Issue's closing links and discussion counts were observed at T1, and a later response at T2 supplies its new title but omits those fields.
      when: The Issue overview is displayed.
      then: The title can use T2 while the earlier permitted links and counts keep their T1 context or are shown unavailable; GitView does not clear them or claim they were refreshed at T2.
    partial_children:
      given: Two direct sub-issues are observed but the source does not establish that all direct sub-issues were returned.
      when: The Issue's direct-sub-issue summary is shown.
      then: The observed contribution can be presented with incomplete coverage, without asserting two is the complete total or inferring a completion percentage.
  unresolved:
  - Source availability and exact mapping for direct hierarchy, blocking links, participants and last-comment time require source-specific verification.
  - Exact grouping, display priority and paging of related objects require native UX refinement; ambiguous links remain labeled according to their available evidence.
