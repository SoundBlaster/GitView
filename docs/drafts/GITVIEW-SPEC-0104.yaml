acceptance:
- A Project read distinguishes a confirmed valid configuration, confirmed absence, and an unavailable or inconsistent result.
- A portfolio read distinguishes a consistently established empty local collection, complete identity enumeration with independent entry limitations, and partial or unavailable enumeration without deriving source coverage from local records.
- A Project write binds operation identity, target and reviewed intended configuration to the applicable saved-state preconditions.
- Commit validation and the local effect preserve Project invariants despite concurrent writes or lost acknowledgements.
- A confirmed operation outcome is distinguishable from the latest readable configuration and cannot resurrect a subsequently deleted Project.
- The boundary can be injected and exercised with deterministic failures independently of source and UI.
specification:
  objective: Define domain-facing storage behavior for Project configuration and default associations without selecting a database or Swift API.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  contract:
    responsibility: A domain-aware Project configuration boundary translates between retained local records and confirmed Project facts. Its generic storage mechanism may be shared under 0095 but must not implement GitView-specific identity or membership policy. It does not fetch GitHub or infer source access merely by reading local data.
    read_request: A caller supplies a portfolio-read intent, a local Project identity, or the confirmed Repository identity when requesting its default association, together with relevant local context. A single-Project read distinguishes a valid saved Project and applicable version evidence, confirmed absence only where the read supports it, and unavailable or inconsistent data. A separately supplied latest operation receipt is not itself the current Project configuration.
    portfolio_read_candidate: As an agent-authored initial domain-facing contract for first launch and the overview, read the set of saved local Project identities and enough associated configuration, version and ordering evidence to support the requested overview under 0023 and 0072. Return individually supported entries with their local identities and per-entry limitations, plus a separate identity-enumeration result of complete, partial or unavailable or inconsistent as established. Complete identity enumeration must be backed by a logically consistent local enumeration of the full saved Project identity set at one supported local read context; it does not assert that every configuration or privacy projection is readable. Confirmed local empty means that such an enumeration establishes no saved Project identities, not that GitHub has no accessible Repositories or work. If an identity row, required enumeration range or local read cannot be resolved, the collection is not a confirmed empty or exhaustive portfolio. A readable identity with unreadable required configuration can remain an identifiable limited entry only to the extent it is safe and supported; it is not silently dropped or converted into a valid Project with no members. Ordering failure alone does not erase an independently established complete identity set; follow the fallback and repair rules in 0072. Do not require all Project work observations or current GitHub access merely to establish the local Project set.
    portfolio_consistency_and_concurrency: A portfolio enumeration must not combine independently changing pages into an asserted exhaustive local set without evidence that their shared read context or an equivalent protocol supports that result. Under the SQLite direction in 0113, a suitable read transaction or independently verified equivalent can establish a local snapshot of the enumeration; finish it without waiting for network, user interaction or rendering and do not hold it across interactive pagination. A later commit may legitimately produce a different portfolio and is not retroactively part of the earlier snapshot. Associate a delivered result with its local read context and route request; on change or refresh, use a separately established new read, and do not let an obsolete asynchronous read overwrite a newer applicable portfolio result or the operator's newer route. If a read is interrupted or the provider cannot establish the needed context, preserve independently supported entries with a collection limitation rather than manufacturing absence or completeness. This local snapshot is not a simultaneous GitHub snapshot or proof that every Project's source data is current.
    portfolio_access_projection: The storage boundary supplies local configuration and provenance to the higher composition subject to access policy; the app-controlled overview independently applies current disclosure under 0036 before exposing names, membership, counts, accessible labels or navigation targets. A supported complete internal local identity enumeration does not authorize revealing a restricted source-derived name, hidden membership or a count that would disclose restricted data. A restricted entry is not treated as local deletion, confirmed source denial for other entries, or a reason to reset the store. Local read completeness and source access or source-observation coverage are different claims.
    repository_reference_resolution: Under the working representation in 0123, resolve each confirmed source Repository identity to its stable local Repository reference within the same source-instance and identifier-kind scope. Project membership and default-association records refer to that reference, not a name, owner, URL or unconfirmed Node ID. If concurrent operations first introduce the same confirmed numeric identity, coordinate creation or reuse at the database boundary so they resolve to one reference; distinct numeric identities at a reused address remain separate references. An unresolved, conflicting, unreadable or insufficiently evidenced identity is not admitted as a confirmed member or treated as proof that a default association is absent. The source access check and any privacy restriction remain separate from this local identity resolution.
    normalized_membership_handoff: When a caller supplies a supported normalized Project proposal as described in 0111, bind its confirmed distinct Repository identities and proposed default-association effect to the reviewed operation intent under 0103. Resolve them to the correct stable local references and coordinate current version, identity, applicable access and uniqueness checks with the write boundary. Multiple source references confirmed to denote one Repository map to one membership; do not merge unresolved or different identities by name or silently drop a distinct intended member. If an association or precondition becomes conflicting or insufficient before effect, return the supported conflict or uncertainty rather than applying a different composition. A prior valid decision is not durable success. This is an exchange with the downstream policy, not a reciprocal graph prerequisite or a requirement for a network request inside the transaction.
    consistent_project_read: Read a Project's identity, saved name and purpose, version evidence, complete member-reference set and any requested default association as one logically consistent saved configuration under the selected persistence boundary. The read must establish each referenced Repository identity sufficiently to interpret the result; a dangling, conflicted or unreadable required reference makes the affected configuration inconsistent or unavailable, not an empty member list or a substitute address-based identity. Return independently supported information only with its limitation and current disclosure policy. A readable Repository record alone does not prove that it currently belongs to a particular Project or that a prior default is current.
    project_commit_candidate: As an agent-authored SQLite design direction, coordinate validation and durable publication of a Project write, its nonempty membership references, applicable default-association change, configuration version and operation result in one local transaction under 0113, provided the chosen provider actually establishes those semantics. Check the saved version and current eligibility at the write boundary; enforce no duplicate member reference within one Project and at most one active default association for a confirmed Repository across Projects. A default association must point to a currently saved membership of its target Project. Different Projects may reference the same Repository. A failure, uniqueness conflict or lost acknowledgement follows the transaction-outcome and operation-reconciliation rules rather than assuming rollback or retrying as a new operation. No GitHub, Keychain or UI request is held inside this transaction.
    configuration_version_candidate: Assign each committed Project configuration a fresh opaque version token that is never reused for that Project, including after an edit returns its visible values to earlier contents. Compare an edit's captured base token with the current saved token in the coordinated transaction; an unavailable, mismatched or invalid base cannot authorize an overwrite. Deletion makes the old Project identity ineligible for edits and a separately created Project gets a different identity. The representation and collision prevention must be selected and verified with the physical schema; wall-clock order, equal content or a local receipt alone do not establish the current token.
    restored_version_boundary: The version comparison protects edits against newer states in the continuing store, but a complete restore of an older database can restore an earlier version token together with an old pending edit or deleted Project. A token matching that snapshot does not prove that no later state existed outside it. If rollback is independently established and the intervening outcomes are not recoverable, do not automatically replay pre-restore edits or claim that a later deletion survived; preserve the snapshot and offer an understandable recovery or a separately reviewed new action under 0103 and 0122. If no independent rollback evidence exists, the local store alone cannot establish that the restored configuration is the latest ever committed. This limitation does not authorize guessing another Project identity or deleting the recovered configuration.
    intended_write: Creation, editing, default association change and deletion submit a 0103 logical operation identity, kind, target, immutable intended change, and relevant preconditions. For an existing Project edit the precondition identifies the confirmed base configuration; a reviewed revision is a new operation. Default setup additionally supplies its confirmed Repository identity and applies the global per-Repository default uniqueness constraint. Exact serialization and method signatures remain implementation design.
    write_decision: At the effect boundary validate the bound operation, applicable saved base, valid nonempty Project name and membership, valid default association and domain identity requirements. A stale base yields a conflict or other explicitly supported safe result, not a silent full-state overwrite. A confirmed deletion makes old edits ineligible to recreate the Project. Validation and commit must be coordinated sufficiently to prevent an intervening write invalidating a previously successful check.
    durable_outcomes: Return or allow recovery of the same operation's applied result, terminal rejection or conflict, or indeterminate outcome under 0103. A duplicate delivery of the same identity and compatible intent resolves to that operation's established outcome without a second effect. A mismatch is rejected or reported as conflict. Do not report rollback or confirmed absence while a prior effect can still commit.
    default_result_contract: For an admitted default-setup entry, distinguish created, reused, known rejected or conflict, and indeterminate. Created means this operation durably established the default Project, matching membership and association. Reused means this operation resolved to a separately established valid current default Project and did not create another; bind that resolution to the operation before reporting its durable result. Known rejection or conflict means the boundary has sufficient terminal evidence that this operation did not apply the intended creation. Indeterminate means neither applied nor terminal non-application can be established, including lost acknowledgement while a late commit remains possible. These are proposed local boundary results, not source access states.
    reuse_at_boundary: Where the submitted operation's reviewed intent permits reuse under 0045 and 0052, inspect and validate the winning association and its Project membership at the same coordinated boundary that establishes the operation's reused result. A reviewed creation cannot silently become reuse of a different Project merely because its association appeared before commit; follow the changed-outcome review rule. If the winner has already been removed, its membership is invalid, the current configuration cannot be read, or safe coordination cannot be established, do not report reused based solely on an earlier snapshot. Return an applicable conflict or indeterminate outcome according to the actual evidence. A reused result is not a claim that the operation created the Project.
    retry_after_outcome: A terminal operation result stays bound to its original operation and intent. Re-delivery reports that historical result rather than converting a terminal rejection into an applied creation; an explicitly reviewed new attempt uses a new operation identity and current admission and configuration evidence. For an indeterminate operation, reconcile or safely re-deliver the same compatible identity under 0103; do not submit a distinct replacement while an earlier late effect could violate uniqueness. If recovery cannot establish safe replay, retain the indeterminate state and offer recovery rather than claiming failure.
    result_projection: Map created and reused to the batch's saved and reused entries only when their applicable durable outcome is supported. Map a confirmed terminal rejection or conflict to an appropriately identified recoverable failure; distinguish an indeterminate submitted entry from an unsubmitted pending entry. An operation receipt reports its historical result, while a separate current read establishes whether the resulting Project and association still exist. The UI must not automatically navigate to a Project solely from an old receipt after deletion or replacement.
    commit_and_evidence: A candidate mechanism must couple the effect or validated reuse decision with the operation-intent binding and recoverable terminal outcome so interruption cannot expose an independently claimed durable success without the matching evidence. Validation of Repository identity, default uniqueness, current saved configuration and locally applicable admission preconditions is coordinated with that effect under 0045 and 0052. This is an observable requirement for the future storage design; it does not select a particular database, transaction API or cross-device synchronization.
    historical_receipt: An applied receipt identifies what the operation established at its own commit context; it does not promise the Project still has that state after later edits or deletion. Obtain the current Project through an independently valid read. A replay after a later deletion may report the earlier operation's historical outcome where permitted but must not recreate the Project or report that it currently exists.
    scope_and_isolation: A completed one-Repository default save has a Project, membership and matching association visible together under 0052. A custom Project save has a valid identity and configuration without changing other Projects or default associations. Batch setup retains individual operation outcomes; no all-batch atomicity is claimed. Changes to a Project do not delete source Repositories or other Projects' retained observations.
    caller_contract: Callers distinguish the result of submitting or reconciling an operation from a separate current read; they preserve an indeterminate result for recovery and show conflicts or failures without exposing restricted details under 0036. Pages do not manufacture durable success from an optimistic UI update, and storage does not navigate or present a modal.
    verification: Under 0040 and 0079 specify TDD boundary scenarios with injected storage covering same-operation replay, two intentional custom Projects with identical content, concurrent default setup, stale base, edit after deletion, lost acknowledgement, inaccessible read and interruption around commit. Verify actual persistence, process restart and platform behavior separately from doubles.
    provenance: Shared Repository membership and default one-Repository Projects are owner decisions. This domain-facing boundary, version evidence and outcome vocabulary are agent-authored proposals and do not require an ontology entity per operation or a particular persistence technology.
  scenarios:
    no_saved_projects_versus_failed_read:
      given: One local read consistently enumerates the complete valid Project identity set and finds none, while another cannot read the enumeration and has no independently supported entries.
      when: The first-launch overview receives each result.
      then: Only the first supports a confirmed empty local portfolio and setup route. The second reports a local-data limitation and recovery, not an empty account or automatic reset.
    enumeration_with_broken_member:
      given: A local snapshot establishes two Project identities, but a mandatory membership reference of one Project is unreadable while the other Project and its configuration are valid.
      when: The portfolio is prepared for the overview.
      then: The valid Project remains available subject to disclosure, the affected Project is limited or unavailable rather than silently dropped or declared memberless, and any claim about identity enumeration is kept distinct from configuration and source coverage.
    concurrent_project_creation_during_read:
      given: A portfolio read establishes a consistent local snapshot with Project P, and creation of Q commits after that snapshot's read boundary.
      when: The first result is displayed and a later local read establishes P and Q.
      then: The first result describes its earlier context without claiming Q never existed; the later applicable result can include Q. An old read completing after the later result cannot replace it as the current overview solely by arriving later.
    restored_version_matches_old_edit:
      given: A backup contains Project P at V1 and a pending edit based on V1; later the continuing store committed V2 or deleted P, but an independently identified older backup is restored without the later evidence.
      when: Recovery compares the saved edit's V1 token with the restored V1 token.
      then: Their equality alone does not authorize automatic replay or prove P was not later changed or deleted; the restored data and unresolved operation remain available for safe recovery or explicit new review.
    shared_identity_concurrent_first_save:
      given: Two confirmed operations independently resolve the same valid GitHub numeric Repository identity while creating different custom Projects, and no local Repository reference exists yet.
      when: Both commits race through the coordinated boundary.
      then: Both valid Projects may be saved and refer to one confirmed Repository reference, while neither name or address becomes the identity and each operation keeps its own durable outcome.
    invalid_default_membership:
      given: A submitted edit would remove Repository R from Project P while leaving P's default association for R active, without an independently valid coordinated association change.
      when: The edit reaches commit validation.
      then: The boundary does not publish a default association pointing to a nonmember; it applies the required coordinated association removal under 0025 or reports a supported conflict, without changing another Project's membership.
    normalized_duplicate_then_recovery:
      given: A reviewed valid Project proposal has two source references confirmed as the same Repository R, yielding a normalized one-member intent; the storage operation commits but its acknowledgement is lost.
      when: The caller redelivers the same operation and its bound intent after restart, then obtains an independently valid current Project read.
      then: The operation can report its original applied result and the current read contains R once, with no duplicate Project or second membership. Recovery does not claim a new source observation, infer a different Repository from its name or treat the receipt alone as the current read.
    missing_reference_during_read:
      given: A saved Project claims a member reference but the referenced Repository identity record is unreadable or cannot be validated after restart.
      when: A caller requests the current complete Project configuration.
      then: The configuration is unavailable or inconsistent for that claim rather than a valid Project with the member silently dropped; supported independent data and recovery remain separately available.
    applied_then_deleted:
      given: Creation operation O durably produced Project P, and a later separate operation durably deleted P.
      when: O is retried and P is read.
      then: O can return its historical applied outcome, the valid current read reports P absent, and replay does not recreate it.
    same_name_independent_creations:
      given: Two separately confirmed custom creation operations have distinct identities but identical names and memberships.
      when: Each passes its own preconditions and commits.
      then: Two distinct valid Projects may exist; matching content is not a retry identity or a default association.
    stale_write_after_newer_commit:
      given: An edit targets Project P based on configuration V1 and a different edit commits V2 before the first reaches its effect boundary.
      when: The earlier edit is submitted.
      then: It cannot overwrite V2 as a successful V1 edit and yields a conflict or another explicitly supported safe outcome.
    unavailable_default_read:
      given: An earlier default setup operation may have committed but its association and pending outcome are unreadable.
      when: The caller asks for a default Project and requests retry.
      then: The boundary reports unavailable or indeterminate rather than confirmed absence, and does not claim a duplicate-free new Project was created without satisfying 0052 and 0103.
    reviewed_reuse:
      given: Operation A durably creates a valid default Project for a confirmed Repository, and a separate operation B explicitly reviewed and confirmed reuse of that same Project before reaching its boundary.
      when: B atomically validates that current association and records its own result.
      then: A reports created, B reports reused for the same Project, and a repeated B delivery returns B's bound result without claiming that B created another Project.
    obsolete_winner:
      given: A valid default Project was observed while B was preparing reuse, but the association is removed before B's result is coordinated and no current valid association is confirmed.
      when: B attempts to report reused.
      then: The older observation alone cannot support reused; B reports conflict or remains indeterminate according to established evidence, with no fabricated current Project.
    terminal_rejection_replayed:
      given: A creation operation is durably rejected and the operator later explicitly reviews a corrected configuration.
      when: The old operation identity is redelivered and the revised creation is submitted.
      then: The old identity retains its terminal result and the revised intent uses a separate identity and current preconditions; no rejection silently becomes an applied creation.
    applied_receipt_current_read_unavailable:
      given: A creation receipt confirms Project P was applied earlier but the current configuration read is unavailable.
      when: Setup reconstructs the result after restart.
      then: The past operation can be reported as applied but P is not asserted currently readable or selected for navigation until an independently valid current read establishes it.
  unresolved:
  - Select concrete Project ownership, version evidence and commit mechanism after reviewing application composition and persistence candidates.
  - Define migration, storage-unavailable interaction and actual cleanup of data no longer referenced by any Project without assuming a particular database.
  - No production boundary, concurrent save, durable read or restart behavior has been implemented or verified.
