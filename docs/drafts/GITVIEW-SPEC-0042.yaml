  autonomy: conversation:gitview/excerpt-77
acceptance:
- The work collection has a deterministic ordering for known objects and does not use a repository-local number as a global identity.
- Uncertain filter candidates are distinguishable from confirmed matches and do not make the selection appear exhaustive.
- A refresh or density change does not silently reset filters or conflate a moved cell with a different object.
- An intentionally filtered empty collection remains distinct from missing data, incomplete coverage and a complete observed empty collection.
specification:
  objective: Make ordering and uncertain results predictable while preserving the current scope and selected object identity.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    order: As an initial agent-authored default, order known work by observed source last-update timestamp descending. Objects without a known source update time follow objects with known times. Break ties deterministically by stable source instance, Repository identity, object type and object source identity. If a source identity component is unavailable, use a stable local observation token for ordering without treating it as a confirmed GitHub identity or deduplicating it with another uncertain record. This is a display order, not an assertion that the last update was a comment or human work.
    identity: A source-confirmed PR or Issue appears at most once per selected collection. Repository-local number alone is insufficient to distinguish objects. Rename or transfer with confirmed source identity does not create a second card. Observations whose identity cannot be resolved remain explicitly uncertain rather than being counted as confirmed distinct objects or silently merged by name.
    confidence: Apply the confirmed match, confirmed exclusion and uncertain candidate rules in 0027 subject to current access policy. Present permitted confirmed matches separately from a clearly identified permitted uncertain portion or provide an equally explicit way to inspect those candidates. Do not reveal a restricted object's identity, existence or derived count solely to make uncertainty inspectable. An unavailable filter value is not labeled as a confirmed match; unobserved portions of a repository remain incomplete even when no candidate object is individually known.
    uncertainty_presentation: As an agent-authored first-version proposal, use two visibly and accessibly identified portions of the same work collection. Show permitted confirmed matches first, then permitted known candidates whose applicability is uncertain in a clearly labeled needs-verification portion. Keep the current grid density, object identity, explicit filters and navigation scope in both portions; apply the same deterministic ordering rule independently within each. The label and an accessible explanation identify uncertainty in the selection, not a GitHub lifecycle or review state. Exact native section and control APIs are not chosen. Do not invent a cell for an unobserved object or show a restricted candidate merely to populate this portion.
    unresolved_identity: A permitted retained observation without confirmed object identity may be made available through a clearly limited inspection or recovery route, but a temporary local ordering token is not an established PR or Issue identity. Do not present it as a confirmed distinct object, construct an actionable source link, or open another object by matching only title or number. When independent source evidence confirms the identity, reconcile it under 0101 and the normal navigation rules; an ambiguous association remains visibly uncertain without a fabricated exact count.
    resolved_identity_focus: If a limited inspection of an unresolved representation is active when independent evidence establishes a permitted typed object, the inspection may update to explain that supported association and offer an explicit open of the confirmed object. Do not automatically navigate, claim an old presentation token was always the source identity, or transfer focus to a different object solely because it occupies the old cell position. When two representations resolve to one object, retain one confirmed card, preserve an accessible path to that identity where feasible under 0073, and show remaining coverage or conflict limitations without claiming a source deletion. Current access restrictions override focus continuity.
    untyped_representation: A permitted source record whose PR-versus-Issue type or source identity is unresolved is not itself a typed work card or a confirmed member of either the match or needs-verification portion under 0110. Where safe, a separately identified limitation or limited source-fact inspection can explain that some representation is unresolved, without presenting its local token as a distinct GitHub object. If existence or association is restricted, even that detail and any revealing count stay withheld; a general non-sensitive coverage indication is offered only where permitted. An independently supported aggregate can retain its own exact scope and time under 0102 without making the visible grid exhaustive or identifying that record.
    coverage_presentation: Make a compact persistent collection-status entry or system control available independently of whether any uncertain candidate is known. It explains permitted scope, incomplete or unobserved coverage and the latest applicable observation and refresh outcome, with a retry or recovery route where appropriate. A missing Repository or unreturned page is a scope limitation, not a placeholder cell or a count of hidden objects. Source-specific cause, total population and restricted names or counts are not invented. A transient refresh cue may supplement this entry but does not replace it.
    status_control_candidate: As an agent-authored first-version presentation proposal, place an accessible status action in the work collection's system navigation or toolbar area, available at every density and when the grid has no cells. Emphasize an applicable incomplete, failed or recovery state through a system-supported symbol or treatment, with color only as a secondary cue. Activating it opens a standard system presentation or equivalent accessible status view for the current Project and selected scope. The view distinguishes the supported source refresh outcome and its affected permitted scope, the latest applicable successful observation time or an explicit unavailable value, incomplete population or unresolved discovery, and any independent local save or recovery limitation under 0044 and 0048. It offers a scope-appropriate refresh or recovery action when eligible, or explains a supported deferral without implying that a request has started. Use separately attributable times where the scopes differ; do not place one success timestamp over a partial Project as though every Repository or category was updated. An expanded status view is not required to expose raw GitHub response text, database codes or restricted identifiers. Exact native control, system symbol, wording and presentation require platform and localization evaluation.
    status_interaction_and_focus: Opening or dismissing the status view does not clear filters, alter density, initiate a request or replace the underlying selected Project. A deliberate refresh or recovery action follows its own captured scope and admission rules under 0048; closing the view does not by itself cancel an admitted operation. Make the action's accessible label describe its current meaningful state without relying on an icon, color or timed announcement, and expose affected scope and recovery details through ordinary accessible navigation. After dismissal return focus or position to the status action or another valid context under 0073; when a source update or access restriction occurs while the view is open, update only still-relevant permitted information and do not let old details remain exposed for focus continuity. Exact announcement policy and native focus behavior remain subject to device validation.
    counts_and_empty: A displayed confirmed-match count includes only the permitted confirmed matches actually supported by its stated context; do not describe it as an exact complete Project total when coverage is incomplete. A known uncertain-candidate count is optional and may be presented only if its identity basis and privacy are supported; it is not the number of missing source objects. If there are no confirmed matches but eligible uncertain candidates exist, show that distinction rather than a confirmed-empty screen. If no candidate is known and coverage is incomplete, show the collection limitation and available recovery, not a fabricated empty GitHub. Intentionally excluding all applicable lifecycle states remains a separate filtered-empty case.
    visible_partial_count: When a count of currently displayed confirmed matches is not supported as the complete selected population, associate a visible non-color-only limitation with the number and make its meaning accessible, consistent with 0047. If the layout cannot provide that usable association, omit the ambiguous numeric count there and expose the scoped qualified value in the collection-status inspection instead. This count describes the supported confirmed matches in its stated context, not the number of unseen objects, the total source population or an automatically valid current lower bound. Apply privacy before showing either the value or its limitation.
    reclassification: On an eligible refresh, a permitted object whose decision changes moves between the two portions or leaves the active selection without changing its source identity, active filters or preview target. Preserve its accessible focus and inspection under 0073 where feasible, and defer disruptive reordering during an active interaction when allowed by that contract. Denial immediately removes restricted content even if reordering is deferred. A transition from unknown to false is a supported non-match only when the new evidence actually establishes the false condition; access loss alone is not a false predicate.
    stale_filter: A last-known filter value may support an observed result for its own time and scope, but is not silently labeled a confirmed current match or exclusion. When current evaluation is unknown, preserve access to the affected known candidate or an equally explicit uncertainty path under 0027, and distinguish that from an exhaustive current selection. Updating another field does not refresh the filter value.
    failed_ci_filter: The failure-category condition uses the same proposed entry mapping and applicable revision as the Project count in 0061 and 0057. When reached from the open-PR summary signal, retain its open-lifecycle condition as well as the check predicate; an independently selected failed-CI filter may have a different explicit lifecycle scope. A confirmed timed-out check or status error can match without claiming a failed test. An action-required or other special outcome is not silently classified as failure, success or healthy merely because it falls outside that category; it remains discoverable through the object's status information. Unknown applicable inputs follow uncertainty rules.
    unknowns: Where the app has a permitted candidate object but cannot evaluate an active filter, it remains available for inspection through the uncertainty presentation. A restricted candidate follows 0036 and the access boundary in 0027; use only a non-sensitive limitation or recovery route where permitted. A known-false independent condition can still exclude an object; missing input alone is not a known-false condition.
    context: Density changes do not change the sorting key, active scope, period or filters. A refresh may change source timestamps and therefore order; preserve the selected object or apply the fallback in 0024 rather than treating the old cell index as identity.
    empty: When all lifecycle states are explicitly excluded, display an intentional filtered-empty result and preserve the ability to inspect scope coverage and refresh failure. When all applicable conditions are known and complete with no matches, display a confirmed empty selection. When coverage is incomplete or candidate evaluation is unknown, do not label the source result fully empty.
    no_matches_recovery: As an agent-authored first-version presentation choice, when a supported complete evaluation has no matching cards, describe the result in terms of the current selection, such as no matches for the chosen conditions and time scope. If editable filters are active, keep an accessible way to inspect or change them and offer the applicable clear action under 0092 even when the grid has no cells. Clearing is explicit and preserves the route's Project, Repository intent, temporal mode where still meaningful, and density; recalculate rather than asserting that other work exists. A valid unrestricted empty Today result still describes that selection, not an empty Repository or a history with no work. If coverage or applicable candidate evaluation is incomplete, present the independently supported limitation and recovery under coverage_presentation instead of a confirmed no-matches claim. A deliberately empty type or lifecycle choice is identifiable as such, even if refresh also failed. Exact wording and control placement remain open.
    boundaries: The sort applies independently within the proposed portions of the current work collection; grouping for historical periods, user-selectable alternative orderings and exact native uncertainty UI remain separate decisions. The portions and default order are agent proposals, not user-selected layout decisions.
  scenarios:
    complete_filtered_no_matches:
      given: A permitted Project-wide Today scope has sufficient applicable population and predicate coverage, contains open PRs, and none satisfies the explicitly selected failed-CI condition.
      when: The operator sees no matching PR cards and explicitly clears the editable failure condition.
      then: Before clearing, the result says no work matches the active selection rather than that the Project or GitHub has no PRs. After clearing, the same Project, Today scope and density remain and the app reevaluates using the supported facts; the previously supported eligible open PRs can appear without any source mutation.
    partial_filtered_no_known_matches:
      given: A failed-CI selection has no known matches while a member Repository's relevant work has not been observed.
      when: The empty-looking collection is displayed and the operator inspects its filter and status.
      then: The active condition and incomplete coverage are discoverable without claiming no matches across the full Project; changing the filter is available but does not by itself fill the missing observation or resolve the limitation.
    status_control_in_empty_partial_grid:
      given: A Project Today grid has no known permitted cells, its Issue source portion has not been observed and the last PR refresh failed after an earlier supported observation at T1.
      when: A sighted or assistive user opens the collection status action at any supported density.
      then: The action remains discoverable without a cell or color; the status view distinguishes unobserved Issues from the PR failure and its applicable T1 observation, and offers an eligible recovery route. It does not report an empty GitHub source, a Project-wide success at T1 or a number of missing objects.
    simultaneous_source_and_local_limitations:
      given: A permitted PR observation is received at T2 but its local retention outcome is unknown, while a separate Issue source request fails and an earlier eligible Issue observation exists at T1.
      when: The operator inspects the collection status and returns to the grid.
      then: The PR fact can be identified as transient with its own T2 source context and local-save limitation; the Issue failure and T1 observation remain separately attributable. Neither limitation is relabeled as the other, and dismissal preserves the selected Project, filters, density and a valid focus path.
    unresolved_type_with_private_record:
      given: A selection contains one permitted confirmed PR and an additional source representation whose type, existence and relationship to the PR are restricted.
      when: The grid, its status and accessible labels are rendered.
      then: The permitted PR remains available, no extra card or exact hidden-record count is exposed, and an incomplete-scope indication is used only if it is safe; restricted evidence is not converted into a confirmed source-empty result.
    tie:
      given: Two different Repositories each contain Issue 42 with the same source update time.
      when: The collection is ordered repeatedly without data changes.
      then: Both Issues remain distinct and their relative order is deterministic.
    unknown_ci:
      given: Two Today PRs have respectively failed CI and unknown CI.
      when: The operator selects the failed-CI filter.
      then: The first is a confirmed match and the second is available through a clearly identified uncertain portion, not counted as a confirmed match or silently lost.
    partial_empty:
      given: A Project has no known matching Issues but one member Repository has not been observed.
      when: The Issue selection is shown.
      then: The result indicates incomplete coverage rather than a confirmed empty Project.
    uncertain_without_missing_cells:
      given: A Project has one confirmed failed-CI PR, one permitted PR with unknown current CI, and one unobserved member Repository.
      when: The operator selects failed CI at the compact grid density.
      then: The first PR is in the confirmed portion, the second in the labeled needs-verification portion, and a persistent safe coverage status indicates that the source scope is incomplete without fabricating an unknown Repository cell or hidden-object count.
    only_uncertain:
      given: A permitted known PR is uncertain under the active filter and no confirmed match has been established.
      when: Its Project collection is shown.
      then: The uncertain PR remains identifiable in its own portion and the collection is not labeled confirmed empty, regardless of whether population coverage is complete.
    candidate_becomes_match:
      given: A permitted PR is being inspected from the needs-verification portion while its applicable CI observation is pending.
      when: A source-supported observation confirms it matches the active filter.
      then: It becomes a confirmed match without changing identity, filter or Project; the preview remains bound to that PR and focus or return uses the current valid identity context.
    stale_ci_after_title_refresh:
      given: A PR had failed CI at T1 and only its title was observed again at T2; no current CI result is available.
      when: The operator opens the current failed-CI selection.
      then: The retained T1 evidence can be inspected with its time and uncertainty; the T2 title does not turn it into a confirmed current result or eliminate it as a confirmed non-match.
    restored_single_object_not_full_population:
      given: One permitted PR in a previously restricted Repository has newly supported Today and active-filter facts, while the rest of that Repository's applicable population has not been observed.
      when: The collection is refreshed and presented.
      then: The PR can appear as a confirmed match under its own evidence, while the separately scoped collection status remains incomplete; no missing-object number, zero Issues or full-Project refresh is inferred.
    restricted_uncertain_candidate:
      given: A previously permitted PR becomes an uncertain filter candidate and its identity, existence and underlying private facts are now explicitly restricted.
      when: The uncertain portion is presented.
      then: The PR's restricted identity, existence and revealing counts are not displayed or announced; permitted candidates remain inspectable and an access-safe limitation is available where allowed.
    timeout_matches_origin:
      given: A Project failure-category signal counts one open PR whose only classified failing entry timed out, with matching scope and observation context.
      when: The operator opens that signal with no intervening source change.
      then: The PR matches the destination filter and its timeout remains distinguishable from a failed test; the originating unit is not relabeled as a count of failed tests.
    reordering:
      given: A selected PR remains in the active filter and receives a newer source update time.
      when: Refresh changes its position in the sorted grid.
      then: Its source identity remains the same and position or focus restoration follows 0024.
  unresolved:
  - User-selected alternative ordering and historical grouping semantics.
  - Validate the proposed labeled portions and compact status control with native grid density, interaction and accessibility; actual visual treatment and localization remain open.
  - Exact stable object identifier encoding and source timestamp mapping require integration refinement.
