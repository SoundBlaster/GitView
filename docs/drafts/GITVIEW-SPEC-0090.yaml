id: GITVIEW-SPEC-0090
title: GitView - Required description process outcome and path coverage
kind: spec
created_at: '2026-11-14T18:22:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0076
depends_on:
- GITVIEW-SPEC-0034
- GITVIEW-SPEC-0036
- GITVIEW-SPEC-0038
- GITVIEW-SPEC-0051
- GITVIEW-SPEC-0054
sources:
  parent: docs/drafts/GITVIEW-SPEC-0076.yaml
  agreed_formats: docs/drafts/github-templates/README.md
  required_format: conversation:gitview/excerpt-37
  owner_agreement: conversation:gitview/excerpt-38
  autonomy: conversation:gitview/excerpt-77
acceptance:
- An applicable required-format policy identifies its participating scope, supported creation paths, policy version and the process checkpoint it governs.
- A template or instruction is distinguished from a current structural assessment, an explicit exception and evidence that a path is actually covered.
- A process outcome cannot be reported as satisfying the required format without an established applicable body and checkpoint context, and for each required section an applicable structural pass or a separately permitted, authorized and applicable exception; an unresolved requirement remains indeterminate.
- A known deficiency, an authorized applicable exception and a structurally conforming body remain distinguishable; an exception does not change the body or structural assessment.
- A body change or applicable policy change invalidates the earlier assessment's applicability to the current checkpoint until re-evaluated.
- Participating process claims and source mutations remain separate from GitView's read-only display of permitted objects.
specification:
  objective: Define a checkable outcome for the required Issue and PR description process without assuming a GitHub gate can prevent all creation paths.
  ontology_refs:
  - gitview:User
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    required_format: The owner-selected Issue sections are Problem, Motivation, Expected outcome and References; PR additionally requires Changes and Validation under 0054. This applies to new descriptions in the participating process and supported paths. A repository or path is not declared participating merely because GitView can read it or because a template file exists.
    participation_manifest: The external participating process identifies its Repository identities, included object types, supported human and agent creation paths, applicable policy and recognition-profile versions, responsible evaluator and the checkpoint at which compliance is assessed. These are process facts, not a requirement to introduce a new ontology entity, prescribe a storage format, or configure GitHub through GitView. Unknown scope or unverified path coverage cannot support an all-paths-compliant claim.
    initial_participation_candidate: As an agent-authored first-version rollout proposal, begin with the GitView Repository itself when it has a confirmed GitHub source identity and the owner has enabled the authoring process for it. Apply the agreed Issue and PR sections to newly authored bodies from both human and coding-agent paths; explicitly record which paths are actually supported and which are unverified. Other owner-controlled Repositories join only by an explicit process configuration, and a Repository's appearance in a GitView Project or a shared GitHub organization does not enroll it. Existing or external objects stay readable under 0034. This is a proposed initial process scope, not evidence that GitView already has a remote, that any Repository was enrolled, or that all creation paths are enforced.
    initial_checkpoint_candidate: For an agent-controlled creation path, assess the proposed actual body against the applicable profile before the agent submits it; on a known deficiency or indeterminate assessment the agent does not submit until the applicable requirement is satisfied or a separately authorized applicable exception is established, and does not report the body conforming by virtue of an exception. For a human or source path that cannot be controlled before submission, the participating process must identify its actual reachable checkpoint and report unverified coverage until an applicable assessment of the created body is established. A later assessment is detection and does not retroactively prove prevention. An approved exception requires separately established authority and scope; no exception mechanism or policy is assumed to exist. This proposal does not authorize creation, modification or communication by GitView itself and does not claim that a source gate has been installed.
    checkpoint: As an agent-authored minimum proposal, before the participating workflow reports a newly authored Issue or PR as having satisfied the required format at its declared checkpoint, establish the applicable actual body, policy and checkpoint context. For every required section obtain an applicable structural pass or a separately permitted, authorized and applicable exception. Report known deficiencies and indeterminate or unavailable assessments distinctly; an unresolved requirement remains unresolved until re-evaluation or an applicable exception. This does not claim that every source path can prevent creation or select a mandatory correction deadline.
    assessment: Use the versioned structural profile and result distinctions in 0076 and 0051. A conforming result means the assessed body has the required headings and structurally filled content according to that profile. It is not evidence that the text is useful, correct, independently validated, causally true, or that tests ran. Any semantic quality review is separately identified and cannot be inferred from nonempty text.
    template_vs_process: Templates and agent instructions can prompt the desired sections but do not establish that an authored body was filled, checked, or covered by a gate. A verified evaluation on one path does not establish that another path, repository or object type is covered. A process that cannot show evidence for a path must label that path unverified rather than claim universal enforcement.
    known_deficiency: A required section known missing or unfilled is a structural deficiency for the assessed body and policy. The participating workflow must not label that body structurally conforming merely because an object was successfully created or a template was present. The next step can be correction and re-assessment, or an applicable authorized exception if the process explicitly permits it; the concrete integration, actor and time limit are not chosen here.
    unknown_assessment: An unavailable or ambiguous body, unknown identity, missing policy applicability, checker failure or unresolved write race is indeterminate. It is neither a pass nor necessarily a confirmed deficiency. Keep the unresolved process status visible to its participants and make a retry or review path available; do not invent a section or silently assume an exception.
    mixed_requirements: Preserve each applicable section's supported result separately when a known structural deficiency coexists with an ambiguous or unassessed section. Report the known deficiency and incomplete assessment together; do not downgrade the known deficiency to a mere checker failure or claim that every other section passed. A valid exception scoped to one known deficiency applies only to that requirement and does not resolve a different unknown section. The participating process can report its required-format obligation satisfied only when each applicable required section has an applicable structural pass or a separately permitted and authorized exception, and no other required assessment or exception remains indeterminate. Structural conformance of the body remains distinct from process satisfaction via exceptions.
    exception: An exception is an explicit, attributable, authorized decision scoped to a specific object, requirement, policy version and applicable lifetime under 0076. It can resolve the participating process only to the extent the policy permits it; it remains distinct from structural conformance and is not inferred from a checker timeout, missing body, missing exception source or operator silence. Authority and whether exceptions are allowed remain unresolved.
    body_or_policy_changed: Bind every assessment to the exact observed body and policy under 0076. Evaluate an exception against its separately established object, requirement, policy and lifetime scope; whether it remains applicable after an edit requires evidence under that exception policy. A new or conflicting body or relevant policy version prevents an old assessment from being described as applicable to the new checkpoint without independent evidence. Preserve prior assessment as historical evidence only; do not automatically write, close or suppress a GitHub object.
    checkpoint_race: An assessment of observed body A and a later independent read of the same bytes are not by themselves proof that the body or policy cannot change between the read and an externally governed action. For a claimed checkpoint outcome, the participating process must establish applicability at its actual decision boundary by a supported conditional operation, coordination mechanism or other source-backed evidence appropriate to that path. If that relationship is not established, retain the assessment as evidence about A and report checkpoint applicability as indeterminate. A later source edit does not retroactively alter a correctly attributed prior checkpoint; a claim that the object remains conforming now needs its own applicable current evidence. The existence of this requirement does not claim GitHub offers a particular conditional write or atomic gate.
    external_boundary: A participating authoring process may cover web, CLI, API and agent paths, but the selected supported set and actual enforcement mechanisms remain separate decisions. GitView itself reads permitted descriptions and does not create, repair, comment on, close or hide source objects based on this process. An Issue or PR outside the policy or with unknown participation remains available under the normal source and access contracts.
    verification: Before claiming enforcement, demonstrate the actual configured evaluator and checkpoint for each declared path with conforming, missing, ambiguous, failed-checker and edited-body cases. Distinguish source-side prevention from post-creation detection and human or agent adherence. A template fixture, synthetic parser test or this specification alone is not proof of a deployed gate; do not use private source data without authorization.
    provenance: Required sections and mandatory intent were selected by the owner. This checkpoint, scope and evidence contract is an agent-authored proposal; participating repositories, authority, exception policy and source-side mechanism are not established.
  scenarios:
    initial_agent_and_unverified_web_path:
      given: GitView has a confirmed GitHub Repository identity and its owner has explicitly enabled the proposed policy for newly authored Issues and PRs; an agent creation path has an applicable evaluator while the human web path has no established checkpoint.
      when: The agent prepares a PR lacking Motivation and a human separately creates an Issue through the unverified path.
      then: The agent identifies the deficiency and does not submit until the requirement is satisfied or a separately authorized applicable exception is established; the human path remains explicitly unverified until an applicable assessment is obtained. Neither a template nor the agent path establishes enforcement for the web path, and existing accessible objects remain readable.
    deficiency_and_ambiguous_section:
      given: A current applicable PR body has a reliably missing Motivation section and an ambiguous Validation section; the policy permits exceptions but none has been established for Validation.
      when: An authorized applicable exception is recorded only for the missing Motivation requirement and the process reports its checkpoint.
      then: Motivation remains structurally missing with its separate exception, Validation remains indeterminate, and the whole required-format obligation is not reported satisfied until Validation is assessed or separately covered by an applicable permitted exception.
    body_changes_after_last_read:
      given: A body A received a structural pass and a later read also returned A, but no source-supported conditional decision or coordination prevents an independent edit before the checkpoint action.
      when: The participating process evaluates whether the pass applies at that later action.
      then: The pass remains valid evidence about body A but applicability to the checkpoint is indeterminate unless independently established; the earlier matching read alone does not prove no intervening edit or claim enforcement.
    non_web_unverified:
      given: A participating repository has an Issue template, but a CLI creation path has no evidence of an applicable evaluator.
      when: A new Issue is created through that path.
      then: The template does not prove that the actual body conforms or that the path is enforced; the process outcome remains unverified until an applicable assessment is obtained.
    known_missing:
      given: A current applicable PR body has a known missing Motivation section and a successful structural assessment established that deficiency.
      when: The participating workflow reaches its declared checkpoint.
      then: The deficiency remains visible and the body is not reported as structurally conforming; correction or an explicitly authorized applicable exception follows the policy.
    exception_without_other_assessments:
      given: An applicable exception resolves a missing References requirement, but the Motivation assessment for the current body is unavailable.
      when: The participating workflow reports the checkpoint.
      then: References remains structurally missing with its separate exception, Motivation remains indeterminate, and the process does not report its full format obligation satisfied.
    checker_failure:
      given: An applicable body cannot be assessed because the checker fails and no sufficiently supported result exists.
      when: The participating workflow reaches its checkpoint.
      then: Assessment remains indeterminate rather than a pass or a confirmed missing section, and the workflow exposes retry or review without inventing content.
    stale_after_edit:
      given: A PR body passed the applicable structural profile, then its body changes before the workflow checkpoint.
      when: The process evaluates the current checkpoint.
      then: The earlier pass remains tied to the earlier body and is not applied to the new body without an applicable reassessment.
    permitted_exception:
      given: A policy explicitly permits an authorized participant to exempt a particular missing References section for an identified Issue and policy version; the actual applicable body and checkpoint are established and every other required section has an applicable structural pass.
      when: That scoped decision is recorded and applicable at the checkpoint.
      then: The process may report its obligation satisfied through the permitted exception while reporting that exception separately. The body remains structurally nonconforming because References is missing; no reference is fabricated or attributed to the author.
    external_read:
      given: An accessible external Issue does not use the participating format and no process assessment applies.
      when: GitView displays it.
      then: Its permitted original description is available without a fabricated section or hidden object and no authoring-process compliance is asserted.
  unresolved:
  - The initial GitView-only enrollment and agent pre-submit checkpoint are proposals; confirm the actual GitHub Repository identity, enrollment, path coverage, evaluator, authority and exception policy before deploying the process.
  - Source-specific capability and timing of any gate, coverage of edits, reliable body identity and semantic quality review require evidence.
  - No checker, GitHub enforcement, agent instruction rollout or GitView implementation has been installed or executed.
