sources:
  root_draft: docs/drafts/GITVIEW-SPEC-0001.yaml
  topic: docs/drafts/ux-zoom-levels-proposal.md
  authorization: conversation:gitview/excerpt-68
  ontology_selection: ontology/candidates/domain-v0.2.0-draft.4/composition-context.yaml
specification:
  objective: "Record the discussed farther-out time view and deeper PR exploration without making them first-version prerequisites."
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  requirements:
  - "A contribution-style calendar is a possible farther overview of time; its cells represent time, not repositories or PRs."
  - "Calendar measures must identify period, scope, source and missing coverage."
  - "Exploration inside a PR may be considered later; current scope ends at the object overview and original GitHub link."
  - "Neither a calendar nor deep PR exploration blocks the first-version grid and Peek and Pop."
  review_scenarios:
  - "Given a calendar day with unavailable history, do not label it a day with zero activity."
  - "Given a PR overview, offer the source without implying an in-app diff viewer exists."
  unresolved:
  - "Calendar measure, navigation and later PR depth are unresolved future decisions."
  evidence_boundary: "Scenarios are expectations for future verification, not executed tests. The ontology selection and specification remain drafts; implementation is not claimed."
