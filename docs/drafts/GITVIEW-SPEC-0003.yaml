specification:
  objective: Open the overview using observations GitView already holds and refresh from GitHub when
    needed, so reading an existing view does not require downloading its data again.
  working_assumption: GitView keeps previously fetched observations in an app-owned database across
    launches. The draft assumes local storage on the device. Storage technology and schema are open.
  ontology_refs:
  - gitview:GitHub
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  failed_refresh_feedback:
    required: Show the last successful update time for the affected data and a visible indication that
      the GitHub refresh failed. If there has been no successful update, show that no data has been loaded yet.
    example: 'Updated at 14:32 · Could not refresh GitHub data'
    proposed_placement: A visible status in the affected view, such as a warning icon with a text label
      in the toolbar. The exact component remains open.
  proposed_behavior:
    read: Render available stored data without waiting for a GitHub request. A refresh may run
      separately; opening a view does not require a new fetch for every visible object.
    refresh: Apply a successful observation to the scope it covers and record the time that scope
      was observed. For example, reading repository metadata alone does not refresh its PR or Issue lists.
    failed_refresh: Keep last known data and its observation time. Record the outcome of the refresh
      separately so a failed attempt does not make older values appear current.
    no_observation: Show that GitView has no data for the scope yet. An empty result requires a
      successful observation with enough coverage to confirm it.
  refresh_triggers:
    background: Request short background refreshes through iOS BackgroundTasks. iOS decides when
      to grant execution time. Use each opportunity for a bounded batch that can stop on expiration.
    foreground: When the app opens with stale data, show stored data and start an update of the
      stale scope as the request budget permits.
    manual: Let users request a refresh through pull-to-refresh where it fits the screen's
      interaction, or an equivalent Refresh action elsewhere. A manual request can refresh
      the current view before its data becomes stale, subject to the same API budget.
  request_budget_proposal:
    priority: Refresh data for the visible project and the current period first, including recently
      completed PRs needed by the timeline. Fetch older history in separate batches.
    pagination: Request pages within the endpoint limit and the available budget. A successful
      first page confirms only its coverage. When a batch stops early, preserve older observations
      and keep the unfinished scope marked incomplete.
    rate_limits: Limit concurrent requests and account for API rate limits and query cost.
      Pause on rate-limit responses and respect GitHub retry or reset headers when present.
  review_scenarios:
    open_from_storage:
      given: GitView previously saved observations for a repository and its PRs.
      when: The overview opens while GitHub is unreachable.
      then: The stored overview can open and indicates when the data was last observed.
    successful_scoped_refresh:
      given: Repository metadata and PR observations are stored with earlier timestamps.
      when: A refresh successfully returns only repository metadata.
      then: The repository metadata and its observation time update. The PR observation time stays as recorded.
    failed_refresh:
      given: A PR list has a previous successful observation.
      when: The next refresh fails.
      then: The previous list remains available. The view shows the previous successful update time and a visible
        GitHub refresh error.
    first_load_without_data:
      given: GitView has never successfully observed this Issue list.
      when: The first request fails.
      then: The view indicates that the refresh failed and that the Issue list has not been loaded yet.
    stale_on_open:
      given: The app has stored observations, and iOS has not granted a recent background refresh.
      when: The app opens and the visible scope is stale.
      then: The app shows the stored data and starts a bounded refresh if the request budget permits.
    page_budget_exhausted:
      given: More pages exist than the current refresh budget can fetch.
      when: The refresh reaches its budget after successful partial retrieval.
      then: The view can use newly observed records and retain older ones. Coverage for the unfinished
        scope remains incomplete.
    manual_refresh:
      given: The current view has stored observations and supports an explicit refresh action.
      when: The user pulls to refresh or invokes the equivalent action.
      then: GitView requests an update for the current view subject to the API budget. If it fails,
        the last successful update time and the visible failure indication follow the same rules as other refreshes.
  unresolved:
  - Which data scopes get priority in the background.
  - Which control each screen uses for manual refresh, and whether a PR detail view refreshes only that PR.
  - Whether the visible error uses a toolbar indicator, snackbar, alert or another component.
  - How account permissions constrain access to previously stored private content.
  deferred_to_implementation: Exact staleness thresholds, REST or GraphQL query selection, request and
    payload measurements, page size, pagination resumption and incremental retrieval.
  provenance_boundary: The owner proposed retaining fetched data, requested visible failure feedback,
    and identified background refresh, refresh on stale open and API limits as design inputs. Manual
    refresh is required with an interaction appropriate to each screen. Local placement, priority,
    batching and individual controls are proposals for review. The scenarios are intended checks awaiting execution.
