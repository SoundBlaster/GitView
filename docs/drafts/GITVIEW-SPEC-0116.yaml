acceptance:
- Source attempt, accepted fact, population coverage, local retention and present disclosure eligibility remain independently representable for the exact affected scope.
- Field evidence distinguishes supported values or absence from omitted, error-affected, inaccessible and conflicting information without converting them into zero or deletion.
- Object representations are associated only with sufficient typed source identity and Repository context; an Issue representation of a PR is not an extra Issue.
- A partial response can contribute supported fields without refreshing unrelated facts or asserting a complete population.
- Retention, replay and later reads preserve per-fact context and do not manufacture a source observation or a durable success.
- The route receives permitted prepared facts and limitations through injectable domain-facing boundaries without receiving raw credentials or treating a transport response as a domain object.
specification:
  objective: Specify the information contract between GitHub observations, retained local evidence and the Project work route without choosing source requests or a physical schema.
  ontology_refs:
  - gitview:GitHub
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    request_context: A source attempt captures its own identity, initiating source and account context, confirmed or unresolved Repository scope, requested object categories and field or event scope, and relevant selection period and revision where applicable. Request start and completion describe the attempt; neither is automatically an event time, a source ordering, a successful observation of every requested field or complete coverage. Cancellation, access and account changes are evaluated under their own contracts. Do not embed tokens or authorization responses in route-visible state or normal diagnostics.
    source_outcome: A completed source response may contain independently usable fields and scoped errors; transport success does not make every field or collection successful. Represent attempt outcome and affected scope separately from interpreted values, including incomplete response, source failure, cancellation or deferred work where supported. A generic error or status is not an invented denial, empty collection, deletion or proof of a specific cause. Attempts with different completion order do not establish source revision order under 0037 and 0053.
    graphql_error_attribution: For the selected GraphQL operation, interpret `data` and `errors` together using the actual response shape, request selections, aliases, schema nullability and response-path list indices. A field-associated error path names response keys, including aliases, and indices in that particular returned list; it is not a durable object identifier and must not be associated to a locally reordered collection by index. If non-null error propagation replaces an ancestor or list with null, treat the affected returned subtree as unavailable rather than reconstructing missing siblings or interpreting the propagated null as semantic absence. Independently returned siblings can supply supported values only where their own identity, path, source context and access remain established. An omitted data entry, malformed path, unscoped error or otherwise ambiguous association does not identify a precise field cause; conservatively limit the affected scope instead of attaching the error to an arbitrary object or declaring the operation empty. Preserve safe structured diagnostic classification without exposing raw private response paths, bodies or messages in ordinary UI or logs.
    graphql_transport_and_limits: GitHub documents that primary GraphQL rate-limit errors can accompany HTTP 200, and resource-limited requests can return partial results with an error. Evaluate the response envelope and applicable limit evidence before classifying a requested scope; HTTP 200 alone is not a complete successful observation. Apply the source-supported rate-limit and refresh policy under 0048, keeping any independently usable facts and their own coverage. Do not infer a permission denial, fabricate a numerical missing-object count, retry without regard to the documented reset or Retry-After evidence, or promote a last page to complete solely because another part of the response succeeded. The particular query, cost budget and live response behavior remain unverified.
    restored_source_outcome: After restart, expose a latest terminal source-attempt outcome only where its identity, scope and ordering context are independently recoverable under 0105. A recoverable prior fact is not proof that an ensuing source attempt succeeded or failed, and a retained failure is not a new attempt. If an outcome write or read is indeterminate, the route receives an unknown outcome or safe local recovery limitation rather than a fabricated success or GitHub failure. Apply current disclosure rules to the reason and affected scope.
    object_identity: Interpret each usable source record under the confirmed source instance and Repository identity and retain its actual source identifier kind and type. Normalize GitHub's PR-marked Issues representation under 0101 before counting or selection, using source-supported association rather than title or unscoped number. A record without enough evidence for type or identity remains unresolved and cannot be silently merged, opened as another object or counted as a confirmed distinct Issue or PR. A separately confirmed linked Issue remains its own object.
    field_evidence: For each requested or retained domain fact distinguish a source-supported value, source-supported absence where its semantics permit it, not requested, failed or unobservable for this attempt, access-restricted and unresolved conflict. Known zero and known empty are values only when the corresponding source semantics and scope establish them. A null-like field affected by an error is not authoritative absence; omission does not delete or refresh an earlier accepted value. Preserve why a field is unavailable only to the extent source and privacy evidence support that explanation.
    exchange_shapes: As an agent-authored interface contract, describe each attempt with its captured scope and outcome; each field update with its object and field identity, interpretation and supported context; each coverage result with its own scope and reference; each retention result with its logical operation identity; and each read with independently supported records, gaps or failures. These are separate value responsibilities rather than required Swift type names or ontology entities. A disclosure decision is an independent current projection over those facts and must not be stored as if it were a permanent property of a source value.
    field_update_interpretation: For one identified field, an update can carry a supported value, a source-supported semantic absence, or no accepted replacement with a reason such as not requested, field error or unavailable evidence. Conflict represents competing incompatible observations that cannot be ordered; retain or identify enough evidence under 0053. Not requested is a property of this attempt, not a command to erase a previous field. Access restriction is applied independently of either an old value or new attempt result and cannot be overridden by the existence of retained data. A source-supported empty collection or zero is a value for its proven scope, not an alias for not requested or failure.
    combining_updates: A usable new value or supported absence can replace a comparable earlier value for the current field only when applicable source evidence supports the new value and ordering. An omitted or failed field retains any independently readable earlier permitted value with its original context, or is unknown if none is recoverable; do not assign the new attempt time to it. A known earlier value can remain last known with a limitation when current applicability is unproven. Incompatible unordered values become conflicted or uncertain rather than choosing by arrival time. Successful siblings remain individually usable without promoting the entire response to complete.
    read_result_shape: A local read reports recoverable records and their individual evidence contexts, plus the scope of any unavailable, inconsistent or unresolved portion. Confirmed local absence means the read reliably supports absence of the relevant local record; it is not a confirmed empty GitHub collection. A locally stored empty-source observation requires its own valid source evidence and is distinct from no stored observation. If neither an earlier nor a later record is independently recoverable, the route receives unavailable or unknown, not an assumed earlier successful value.
    historical_retention_exchange: As an agent-authored information contract, submit one logical retention intent with its opaque operation identity and immutable binding, the source observation or explicitly attributed retrieval identity, the intended history generation captured when eligible work began, and one or more scoped evidence bundles. Each bundle identifies metric and predicate version, value or explicit unavailable state, unit and subject, confirmed or unresolved source identity, Repository and membership basis, source event time or state reference where supported, observation or retrieval context, coverage and applicable access context. Explicit unknowns are not represented as empty collections, zero or invented timestamps. An absent required context prevents a stronger claim but does not require rejecting an independently interpretable partial bundle. Do not include credentials, raw authorization responses or source text not needed by the selected retention policy. This describes information crossing the boundary, not one mandatory Swift type, table, batch-wide transaction or a durable success.
    historical_retention_outcome: Return the logical operation identity with applied, confirmed terminal non-application or conflict, or indeterminate status under 0103 and 0105. For an applied effect expose only the recoverable scoped effect and its evidence context; per-bundle outcomes remain separate when they did not commit atomically. A known non-application of one operation does not imply that another operation or the source attempt failed. An indeterminate admission, unknown generation or lost acknowledgement does not establish either a committed sample or safe non-application; reconcile using the original identity and clear boundary before replay. Current access is reevaluated separately before presenting retained contents.
    historical_read_exchange: A history read identifies the requested metric, Project or source scope and fixed temporal context, and returns independently recoverable supported values with their own predicate version, unit, time, membership basis and coverage, plus attributable incomplete, unavailable or conflicting portions. A complete zero requires its own source and population evidence; a successful read with no local records is local absence, not source zero. A persisted operation receipt is not itself a readable point or evidence of current authorization. A separately supported current-cache fact cannot silently replace missing history, and exact result serialization remains open.
    retention_result_shape: Bind the submitted operation identity and immutable intent to an applied, confirmed terminal non-application or conflict, or indeterminate result under 0103 and 0105. An applied receipt supports the historical local effect only if its binding and context are recoverable; it does not by itself establish that a later read succeeds. A known terminal failure does not prove an earlier observation survived an interrupted write unless an independent read confirms it. An indeterminate result cannot be turned into rollback, a new observation, or a distinct retry while an earlier effect could still commit.
    provenance: Associate each accepted fact with the exact object, source representation, field or event meaning, applicable observation and source-event times, relevant revision or ordering evidence, access context and scope. An event time can precede observation; an unavailable event time stays unknown. A last-known fact remains last known for its own context even if a sibling field is newly observed. Do not serialize a group of differently timed facts as one simultaneous current source snapshot unless independently established.
    coverage: Supply a separate coverage assessment for the requested Repository set, object category, Today alternatives or other predicate, selected period, applicable filters, source and access context under 0102. Distinguish unobserved, incomplete or unproven, and sufficiently established coverage with its supported reference; a last page or successful local write alone is not sufficient proof. A count of known candidates is not a count of unseen source objects. Keep a prior supported coverage claim at its original scope and time rather than advancing it with an unrelated partial field.
    aggregate_and_objects: Exchange and retain a supported aggregate claim independently from object-level materialization coverage. A durably retained count and its provenance need not contain member identities and cannot by itself supply a complete route input or fabricated cards. A local read must not report the grid as fully populated solely because an aggregate exists or the number of recovered objects happens to match it. An independently established exact collection retains its own identity, predicate and reference evidence; count and collection can support one another only to the extent their contexts and semantics are established as compatible under 0102.
    retention: A domain-aware boundary accepts a logical 0103 retention operation with its bound supported facts and interpretation context under 0105 and 0113. Return applied, terminal rejection or conflict where supported, or indeterminate independently of the source attempt. Same-operation replay cannot become another source observation, and a checkpoint or coverage advance cannot outlive the evidence required to support it. A successful cache write does not establish separate history retention or current source access.
    route_read: A work route reads the current saved Project membership and the eligible recoverable observations under their respective boundaries. Its prepared input includes per-object typed facts and limitations, an independently scoped population assessment, relevant latest source attempt and local retention outcomes, and safe access state. A pending source response can be presented transiently only when permitted and explicitly not claimed durable; an unreadable local read or an indeterminate save remains a recovery condition rather than a confirmed empty Project. The current Project identity and filter context are supplied by the route, not inferred from a source record.
    transient_identity_resolution: Under 0124 a source-supported identity association can be usable during the current session even when its local retention fails or remains indeterminate. Carry the association evidence and source context separately from the persistence outcome, show a safe recoverability limitation and do not claim it survives restart. Reapply current access and route relevance before projection. A local save failure does not imply source denial, and a source success does not imply a durable association.
    ordering_and_presentation: Reconcile only comparable facts using supported source ordering and current access, not callback completion or record insertion order. When values cannot be ordered retain an explicit conflict or uncertainty; a response started before denial or a previous account cannot unlock restricted content. Before producing visual, accessible, preview or sharing state, apply current privacy and relevance under 0036, 0112 and 0115. Suppress restricted identity, values and revealing aggregates, while preserving a safe general limitation where allowed.
    response_boundaries: The selection policy receives immutable prepared facts and their contextual uncertainty rather than raw GraphQL or REST payloads, database handles, credential values or UI objects. The route can change density, filters or navigation without causing the source observation itself to change; a newly relevant context requires a new evaluation. Exact Swift interfaces, source endpoint choices, serialization, scheduling and result presentation remain separately specified.
    verification: Prepare TDD cases with injected source responses and local outcomes for a partial response with a failed sibling field, PR issue representation, unknown identity, overlapping unordered attempts, denied access, lost save acknowledgement and restart. Verify real GitHub response mapping, persistent storage and native rendering separately from deterministic doubles. This specification and ontology checks do not demonstrate any implemented adapter or product.
    provenance_note: Offline last-known data, visible update errors, a dense Today overview and DI with TDD were requested by the owner. The evidence dimensions and boundary are agent-authored working refinements; they introduce no new product ontology entity or mandatory source API.
  scenarios:
    graphql_aliased_field_error:
      given: A GraphQL result contains two independently identified PRs in response order, and an error path uses the requested alias and index of the second PR's review field while the first PR and second PR's title are returned with supported identity and context.
      when: The source boundary prepares facts for a grid that is locally sorted in the opposite order.
      then: The error is attributed using the response path and query mapping rather than the later grid index; the second PR's review is unavailable or last known, while independently supported first-PR facts and the second title retain their own contexts.
    graphql_nonnull_propagation:
      given: A required nested GraphQL field fails and source schema nullability propagates null to its nearest nullable parent, leaving the parent's other requested fields absent from returned data.
      when: The route requests those fields for the affected object or collection.
      then: The omitted subtree is unavailable within its supported scope, no absent field becomes an empty value or a successful observation, and independently returned permitted siblings remain usable without a complete-population claim.
    graphql_200_with_rate_limit_error:
      given: GitHub responds with HTTP 200, a GraphQL rate-limit error and supporting limit evidence while some unrelated requested values are independently usable.
      when: The attempt is mapped for refresh and presentation.
      then: The rate-limited scope is not labeled successful or empty, supported siblings retain their own context, and the next eligible attempt follows applicable reset or retry evidence rather than immediate repeated requests.
    history_read_after_lost_retention_ack:
      given: An eligible historical sample's retention acknowledgement was lost, and the current source observation remains independently usable in memory.
      when: The route reads historical data before durable reconciliation.
      then: The receipt is indeterminate and the transient observation retains its own context; the read returns only independently recoverable history or an explicit limitation, without inventing a durable point or an empty source.
    history_bundle_partial_context:
      given: A retained permitted title has complete interpretation context but an independently submitted review-state fact lacks the source context necessary to interpret it.
      when: Those independently scoped evidence bundles are recovered.
      then: The title may remain usable with its own time, while the review fact is unavailable or uncertain rather than inheriting the title's context or becoming a confirmed historical review point.
    retained_count_missing_object:
      given: A source-supported aggregate of two PRs and its context were durably retained, but the source supplied and local storage retained facts for only one identified matching PR.
      when: The app restarts and prepares the work route from a successful local read.
      then: The count remains a separately attributed permitted measurement, the single recovered PR may be shown, and the route reports incomplete object materialization rather than inventing a second card or claiming an exhaustive grid.
    title_and_failed_ci_field:
      given: An applicable PR response successfully supplies a new title at T2 but its CI field has an error; a permitted CI observation from T1 is retained.
      when: The source response is normalized and the route is prepared.
      then: The title can carry T2 while CI remains last known at T1 or unavailable with its own limitation; no zero, current success or full-Project refresh is inferred.
    marked_pr_representation:
      given: A usable source record in an Issues response is marked as a PR and its association to a separately received PR identity is supported in the same confirmed Repository.
      when: The route builds its distinct work candidates.
      then: The two representations contribute one PR, their source ID kinds remain distinct and no independent Issue is fabricated.
    partial_with_storage_failure:
      given: A source attempt supplies two supported PR facts but leaves a second Repository unobserved and its local retention fails.
      when: The current route displays the result and later restarts.
      then: Permitted transient facts may be shown with their context and failure, Project coverage remains incomplete, and after restart no new durable observation is claimed without an independently readable save.
    unordered_values:
      given: Two applicable observations give incompatible current CI states for the same entry with no source-supported ordering.
      when: The route requests the current failure filter.
      then: The field remains conflicted or unknown and no callback order is used to manufacture a confirmed match or exclusion.
    stale_response_after_denial:
      given: A request for a private Issue began under account A, and a later applicable denial restricts its identity before that response completes.
      when: The result is mapped and the route renders.
      then: The old response cannot unlock the Issue or reveal its restricted identity or derived count; a permitted limitation may remain visible.
    absent_and_unrequested:
      given: A supported source response establishes an empty assignee collection for an Issue but did not request its review-related PR information.
      when: Facts are handed to their respective overviews.
      then: The Issue assignee collection can be known empty in that context, while unrequested PR review data is not cleared or labeled a zero review state.
    unsupported_null_with_prior_value:
      given: A PR review assessment was accepted at T1; a later source response at T2 returns null for that field with an error and contains a supported new title.
      when: The attempt and field evidence are combined for the permitted route.
      then: The title may use T2, the review retains its independently recoverable T1 value as last known or remains unavailable, and the error does not become a confirmed empty review or a T2 observation.
    supported_absence_with_order:
      given: An Issue's assignee collection was nonempty at T1 and a comparable source response at T2 independently establishes a complete empty assignee collection with sufficient ordering and access evidence.
      when: The current field result is prepared.
      then: The T2 collection can be reported as known empty for that scope while the prior observation retains its own history; this absence does not erase unrelated fields or historical facts.
    failed_write_does_not_restore_baseline:
      given: A title at T1 was reported saved, a later T2 retention attempt fails, and the subsequent local read cannot establish either title or its evidence.
      when: The route is recovered after interruption.
      then: Neither T1 nor T2 is claimed durably recovered solely from earlier acknowledgements; the affected title is unavailable or unknown and local recovery remains separate from source emptiness.
  unresolved:
  - Select concrete Swift interface shapes and source-to-domain mappings for the chosen GitHub operations, including source-specific errors, identity association and coverage evidence.
  - Define the physical atomic retention and recovery boundaries and validate access, timestamps and conflict handling with the selected SQLite and Keychain design.
  - No adapter, live GitHub interaction, persistence, product TDD cycle or native presentation has been implemented or verified.
