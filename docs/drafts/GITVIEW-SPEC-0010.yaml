id: GITVIEW-SPEC-0010
title: GitView - Issue and PR description formats
kind: spec
created_at: '2026-11-10T00:00:00Z'
updated_at: '2026-11-10T07:33:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0001
depends_on:
- GITVIEW-SPEC-0008
- GITVIEW-SPEC-0009
sources:
  working_ontology_context: ontology/candidates/domain-v0.2.0-draft.12/composition-context.yaml
  ontology_selection_scope: The draft.5 ontology_selection records an earlier source context; draft.12 is the current working composition. Neither is semantically approved by this reference.
  root_draft: docs/drafts/GITVIEW-SPEC-0001.yaml
  topic: docs/drafts/github-templates/README.md
  authorization: conversation:gitview/excerpt-68
  ontology_selection: ontology/candidates/domain-v0.2.0-draft.5/composition-context.yaml
  pilot_autonomy: conversation:gitview/excerpt-72
specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Use the agreed structured descriptions and preserve the original authored content.
  ontology_refs:
  - gitview:Issue
  - gitview:PullRequest
  requirements:
  - Issue description format contains Problem, Motivation, Expected outcome and References.
  - PR description format contains Problem, Motivation, Expected outcome, Changes, Validation and References.
  - Require the agreed sections in Issue and PR descriptions created through the participating repository process;
    templates and agent instructions support that requirement but are not by themselves proof of enforcement.
  - Existing or external objects remain visible when their descriptions use another format or sections
    are missing; do not invent missing text.
  - Treat Motivation, Expected outcome and Validation as authored statements, not independently proved
    motive, achievement or test evidence.
  review_scenarios:
  - Given an external Issue with no Motivation section, retain its text and indicate absence rather than
    fabricate a motivation.
  - Given a PR Validation statement, show it separately from observed CI.
  unresolved:
  - Template installation targets, enforcement, parsing and versioning remain outside this reading contract.
  pilot_scenarios:
    legacy_description:
      given: A legacy PR contains unstructured text and no section headings.
      when: It is opened in GitView.
      then: Its original text remains available and missing sections are not invented.
    claimed_validation:
      given: A PR description says validation passed but the observed CI failed.
      when: Both are available.
      then: The description and failed CI remain separate and the CI failure is visible.
acceptance:
- Issue sections are Problem, Motivation, Expected outcome and References; PR adds Changes and Validation.
- In participating repositories the agreed format is required for newly created Issue and PR descriptions;
  the process must cover the supported creation paths. Template installation and the enforcement mechanism
  are separate deployment decisions and are not claimed to exist.
- Display original text when a section cannot be reliably extracted, and never invent missing sections
  or suppress nonconforming external objects.
- Treat declared motivation, expected outcome and validation as author statements, distinct from proved
  causal motives, actual outcomes and observed CI.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
