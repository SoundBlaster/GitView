specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Make workload and completion trends interpretable without inventing historical data.
  ontology_refs:
  - gitview:Metric
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - Provide metrics and charts for current work and outcomes where sufficient observations or source history
    are available.
  - Define each metric by subject, unit, scope, period and available coverage; distinguish snapshots from
    events.
  - Display merged PRs and closed Issues as distinct series and preserve closure reasons.
  - A historical value without sufficient applicable evidence is a gap or explicitly incomplete, not zero; do not claim a historical trend
    from one current snapshot. Separately supported source history can establish a past event even when it was observed later.
  - A burndown-style understanding of unfinished work and completion is desired; exact calculation and
    graph form remain open.
  review_scenarios:
  - Given neither an eligible state sample nor sufficient other evidence for a particular day and metric, its chart shows a gap rather than a zero.
  - Given a PR and an Issue describing the same work, series remain separate and are not called two completed
    tasks.
  unresolved:
  - Retention, event reconstruction, metric period and burn-down definition.
  pilot_scenarios:
    history_gap:
      given: An open-work state series has no eligible Tuesday sample or other sufficient evidence for the stated metric.
      when: A trend spanning Monday through Wednesday is drawn.
      then: Tuesday is a gap, not a zero or interpolation presented as observed.
    later_observed_event:
      given: No observation was taken on Tuesday, but a later permitted source observation sufficiently establishes a specific Issue closure event that occurred during Tuesday.
      when: A Tuesday closure outcome is evaluated.
      then: The event can support that Issue's contribution with its actual event and observation times. The single event does not establish complete bucket coverage, a zero for other Issues or Tuesday's open-work state.
    reopen:
      given: An Issue closes, reopens and later closes again.
      when: Historical metrics are requested.
      then: A count requiring event history is only asserted if the source or retained history supports
        the rule.
acceptance:
- Metric descriptions identify subject, unit, scope, time period, source and coverage; current snapshots
  are distinct from historical events.
- Show current open PR and Issue counts separately; when adequate history exists show merged PR and closed
  Issue outcomes separately with source closure reasons.
- A historical metric without sufficient applicable evidence remains a gap or is explicitly incomplete; a single current snapshot is not backfilled as past history. A later source observation may independently support an earlier event within its actual coverage.
- The desired burn-down view is completion and unfinished-work visibility; its formal formula and cohort
  are not assumed.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
