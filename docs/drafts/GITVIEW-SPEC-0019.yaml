acceptance:
- The operator can authorize GitView to read GitHub data and identify the connected source account.
- Repository discovery and selection respect the connected account's available access and show incomplete
  discovery distinctly.
- Credentials are protected using platform-provided secure storage and are not included in shared content
  or ordinary diagnostic logs.
- A network failure does not itself erase previously accepted observations; eligible last-known data and
  the affected refresh failure remain distinguishable. Explicit authentication or permission denial is
  distinguished from a successful empty result.
- The operator can reconnect or disconnect the account; disconnection does not issue GitHub mutations
  or silently delete source repositories.
acceptance_evidence:
- criterion: Authorization, partial access, disconnection and recovery are checkable.
  evidence: The scenarios below describe expectations for future verification; no GitHub connection has
    been implemented.
specification:
  objective: Give the operator a safe path from first launch to authorized GitHub repository data.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Repository
  - gitview:Project
  pilot_contract:
    account: 'Support one connected GitHub identity in the initial pilot. GitView User means the operator,
      not necessarily the author or assignee of a source object. Multiple accounts and GitHub Enterprise
      are not required for this first slice.

      '
    access: 'Request only access needed for the selected repositories and supported read-only overview.
      Distinguish the app''s read-only behavior from permissions actually granted to a credential; any
      broader grant needs explicit justification and disclosure under 0087. Candidate 0098 proposes a
      GitHub App public-client flow; exact permission names and GitHub API mapping require further research.
      The app does not create, review, merge or otherwise mutate source work objects in this pilot; user-mediated
      authorization or installation is a separate provider-side access decision.

      '
    discovery: 'Once authorized, let the operator find and select accessible GitHub repositories. Source
      identity follows GITVIEW-SPEC-0002; the default Project relationship follows GITVIEW-SPEC-0005.
      An inaccessible or unobserved repository is not treated as a confirmed empty or deleted repository.

      '
    credentials: 'Protect credentials using platform secure storage; do not place secrets in diagnostics,
      sharing, exported descriptions or version-controlled configuration.

      '
    failure: Distinguish temporary network or rate failures from observed authentication and authorization
      failures. A 404 alone cannot prove deletion or revocation. For confirmed access revocation of a
      private Repository, preserve and show the saved local observations, identify the revocation and
      supported update time when known, and stop synchronization under canonical 0019. Offer a point of
      access for recovery or explicit local deletion without asserting restored GitHub access. Other access
      and account cases require separate refinement.
    disconnect: Provide a deliberate local disconnect action that stops new refresh for that account and
      attempts to remove the app credential. Confirm local credential removal only when established; unsuccessful
      or uncertain removal remains a visible recovery problem under 0058. Preserve locally saved data
      and a user-visible point of access for understanding and recovery or explicit deletion; detailed
      account isolation and presentation remain to be refined. No GitHub object is deleted.
  scenarios:
    first_connection:
      given: No GitHub account is connected and the operator begins the proposed setup route.
      when: The source identity is independently confirmed, a Repository is discovered with applicable
        eligibility, and the operator explicitly confirms default setup.
      then: After a valid Project is established or reused, the operator can enter it even while PR and
        Issue observations are unobserved or loading. Authorization or selection alone does not establish
        a Repository grant, save a Project or prove work data is observed; unresolved setup remains recoverable
        under 0022 and 0045.
    temporary_offline:
      given: A connected account has stored observations and supported observation times eligible for
        display under the current access policy.
      when: A refresh fails because the network is unavailable, with no independently accepted newer observation
        or change in access.
      then: The eligible last-known data and its supported observation time remain available with a visible
        refresh failure for the affected scope.
    explicit_access_denial:
      given: A previously observed private Repository has saved data and the source explicitly confirms
        its access revocation.
      when: The operator requests refresh after the revocation has been confirmed; no synchronization
        request is sent for that Repository while revocation applies.
      then: The app distinguishes revocation from an empty Repository, retains and shows saved data with
        the access indication and supported update time when known, stops synchronization and offers access
        to recovery or explicit local deletion.
    disconnected:
      given: One GitHub account is connected and the candidate offline policy is selected.
      when: The operator disconnects it.
      then: The account stops refreshing, and local credential removal is confirmed only if established.
        Saved data is not silently removed or hidden as an assumed default; a path to recovery or explicit
        local deletion remains. No source Repository is deleted and account isolation details remain open.
  unresolved:
  - Validate candidate 0098's authorization method and rotation; determine least-required GitHub permissions
    and concrete account recovery.
  - Exact local clear-data interaction and behavior after device change.
  - Repository discovery pagination and first-launch layout.
  provenance_boundary: 'Single-account scope and the default privacy posture are pilot choices made under
    the owner''s autonomous authorization; they are not claims about implemented security or accepted
    API details.

    '
