acceptance:
- An object's inclusion evidence, each active filter input and its displayed current state retain their own time, revision, scope and coverage where applicable.
- A confirmed same-day event can establish Today inclusion without establishing the object's present lifecycle or the outcome of another filter.
- An obsolete or inapplicable lifecycle or CI observation is not used as a confirmed current match or exclusion merely because another field refreshed.
- A confirmed false required condition can exclude only within the time and source context that supports that condition; an unknown required condition remains uncertain unless another applicable false condition decides the conjunction.
- A source-confirmed newer PR revision does not silently inherit status checks observed for an older revision.
- Distinct-time observations are not presented as a confirmed simultaneous source snapshot without sufficient evidence.
- Current access restrictions apply before displaying candidate identity, retained values or derived counts.
specification:
  objective: Clarify how Today inclusion and filters use observations from different times and revisions without requiring a particular source request strategy.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:CIStatus
  contract:
    claims: Interpret each source fact with its established object identity, scope, event time if applicable, observation time, field coverage and revision context. A time at which GitView received a response is not automatically the time a source event occurred. A field omitted from a later response retains its own earlier context under 0044.
    today_event: A source-confirmed eligible creation, merge or closure event can establish its Today inclusion alternative by event time, even when learned later and even if current lifecycle is unknown or later changes. The event does not alone establish the entire intervening history, a present open or closed state, an achieved outcome or the result of a separate current-state filter. Source correction, identity conflict and access restrictions remain independently applicable.
    current_lifecycle: A lifecycle observation supports the state and time it actually establishes. If reliable evidence places a conflicting lifecycle transition after an older state observation, do not present the older state as confirmed current. Do not infer a complete later state solely from an isolated event where reopening or other transitions remain possible; establish it independently or show it as unknown or last known. A confirmed current open state can still supply the unfinished alternative under 0027.
    revision_context: A CI result is attributable to its observed check entry and applicable PR revision or revisions under 0060. If a newer PR head is confirmed and no evidence establishes that the earlier checks apply to the selected current check context, the old check result remains historical or last known and the current CI filter input is unknown. Head and test-merge contexts are not automatically interchangeable. A new head alone does not order or invalidate unrelated review fields without their own source semantics under 0053.
    evaluation: First derive each inclusion alternative and active-filter condition only in the stated selection context, using unknown when an applicable current value is not established. Then apply 0027's disjunction and conjunction. A true historical Today event may confirm base inclusion while an unknown current CI or lifecycle filter makes the filtered outcome uncertain. An independently confirmed false required condition may determine exclusion only for its own applicable context; a stale false value is not a current false condition.
    observation_not_snapshot: A set of individually supported facts from different times may be presented with each fact's own context where access permits. Do not call their conjunction a confirmed simultaneous current source snapshot or assign one shared freshness time without source or reconciliation evidence. Completion of one field's request does not refresh a different field or the complete collection time.
    selection_and_coverage: Preserve explicitly selected Project, Repository scope, period mode and filters through reevaluation under 0042 and 0049. Dynamic Today uses the current applicable local-day interval, while a fixed historical period retains its separately defined boundaries; preserving the selection does not freeze an obsolete Today interval. A partially observed candidate or unobserved source portion remains discoverable through an access-safe uncertainty path; a confirmed Today alternative alone does not make the entire Project's source coverage complete. Identity ambiguity and shared Repository deduplication follow 0002 and 0029.
    privacy: Apply 0036 and 0088 before presenting current or historical facts, candidates, links and derived values. An older permitted observation cannot override a later applicable denial or disconnect; information already handed to the system or another app cannot be recalled.
    verification: Under 0040 and 0079, controlled tests should cover event time versus retrieval time, newer revision versus older CI, stale known-false inputs, incompatible or missing source ordering, and access changes. Check actual source and native boundaries separately. A finite independent-input truth table does not by itself test temporal applicability, source truth or product behavior.
    provenance: The owner's requirement keeps completed work visible in Today. Evidence composition, treatment of obsolete states and revision scope are agent-authored refinements of that requirement.
  scenarios:
    event_after_old_open:
      given: An Issue was observed open at T1; an independently confirmed closure event occurred later today at T2, and no later lifecycle observation is available.
      when: The unfiltered Today selection is evaluated.
      then: The same Issue remains eligible through its Today event, the old open observation keeps T1 and is not labeled confirmed current, and no later reopening history is invented.
    head_changes_before_ci:
      given: A PR was observed with a failed check for revision R1, then a source-confirmed head R2 is observed without applicable R2 or test-merge checks.
      when: The current failed-CI filter is evaluated.
      then: The R1 result may remain permitted last-known evidence for R1, while the current filter is uncertain rather than a confirmed match or exclusion.
    inclusion_true_filter_unknown:
      given: A source-confirmed merge event places a PR in Today, but its current CI status is unavailable and a failed-CI filter is active.
      when: The filtered collection is evaluated.
      then: The event confirms base Today inclusion while the current filter outcome remains uncertain; the PR is accessible only through the permitted uncertainty path.
    stale_false_filter:
      given: A PR matched Today and an old observation classified its checks as non-failing, but the applicable current check context is no longer established.
      when: The current failed-CI filter is applied.
      then: The old non-failure is not used as a confirmed current exclusion; the permitted candidate remains uncertain unless another independently applicable false condition determines exclusion.
    mixed_observation_times:
      given: A PR lifecycle is observed at T1 and an applicable review field at T2, with no evidence that both were simultaneous.
      when: The overview or a combined summary shows them.
      then: Each fact retains its own context and the combination is not asserted to be a simultaneous snapshot or assigned a fabricated shared observation time.
    denied_before_late_result:
      given: A private PR and its earlier failed CI were visible before explicit access denial; a previously started response arrives after denial.
      when: Today and its failed-CI filter are reevaluated.
      then: Restricted identity, facts and revealing counts remain hidden, and the late response alone cannot restore access or create a confirmed current match.
  unresolved:
  - Source-specific ordering, revision applicability, correction and freshness evidence remain to be established for each selected field.
  - Exact representation of individual observation contexts, uncertainty and accessible recovery requires UX and platform evaluation.
  - No source adapter, retention mechanism, actual privacy behavior or application implementation has been tested.
