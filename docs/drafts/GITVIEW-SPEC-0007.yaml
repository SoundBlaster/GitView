acceptance:
- The unfiltered Today view includes unfinished PRs and Issues, including those created before today.
- Today represents current work. Inclusion and retention of completed cards remain open; historic aggregate metrics do not require a past-state viewer.
- Explicit filters may narrow the applicable current-work selection; the default treatment of completed lifecycle states remains open.
- Each source-confirmed PR or Issue occurs once in a selection, retains its repository identity and is not
  conflated with a linked object; unresolved identity is not represented as confirmed uniqueness.
- Filters, scope and selected time group remain identifiable and survive density changes and return navigation.
- Incomplete, stale or unknown observations do not become a confirmed empty result or a successful current
  state.
acceptance_evidence:
- criterion: Unfinished work and same-day completion remain in Today
  evidence: older_open_item, completion_in_view, many_completed and closed_without_merge are expectations
    for future verification.
- criterion: Explicit filtering and stable navigation
  evidence: exclude_completed, exclude_every_state and zoom_and_return are expectations for future verification.
- criterion: Identity and changing source observations
  evidence: cross_repository_identity, reopened_item and incomplete_observation are expectations for future
    verification.
specification:
  current_intent_boundary: The owner clarified Today as the current work picture in conversation_memory/sketches/gitview revision a748240310ba46aca7e16424b35f2b3c, node grid-today-current-work. Calendar-day inclusion, automatic same-day retention and a historical work viewer in selection_contract, filters, scenarios and acceptance_evidence below are superseded candidates, not first-version obligations. Preserve the general identity, filters, uncertainty and access outcomes; the completed-card rule remains open.
  objective: Let the user see work and its completion in the selected Project or Repository and time group,
    with explicit filters.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  selection_contract:
    scope: 'The input is the selected Project''s member repositories or a selected Repository. Show each
      object in its source Repository context. A PR and a linked Issue are different objects; equal numbers
      in different repositories do not identify the same object.

      '
    today_unfinished: 'Treat a source-observed open PR, including a draft PR, and an open Issue as unfinished
      work for this first selection. Include them even when created before today. Draft is a flag, not
      a lifecycle state. Other possible interpretations of unfinished work remain open.

      '
    today_results: 'Include a PR merged or closed without merge today and an Issue closed today, even
      if it was created before today. Show the current state only with applicable evidence; an unavailable
      current state remains unknown and a retained earlier state keeps its observation context. Closing an Issue is not automatically successful
      completion; keep its source reason when available. When the source provides a creation time within
      today, retain that object''s card within the current day''s unfiltered selection.

      '
    same_day_continuity: 'When an observed open item closes or merges today, update its card rather than
      removing it merely because its lifecycle state changed. For example, if 95 of today''s 100 PRs merge,
      the unfiltered selection still contains the 100 PRs, subject to confirmed identities, same scope, access and observation coverage; an open-only refresh does not by itself prove what happened to unreturned PRs.

      '
    identity: 'A source-confirmed object appears at most once within one selection even if several inclusion
      conditions match. If available information cannot establish whether two observations identify the same
      source object, retain the uncertainty without asserting that they are distinct or silently merging them
      by display name. Repository identity is stable across source-confirmed rename or transfer as in
      GITVIEW-SPEC-0002. Membership in multiple Projects does not merge their contexts.

      '
    reopened: 'A currently open object is included as unfinished even if it previously closed. Show its
      current source state. Do not assert a complete sequence of reopenings or historical results without
      the corresponding source history.

      '
    time_boundary_proposal: 'For this working draft, interpret Today as the current local calendar day
      on the device, from its start through the start of the next local day. Re-evaluate the date grouping
      when that day or the device time zone changes; do not change stored event timestamps. The treatment
      of time-zone changes during an active interaction and historical grouping remains to be refined.

      '
    temporal_mode_boundary: 'As an agent-authored first-version navigation direction, distinguish the ordinary dynamic Today selection from an explicitly opened historical outcome selection. Under the proposed local-day interpretation, Today uses its current local day and unfinished-work alternatives; an outcome selection uses the origin''s fixed period, captured Repository basis and named event predicate under 0056. A historical merged-PR or closed-Issue list is a selection for that condition, not a complete general timeline of everything created, updated, closed without merge or open in that period. The all-lifecycle default means no implicit current-lifecycle restriction within the selected mode; it does not expand the origin''s historical event predicate. A broader general past-period grid and its event and membership semantics remain open, rather than being silently replaced with an outcome list or implied by a chart. Under the direct ordinary Project-work entry candidate, that work route starts in Today under 0024; selecting or leaving a historical mode follows an explicit route and preserves its actual context. This temporal rule does not select direct entry for multi-member Projects.

      '
    incomplete: 'A missing lifecycle state, relevant timestamp, repository observation or page is not
      evidence of exclusion or of an empty period. Use known observations without presenting unknown or
      stale values as current facts; expose affected coverage or freshness according to GITVIEW-SPEC-0003.
      A confirmed empty result requires sufficient coverage of the active scope and filters.

      '
  filters:
    initial: 'In an unfiltered scope and time group, do not hide an object solely because it is open,
      merged or closed. Lifecycle filtering is explicit. The interface need not show every control simultaneously.

      '
    state: 'Let the operator exclude merged PRs or closed PRs and Issues to focus on unfinished work,
      without changing the underlying objects. PR closed without merge and Issue closed retain their distinct
      meanings; neither is silently equated with merged.

      '
    composition: 'Apply selected scope, time group and explicit type or lifecycle filters together. A
      Project signal can establish an additional condition, such as failed CI, across its member repositories.
      Its originating scope and active condition remain identifiable.

      '
    uncertainty: 'Evaluate inclusion alternatives and active filters separately as specified in 0027.
      An unknown input does not override an independently confirmed inclusion alternative or a known-false
      condition. If the overall result remains unknown, do not classify it as a confirmed match or non-match.
      Keep uncertainty or incomplete coverage visible rather than presenting the resulting list as exhaustive.

      '
    all_excluded: 'If the user explicitly excludes every applicable lifecycle state, show an intentional
      filtered empty result and make the active exclusions identifiable. This differs from no data or
      a failed load.

      '
    interaction: 'Changing density does not silently reset scope, time group or filters. Returning from
      an object restores these choices and the prior position when available. An open object overview
      does not disappear merely because a refresh changes whether it matches the originating filtered
      list; update the list predictably when returning.

      '
  review_scenarios:
    older_open_item:
      given: An Issue was created yesterday and is currently observed open.
      when: The operator opens the unfiltered Today view for its Repository.
      then: The Issue appears as unfinished work even though it was created yesterday.
    completion_in_view:
      given: An open PR from an earlier day is visible in today's unfiltered selection.
      when: A successful observation reports that it was merged today.
      then: The same card remains in Today and now shows merged.
    many_completed:
      given: Today contains 100 distinct PRs in the current scope and the observation coverage is complete.
      when: Ninety-five of those PRs are observed merged today.
      then: The unfiltered selection still shows all 100 with their current states.
    closed_without_merge:
      given: A PR is closed without merge today and an Issue is closed today with a non-completion reason.
      when: Today is shown without lifecycle exclusions.
      then: Both are visible with their respective source states and the Issue reason if available; neither
        is presented as merged.
    exclude_completed:
      given: Today contains open PRs, merged PRs and closed Issues.
      when: The operator excludes merged and closed states.
      then: Open work remains and known merged or closed objects are hidden while the exclusions remain
        identifiable.
    exclude_every_state:
      given: The operator excludes every applicable lifecycle state.
      when: The filtered view is displayed.
      then: It indicates an intentional filtered empty result rather than a load error or confirmed absence
        of source work.
    reopened_item:
      given: An Issue closed earlier was reopened and is currently observed open.
      when: Today is shown.
      then: The Issue appears once as unfinished and no unsupported historical completion is inferred.
    cross_repository_identity:
      given: Two different repositories in one Project each have an Issue numbered 42, and one Issue is
        linked to a PR.
      when: The Project's unfiltered selection is shown.
      then: The two Issues remain distinguishable by repository and the linked PR remains a separate object.
    incomplete_observation:
      given: One Project repository has not completed its Issue retrieval and an earlier observation may
        be stale.
      when: The operator filters the Project's Issues.
      then: Known objects remain usable and the affected coverage or freshness is visible; the view does
        not claim an exhaustive empty result.
    zoom_and_return:
      given: The operator opens a PR from a filtered Today grid at a chosen density.
      when: The operator returns after the PR no longer matches the active filter.
      then: The Project, Today, filter and density remain; the list reflects the updated state predictably
        and restores position where possible.
    historical_outcome_is_not_general_timeline:
      given: A Project history chart has a permitted distinct merged-PR outcome for a fixed past interval; another PR was closed without merge in that interval and an Issue was created then without a supported closure.
      when: The operator opens the merged-PR outcome without applying a current-state filter.
      then: The destination identifies its fixed interval, captured scope and merge-event condition, and displays supported matching PR identities once with their separately observed current states. It does not claim to show every past PR or Issue, silently include the other objects as merge matches, or infer their absence from history. A broader past-period grid remains a separate unselected contract.
    clear_last_historical_condition:
      given: A fixed historical outcome selection has only its origin event condition and the operator removes that condition.
      when: No other valid temporal mode remains selected.
      then: The route requests or exposes explicit time-scope selection under 0092 instead of silently presenting the old objects as dynamic Today or an exhaustive general history. Explicitly choosing Today evaluates its current scope and evidence independently.
    date_boundary:
      given: The device's local calendar day changes while the app is open.
      when: The Today selection is next updated.
      then: The selected day is re-evaluated without rewriting the stored event timestamps.
    next_day_completion_and_unfinished:
      given: A permitted PR was merged during the previous local day and another permitted PR remains open from that day; sufficient applicable evidence supports both states and times.
      when: The working local-day Today selection is evaluated on the following day without lifecycle exclusions.
      then: The open PR remains eligible as unfinished work, while the earlier merge alone no longer qualifies the merged PR for the new Today. This does not delete it or prove that historical outcome access is complete; a supported explicit past-period outcome route remains separate.
    partial_open_only_refresh:
      given: Today includes a previously observed PR and an open-only refresh does not return it; no sufficiently supported newer lifecycle or same-day outcome is available.
      when: The Today view incorporates the refresh.
      then: The missing result alone does not establish merge, closure or deletion. The retained eligible observation and its time may be shown with applicable uncertainty and incomplete coverage rather than claiming a current state or a complete list.
  unresolved:
  - Precise grouping and inclusion rules for older completed outcomes and historical reopening sequences.
  - Whether other non-open states should count as unfinished beyond the working first-selection rule.
  - Exact filtering control and interaction during a clock or time-zone change; 0024 and 0042 propose
    position fallback and sorting, subject to review.
  - Source mapping, pagination, history availability and exact freshness thresholds; see GITVIEW-SPEC-0003.
  provenance_boundary: 'All lifecycle states by default, retaining today''s completed work, older unfinished
    work and explicit state filtering follow the user''s discussion. The local-day interpretation and
    detailed interaction and uncertainty rules are working specification choices, not previously observed
    app behavior. Scenarios are expected behavior for later checks; no app implementation or executed
    UI test is claimed.

    '
