acceptance:
- Issue comment count, distinct discussion-participant count and latest comment time retain their own units, scope and observation context.
- A missing or incomplete comment population, unavailable author identity or restricted evidence cannot silently become a complete zero or exact comment-author count; the separately supported source participants aggregate retains its own evidence.
- A comment's creation time is distinct from Issue update time, observation time and a later comment edit.
- When a distinct comment-author metric is evaluated, two comments by the same confirmed author count once and unresolved identities are not silently merged by display name.
- A supported GitHub participating-Users count is available with its source-defined population and is not presented as a complete count of all possible discussion actors.
- The Issue overview does not require showing individual comment text or identifying restricted participants to display a permitted aggregate.
specification:
  objective: Specify interpretable source-scoped discussion counts and latest comment time for the selected Issue overview without treating Issue comments as PR review threads.
  ontology_refs:
  - gitview:Issue
  - gitview:Repository
  - gitview:Metric
  contract:
    population: As an agent-authored initial proposal, comment count, comment-author count and latest comment time concern source Issue comments in the explicitly described Issue and source-access scope, not PR review threads or comments in linked objects. The GitHub participating-Users metric has its separately documented conversation population and is not assumed identical to the comment-author population. Current accessible source comments and historical comments are different populations; a retrieved current set must not be described as a complete historical record of deleted or hidden comments.
    comment_count: Count distinct confirmed source comment identities in the stated current population, or accept a source-provided count only when its documented population and semantics match the stated metric. A source aggregate and a locally enumerated subset must not be summed as though independent. Coverage and time follow 0044; unknown, inaccessible or incomplete populations are not a confirmed zero.
    source_comment_count: GitHub documents Issue.comments as a connection of comments associated with the Issue and its IssueCommentConnection totalCount as a count of that connection's items. This is a candidate source aggregate for the current Issue comment count, not automatically proof of complete participant identities, last-comment time, historical deleted comments or visibility beyond the actual response context. Accept its value only when source identity, scope, errors, access, population equivalence and applicable observation context support the stated claim; do not add separately fetched pages to totalCount.
    participants: As the agent-authored first-version source-aligned working choice, make a supported count of GitHub Users participating in the Issue conversation inspectable with that explicit source-defined meaning, source and observation context. GitHub documents Issue `participants` as a UserConnection and UserConnection `totalCount` as its item count. This is a candidate mapping for the selected participant counter, not a claim that all human and non-User actors, every comment author or every historical participant are included. Source schema does not specify a complete participation-membership algorithm or establish the selected operation's permission, visibility, current applicability or snapshot behavior. Do not promise a category-specific exclusion beyond the source's supported type and semantics; identify unproven broader coverage instead of presenting the value as all possible actors. An unavailable or error-affected count remains unknown or last known under its own context, not zero.
    comment_authors: A distinct comment-author count is a separate agent-authored candidate, not the definition of GitHub's participants connection. It counts confirmed authors of comments in the explicitly stated comment population, including qualifying supported non-User actors where stable source identity is established. An Issue creator, assignee, reviewer or mentioned person is not included solely because of that role. Do not require enumerating comment authors merely to show a supported participants aggregate; do not present the author metric as the source participant count without established equivalence.
    source_participants_boundary: Do not add the GitHub participating-Users count to a distinct comment-author count or substitute either for the other without evidence of matching population, identity, visibility and timing. When both are available they retain separate labels, units and contexts. The broader operator meaning of participant, especially coding agents and bots, remains open; the source-labeled count does not claim to resolve it.
    identity: For an independently enumerated comment-author metric, deduplicate actor identities within their source instance using evidence that the source actually establishes as the same actor. Matching display names, deleted-user labels or missing authors are insufficient to merge identities. If one or more qualifying comments have unknown, inaccessible or ambiguous authors, the exact distinct-author total is unknown or incomplete even when a number of confirmed distinct authors is known. This does not by itself invalidate a separately supported source participants aggregate. Do not call the observed subset a present-day lower bound without sufficient timing and population evidence.
    latest: The latest comment time is the maximum confirmed source creation time among comments in the stated population only when the relevant population and its timestamps are sufficiently covered for that claim. If no comments are confirmed under sufficient coverage, the result is known absence of a latest comment, not a fabricated timestamp. With partial population or missing timestamps, an observed latest-so-far may be shown with explicit incomplete coverage, not as the exact latest comment time.
    latest_without_full_enumeration: Complete retrieval of every comment body or participant is not intrinsically required for a latest-time claim. A source-supported operation that establishes the maximum creation instant over the exact applicable visible comment population and reference context can suffice if its ordering, filtering, access, errors and consistency are actually justified. Otherwise retain uncertainty. Equal latest creation instants may support an exact latest time without determining one unique latest comment identity; do not invent that identity or claim a complete discussion history.
    source_ordering_limits: GitHub documents the GraphQL IssueCommentOrderField as UPDATED_AT, while IssueComment has separately described creation and update times. Therefore an item first in an update-time ordering can be an older comment edited after a newer one and is not by that fact the most recently created comment. GitHub's REST per-Issue comment listing documents ascending ID order and its since parameter filters by update time; neither fact alone is treated here as a demonstrated creation-time maximum, deletion history or snapshot guarantee. The exact operation and its sufficient source semantics remain open.
    timestamps: Keep comment creation, edit if separately supported, Issue last update and observation time distinct. A title change or comment edit does not by itself create a new comment or prove a newer comment creation time. A newly read comment can have a creation time earlier than its retrieval time. If the source has a different documented definition of latest comment, that mapping requires explicit evidence before substituting it.
    removal_and_access: A deleted, inaccessible or newly restricted comment is not automatically evidence of a source-empty discussion or historical absence. Re-evaluate the stated current population and any retained observations under their coverage and source semantics. Restrict private source content and revealing derived counts under 0036; a public Issue alone does not prove every linked or historical detail is eligible to disclose.
    partial: A successfully observed subset can contribute permitted known comment identities and authors with their observation times. It cannot establish the complete current comment count, participants or latest time unless separate source evidence suffices. A new Issue title or lifecycle observation does not refresh an omitted discussion field; an earlier result retains its own context under 0044 and conflicts follow 0053.
    presentation: Show the selected aggregate units and available time without requiring a comment browser, participant list or review-thread viewer. The GitHub participating-Users value is identified as such; unknown broader participant coverage is not represented as complete. If the selected source cannot provide a supported metric, preserve an unknown or partial result rather than replacing it with a semantically different source count. Access to the original Issue remains available under the source-navigation contract.
    selected_discussion_sources: For an identified permitted Issue, use the linked schema-checked GitViewIssueOverview operation as the initial source for Issue.comments totalCount, GitViewIssueParticipantsAndAssignees for the separately labeled participating-Users total and assignees, and GitViewIssueCommentTimes for eligible comment creation times when needed. These are separately interpreted values and coverage, not a single atomic source snapshot; do not fetch comment bodies or participant lists for these counts. For latest-comment time, the latest observed creation is exact only when source and traversal evidence establish the maximum for the applicable population; otherwise show an observed subset with its limitation or unknown. This selection supersedes the examples' earlier candidate-only status but does not prove actual GraphQL permissions, broader participant coverage, runtime visibility or a complete history.
    graphql_discussion_query_candidates: The accompanying schema-checked examples request a source participating-Users aggregate, a separately paged assignee collection and independently paged comment IDs with creation and update times. Bind each usable field to the identified Issue and Repository with its actual response, time and access context; do not treat one field as proof of another or turn a terminal cursor into a simultaneous complete population. An observed latest creation time remains subset-scoped until the exact maximum is independently justified. The examples do not select production operations or establish permissions, deleted-comment history or equivalence between the source participant population and all actors.
    provenance: The owner selected comment and participant counts plus last-comment time. The source-aligned participating-Users mapping and selected source operations are agent-authored working choices; a separate comment-author population and broader actor coverage remain candidates. GitHub documents the field types and count, but no particular operation, permissions or product integration has been verified.
  scenarios:
    repeated_author:
      given: A completely observed Issue comment population has three distinct comments with authors A, A and B, and source identity confirms A and B are distinct.
      when: The discussion summary is displayed.
      then: The comment count is three and the proposed distinct comment-author count is two; the Issue creator is not added solely for creating the Issue.
    unknown_author:
      given: Three comments are observed under complete comment coverage, two authored by confirmed A and one with unavailable author identity.
      when: The distinct comment-author metric is calculated.
      then: One confirmed author is observable but the exact distinct-author total remains uncertain; the missing author is not assumed to be A or a new person. Any independently supported GitHub participating-Users count keeps its own evidence and meaning.
    update_without_comment:
      given: An Issue's last observed comment was created at T1 and its title changes at T2.
      when: The title refresh completes without a new discussion observation.
      then: T2 is not presented as the latest comment time and the earlier discussion value keeps its own source context.
    old_comment_edited_later:
      given: Comment A was created at T1 and edited at T3, while comment B was created at T2 between T1 and T3 and the source list is ordered by update time.
      when: The first result in update-time order is considered for the latest-comment metric.
      then: A's edit at T3 is not presented as a new comment or the latest creation time; B's T2 can establish the maximum only when applicable source coverage and ordering evidence justify it.
    connection_count_without_authors:
      given: A permitted source connection supports an exact current comment count of three for one Issue but supplies no applicable participant identities or latest creation evidence.
      when: The Issue discussion overview is shown.
      then: Three may be shown as the source-supported comment count while the comment-author count and latest creation remain unknown; a separately supported participating-Users count can still be available. The comment count is not added to separately retrieved comment pages.
    same_maximum_time:
      given: Sufficient source evidence establishes that two comments share the maximum creation instant in the applicable Issue population, without ordering those two identities.
      when: Only the latest-comment time is requested.
      then: That instant may be shown with its evidence context without selecting one comment as uniquely latest or asserting a complete history of deleted comments.
    partial_latest:
      given: A partial comment response contains a comment created at T1 but later pages or timestamps are unobserved.
      when: GitView reports discussion timing.
      then: T1 can be identified as latest among the observed subset with incomplete coverage, not as a confirmed latest time for the whole Issue.
    empty_discussion:
      given: An Issue's permitted current comment population is sufficiently observed and contains no comments.
      when: Its discussion summary is displayed.
      then: Comment count and the proposed comment-author count are zero and the latest comment time is known absent; this does not establish that no comments ever existed.
    deleted_author:
      given: Two observed comments have indistinguishable deleted-author labels with no usable source identity.
      when: The proposed distinct comment-author count is evaluated.
      then: GitView does not infer that one or two distinct authors existed solely from those labels, and the exact count remains uncertain.
    source_participant_population:
      given: A source provides a count of participating Users but the eligible comment-author population can include other actor types or is not established to have the same membership.
      when: The proposed distinct comment-author count is displayed.
      then: The source User count is not represented as the exact author count without evidence of equivalence, and missing author evidence remains uncertain.
    source_users_without_comment_authors:
      given: An applicable permitted GitHub Issue participants connection returns a usable totalCount of three at T1; comment authors and the presence of non-User actors are not established.
      when: The operator opens the Issue discussion summary.
      then: Three is inspectable as the GitHub participating-Users count at T1, with its source-defined scope; it is not presented as three comment authors or every actor involved, and no participant list or comment bodies are required.
    source_users_unavailable:
      given: An Issue title is observed at T2 but the participants count is not requested or its field fails, and only a permitted participating-Users count from T1 is independently recoverable.
      when: The Issue discussion summary is displayed.
      then: The T1 count may be shown as last known with its own context and limitation; T2 does not refresh it and the missing result is not zero. Current access and independently applicable disclosure still govern presentation.
  unresolved:
  - Whether the GitHub User population is sufficient for the owner's broader concept of participants, including coding agents and bots, and whether any additional actor-based metric is desired remain open; the source-labeled candidate does not claim that equivalence.
  - Confirm the exact GraphQL operation, permission, error and visibility behavior for `participants.totalCount` and how its population changes over time before claiming a verified integration.
  - Source ordering, deleted or hidden comment behavior, access scope and completeness for latest-time claims require integration research.
  - UI presentation of partial and unavailable discussion metrics and native accessibility require design and testing.
