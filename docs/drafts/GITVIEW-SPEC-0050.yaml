acceptance:
- A preview provides enough permitted identity and available summary to identify the same object before opening it.
- PR and Issue previews distinguish their lifecycle and known signals without fabricating missing values or combining unrelated review and CI facts.
- Project and Repository previews retain scope, data coverage and applicable access restrictions.
- Full source detail remains available through object overview and source navigation rather than requiring it inside the preview.
specification:
  objective: Define a compact, type-aware preview that supports scanning without leaving the overview.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    common: Present the object type and enough allowed identity to disambiguate it in the originating scope where disclosure is permitted. Show a known permitted title or name, source Repository context and number where applicable, and relevant available state. Show a short excerpt of source text when available and permitted; lack of excerpt is not proof the source description is empty. Restricted identity or details are not exposed visually or through assistive representations merely to distinguish objects.
    project: Present the permitted local Project name, member count and available summary signals with their relevant scope and coverage. If the name or values are restricted source-derived private data, follow 0047 and 0046 rather than exposing them to identify the preview.
    repository: Present the permitted Repository name and source context plus available PR and Issue summary signals. A changed or unavailable source address retains its observation context; do not identify another Repository solely by a reused name.
    pull_request: Present Repository context, PR number, known title and lifecycle, with draft flag, CI summary, review assessment and unresolved-thread count where available. Keep CI, review and threads independent and do not expose individual run or thread content as part of these counters.
    review_independence: Under 0062, requested-review information, review assessment and unresolved-thread count retain separate meanings and observation context. A zero or missing thread count does not by itself justify an approval or completed-review mark. Compact visual treatment has an accessible path to distinguish available signals and unknowns without requiring individual thread content.
    issue: Present Repository context, Issue number, known title and open or closed state, with source closure reason when available. An Issue is not assigned PR CI or review-thread status, and closure is not automatically completion.
    issue_blockers: A blocked-by indication for an Issue follows the permitted evidence and uncertainty rules in 0063; it does not disclose a restricted private blocker or claim no blocker when dependency coverage is incomplete.
    missing: A source field that is unknown, stale, incomplete or restricted remains distinguishable from a confirmed empty, zero or successful field. Compactness does not authorize inventing values; detailed representations follow 0023 and the relevant object specification.
    mixed_freshness: Compact presentation must not use a newly observed title or lifecycle as evidence that omitted CI, review, thread, Issue-link or counter fields are equally fresh. Relevant limitations remain available through the preview or its accessible route to detail without exposing restricted fields.
    check_specials: A compact PR cell or preview need not add a prominent counter beyond the selected failure, pending, success and total. When a known total includes special or unclassified status-check entries under 0061, a non-color accessible path exposes their presence and available outcome without presenting them as passed or silently describing the PR as healthy. The route may lead to the same object's overview; do not require individual check details in GitView.
    action: Provide a path to open the same object and dismiss the preview; optional source and share actions follow 0033. Dismissal and identity preservation follow 0031; content prioritization and asynchronous availability are refined in 0093.
    layout: Which fields fit and how text is truncated can adapt to size and system accessibility settings. An accessible path to identify and open the object remains available under 0032; eight columns are not a requirement.
    provenance: The owner requested minimal title, ID, badges and text; this type-specific prioritization is an agent-authored proposal.
  scenarios:
    pr_unavailable_review:
      given: A PR preview has a known title, failed CI and unavailable review assessment.
      when: The preview is shown.
      then: The PR remains identifiable, failed CI is distinguishable and review is not represented as approval or known zero.
    special_check_in_dense_view:
      given: A PR's complete current status-check observation contains one skipped result and no success, pending or failure entries.
      when: Its compact representation and accessible inspection path are used.
      then: The total can be one while the three category counts are zero; the skipped result or its special status is discoverable without a color-only cue or a claim that a check executed successfully.
    issue_closed:
      given: An Issue preview is closed with unknown source reason.
      when: The preview is shown.
      then: The closed state is available without calling the Issue successfully completed or fabricating a reason.
    project_denied:
      given: A Project preview would otherwise include a default name derived from a private Repository whose access is explicitly denied.
      when: The preview is displayed.
      then: Restricted source-derived details and private counts are not exposed; an access problem and safe route remain available.
    mixed_freshness:
      given: An Issue preview has a title observed recently and related-PR data only from an earlier observation.
      when: The preview summarizes available information.
      then: It does not imply that the related-PR data was refreshed with the title, and its applicable stale or incomplete context remains discoverable.
  unresolved:
  - Exact layout, field priority at each density and excerpt length require native UX evaluation.
  - Detailed classification of user-supplied versus source-derived Project names follows the access branch.
