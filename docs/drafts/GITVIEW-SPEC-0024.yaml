acceptance:
- Returning from a work object preserves the originating Project, scope, period, filters and density when valid.
- Restoring position uses a stable object identity when possible and handles a missing object without silently selecting a different one.
- A missing or inaccessible Project or Repository is distinguished from an empty work collection, and the operator can return to an available scope.
- A change of density alone does not change the scope, period or filters.
specification:
  objective: Specify continuity of context while navigating the Project overview and its work collections.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    context: The working context includes Project identity, selected repository scope where applicable, period, explicit filters, density and a position or focused object when available. These are navigation state, not new ontology entities.
    return_in_session: Returning from a PR or Issue overview restores the originating context. The previously visible object remains the position anchor when it still exists in that filtered collection.
    changed_objects: If the anchor no longer matches or cannot be located, preserve still-valid scope and filters and avoid claiming an unrelated object is the original. If the previous ordered list contains another object still present, anchor to the nearest surviving successor, otherwise the nearest surviving predecessor. If none survives, start at the beginning of the updated collection; its empty, incomplete or error state follows 0007 and 0023. If the previous order is unavailable, start at the beginning without inventing an anchor.
    changed_membership: Resolve membership by stable identity, not repository display name. If the selected Repository is no longer a Project member, do not silently substitute another; surface the changed scope and provide a route to the Project or portfolio.
    deleted_project: When durable local configuration confirms that the originating Project was removed, do not restore its route as a valid Project or silently switch to another Project that shares a Repository. Identify the removed local scope and provide a route to the portfolio or another explicitly chosen valid scope. A pending or failed local configuration read does not prove removal and follows 0023 instead.
    open_object_after_scope_change: If an accessible PR or Issue overview or preview is already open when its originating Project is deleted or its Repository is removed from that Project, it may remain associated with that same object under current access policy. It must not be relabeled as belonging to another Project or silently navigate there. On return or dismissal, report the changed origin and offer an available route rather than restoring an invalid Project or Repository scope.
    unavailable: Temporary observation failure does not by itself prove the Project or Repository disappeared. Where access is explicitly denied, follow 0019's cache policy and provide an available route out without displaying restricted content.
    identity_change: If the one active GitHub identity changes while a route is open or being restored, retain the local Project and explicit route intent where still valid, but evaluate each visible source fact and accessible object against the new identity and current Repository access under 0036. A route or saved anchor is not proof of authorization. Do not show previously restricted private details, a revealing object title or count, or silently substitute another object to preserve position. Where the original object cannot be displayed, offer an access-safe context or recovery route; the actual GitHub account-switching UI and cross-scene support are not selected by this rule.
    signal_entry: A signal-origin route identifies the signal's active selection; returning does not discard that selection without operator action. Editing or clearing filters follows 0007.
    zoom: A density change preserves the active context and uses the focused object as anchor when it remains available; any change of scope is explicit.
    launch: As an agent-authored initial default, a new cold app session opens the Projects overview; it does not automatically enter the last viewed private object or silently reapply its work filter. If iOS resumes a still-existing app session, preserve its valid navigation context where possible. A future user-controlled cross-launch restoration feature is outside this default and requires a separate decision.
    launch_with_unknown_configuration: The cold-launch overview may represent local configuration as unavailable or inconsistent. Do not substitute the first-run empty state or automatically enter an old object when the Project configuration cannot be verified. On recovery, show the Projects confirmed by the successful read without silently discarding their membership or restoring a stale private route.
    boundary: Exact transition, scroll algorithm, persisted state lifetime and system navigation implementation remain open; no app implementation or tested behavior is claimed.
  scenarios:
    object_return:
      given: A filtered Project grid has an active density and an identified PR at its visible position.
      when: The operator opens that PR and returns while it still matches.
      then: Project, scope, period, filters and density remain and the same PR is restored as an anchor.
    removed_member:
      given: The current Project no longer includes the selected Repository.
      when: The operator returns to the prior repository-scoped collection.
      then: GitView reports the scope change and offers a route to an available Project or portfolio without substituting another repository.
    deleted_origin:
      given: Project P and Project Q both contain Repository R, and a PR from R is open through P.
      when: P is durably deleted while the PR remains accessible, then the operator returns.
      then: GitView identifies that P is no longer available and offers a route to the portfolio or an explicitly selected Project; it does not silently relabel the origin as Q or delete R's observed data.
    unknown_origin_configuration:
      given: A previously opened Project cannot currently be looked up because local configuration is unreadable.
      when: The operator returns from an object.
      then: The origin is reported as temporarily unverifiable rather than confirmed deleted, and a safe recovery path remains available.
    source_failure:
      given: A previously observed selected Repository is temporarily offline.
      when: The operator returns to its work collection.
      then: The prior scope is preserved and observation failure is presented according to 0003 rather than asserting the repository was removed.
    changed_identity_on_return:
      given: A private PR from Repository R is open through Project P under GitHub identity A, and its details are restricted after identity B becomes active without confirmed R access.
      when: The operator returns to the prior work collection.
      then: P and its saved membership remain intact, but the restricted PR and revealing derived details are not exposed; the original anchor is not replaced and presented as the same PR, and an access-safe context or recovery route is available.
    cold_launch:
      given: An earlier app session ended while a filtered Project collection was open and Projects remain configured.
      when: A new cold app session starts.
      then: The Projects overview is shown without silently entering the old filtered collection; cached observation visibility still follows access policy.
    preserved_session:
      given: A filtered Project collection remains in an app session while iOS suspends it.
      when: iOS resumes that same preserved session.
      then: The valid Project, filter and density context remains available where the system and current data permit.
    launch_local_read_failure:
      given: A previous session contained saved Projects, but local configuration cannot currently be read.
      when: A new cold session opens the overview.
      then: The local-data problem is shown instead of a confirmed empty portfolio; a later successful read restores access to the saved Projects under the current access policy.
    changed_filter_membership:
      given: A filtered ordered collection contained objects A, B and C in that order and B was the anchor.
      when: B no longer matches on return while A and C still match.
      then: The same scope and filter remain active and C is the position anchor, without claiming C is B.
    no_surviving_anchor:
      given: The previous anchor and every other object from the old ordered collection no longer occur in the new collection.
      when: The operator returns to the collection.
      then: GitView starts at the beginning of the updated collection and reports its actual known, partial or empty state.
  unresolved:
  - Stable sort order for the collection is owned by 0007 and proposed in 0042; this fallback operates on the last known ordered collection. The ordering proposal still needs review.
  - System lifecycle boundaries, multiple scenes and the account-changing UX require platform and access refinement; cold-launch overview is an agent-authored default, not an explicit owner selection.
  - Exact presentation and accessible focus after a deleted Project or temporarily unavailable local configuration require native UX evaluation.
