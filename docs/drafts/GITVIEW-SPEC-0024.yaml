acceptance:
- Returning from a work object preserves the originating Project, scope, period, filters and density when valid.
- Restoring position uses a stable object identity when possible and handles a missing object without silently selecting a different one.
- A missing or inaccessible Project or Repository is distinguished from an empty work collection, and the operator can return to an available scope.
- A change of density alone does not change the scope, period or filters.
specification:
  objective: Specify continuity of context while navigating the Project overview and its work collections.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    context: The working context includes Project identity, selected repository scope where applicable, period, explicit filters, density and a position or focused object when available. These are navigation state, not new ontology entities.
    return_in_session: Returning from a PR or Issue overview restores the originating context. The previously visible object remains the position anchor when it still exists in that filtered collection.
    retained_route_lifetime: As an agent-authored first-version policy, retain a work route's explicit filters, period mode, density and permitted identity-based anchor for as long as that route remains in the active navigation session, including while an object or preview is presented above it. Returning to that retained route restores its current valid context rather than recreating an ordinary-entry default. Popping or otherwise explicitly closing the work route ends this route-specific state; a later ordinary entry creates a new context under 0074, while a new signal or historical entry uses its own origin under 0092 or 0056. A cold app session begins at the Projects overview under launch; do not persist and silently reapply the prior route's filters or anchor. This does not delete Projects, source observations, user data or any separately defined preference.
    restored_route_revalidation: Resume a retained route only after checking the current Project configuration, source access, selected scope and applicable day or fixed period. Dynamic Today is recalculated for the current local day; a fixed historical period keeps its captured boundaries where it remains valid. Restore a permitted anchor by confirmed identity, not saved index, and follow changed_objects or unverified_anchor when it no longer matches or is not yet observable. A saved or in-memory route is not authorization and does not make previous source facts current. An asynchronous restoration result cannot replace a newer explicit user route, filter edit, position or restriction.
    changed_objects: If the anchor no longer matches or cannot be located, preserve still-valid scope and filters and avoid claiming an unrelated object is the original. When evidence establishes the prior permitted order and which intervening objects still match, anchor to the nearest surviving successor, otherwise the nearest surviving predecessor. If evidence establishes that none survives, start at the beginning of the updated collection; its empty, incomplete or error state follows 0007 and 0023. If the previous order or necessary membership evidence is unavailable, follow restoration_evidence_precedence and use an honest provisional fallback without inventing an anchor or a nearest-object claim.
    unverified_anchor: When an anchor cannot be found in a partial, unobserved, restricted or unreadable result, its absence from that result does not prove source deletion, membership removal or a confirmed filter non-match. A permitted provisional fallback can keep the collection operable under 0073, but the limitation remains discoverable and the fallback is not described as the original object or an exhaustive next source object. If sufficient later evidence confirms the anchor still matches, it may be restored only while its original route and access remain valid and without unexpectedly disrupting active interaction; an explicit new user position or changed route takes precedence. Exact native focus and scroll mechanics remain open.
    restoration_evidence_precedence: As an agent-authored refinement, evaluate disclosure and the validity of the actual originating route before choosing a position. A confirmed deleted Project or removed member follows the changed-origin route; an unreadable configuration is an unresolved local limitation, not either a confirmed valid scope or a deletion. Within an otherwise usable route, distinguish an explicitly restricted anchor from an anchor whose absence is unexplained by an incomplete result and from an established non-match. Restriction may prohibit disclosing even the anchor's identity or that it was previously present; an incomplete result permits only an honestly provisional position. Use the successor-then-predecessor rule for an established change only with permitted surviving identities in the actual prior order; do not promise that the first observed candidate is the nearest source object when intervening coverage is incomplete. If the prior order or enough permitted evidence for that choice is unavailable, use a safe provisional position and expose the applicable limitation without revealing restricted facts. A complete current list does not retroactively establish an unavailable prior order, and a later supported correction cannot override newer explicit user navigation, position or focus.
    changed_membership: Resolve membership by stable identity, not repository display name. If the selected Repository is no longer a Project member, do not silently substitute another; surface the changed scope and provide a route to the Project or portfolio.
    deleted_project: When durable local configuration confirms that the originating Project was removed, do not restore its route as a valid Project or silently switch to another Project that shares a Repository. Identify the removed local scope and provide a route to the portfolio or another explicitly chosen valid scope. A pending or failed local configuration read does not prove removal and follows 0023 instead.
    open_object_after_scope_change: If an accessible PR or Issue overview or preview is already open when its originating Project is deleted or its Repository is removed from that Project, it may remain associated with that same object under current access policy. It must not be relabeled as belonging to another Project or silently navigate there. On return or dismissal, report the changed origin and offer an available route rather than restoring an invalid Project or Repository scope.
    related_object_origin: A related-object route under 0078 retains the actual originating PR or Issue route and the target's own Repository identity, including when that Repository lies outside the originating Project. Return first to the originating object when it is valid and permitted, then follow its actual route back to the collection. The target's external Repository is not required to be a Project member merely to inspect it, and the relationship does not expand Project membership. If the origin becomes invalid or restricted, follow changed-origin or access-safe recovery rather than claiming the target or source was deleted or selecting a different Project.
    unavailable: Temporary observation failure does not by itself prove the Project or Repository disappeared. Where access is explicitly denied, follow 0019's cache policy and provide an available route out without displaying restricted content.
    identity_change: If the one active GitHub identity changes while a route is open or being restored, retain the local Project and explicit route intent where still valid, but evaluate each visible source fact and accessible object against the new identity and current Repository access under 0036. A route or saved anchor is not proof of authorization. Do not show previously restricted private details, a revealing object title or count, or silently substitute another object to preserve position. Where the original object cannot be displayed, offer an access-safe context or recovery route; the actual GitHub account-switching UI and cross-scene support are not selected by this rule.
    signal_entry: A signal-origin route identifies the signal's active selection; returning does not discard that selection without operator action. Editing or clearing filters follows 0007.
    zoom: A density change preserves the active context and uses the focused object as anchor when it remains available; any change of scope is explicit.
    launch: As an agent-authored initial default, a new cold app session opens the Projects overview; it does not automatically enter the last viewed private object or silently reapply its work filter. If iOS resumes a still-existing app session, preserve its valid navigation context where possible. A future user-controlled cross-launch restoration feature is outside this default and requires a separate decision.
    launch_with_unknown_configuration: The cold-launch overview may represent local configuration as unavailable or inconsistent. Do not substitute the first-run empty state or automatically enter an old object when the Project configuration cannot be verified. On recovery, show the Projects confirmed by the successful read without silently discarding their membership or restoring a stale private route.
    boundary: Exact transition, scroll algorithm, persisted state lifetime and system navigation implementation remain open; no app implementation or tested behavior is claimed.
  scenarios:
    object_return:
      given: A filtered Project grid has an active density and an identified PR at its visible position.
      when: The operator opens that PR and returns while it still matches.
      then: Project, scope, period, filters and density remain and the same PR is restored as an anchor.
    removed_member:
      given: The current Project no longer includes the selected Repository.
      when: The operator returns to the prior repository-scoped collection.
      then: GitView reports the scope change and offers a route to an available Project or portfolio without substituting another repository.
    deleted_origin:
      given: Project P and Project Q both contain Repository R, and a PR from R is open through P.
      when: P is durably deleted while the PR remains accessible, then the operator returns.
      then: GitView identifies that P is no longer available and offers a route to the portfolio or an explicitly selected Project; it does not silently relabel the origin as Q or delete R's observed data.
    unknown_origin_configuration:
      given: A previously opened Project cannot currently be looked up because local configuration is unreadable.
      when: The operator returns from an object.
      then: The origin is reported as temporarily unverifiable rather than confirmed deleted, and a safe recovery path remains available.
    source_failure:
      given: A previously observed selected Repository is temporarily offline.
      when: The operator returns to its work collection.
      then: The prior scope is preserved and observation failure is presented according to 0003 rather than asserting the repository was removed.
    changed_identity_on_return:
      given: A private PR from Repository R is open through Project P under GitHub identity A, and its details are restricted after identity B becomes active without confirmed R access.
      when: The operator returns to the prior work collection.
      then: P and its saved membership remain intact, but the restricted PR and revealing derived details are not exposed; the original anchor is not replaced and presented as the same PR, and an access-safe context or recovery route is available.
    cold_launch:
      given: An earlier app session ended while a filtered Project collection was open and Projects remain configured.
      when: A new cold app session starts.
      then: The Projects overview is shown without silently entering the old filtered collection; cached observation visibility still follows access policy.
    preserved_session:
      given: A filtered Project collection remains in an app session while iOS suspends it.
      when: iOS resumes that same preserved session.
      then: The valid Project, filter and density context remains available where the system and current data permit.
    closed_route_reopened:
      given: During an active session an operator modifies the filters and density of Project P's work collection, then explicitly goes back far enough to close that collection route.
      when: The operator later opens P through ordinary Project entry rather than returning to the retained route.
      then: The new route uses the initial Today selection and initial density under 0074, without silently restoring the previous route's edited filter or anchor; P and its saved observations remain intact.
    resumed_across_day_boundary:
      given: A retained Project work route has dynamic Today, explicit failed-CI and open-PR conditions, a density and a permitted PR anchor, and the app is suspended across a local-day change.
      when: The same session resumes and the current access and Project scope remain valid.
      then: The route retains its explicit conditions and density while Today is recalculated for the new day; the same PR remains the anchor only if it is still permitted and applicable, otherwise the supported identity-based fallback applies without calling the older selection current.
    launch_local_read_failure:
      given: A previous session contained saved Projects, but local configuration cannot currently be read.
      when: A new cold session opens the overview.
      then: The local-data problem is shown instead of a confirmed empty portfolio; a later successful read restores access to the saved Projects under the current access policy.
    changed_filter_membership:
      given: A filtered ordered collection contained objects A, B and C in that order and B was the anchor.
      when: B no longer matches on return while A and C still match.
      then: The same scope and filter remain active and C is the position anchor, without claiming C is B.
    no_surviving_anchor:
      given: The previous anchor and every other object from the old ordered collection no longer occur in the new collection.
      when: The operator returns to the collection.
      then: GitView starts at the beginning of the updated collection and reports its actual known, partial or empty state.
    missing_from_partial_result:
      given: A permitted PR was the work-grid anchor, but on return the source result is incomplete and does not contain that PR; no deletion, denial or filter non-match is established.
      when: The work collection is shown with another permitted observed object.
      then: The app may use the latter as a provisional position without presenting it as the original PR, identifies incomplete coverage and does not claim the anchor was deleted or ceased matching.
    user_moves_before_anchor_recovers:
      given: The original permitted anchor is temporarily unavailable in an incomplete collection and the operator explicitly moves to a different position.
      when: A later supported observation makes the original anchor available again.
      then: The later observation does not unexpectedly override the operator's new position, and the original object is not confused with the current anchor.
    incomplete_successor_evidence:
      given: The prior permitted order was A, B, C, D with B anchored; B is now confirmed not to match, the current result includes D but cannot establish whether C still matches, and the route and D remain permitted.
      when: The operator returns to the collection.
      then: D may be used as a provisional position, but is not claimed to be the nearest surviving successor or the original B; incomplete coverage remains discoverable. If C is later confirmed and the operator has already moved or focused elsewhere, the later result does not override that action.
    restricted_anchor_and_unreadable_order:
      given: A route remains usable but its former private anchor and the prior order are not available for disclosure under the current identity; another independently permitted object is visible.
      when: The app restores a usable position in the collection.
      then: It may present the permitted object as a fallback without identifying it as the former anchor, exposing the restricted identity or asserting a nearest successor or deletion. Any limitation or recovery indication uses only currently permitted information.
  unresolved:
  - Use the initial work ordering in 0042 and stable Project ordering in 0072 for this fallback; concrete collection behavior and accessible focus require native verification.
  - System lifecycle boundaries, multiple scenes and the account-changing UX require platform and access refinement; cold-launch overview is an agent-authored default, not an explicit owner selection.
  - Exact presentation and accessible focus after a deleted Project or temporarily unavailable local configuration require native UX evaluation.
