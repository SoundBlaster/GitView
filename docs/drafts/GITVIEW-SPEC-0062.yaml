id: GITVIEW-SPEC-0062
title: GitView - Independent review attention conditions
kind: spec
created_at: '2026-11-14T16:08:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0028
depends_on:
- GITVIEW-SPEC-0044
- GITVIEW-SPEC-0046
- GITVIEW-SPEC-0053
sources:
  parent: docs/drafts/GITVIEW-SPEC-0028.yaml
  agreed_summary: docs/drafts/project-summary-proposal.md
  access_research: docs/drafts/github-field-access-research-20261114.md
  github_review_schema: https://docs.github.com/en/graphql/reference/pulls
  github_review_requests: https://docs.github.com/en/rest/pulls/review-requests#get-all-requested-reviewers-for-a-pull-request
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Outstanding review requests, source review assessment and unresolved review threads are separate facts with separately attributable coverage and observation context.
- The agreed Project attention counts and destinations use the same open-PR scope and named condition; thread counts and affected-PR counts remain different units.
- Neither zero outstanding reviewers nor zero unresolved threads alone establishes approval, completed review or merge readiness.
- Incomplete or unavailable review evidence remains uncertain and is not announced as a healthy zero.
specification:
  objective: Preserve independent review signals from Project summary through PR inspection without inferring missing decisions.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:ReviewThread
  contract:
    requests: An outstanding-review-request condition requires evidence that at least one person or team is currently requested for this PR in the observation context. It is distinct from a source decision that review is required and from a personal request to the GitView operator. GitHub documents that a requested reviewer is removed from the requested-reviewer result when they submit a review; absence from that result alone does not establish approval or even the reason for absence.
    assessment: A changes-requested condition uses the applicable current source review assessment with its own scope and observation time. An individual historical review or a newly observed head revision alone is not proof of the current aggregate assessment; dismissed or superseded reviews require source-specific interpretation. A source assessment remains distinct from thread resolution and outstanding review requests.
    required_review: GitHub GraphQL documents REVIEW_REQUIRED as a source review decision and separately provides review requests. A supported applicable REVIEW_REQUIRED decision can be made discoverable as the source's review-required status even if a complete requested-reviewer list is empty; do not fabricate a person or team request, attribute it to the GitView operator, or add it to the distinct outstanding-request count merely from that decision. Conversely, an observed reviewer request alone does not establish REVIEW_REQUIRED. Exact badge and category presentation remain a native design proposal and neither fact establishes the complete merge decision.
    nullable_decision: The GraphQL reviewDecision field is nullable. Preserve a source-supported null or unavailable value with its own context, and distinguish a field-level error or unrequested field from a supported null. The documented nullable type by itself does not explain why the value is null or prove that no review exists, approval is absent, a review is required, or a PR is mergeable. Show an appropriate limited or unknown state rather than inventing the reason.
    review_commit: GitHub's individual PR review can have an associated commit and a submission time, while the PR reviewDecision is a separate current assessment. Preserve any supported individual review commit and observation context where used; a review's commit alone neither establishes the current aggregate decision nor proves that an earlier approval is valid or invalid for a newer head. A nullable or unavailable commit is not evidence of an empty review or a successful assessment.
    threads: An unresolved-thread condition concerns identifiable review threads whose source resolution state is known. GitHub exposes isOutdated and isResolved as separate thread fields; an outdated thread that is still source-confirmed unresolved remains an unresolved thread for the selected all-unresolved count, not an automatically resolved or excluded thread. Preserve its outdated status separately when available, without requiring individual thread content. A positive observation can establish an affected PR under partial coverage; a known zero or absence requires sufficiently complete relevant threads and resolution states. Thread count, PRs with at least one unresolved thread and affected Repositories are different units. An unresolved thread need not mean that the source assessment is changes requested, and a changes-requested assessment can exist without an unresolved thread.
    joint_observation: A response that includes a head revision and review fields can support each successfully interpreted field with its source context, but their inclusion in one response alone is not a documented proof that every nested field, page and policy was evaluated atomically for that revision. After a head change, do not promote an earlier approval or complete-thread claim to the new revision solely from a refreshed head or a callback time. Use an applicable source assessment and sufficient context; otherwise preserve the older observation as last known or unknown under 0044 and 0053. This does not assume that every thread is intrinsically scoped to one head revision.
    scope_and_route: Project counts in 0057 count distinct open PRs for each named attention condition. A destination opened from one of those counts retains its originating Project, open lifecycle, named predicate, applicable time and source scope. A thread-count origin can open distinct affected PRs without asserting equal numbers of threads and cards. Explicitly changing a filter is distinct from silently changing the origin condition.
    uncertainty: Each predicate uses its own identity, access, source and time evidence. An incomplete request list, unavailable assessment or incomplete thread collection is not a confirmed negative. Known positive observations may be shown with incomplete coverage; stale or differently timed inputs are not represented as one simultaneous current review state without evidence under 0044 and 0046.
    compact: A compact card or preview can prioritize a subset of the review facts but provides an accessible non-color route to the available separate signals and their limitations without requiring individual thread content. Zero unresolved threads or no outstanding reviewer is not rendered as approval or completed review by itself. Exact glyphs and layout remain open.
    compact_badge_proposal: As an agent-authored interpretation of the owner's eye, check and warning ideas, a review-attention mark can indicate a supported changes-requested assessment or at least one confirmed unresolved thread, and a review-request mark can indicate a supported outstanding request. If both are present, a compact primary mark can prioritize attention, but the independent request remains discoverable. A positive approved-and-clear mark requires an applicable source approval, sufficiently complete evidence of zero unresolved review threads and no outstanding review request in the stated context; if any prerequisite is unknown, do not infer this combined mark. It describes those review facts only, not CI success or merge readiness. Platform symbols, prioritization and overlap must be verified in the real UI.
    compact_badge_applicability: Evaluate each prerequisite of a combined approved-and-clear mark for the same identified PR and the requested presentation context using independently applicable permitted evidence. A new title, head, empty reviewer list or zero-thread observation does not refresh an earlier approval or make unrelated older inputs applicable. If the available facts were observed at different times, they may support the combined mark only when the required individual applicability and compatible context are established; do not claim a simultaneous source snapshot from their co-display alone. If approval, thread coverage, outstanding requests or their applicability is unknown or restricted, do not render an unqualified current approved-and-clear mark. A separately supported current attention signal can still be shown under compact_badge_proposal, with its own coverage and a non-color accessible explanation; an older permitted signal may be inspected as last known without being promoted to current.
    source_boundary: GitHub documents separate review requests, current review decision and review-thread connections. This motivates separate facts but does not prove a particular query, permission, availability, freshness or equivalence to the GitHub interface. GitView remains read-only and does not resolve threads, submit reviews or change source state.
    provenance: Review attention and counters were selected by the owner; precise predicates, uncertainty and routing here are agent-authored refinements.
  scenarios:
    request_removed_after_review:
      given: GitHub reports no currently requested reviewers after a reviewer submitted a comment-only review, and no approval assessment is established.
      when: Review attention is shown.
      then: The app does not infer approval or a completed approval requirement from the empty request result.
    changes_without_open_threads:
      given: An open PR has a current changes-requested assessment and a complete observation of zero unresolved threads.
      when: Project and PR review signals are displayed.
      then: It contributes to the changes-requested PR count but not the unresolved-thread count, with both facts separately identifiable.
    approved_unknown_threads:
      given: An applicable review assessment reports approval but the review-thread collection is incomplete.
      when: The compact review mark is selected.
      then: The approval remains independently available but the app does not assert the combined approved-and-clear mark or a zero unresolved-thread count.
    old_approval_new_zero_threads:
      given: A PR had an approval observation at T1. After a head change, T2 provides a complete zero-unresolved-thread observation and an empty reviewer-request list, but no applicable current review assessment.
      when: Its compact review mark and accessible explanation are prepared.
      then: The T2 thread and request facts retain their own scope, the earlier approval remains last known where permitted, and no unqualified current approved-and-clear mark is inferred from their combination. The result does not claim changes requested, failed CI or merge readiness.
    required_without_requested_reviewer:
      given: The source reports an applicable REVIEW_REQUIRED review decision and a sufficiently observed empty requested-reviewer collection.
      when: Review signals and the outstanding-request count are presented.
      then: The review-required decision is discoverable independently; zero explicit outstanding reviewer requests does not erase it or fabricate a requested person, and the app does not claim merge readiness.
    null_decision_without_cause:
      given: A successfully interpreted source response provides a null reviewDecision with no documented cause, while an independent review-thread observation is available.
      when: The PR review summary is presented.
      then: The null retains its actual source context without an invented reason or implied approval, and the independently supported thread fact is not erased.
    outdated_unresolved_thread:
      given: A review thread is source-confirmed outdated and unresolved for an otherwise eligible PR, with sufficient identity and applicable observation context.
      when: The all-unresolved thread and affected-PR signals are evaluated.
      then: The thread can contribute once as unresolved and its outdated attribute remains distinct; it is not excluded or marked resolved solely because it is outdated.
    head_and_partial_review_response:
      given: A PR head changes from A to B, and a later response supplies the new head but its review assessment field is missing or affected by an error.
      when: The compact review marker is evaluated.
      then: An earlier approval or zero-thread observation remains attributed to its prior evidence and is not asserted current for B solely because the head was observed at B.
    requested_and_attention:
      given: An open PR has an outstanding review request and a confirmed unresolved thread in their own applicable contexts.
      when: Its compact review signal is displayed.
      then: Attention can be the primary mark, while the outstanding request remains separately discoverable and neither fact is rewritten as an approval.
    thread_without_changes:
      given: An open PR has two confirmed unresolved review threads and no source assessment establishing changes requested.
      when: A thread-count signal is opened.
      then: The source signal can report two threads and the destination one affected PR, without inventing a changes-requested assessment.
    partial_review_requests:
      given: One open PR has a confirmed outstanding review request and another PR's request collection is incomplete with no known request.
      when: The Project's requested-review count and destination are shown.
      then: The confirmed positive remains available, the second PR is not declared a confirmed non-match and Project coverage remains incomplete.
    stale_review_and_new_head:
      given: Review approval was observed at T1 and the PR head changed at T2 without a new review assessment.
      when: The PR is previewed.
      then: The old approval retains its context and is not asserted to apply to the new revision solely because the head was refreshed.
    review_commit_without_current_decision:
      given: An individual submitted review is associated with commit A, the PR head is now B, and no current reviewDecision is observed.
      when: Review signals are displayed.
      then: The individual review's supported commit and time may be retained as historical context, but neither a current approval nor a current rejection is inferred solely from its association with A.
  unresolved:
  - Verify source-specific semantics and permissions for review decisions, reviewer requests, dismissals and thread resolution, including partial responses.
  - Define exact display and accessibility treatment when review signals overlap or have different observation times.
  - No native UI, GitHub query or review-policy behavior has been executed or validated.
