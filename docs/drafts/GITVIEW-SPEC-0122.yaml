acceptance:
- Opening a previously created store distinguishes supported migration, a newer unsupported schema, unavailable storage and verified first use.
- An upgrade preserves the meaning and associations of retained Project configuration, permitted observations, history and recovery evidence or reports an explicit limitation.
- A schema version is not reported as installed before its required transformations and integrity checks are durably established.
- Interrupted or failed migration does not silently reset an existing store or make incomplete data appear to be a fresh empty portfolio.
- Older application versions do not write to a newer incompatible schema under an assumed downgrade.
- Database migration cannot itself establish Keychain availability, current GitHub access, or the outcome of a previously uncertain operation.
- Observable recovery cases can be verified independently of a network; actual provider, device and restart behavior require separate evidence.
specification:
  objective: Define a recoverable schema-evolution contract for the proposed local data boundary without choosing a physical schema or implementing the app.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:Metric
  contract:
    applicability: This agent-authored proposal applies to the first iPhone app's local database direction in 0113. A schema version identifies a storage contract, not a GitHub revision, Project configuration revision, history generation or ontology version. A version marker alone is not evidence that required data and invariants are valid.
    open_classification: Before exposing or mutating stored data, distinguish an eligible initialization with no existing local store from a supported existing schema, a schema newer than the reader understands, an unrecognized or malformed marker, an inaccessible protected file and an unreadable or corrupt store. Inaccessible or corrupt evidence must not be converted to first use by deleting or replacing the store. Recovery and accessible messaging follow 0023 and 0113.
    initial_store: As a working first-use rule, a new local store may be initialized only when the selected storage boundary establishes that its expected store is absent and no recoverable local evidence indicates an interrupted existing store or pending migration. A missing file alone does not prove the operator never configured GitView, that a prior installation or backup never existed, or that GitHub has no data. If local evidence is incomplete or contradictory, offer recovery rather than replacing data. After successful initialization and a successful empty Project read, setup can be offered as in 0022 without claiming knowledge of any inaccessible or deleted earlier installation. The exact evidence and platform lifecycle needed to distinguish absence from inaccessibility remain a provider prerequisite.
    upgrade_path: A release that changes the schema must declare its supported starting versions and a deterministic sequence of steps or a separately verified equivalent migration. Each step states preconditions, transformations, preserved invariants, data-loss or unsupported cases and evidence needed for validation. An unsupported starting version is not silently coerced into a supported version; retain the existing store and provide an appropriate update or recovery route without promising a particular export mechanism.
    commit_boundary: As a working SQLite direction, a migration step's data transformation, its integrity checks and the durable marker for that completed step share one transaction when the chosen provider and operations support it. Do not advance the marker on an uncommitted or failed transformation. If any necessary operation cannot participate in that boundary, specify a separate durable staged protocol with a recoverable marker and prove its crash ordering before relying on it. A completed intermediate version is not the final version; resume only along a supported path after validating its evidence.
    preserved_meaning: Maintain source and object identifier kind and scope, Project identities and membership, default-association uniqueness, configuration revisions, fact and coverage contexts, history and clear generation, operation intent and outcomes, and active connection references to the extent those data existed and remain eligible. Re-encoding cannot invent source identity, freshness, access or completeness. A transformation that cannot establish a required association must expose that portion as unavailable or uncertain rather than attach another object's evidence, silently drop the affected Project or fabricate a zero.
    project_recovery_invariants: As an agent-authored validation contract, when opening, reading or migrating the Project configuration and recovery records, establish the invariants needed by the particular operation or completeness claim. A current valid Project has its supported identity, name, version and complete nonempty distinct membership with resolvable scoped Repository references; an active default association targets an existing membership and remains unique per confirmed source Repository. An interpretable batch entry retains its own identity, originating batch and supported identity context; an operation result retains its bound operation and the evidence required to interpret that result. Current access and account admission remain separate checks. An applied historical receipt whose Project was subsequently deleted is not by itself a dangling current Project or corruption. Source identity, operation binding and fence evidence must not be repaired by guessing from names or matching values. The linked data contract records these logical responsibilities; exact encoding, validation query and repair policy remain provider decisions.
    validation_scope_and_failure: Report structural store integrity, schema compatibility and domain invariants as separate evidence. A passing structural check or supported version marker alone cannot certify Project membership, operation provenance, current authorization or complete source coverage. Do not claim the whole store or portfolio valid when only one record or range was inspected, and do not require an exhaustive source refresh to validate local configuration. A failed or unreadable required check limits its affected claim and prevents writes whose preconditions depend on it; unrelated data can remain available only if the storage boundary independently establishes safe isolation and current disclosure. If the failure scope itself is unknown, do not presume isolation or silently drop records to manufacture a complete result. A normal local read may validate an applicable subset; the exact startup, background and per-read validation schedule is not yet selected. A migration may claim completion only after all checks required by its declared step have passed and its outcome is durable under commit_boundary.
    project_order_migration: Preserve supported Project ordering across migration where possible. If prior ordering cannot be recovered, use the 0072 deterministic identity-based fallback with a limitation rather than inventing historical insertion order from names, timestamps or row position. A valid Project is not made unavailable solely because optional order metadata cannot be repaired. An older restored backup supports only the order it actually contains, not later changes.
    in_flight_and_admission: Coordinate store opening and migration with Project writes, observation retention, history clear and background work so no producer writes through an incompatible schema or assumes a half-migrated view. Pending operation identities and admission fences remain distinguishable after recovery; a pre-migration request does not become a new observation merely because its storage is resumed. Account or access restrictions continue to apply while migration is pending, and a local migration cannot authorize a source fetch.
    interrupted: A failed or interrupted migration reports a local recovery limitation. On restart inspect durable schema and operation evidence before retrying the same supported step; do not infer success from an earlier attempted statement or assume rollback when the provider cannot establish it. A transaction outcome and its marker may be uncertain until reconciled under 0071 and 0113. Do not automatically recreate, overwrite or discard the only existing data in order to resume; a separately designed user-authorized destructive recovery is outside this contract.
    newer_reader: If the durable schema is newer than the installed application can safely interpret, do not perform older-schema writes or migrate it backward by assumption. Preserve the store and identify an update or compatible-reader route when available. Any read-only compatibility requires an explicitly supported mapping and current access checks; otherwise report the local data as unavailable, not empty. This proposal does not promise that every app downgrade or device restore is supported.
    independent_stores: Database migration, Keychain item accessibility and GitHub authorization have independent outcomes. After an eligible schema upgrade, a missing or inaccessible credential follows 0086 and does not erase Projects or prove no source data exists. Conversely, a readable credential does not justify opening an incompatible database or disclosing cached private data without the applicable access policy.
    backup_scope: As an agent-authored first-version candidate, place the nonpurgeable SQLite store containing locally created Project configuration and the operation evidence required to interpret it in an application-managed Application Support location eligible for normal system backup. Because the current proposed consistency boundary also contains observations and history, those records and their access metadata may enter a device backup too; do not represent the store as containing only Project names. Do not put credentials or authorization secrets there. Apple describes Application Support as included in regular backups, but backup availability, timing, encryption configuration, snapshot consistency and restoration are not controlled or guaranteed by GitView. This is device backup, not cross-device synchronization.
    backup_consistency: The selected backup mechanism must preserve a recoverable SQLite consistency unit under its actual journal mode, including any necessary associated files, or produce a separately verified consistent snapshot. Never assume a copy of the main file alone is sufficient during a transaction or for an existing WAL-mode store. On restore, validate the available store and relevant schema and journal state before mutation or claiming recovery. Incomplete, incompatible or inconsistent evidence follows the non-destructive recovery path. Prove supported platform backup and restore behavior separately; merely choosing a directory does not establish SQLite snapshot consistency.
    restored_state_age: A restored store represents at most its backup point, not the current GitHub state or the latest local decisions. A later local disconnect, clear, edit, admission fence or operation outcome may be absent from the snapshot. Do not claim these later events survived or that restored observation timestamps imply current access. If rollback or restore is independently established, prevent pending saved operations and prior access evidence from silently authorizing new activity; reconcile or require a new supported authorization and scope-specific evidence under 0036 and 0086. If no reliable external evidence identifies an older snapshot, local data alone cannot prove that it was not rolled back; the offline policy in 0036 retains that explicitly accepted limit rather than promising universal restore detection.
    restore_matrix: A readable restored store with a confirmed missing device-only credential retains Projects and their associations while connection requires recovery; this alone does not establish which device restored it, current authorization or a deleted account. A temporarily inaccessible Keychain or protected file remains unavailable rather than confirmed missing. A secure credential without its matching readable and valid binding does not authorize reconstruction of the old Projects or activation of a pending attempt. A different source identity cannot inherit previous private access. Apply 0036 to visibility and 0086 to credential-binding reconciliation, without relabeling a successful restore as a successful refresh.
    verification: Specify deterministic tests for every supported prior schema and representative data, interrupted steps, failed validation, full or inaccessible storage, concurrent write admission, unknown commit result, newer schema and missing secure item. Separately test actual provider transactions, restart, file protection and supported device upgrades after implementation. Migration fixture success alone is not proof of all historical stores or product readiness.
    provenance: Retained local data and testability follow owner direction. Schema versions, staged recovery and SQLite transaction boundaries are agent-authored working proposals; no migration, database or device test exists yet.
  scenarios:
    valid_storage_broken_default:
      given: A supported database is structurally readable, but a domain check establishes that an active default association points to a Repository no longer in its target Project; another Project is independently readable under an established safe isolation boundary.
      when: GitView opens the portfolio and attempts to reuse that default.
      then: Structural readability is not presented as a valid default association, reuse is not admitted and the affected scope exposes an appropriate local limitation. The independently supported Project may remain available under current disclosure; the app does not silently remove or repair the association by guessing.
    historical_receipt_for_deleted_project:
      given: An applied creation receipt and its original binding remain readable, and a later confirmed Project deletion is also established in the same continuing store lineage.
      when: The store validates operation-recovery records.
      then: The receipt remains a historical outcome without being treated as proof of a current Project or as corruption merely because that Project is absent. Replay does not recreate it, and no source access or refresh is inferred.
    validation_cannot_establish_scope:
      given: A local validation fails but cannot establish whether the affected records are isolated from the Project collection or its operation evidence.
      when: The app prepares a complete portfolio and a potentially conflicting write.
      then: It does not claim complete valid configuration or admit that write on the basis of presumed isolation; a safe recovery limitation is offered without replacing the store or asserting source denial.
    supported_upgrade:
      given: A readable supported old store contains two Projects sharing a Repository, a bound operation result and eligible observation contexts.
      when: The declared upgrade steps commit and their invariants are validated.
      then: Both Projects retain their identities and shared membership, the operation result remains attributable, observations retain their context, and the final version is reported only after its durable completion.
    genuinely_absent_store:
      given: The storage boundary establishes the expected local store is absent and finds no recoverable evidence of an interrupted store or migration.
      when: Initialization succeeds and the new Project collection is read successfully as empty.
      then: The overview can offer setup without claiming GitHub is empty or proving that an earlier installation or inaccessible backup never existed.
    interruption_before_marker:
      given: A transactional migration has begun but the process stops before its data changes and version marker commit.
      when: A later process opens the store and establishes the durable state.
      then: It resumes from the established supported version or reports uncertainty if the outcome cannot be reconciled; it does not display a fabricated empty portfolio or claim the new version succeeded.
    incompatible_downgrade:
      given: A previous application version opens a store upgraded by a later version with an unsupported schema.
      when: The older version prepares its normal Project writes.
      then: Those writes are not admitted, the existing store is preserved, and an update or compatible recovery route is offered if available.
    credential_inaccessible_after_upgrade:
      given: A supported store upgrade is confirmed but the credential slot referenced by the saved connection is inaccessible after a device restore; its presence or absence has not been established.
      when: The operator opens the application.
      then: Connection availability follows its own recovery policy, Projects are not deleted, and neither GitHub access, a confirmed missing credential nor an empty portfolio is inferred from an inaccessible slot.
    preserved_history_fence:
      given: The old store contains a confirmed history clear generation and an operation that began before that clear.
      when: Schema migration completes and the old operation is replayed.
      then: The clear boundary and original operation context remain applicable; the replay cannot silently repopulate cleared history as a post-clear observation.
    restored_backup_predates_disconnect:
      given: Independent reliable evidence establishes that a restored store predates a local disconnect, although the restored database still records the former active binding.
      when: GitView opens the old snapshot offline.
      then: The old binding does not silently reinstate affected private access or authorize pending work; Projects remain retained and the operator is offered a supported recovery path.
    restore_cannot_be_detected:
      given: An older store snapshot is restored without an independently readable indication of rollback and contains consistent prior binding and restriction records.
      when: GitView starts offline and evaluates the available evidence.
      then: It cannot prove whether a later disconnect or clear happened; the working offline policy may show otherwise eligible last-known data, without claiming current access or that all later local changes survived.
    restored_binding_without_credential:
      given: A valid supported restored store refers to an active source identity and a device-only credential slot, but the secure store establishes that the slot is absent.
      when: The operator opens the overview.
      then: Projects and memberships remain retained, the connection is not usable, and recovery offers authorization without asserting that GitHub or the local portfolio is empty.
  unresolved:
  - Define concrete physical schemas, actual supported upgrade paths, provider operations and integrity checks once the data representation is chosen.
  - Specify any nontransactional migration stages, backup and protected-file behavior and user-authorized destructive recovery before relying on them.
  - Verify real SQLite, Keychain, process interruption, app downgrade and device-restore behavior on supported iOS environments.
