  project: docs/drafts/GITVIEW-SPEC-0025.yaml
  autonomy: conversation:gitview/excerpt-77
acceptance:
- An explicit history-clear action identifies its local data scope and consequences before it is submitted.
- A confirmed clear prevents older in-flight data from silently restoring cleared history, including after restart.
- A failed, partial or indeterminate clear is distinguishable from confirmed success and is recoverable without inventing an empty history.
- A later accepted fresh observation can form new history only with its actual observation context and current access eligibility.
- Clearing history does not mutate GitHub or silently delete Projects and unrelated local data.
- The proposed initial clear is identified as affecting all local metric history, including shared Repository-derived history used by other Projects.
specification:
  objective: Define observable recovery and concurrency boundaries for explicit local metric-history clearing without choosing a storage implementation.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:Metric
  contract:
    scope: A history-clear action concerns an explicitly described local metric-history scope. Before submission, make the affected data and any material consequences understandable; do not silently equate it with deleting a Project, disconnecting GitHub, clearing credentials or deleting GitHub source objects. Cancelling before submission leaves the previous history intact.
    initial_clear: As an agent-authored first-version proposal, offer a user-initiated action to clear all metric history retained by this GitView installation, including historical samples, retained outcome evidence and derived historical aggregates in that scope. Before explicit confirmation, disclose that it affects history used by all Projects, including shared Repositories, and that historical graphs may have gaps until supported evidence is acquired again. Do not disclose restricted Project or Repository identities in the explanation. This action is distinct from clearing current observation cache, local Project configuration, credentials, GitHub data or external backups. Project-only or Repository-only history clearing is not promised by this initial option; such a narrower option requires its own supported isolation and disclosure rules.
    reacquisition_disclosure: Before confirmation, explain that this clears the specified local history rather than deleting GitHub events or permanently hiding them. A permitted new refresh or separately requested history retrieval may later obtain and retain an event whose source event time precedes the clear; ordinary retention and access rules still apply. A new state observation does not recreate an earlier state sample simply by reusing old cached data. Do not promise that past history will be restored, that automatic retrieval will occur, or that a reappearing event is the same local record. The disclosure must remain understandable and accessible without revealing restricted source identities or counts.
    current_vs_history: If current observations and history share underlying facts, the confirmed clear must enforce the described history boundary without silently deleting current cache or Project configuration. An old retained current fact is not automatically reintroduced as a new historical sample merely because the current view is opened after clear; a new qualifying observation or separately attributed supported history retrieval follows 0066. This is an observable requirement, not a mandate to duplicate physical data.
    shared_evidence: A Repository can belong to multiple Projects and historical inputs can be shared. The action must not promise Project-only removal while silently damaging history required by another Project. If the selected scope cannot be isolated from shared evidence, disclose the affected scope before submission or do not claim a narrower clear. No particular storage representation or duplication is mandated.
    durable_clear: Report a clear as confirmed only when the affected local scope and the protection against reintroducing pre-clear history are durably established. An implementation may use any mechanism that provides this observable behavior. The clear changes local retention, not what existed at GitHub in the past.
    old_in_flight: Coordinate clear with in-flight refresh, retention and queued writes for the affected scope. Data observed before the clear boundary or from work begun before that boundary must not silently repopulate the cleared history after confirmed clear, even if its write or response arrives later or the app restarts. An already committed write is within the clear's affected scope and must be handled before reporting confirmed success. Exact admission and reconciliation mechanism remain open.
    open_presentations: After the all-local-history clear is confirmed, invalidate app-controlled historical points, historical selection payloads and pending focus or announcements derived solely from the cleared evidence, including copies already loaded into an open chart or drilldown. Returning to that chart shows the applicable cleared or unavailable state and a safe navigation context rather than restoring an old point as retained history. A separately permitted current-cache fact remains governed by its own scope and is not automatically a historical sample; independently obtained post-clear evidence follows new_observation. This does not promise to retract anything already spoken, seen, copied or handed to another process, and exact system snapshots require platform evaluation.
    new_observation: A genuinely new permitted observation initiated after a confirmed clear can be retained under 0066 with its actual source and observation context. Its presence is not proof the cleared past was recovered. A new observation cannot relabel old cached data, old history or a late pre-clear response as newly observed; any source event history subsequently requested must be attributed to the new retrieval and its own evidence rather than silently restoring deleted local records.
    failure: If a particular clear is known not committed, do not report that operation as successful or apply its proposed effect. An independently confirmed clear or retention may nevertheless change what is currently recoverable; reconcile the current generation and actual durable evidence under 0117 rather than restoring or promising an earlier snapshot because this operation failed. If the result is partial or unknown, do not claim full removal or full rollback; identify the affected scope and allow recovery. If local configuration or clear status cannot be read, do not manufacture an empty graph or automatically replay pending old writes as if the clear were absent.
    access: Apply current authorization and private-data restrictions before showing any retained or recovered data. Clearing metric history is independent of reconnecting; a clear operation or a late write does not re-establish access. Prevent a cleared historical value from leaking through stored derived aggregates where the clear scope includes them; current source-derived data outside the described clear scope follows its own policy.
    later_graph: An empty local history after a confirmed clear means no retained local history for that cleared scope, not proof that the source had no events or work. A later source-supported event query or new observation can add separately attributed evidence under 0065 and 0066. Display gaps or unavailability rather than retroactive zeroes.
    provenance: The owner requested local observations and graph history; this scoped clear and recovery contract is an agent-authored product proposal, not a claim that a particular clear control or storage architecture was selected.
  scenarios:
    all_projects_clear:
      given: Repository R contributes retained history to both Projects P and Q, and current permitted work observations and Project configurations are separately retained.
      when: The operator reviews and explicitly confirms the initial all-local-history clear, and it is durably completed.
      then: The affected historical evidence is cleared for the disclosed all-Project scope, P and Q and their current permitted observations remain, and missing past chart values are not reported as source zeroes.
    no_silent_project_only_clear:
      given: The operator is viewing P and R's retained evidence is shared with Q.
      when: The operator opens the initial clear action.
      then: The action is identified before confirmation as clearing all local metric history including Q's affected history, not described as clearing P alone; cancellation leaves confirmed history unchanged.
    current_cache_after_clear:
      given: All local metric history was confirmed cleared and a permitted current PR observation from before that clear remains in the current cache.
      when: The operator opens a historical open-PR graph without a new qualifying observation or supported historical retrieval.
      then: The old current cache is not silently copied back as a newly retained historical sample and the cleared period remains a gap or unavailable.
    clear_while_drilldown_open:
      given: A historical point and an associated selection are loaded from retained local history, and an explicit all-history clear is durably confirmed while the selection remains open.
      when: The operator returns to its chart or a delayed app-owned point announcement is ready.
      then: The cleared historical value and dependent selection are not restored or announced as retained history; a safe cleared or unavailable state is reachable, while current cache and Projects retain their separate rules.
    stale_response_after_clear:
      given: A metric refresh for R began before an explicit all-local-history clear was durably confirmed.
      when: Its response and attempted retention arrive after the clear.
      then: The prior work does not silently recreate the cleared history, including after restart; its source response does not become a newly initiated observation.
    fresh_observation_after_clear:
      given: An all-local-history clear is confirmed and current source access to R permits refresh.
      when: A new refresh is initiated afterward and yields a confirmed observation that is durably retained.
      then: The new sample can appear with its actual observation context, without claiming that earlier cleared points were restored or were zero.
    rediscovered_event_disclosed:
      given: Before confirming the all-local-history clear, the operator is told that later permitted refreshes may reacquire old GitHub events; the clear is then durably confirmed.
      when: A newly initiated eligible refresh independently retrieves an event from before the clear and its evidence is durably retained.
      then: The event may appear at its supported source event time with its new retrieval context; it is not described as a surviving cleared record, a source deletion failure or proof of complete historical coverage.
    shared_project_scope:
      given: Repository R belongs to Projects P and Q and both use some shared retained metric evidence; a future separately specified Project-only clear is under consideration.
      when: That narrower option is evaluated before being offered to the operator.
      then: The app either isolates that scope or discloses the actual effect before submission; Q's history is not silently erased under a claim that it was unaffected.
    failed_clear_after_independent_success:
      given: Clear X and a separate intentionally confirmed clear Y concern all local metric history; Y durably succeeds and X is independently confirmed not to have committed.
      when: The app reports X's failure and reconciles current history.
      then: X is not reported successful, Y's clear remains effective, and history removed by Y is not restored or claimed present solely because X failed; a separate valid post-Y observation keeps its own context.
    acknowledgement_lost:
      given: A clear may have committed but its acknowledgement was lost and local status cannot currently be read.
      when: The operator reopens the history view.
      then: The clear outcome remains unknown with a recovery path; no full success, full rollback or confirmed empty source history is invented.
    cleared_local_not_source_zero:
      given: A confirmed local history clear removed previously retained PR samples for the chosen scope.
      when: A past graph is displayed before sufficient new historical evidence is obtained.
      then: The missing local history is shown as unavailable or gaps rather than zero past PRs.
  unresolved:
  - Exact confirmation and recovery interaction and any future narrower clear scopes require native and storage design; the all-local-history option is an agent-authored proposal.
  - Durable ordering, concurrent admission, restart reconciliation and privacy-safe retention need storage-specific design and evidence.
  - Whether or how a later explicit source-history query is offered after local clearing remains open; no automatic deletion of GitHub data is implied.
