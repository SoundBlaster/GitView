acceptance:
- An authorized operator can discover repositories, form Projects, open a Project and inspect its PR and
  Issue work.
- Today presents current work while explicit filters and zoom preserve the intended scope; completed-card retention remains an open product decision.
- The operator can inspect an eligible card through a first-version preview and open its overview; an eligible associated GitHub link can be opened or shared under the source-handoff policy.
- Current CI, review and thread counts remain distinct; incomplete, stale, failed and unauthorized data
  are not represented as successful empty data.
- Summaries and available charts use explicit scopes and do not double-count shared repository identities
  in portfolio totals.
- Essential navigation is accessible without relying solely on color or a gesture.
acceptance_evidence:
- criterion: Acceptance scenarios and their verification obligations are reviewable.
  evidence: The scenarios below and linked nodes describe expected outcomes. Executable procedures, fixtures and applicable integration or device evidence remain to be specified; no app build, UI run or source integration has been observed.
specification:
  current_intent_boundary: The owner clarified Today means current work, with history in aggregate metrics and charts. Prior same-day-retention and historical-view scenarios below are superseded candidates; the completed-card policy remains open. Other pilot outcomes remain applicable.
  objective: Define the coherent first useful GitView pilot and its observable end-to-end outcomes.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  first_slice:
  - One authorized GitHub identity; selected repositories and local Projects, including overlap.
  - Project overview, member or signal navigation, Today selection and explicit lifecycle filters.
  - Multi-density native grid, first-version Peek and Pop, PR/Issue overview, original source and link
    sharing.
  - Persisted observations, scoped refresh, failure and coverage signals; available metrics and charts
    when data supports them.
  - Accessibility alternatives and native iOS visual conventions.
  later:
  - Sliding rich preview; gesture hypothesis needs native prototyping.
  - Calendar overview, deeper PR internals, additional Git hosting providers and multiple accounts.
  - GitHub write operations such as merge, approve and editing Issues.
  scenarios:
    happy_path:
      given: An authorized operator selects two repositories in a Project, applicable data is observed and the selected PR has an eligible source link.
      when: The operator opens the Project, filters failed CI, zooms the grid and previews a PR.
      then: Matching PRs retain repository context, the preview identifies the selected PR, and the operator
        can open its GitHub source.
    completed_work:
      given: Today contains 100 distinct permitted PRs within a known complete scope.
      when: Source-supported compatible observations establish that ninety-five were merged today and the remaining five are open.
      then: All 100 remain visible without state exclusions, with current states; filtering merged leaves
        the remaining matching work.
    offline_resume:
      given: The app has previously stored observations with supported successful times and the network is unavailable.
      when: The operator reopens a Project and requests refresh.
      then: Previously observed data remains visible only where current local access policy permits it, with
        its last-success time and the applicable refresh limitation. Restricted or unverifiable private data
        is not exposed, and unavailable data is not claimed current.
    overlap:
      given: One repository belongs to two Projects.
      when: Each Project and the portfolio summary are shown.
      then: The repository contributes to both Projects but is counted once in the unique portfolio total.
    access_revoked:
      given: A source explicitly denies access to a previously observed private repository.
      when: Refresh occurs.
      then: GitView shows an access problem and follows the private-cache access policy without claiming
        the repository is empty.
  unresolved:
  - Exact iOS deployment target, performance thresholds and device-based usability evidence.
  - Verify and refine the candidate authorization method and its integration, GitHub API mappings, cache schema and private cache retention policy.
  - Precise chart definitions and historical data requirements for each supported metric. Candidate 0055 proposes a separate fixed cohort; its release scope remains undecided and dynamic Today does not depend on it.
  boundary: This is a pilot specification and verification plan, not evidence of implementation or executed
    acceptance tests.
