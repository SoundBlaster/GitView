acceptance:
- Ordinary Project entry has a defined route for one or several confirmed member Repositories without treating either a GitHub organization or a density change as a Project transition.
- A multi-member Project offers a reachable Project-wide work collection as well as each individual Repository route.
- Within an overview, changing density preserves the selected scope and objects except for independent data or membership changes.
- A Project signal can open its corresponding cross-repository work selection without traversing an unrelated Repository screen.
- Returning follows the actual originating route and restores its valid context rather than inventing intermediate screens or switching Project identities.
- Unavailable member observations and restricted identity do not erase membership or become a known empty work collection.
specification:
  objective: Define the relationship between the Projects overview, a Project's Repository overview, work collections and object overviews while keeping density independent of navigation.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    dimensions: A navigation scope identifies which Projects, Repositories or work objects are being surveyed; density controls presentation inside the current overview. An interaction recognized as an in-scope density change changes density and detail without silently selecting a Project, Repository or object. The owner's Photos-inspired direction also envisions moving between overview levels; whether a deliberately targeted pinch can perform such a scope transition in the first version, and how it is disambiguated from in-scope scaling, remain open rather than being deferred by this candidate. Any selected transition must preserve the actual target and origin and offer an accessible alternative.
    portfolio: The initial Projects overview presents saved Projects according to 0047 and 0072. Explicitly opening one Project selects that identity; a source signal can instead open its corresponding work selection as described below. The detail available in a Project cell may increase with density without changing its membership or creating a new scope.
    multiple_members: As an agent-authored initial route, ordinary entry to a Project whose confirmed saved membership contains multiple Repositories presents that Project's member Repository overview, with permitted names and available summaries. Each member offers a route to its PR and Issue work, and an explicitly identifiable Project-wide work route covers all confirmed current members without requiring the operator to choose an attention signal. Different GitHub organizations are source metadata, not alternate Project identities.
    initial_work: As an agent-authored default for a newly opened ordinary Project-wide or explicitly selected Repository work context, show Today under 0027 with all applicable lifecycle states included and no implicit attention filter. An explicit signal or historical route retains its own condition and period under 0092 and 0056 instead of being converted to Today. An in-session return restores its actual prior context under 0024 rather than resetting it to this default.
    single_member: Ordinary entry to a Project with one confirmed member reaches its Project-wide work collection directly without requiring a second equivalent Project-to-Repository screen. Project-wide intent remains distinct from a Repository scope explicitly selected by the operator; 0091 refines behavior if membership later changes. The Project and Repository remain separately identifiable where permitted, and the source context of each object is retained.
    uncertain_membership: Choose the one-member shortcut or multi-member representation only when the applicable saved membership is established. An unavailable or inconsistent configuration cannot prove a Project has one or zero members. Surface local recovery under 0023, preserve known permitted context and do not silently discard or substitute a member. An unobserved member's work remains unknown under 0047 rather than absent.
    repository_work: Explicitly opening a member Repository's work retains the enclosing Project and the selected source Repository. Changing its density does not widen to all Project members or narrow the active filters, period or object types. A Repository shared by another Project is not silently relabeled as originating there.
    signal_route: Opening an actionable Project signal selects the signal's condition, applicable period and originating Project and can reach matching work across member Repositories directly. The destination identifies Repository context and incomplete or restricted scope under 0047. A count of checks, threads or events is not necessarily the number of destination object cards; 0029 and 0056 determine the units and historical evidence.
    origin_and_return: An ordinary entry and a signal shortcut retain their actual originating route. Back from Repository work entered through a member overview returns to that overview; work entered directly for a single-member Project returns to its originating portfolio surface. Back from a Project-wide signal destination returns to the Project or portfolio surface on which the signal was activated, without fabricating a Repository step. Return from an object restores its originating work selection; Project, Repository, period, filters, density and available position follow 0024.
    density_state: Each currently retained overview context carries its own density and identity-based position during the active session. Changing one overview's density does not silently overwrite the originating overview's density on return. Initial density for a newly entered scope and persistence across a cold launch remain open, subject to 0024.
    scope_change: If saved membership or Project availability changes during navigation, use the confirmed current configuration and the changed-origin rules of 0024. A Project deleted locally is not replaced by another that happens to contain the same Repository. Explicit source denial restricts private detail immediately; it does not itself remove a Project member.
    accessibility: Scope entry, return and density change have distinguishable accessible paths under 0032 and 0073. Non-color identity and state, Dynamic Type and Reduce Motion remain applicable at every level; physical gestures and animation are not the only way to operate the app.
    provenance: Owner discussion establishes the density idea, membership and shortcut goals. The multi-member initial view and route-specific return behavior are agent-authored working proposals; existing prototypes demonstrate a single-member Project only.
  scenarios:
    all_work_for_multiple_repositories:
      given: Project P has confirmed members A and B and their permitted work observations; B belongs to another organization.
      when: The operator opens the Project-wide work route from P without choosing a signal.
      then: Today uses the confirmed A and B Project scope, includes applicable known open and same-day completed work without implicit lifecycle exclusions, and identifies the source Repository of each object.
    signal_does_not_become_today:
      given: An operator opens a historical Project closure outcome for a fixed period from P.
      when: The work collection appears.
      then: The explicit historical event condition and period remain active under 0056 rather than being replaced by the ordinary-entry Today default.
    multi_repository_entry:
      given: Project P has confirmed members A and B from different organizations and B's work has never been observed.
      when: The operator opens P from the Projects overview.
      then: The member overview represents both A and B within P with permitted identity; B is unobserved rather than an empty Repository.
    single_repository_entry:
      given: Project P has one confirmed member R and permitted observations.
      when: The operator opens P.
      then: R's work is reachable directly in P without a duplicate Repository screen; P and R remain distinct in context.
    portfolio_signal_shortcut:
      given: A failed-CI signal on P's portfolio cell represents checks affecting PRs in A and B with known coverage.
      when: The operator opens the signal and then returns without opening an individual Repository.
      then: The destination retains P, the signal condition and each PR's Repository, and return goes to the originating portfolio surface rather than an invented Repository screen.
    independent_densities:
      given: P's member overview is at a dense scale and the operator opens member A's work collection at a more spacious scale.
      when: The operator changes A's work density and returns.
      then: P's prior member-overview density and available position remain, while the work density change does not change P membership or its filters.
    membership_unknown:
      given: A Project's saved membership cannot currently be read and an earlier view showed one Repository.
      when: The operator opens that Project.
      then: The app identifies the configuration uncertainty and offers recovery rather than claiming the Project still has exactly one member or automatically selecting an unrelated Repository.
    removed_origin:
      given: An object opened through P remains accessible in Repository R, and P is durably removed while another Project Q also contains R.
      when: The operator returns.
      then: The changed origin and an available route are offered without silently treating Q as the original Project.
  unresolved:
  - Default density and available controls at each scope require UX and native-device evaluation.
  - Presentation of member overview, cross-repository selection and navigation transitions require detailed design.
  - Decide whether and how a deliberately targeted zoom gesture crosses scope boundaries in the first version, including target selection, reversal and accessible alternatives; this is distinct from the separately deferred sliding preview.
  - No implementation, source integration or native navigation test has been performed.
