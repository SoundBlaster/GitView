acceptance:
- Ordinary Project entry has a defined route for one or several confirmed member Repositories without treating either a GitHub organization or a density change as a Project transition.
- A multi-member Project offers a reachable Project-wide work collection as well as each individual Repository route.
- Within an overview, changing density preserves the selected scope and objects except for independent data or membership changes.
- A Project signal can open its corresponding cross-repository work selection without traversing an unrelated Repository screen.
- Returning follows the actual originating route and restores its valid context rather than inventing intermediate screens or switching Project identities.
- Unavailable member observations and restricted identity do not erase membership or become a known empty work collection.
specification:
  objective: Define the relationship between the Projects overview, a Project's Repository overview, work collections and object overviews while keeping density independent of navigation.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    dimensions: A navigation scope identifies which Projects, Repositories or work objects are being surveyed; density controls presentation inside the current overview. An interaction recognized as an in-scope density change changes density and detail without silently selecting a Project, Repository or object. The owner's Photos-inspired direction also envisions moving between overview levels; whether a deliberately targeted pinch can perform such a scope transition in the first version, and how it is disambiguated from in-scope scaling, remain open rather than being deferred by this candidate. Any selected transition must preserve the actual target and origin and offer an accessible alternative.
    portfolio: The initial Projects overview presents saved Projects according to 0047 and 0072. Explicitly opening one Project selects that identity; a source signal can instead open its corresponding work selection as described below. The detail available in a Project cell may increase with density without changing its membership or creating a new scope.
    multiple_members: As an agent-authored initial route, ordinary entry to a Project whose confirmed saved membership contains multiple Repositories presents that Project's member Repository overview, with permitted names and available summaries, subject to the access-safe routing rule below. Each permitted member offers a route to its PR and Issue work, and an explicitly identifiable Project-wide work route covers all confirmed current members without requiring the operator to choose an attention signal. Different GitHub organizations are source metadata, not alternate Project identities.
    member_overview_presentation: As an agent-authored first-version proposal, start a new multi-member overview with an adaptive compact grid targeting two permitted Repository entries across on a representative iPhone where size and accessibility permit. Each entry identifies its Repository by a permitted name and enough permitted source context to distinguish equal names, and provides an ordinary open action for that Repository's work. Show separately identified open-PR, open-Issue and failed-CI affected-PR values when supported and when they fit; otherwise retain a reachable summary with the same units, scope, freshness and limitations under 0057. A known zero, an unobserved category and an incomplete or failed refresh have distinct supported meanings. Avoid a combined health color or the appearance that a hidden field is known healthy. Adapt to text size and available width; no exact column count, particular control or fixed card layout is required.
    member_order_candidate: Order permitted member entries deterministically by stable confirmed local Repository reference within the current Project; this is a display order, not a priority or GitHub activity ranking. Source rename, owner transfer, refresh and summary changes do not themselves move a confirmed member; a confirmed membership change or identity reconciliation may change the set. Only order eligible representations, without reserved slots, absolute positions or counts that reveal restricted members. If a reference or membership cannot be established, follow the uncertainty route instead of merging or ordering by a guessed name. The exact reference encoding and native focus behavior need validation.
    project_wide_entry: Present an explicit accessible action for the Project-wide work collection independently of Repository cells and attention signals. Its label or associated explanation identifies the enclosing Project and all-current-members intent without exposing restricted member names or counts. Ordinary entry uses the Today and lifecycle defaults under initial_work; it does not imply all members have been observed. It must not be a synthetic Repository identity or a one-for-one placeholder for hidden members. The Project's agreed summary and eligible history remain reachable from the same Project context under 0047 without requiring an individual Repository route.
    member_overview_return: Within a retained member-overview route, density and a permitted Repository anchor belong to that route rather than to its work destination. On return from a Repository or Project-wide collection, retain the actual Project and restore the eligible anchor where applicable; apply 0024 and 0091 to removal, restriction, partial local reads or changed membership. A safe fallback never labels another Repository as the original. A fresh route may use the proposed starting density; changing the Project-wide work density does not rewrite the member overview's density.
    initial_work: As an agent-authored default for a newly opened ordinary Project-wide or explicitly selected Repository work context, show Today under 0027 with all applicable lifecycle states included and no implicit attention filter. An explicit signal or historical route retains its own condition and period under 0092 and 0056 instead of being converted to Today. An in-session return restores its actual prior context under 0024 rather than resetting it to this default.
    single_member: Ordinary entry to a Project whose complete valid saved membership is established as exactly one Repository reaches its Project-wide work collection directly without requiring a second equivalent Project-to-Repository screen. Project-wide intent remains distinct from a Repository scope explicitly selected by the operator; 0091 refines behavior if membership later changes. The Project and Repository remain separately identifiable where permitted, and the source context of each object is retained.
    uncertain_membership: Choose the one-member shortcut or multi-member representation only when the applicable saved membership is established. An unavailable or inconsistent configuration cannot prove a Project has one or zero members. Surface local recovery under 0023, preserve known permitted context and do not silently discard or substitute a member. An unobserved member's work remains unknown under 0047 rather than absent.
    restricted_member_presentation: A valid saved Project may have several members while current disclosure permits only some member identities or work. Keep the internal Project-wide intent and evaluate its coverage against the actual saved scope, but do not reveal restricted members, their exact number or contribution through one-for-one placeholders, a displayed count, an accessible label or a route whose only meaning is the existence of an additional restricted member. Present permitted members or work and an access-safe limitation or recovery route where allowed; if none is permitted, offer a safe Project-level recovery or exit. A permitted subset is not relabeled as the complete Project or as a confirmed single-member Project, even if only one member is visible. Exact layout and source-derived detail classification require privacy and native design review.
    access_safe_routing: Do not choose a visibly distinct multi-member screen solely because a restricted additional member exists when the screen choice itself would disclose that fact. When the operator cannot be shown a complete membership basis, use a neutral Project context that can also apply to an unknown or single-member basis, offering permitted work, Project-wide intent and any safe recovery as supported. Do not assert that this neutral route proves one or several members. The single-member shortcut applies only when its membership basis and route can be disclosed without exposing a restricted fact. This rule preserves internal Project-wide scope and does not mandate a visible generic restriction message if that message would itself reveal protected information.
    repository_work: Explicitly opening a member Repository's work retains the enclosing Project and the selected source Repository. Changing its density does not widen to all Project members or narrow the active filters, period or object types. A Repository shared by another Project is not silently relabeled as originating there.
    signal_route: Opening an actionable Project signal selects the signal's condition, applicable period and originating Project and can reach matching work across member Repositories directly. The destination identifies Repository context and incomplete or restricted scope under 0047. A count of checks, threads or events is not necessarily the number of destination object cards; 0029 and 0056 determine the units and historical evidence.
    origin_and_return: An ordinary entry and a signal shortcut retain their actual originating route. Back from Repository work entered through a member overview returns to that overview; work entered directly for a single-member Project returns to its originating portfolio surface. Back from a Project-wide signal destination returns to the Project or portfolio surface on which the signal was activated, without fabricating a Repository step. Return from an object restores its originating work selection; Project, Repository, period, filters, density and available position follow 0024.
    density_state: Each currently retained overview context carries its own density and identity-based position during the active session. Changing one overview's density does not silently overwrite the originating overview's density on return. Candidate 0047 proposes a two-across starting target for a new portfolio overview; this is independent of the denser work context. As an agent-authored initial design for a newly opened work collection, start in the compact bird's-eye grid illustrated by the owner, targeting roughly eight cells across on a representative iPhone when the available layout and accessibility settings permit. These are adaptive visual targets, not exact column-count or minimum hit-target guarantees; system accessibility and available space may require another density or an equivalent accessible path. A new ordinary route starts from its applicable initial density; a retained route restores its own density under 0024. No cross-launch density preference is established by this candidate.
    scope_change: If saved membership or Project availability changes during navigation, use the confirmed current configuration and the changed-origin rules of 0024. A Project deleted locally is not replaced by another that happens to contain the same Repository. Explicit source denial restricts private detail immediately; it does not itself remove a Project member.
    accessibility: Scope entry, return and density change have distinguishable accessible paths under 0032 and 0073. Non-color identity and state, Dynamic Type and Reduce Motion remain applicable at every level; physical gestures and animation are not the only way to operate the app.
    provenance: Owner discussion establishes the density idea, membership and shortcut goals. The multi-member initial view and route-specific return behavior are agent-authored working proposals; existing prototypes demonstrate a single-member Project only.
  scenarios:
    all_work_for_multiple_repositories:
      given: Project P has confirmed members A and B and their permitted work observations; B belongs to another organization.
      when: The operator opens the Project-wide work route from P without choosing a signal.
      then: Today uses the confirmed A and B Project scope, includes applicable known open and same-day completed work without implicit lifecycle exclusions, and identifies the source Repository of each object.
    signal_does_not_become_today:
      given: An operator opens a historical Project closure outcome for a fixed period from P.
      when: The work collection appears.
      then: The explicit historical event condition and period remain active under 0056 rather than being replaced by the ordinary-entry Today default.
    partial_membership_is_not_single:
      given: A local read independently establishes that R belongs to P but cannot establish whether P has additional members.
      when: The operator opens P from the Projects overview.
      then: R may be presented only within its supported permitted context, while membership completeness and recovery remain visible; the app does not treat R as proof that P has exactly one member or choose the one-member shortcut on that basis.
    multi_repository_entry:
      given: Project P has confirmed members A and B from different organizations and B's work has never been observed.
      when: The operator opens P from the Projects overview.
      then: The member overview represents both A and B within P with permitted identity; B is unobserved rather than an empty Repository.
    distinguish_equal_repository_names:
      given: Project P has two permitted members with the same Repository name under different GitHub owners and both confirmed source identities remain distinct.
      when: The member overview is displayed and the operator opens the second member.
      then: Permitted owner or other permitted source context distinguishes the entries, the selected Repository work stays in P, and the first Repository's objects are not substituted.
    project_wide_from_member_overview:
      given: P contains permitted members A and B, A has observed work and B has not been observed.
      when: The operator chooses the explicit Project-wide work action without selecting a signal.
      then: The destination identifies P and Project-wide Today intent, shows eligible A work while indicating incomplete B coverage, includes applicable lifecycle states by default and does not claim a complete Project result.
    restricted_member_no_extra_slot:
      given: P contains permitted A and private B, but B's identity, membership and contribution are now restricted.
      when: The member overview and Project-wide action are presented, including accessible navigation.
      then: A may be shown and the Project-wide action retains its non-revealing intent; no B-specific tile, reserved position or revealing member count is exposed and any limitation is access-safe.
    restricted_membership_route:
      given: P has permitted A and a restricted B whose membership existence cannot be disclosed, and a separate Project Q has A with membership completeness unavailable.
      when: Each Project is opened under the same applicable disclosure policy.
      then: The route used for P does not reveal B merely by selecting a multi-member-only screen; a neutral Project context can also serve Q, while each route retains its actual internal Project scope and applicable permitted facts.
    member_overview_large_text:
      given: P has multiple permitted members and the operator uses enlarged text on a narrow screen.
      when: The initial member overview is displayed.
      then: It may use fewer columns or taller entries while preserving identification, open actions, an accessible Project-wide work route and applicable summary limitations.
    single_repository_entry:
      given: Project P has one confirmed member R and permitted observations.
      when: The operator opens P.
      then: R's work is reachable directly in P without a duplicate Repository screen; P and R remain distinct in context.
    restricted_member_after_save:
      given: A saved Project has confirmed members A and private B, and B's source identity and contribution become restricted while A remains permitted.
      when: The operator opens the Project and its Project-wide work.
      then: The local Project and both memberships remain unchanged, permitted A work can be reachable with a safe scope limitation, and neither B nor its exact contribution is revealed through a member placeholder, count or accessible route. The visible A subset is not called the full Project or proof that P has one member.
    portfolio_signal_shortcut:
      given: A failed-CI signal on P's portfolio cell represents checks affecting PRs in A and B with known coverage.
      when: The operator opens the signal and then returns without opening an individual Repository.
      then: The destination retains P, the signal condition and each PR's Repository, and return goes to the originating portfolio surface rather than an invented Repository screen.
    independent_densities:
      given: P's member overview is at a dense scale and the operator opens member A's work collection at a more spacious scale.
      when: The operator changes A's work density and returns.
      then: P's prior member-overview density and available position remain, while the work density change does not change P membership or its filters.
    membership_unknown:
      given: A Project's saved membership cannot currently be read and an earlier view showed one Repository.
      when: The operator opens that Project.
      then: The app identifies the configuration uncertainty and offers recovery rather than claiming the Project still has exactly one member or automatically selecting an unrelated Repository.
    removed_origin:
      given: An object opened through P remains accessible in Repository R, and P is durably removed while another Project Q also contains R.
      when: The operator returns.
      then: The changed origin and an available route are offered without silently treating Q as the original Project.
  unresolved:
  - Evaluate the proposed initial portfolio, member and work-grid densities, control placement and navigation transitions with native-device and accessibility evidence.
  - Validate the proposed local reference ordering and access-safe presentation against storage, identity reconciliation and privacy requirements.
  - Candidate 0120 proposes targeted first-version zoom across scope boundaries, including target selection, reversal and accessible alternatives; validate its usability and native feasibility before implementation readiness. It is distinct from the separately deferred sliding preview.
  - No implementation, source integration or native navigation test has been performed.
