acceptance:
- A reordered or reflowed collection keeps the currently inspected permitted object identifiable by its
  actual identity rather than by its old position.
- If an object is no longer in the active collection, accessible focus has a meaningful successor, predecessor
  or collection-state fallback without misidentifying a different object.
- An uncertain candidate remains distinguishable from a confirmed matching object and is not lost solely
  because its grouping changed.
- Confirmed private Repository revocation is made accessible without waiting for visual reordering while
  saved content remains available under 0019 with its indication and supported time when known.
- Failures, incomplete coverage and changes to the selected period are discoverable without requiring
  a transient announcement or color.
specification:
  objective: Specify observable focus continuity and safe recovery during asynchronous overview changes
    across visual and assistive navigation.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    identity: Associate the active focus or inspection target with the appropriate stable Project or source
      object identity and originating scope. Equal local numbers, a reused cell position and a changed
      label do not imply the same object. An unresolved source identity retains the limitations in 0042;
      a temporary presentation token is not proof of source identity.
    live_reorder: Source refresh can change work order under 0042, while the Project order follows 0072.
      When the focused object remains present and permitted, maintain an accessible path to that same
      object across a reorder or density reflow. Do not programmatically move focus to the item that inherits
      its old position or falsely announce that the target changed. Exact focus APIs and platform scheduling
      remain open.
    candidate_transition: When a confirmed match becomes uncertain because a required value is unavailable,
      preserve its known object identity and provide access through the uncertain portion or equivalent
      path under 0042. If it remains represented there and access is permitted, maintain or restore focus
      to that object where feasible; disclose that its selection status is uncertain. Do not call the
      changed grouping a confirmed exclusion or leave focus on a stale claim of a confirmed match.
    section_and_status: Distinguish confirmed matches and uncertain candidates accessibly under 0042;
      if its optional two-portion presentation is selected, label each portion perceptibly. Coverage status
      remains reachable even when no known cell is available. An assistive user can navigate to a permitted
      uncertain object, inspect why its selection is uncertain where supported, and open or dismiss its
      eligible preview without requiring a precise gesture. A collection-wide unknown population is not
      announced as a specific number of hidden objects or as an empty source.
    removed_or_unavailable: If a selected object no longer matches or is unavailable in the active collection,
      use the last known ordered collection and the successor, predecessor and collection-state fallback
      in 0024. With no reliable prior order or when the collection is incomplete, do not assert that the
      fallback is the next source object or imply an exhaustive selection. When an object overview or
      preview remains open, preserve its identity under 0031 and apply fallback on return rather than
      immediately switching it to another object.
    active_interaction: Defer disruptive ordering or collection changes during an active pinch, scroll
      or discrete assistive interaction when a coherent presentation is possible, while making incomplete
      data or pending updates discoverable. After the interaction reconcile the eligible selection without
      indefinite deferral. Confirmed private Repository revocation is indicated immediately without hiding
      available saved content under 0019; it stops synchronization. An obsolete match is not asserted
      current and no precise animation timing is promised.
    status_changes: Make a relevant failure, incomplete scope or changed Today period persistently discoverable
      in the current accessible context or its status route. A completed update is not proof of complete
      coverage. Avoid treating every changed cell as an urgent interruption; exact announcement timing,
      coalescing and focus movement must be evaluated on supported devices.
    access_change: When private Repository revocation is confirmed, keep saved values available in app-controlled
      accessible labels and equivalent visual content under 0019, adding an accessible revocation indication
      and supported update time when known without waiting for deferred ordering. Offer accessible recovery
      or explicit local deletion. Do not claim source access or promise to retract already announced information.
    identity_change: When the active source identity changes, apply its current access policy to focused
      objects, app-controlled accessible labels and pending announcements before restoring or announcing
      them. An anchor retained for navigation is not evidence that a newly active identity may inspect
      the object. If it is not eligible, provide a permitted collection or recovery context without exposing
      the restricted identity or attributing its focus to a different object. This does not prescribe
      a platform speech-interruption mechanism.
    user_control: The operator can continue through permitted content, open a surviving object, reach
      status and filters, and leave the affected scope without relying solely on a gesture, color or timed
      announcement. These are user outcomes, not a mandate to create custom controls.
    provenance: This focus and update behavior is an agent-authored refinement of the owner's dense grid,
      navigation and Apple-style direction; it is not evidence of implemented accessibility support.
  scenarios:
    refresh_moves_focused_pr:
      given: An assistive user is focused on PR 42 in Repository B while a second Repository has a different
        PR 42.
      when: A refresh changes the sort position of B's PR but it remains a permitted match.
      then: The user retains a path to B's same PR and its actual updated accessible state; focus is not
        attributed to the cell now occupying its old position.
    restored_object_during_focus:
      given: An assistive user is focused on a permitted PR in a filtered Project collection while a different
        Repository yields a newly permitted matching PR.
      when: The collection reconciles the newly supported result.
      then: The original focused PR retains its identity and an accessible path where still eligible;
        the new PR does not inherit its focus merely by taking the prior position, and incomplete coverage
        remains discoverable where applicable.
    candidate_becomes_uncertain:
      given: A focused PR is a confirmed failed-CI match and a later observation cannot establish the
        applicable CI result.
      when: The selection is reevaluated.
      then: The same permitted PR remains inspectable in the uncertain portion or equivalent path, the
        uncertainty is discoverable, and it is not announced as a confirmed failed match or confirmed
        exclusion.
    no_known_cells_with_coverage_gap:
      given: A Project filter has no currently known permitted matching or uncertain objects and one source
        scope remains unobserved.
      when: An assistive user reaches the work collection.
      then: The incomplete collection status and available recovery are discoverable without a placeholder
        object, fabricated count or announcement that GitHub is empty.
    preview_and_day_boundary:
      given: A VoiceOver user has opened a PR preview from Today and the PR will not match the next local
        day.
      when: The local day changes and the preview is dismissed.
      then: The preview was not retargeted, the current day and incomplete coverage are discoverable,
        and focus uses a valid surviving anchor or collection-state fallback.
    revoked_while_deferred:
      given: A private PR title is focused and a grid rearrangement is deferred during an interaction.
      when: Private Repository revocation is confirmed before the interaction ends.
      then: The saved title remains available to assistive technology with the revocation indication and
        supported update time when known without waiting for rearrangement; accessible recovery or explicit
        local deletion remains available.
    failure_after_transient_feedback:
      given: A refresh failure was visually indicated while an assistive user was inspecting another cell.
      when: The transient feedback has disappeared and the user later opens the status route.
      then: The affected scope, failure and applicable last successful observation remain discoverable
        without relying on the original cue.
    focused_object_after_identity_change:
      given: A private PR is focused under identity A and identity B becomes active without confirmed
        access to that Repository.
      when: The collection or object route is restored for B.
      then: Restricted app-controlled labels and pending announcements are not exposed, the old anchor
        is not announced as another object, and a permitted recovery context is reachable.
  unresolved:
  - Supported assistive technologies, focus APIs, announcement policy and timing require implementation-independent
    platform design and device evaluation.
  - The exact presentation and accessible grouping of uncertain candidates require UX validation.
  - Native accessibility tests and real source observations have not been executed.
