acceptance:
- The main overview represents each saved GitView Project and identifies it where its identifying information is permitted to be shown, without treating a GitHub organization as a Project.
- Available work counts, attention signals and period outcomes retain their meaning, scope and coverage.
- Opening a Project or one of its actionable signals preserves Project and source Repository context.
- A Project with incomplete observations remains represented and cannot be mistaken for confirmed empty or healthy work.
- The operator can reach Repository discovery for default setup and a separate explicit custom-Project creation route from the overview without losing saved Projects.
- The agreed Project summary and eligible metric history remain inspectable from the Project context even when a compact cell cannot display them all.
specification:
  objective: Help the operator survey Projects, notice relevant work and enter the selected scope without losing identity or data limitations.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    collection: The main overview concerns locally saved GitView Projects. It does not equate a Project with a GitHub organization or GitHub Projects feature. A local Project can include repositories from different organizations and a Repository can occur in multiple Projects.
    manage_projects: The overview offers an accessible route to add default Projects from Repository discovery under 0022 and 0045, and a distinguishable route to explicitly create a custom Project under 0025. Both routes remain reachable when Projects already exist; a confirmed empty collection offers a route into setup under 0022. Beginning either route does not itself create a Project or alter the existing portfolio. The exact control, placement and whether the routes share intermediate screens remain open.
    entry: Each Project representation exposes its name and member Repository count where known and permitted, and makes available selected work counts, attention signals and period outcomes according to space, coverage and access. When a Project name or another identifying detail derives from restricted private source data, do not expose that detail solely to identify the entry; provide a non-sensitive representation and a route to understand or resolve the access problem. Exact visual arrangement and default density remain subject to product and native design refinement.
    compact_project_identity: At compact density, preserve a perceivable way to identify and open each permitted Project, including its name and member count when those values are available and can be meaningfully presented. When they do not fit, a clearly associated inspection or less-dense route exposes them without relying exclusively on long press, color or precise tiny text. Equal or truncated names do not establish identity; distinguish permitted Projects through their local identity and enough allowed context before acting. Restricted details are not exposed to force visual distinction, and no private count is inferred from a neutral representation.
    summary_reachability: From an identifiable Project, the operator can reach the agreed Project-wide summary even when the cell, accessible label or static preview shows only a subset. Where supported and permitted, it makes separately inspectable the member count and coverage, open PRs and draft subset, open Issues, failed CI, outstanding review requests, changes requested, unresolved threads and affected PRs, blocked Issues, and merged PR and Issue closure outcomes for a stated period under 0057. Unknown, partial, stale and restricted inputs retain their own limits. The optional checks-and-review-passed selection remains conditional on its own chosen predicate; omission of a signal from a compact cell does not mean zero, healthy or absent.
    today_progress: From the Project context make the applicable dynamic Today lifecycle breakdown under 0057 inspectable alongside its scope, filters and evidence. A compact cell need not fit every category. It is separate from period outcome counts, historical series and a fixed PR cohort; it is not labeled a burn-down trend from a single current observation.
    metric_history_route: From the Project context the operator can reach history for the selected summary metrics when sufficient permitted evidence exists. Indicate insufficient history or coverage without inventing a zero, connecting unsupported points or claiming that a chart exists for an unsupported series. A series retains its metric, subject, unit, period, membership basis, time and access context under 0057, 0064 and 0065. Summary and history navigation remain accessible without long press, pinch or color alone; exact chart choice and placement remain open.
    layout_and_refresh: A density change may alter how much of the same Project summary is immediately visible but does not alter the Project, period, predicates, observations or coverage. A newly observed signal may change a displayed value under the update rules; neither a hidden signal nor a separate successful category makes other categories current. Avoid a generic all-clear based only on visible fields. Preserve the original Project and actual route when opening a summary, metric history or signal selection and returning under 0024 and 0092.
    units: Open PRs, open Issues, failed checks, affected PRs, review attention and period outcomes remain distinct units under 0029. A single indicator must not imply that one PR is multiple independent work items or that a Project is merge-ready.
    selection: Opening a Project enters that same Project. If it contains exactly one Repository, work is reachable without a duplicate Project/Repository screen while both identities remain distinct. A multi-repository Project exposes its members and an appropriate path to each member's work under 0006.
    signal: An actionable signal can open a filtered work collection in the originating Project. The active condition, period and Project remain identifiable; when work comes from several Repositories, its source is distinguishable. Unknown inputs and partial coverage follow 0027 and 0046 rather than being presented as a complete filtered list. Candidate 0092 refines what happens when the operator explicitly changes that initial condition.
    signal_unit: The destination is a work-object collection, not necessarily a list of the metric's counted units. Where the source counts individual checks, threads or events, identify the distinct PR or Issue unit in the destination and retain the originating condition and period under 0029. Do not imply that the number of cards must equal a count expressed in another unit.
    failed_ci_signal: The Project's failure-category count and its destination apply the same working status-check classification under 0061, scope and observation context. The open-PR count retains its open-lifecycle condition at the destination. A timeout or status error is not relabeled as a failed test; a special outcome outside the failure count is not thereby represented as healthy.
    review_signal: Requested-review, changes-requested and unresolved-thread signals preserve their independently named condition, open-PR scope and observation context under 0062. A thread-count signal can lead to fewer distinct PR cards than threads; absence or uncertainty in one review fact does not decide another.
    older_comment_signal: Candidate 0094 adds an age-based attention proxy whose label or accessible explanation identifies an unresolved thread with a submitted comment at least 24 elapsed hours old. Opening it retains the originating Project, open-PR scope, distinct thread or affected-PR unit, threshold and reference-time context; 0092 describes reevaluation in the destination. A qualifying older comment is not described as proof of continuous unresolved time, inactivity or an outstanding reply. If the compact representation cannot fit this meaning, make it accessible through its associated summary or signal inspection without requiring color or long press. Unknown or restricted inputs do not become a zero or a disclosed private count.
    blocked_issue_signal: A blocked-Issue signal counts affected open Issues and opens those Issues, not their blockers, under 0063. A direct blocker outside Project membership does not expand that membership; inaccessible dependency information stays restricted or uncertain.
    historical_signal: A historical outcome signal that opens distinct work objects retains the event condition, scope and period under 0056; a currently reopened Issue may still qualify for an earlier closure. If the destination cannot support the original condition or its evidence is incomplete, expose that limitation.
    signal_update: A refreshed or partially loaded destination may differ from the observation underlying the originating signal. Its coverage and relevant observation context remain identifiable; unknown or restricted data is not displayed as an empty or healthy result.
    observations: An unobserved category remains unknown, partial and failed scopes remain identifiable, and stale data retains its observation context. Explicit denial follows 0036; no restricted private content or derived count is exposed as a healthy zero.
    restricted_aggregation: Apply the conservative input-provenance and differential-disclosure policy of 0064 to current summary values as well as history. A persisted total containing a now-restricted input is not exposed alongside a permitted subset; an independently supported permitted subset may remain available under its safe scope and coverage. Do not reveal restricted membership counts, source names or exact contributions through labels, accessibility, navigation or sharing.
    scale_and_access: Density can change without altering the selected Project set or its accounting. Essential identification, navigation and refresh do not depend only on pinch, long press or color; accessible behavior follows 0032 and 0035.
    provenance: Multiple Projects, summary signals and a compact Apple-style overview follow the owner's product direction. Exact distribution of fields across densities and control placement remain agent-independent design questions.
  scenarios:
    compact_summary_with_missing_checks:
      given: A Project has two confirmed members, available open-PR counts and incomplete CI coverage; at the current density its cell cannot fit every signal.
      when: The operator identifies the Project and opens its summary without long press.
      then: The same Project's permitted counts and incomplete CI state are discoverable with their scope, no missing CI is described as healthy, and no other Project is substituted by similar name.
    graph_with_history_gap:
      given: A Project summary has a current open-PR count but lacks sufficient history for an earlier day.
      when: The operator opens the corresponding history from the Project context.
      then: The series identifies its scope and metric and shows the earlier point as a gap or incomplete rather than using the current value or zero.
    existing_portfolio_add_project:
      given: The overview contains saved Projects and the operator wants a custom Project using one or more eligible Repositories already represented there.
      when: The operator enters the custom-creation route and confirms a valid Project.
      then: The new Project can appear with its own identity while existing Projects, memberships and default associations remain unchanged under 0025; the overview is not reset to first launch.
    two_organizations:
      given: One Project contains two Repositories from different GitHub organizations.
      when: The operator opens that Project.
      then: Both remain in the same GitView Project and neither organization is silently substituted for the Project.
    shared_repository:
      given: Repository R belongs to Projects P and Q and has one observed open PR under complete coverage.
      when: Both Project summaries are visible.
      then: R contributes to P and Q while a unique portfolio count includes its PR only once.
    missing_category:
      given: A Project's PR scope is observed and its Issue scope has never been obtained.
      when: Its summary is shown.
      then: The observed PR value remains available and the Issue count is unknown or loading rather than zero.
    follow_signal:
      given: An actionable failed-CI signal belongs to Project P containing Repositories R1 and R2.
      when: The operator opens that signal.
      then: The resulting work collection retains Project P and failed-CI condition and distinguishes source Repositories; partial coverage remains visible.
    checks_to_prs:
      given: An actionable Project signal describes five failed checks belonging to two PRs and no source data changes.
      when: The operator opens that signal.
      then: The destination describes the failed-check condition and two affected PRs, without implying five PR cards or losing Project context.
    restricted_default_name:
      given: A default Project was named from a private Repository and source access is explicitly denied.
      when: The Projects overview is displayed.
      then: The Project remains represented without exposing its restricted source-derived name or private counts, and the access problem is discoverable.
    restricted_total_and_permitted_subset:
      given: A previously displayed Project total of 10 includes seven PRs from permitted Repository A and three from Repository B, whose private PR data is now explicitly restricted.
      when: The operator opens the summary and an A-only view.
      then: The A-only seven may be shown where its scope is permitted, while the prior total and other app-controlled equivalents that expose B's contribution are suppressed; the Project is not reported as having only seven total PRs.
  unresolved:
  - Default layout, ordering of Projects and exact subset of signals shown at each density.
  - Exact visual and accessible controls for signal navigation and cross-Repository scope selection.
  - Classification of local Project names that were independently supplied by the operator versus derived from a private source requires privacy and storage refinement.
