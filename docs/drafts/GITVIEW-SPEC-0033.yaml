acceptance:
- Opening or sharing uses an eligible source link associated by observation with that Repository, PR or Issue, without claiming a last-known link still resolves there when its current destination is unverified.
- Missing or unverified source links do not silently navigate to a different source object.
- Under the agent-proposed link-only default, sharing passes the source link through the platform sharing flow without automatically including private object contents or credentials; the default payload remains a product decision.
- A source link does not imply that a recipient has access or that an external application successfully opened it.
specification:
  objective: Preserve object identity and access boundaries when moving from a GitView overview to its source or sharing a link.
  ontology_refs:
  - gitview:User
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    link_identity: The selected source link belongs to the selected object and repository identity. Equal repository-local numbers in distinct repositories do not identify the same PR or Issue. Repository rename and transfer do not by themselves authorize substituting an unverified address.
    observed_link: Retain the source identity and observation context that associated an address with an object. A last-known permitted address with no contradictory evidence may be offered as last known, with its uncertainty identifiable; an old observation alone does not establish that the address still resolves to the same object. A redirect or handler launch is not by itself proof of the final source identity.
    eligible_web_link: A source link must be a well-formed HTTPS web address associated by usable source evidence with the selected object and an approved web origin for its source instance. Reject or keep unavailable malformed links, unsafe schemes, embedded user credentials, credential-bearing query or fragment values, and an unverified different origin. Do not rewrite or strip components while claiming the result still identifies the same object unless independent evidence supports the resulting link. This initial rule concerns external handoff and does not authorize arbitrary source instances or prescribe how they are configured.
    known_address_reuse: If reliable source evidence establishes that a previously associated address now identifies a different Repository or object, do not offer that address as the selected object's source or share link. A newly observed address becomes eligible for the original object only when its identity is sufficiently confirmed; otherwise provide an unavailable or uncertain result under 0038.
    open: When an eligible source link is available, provide an operation that requests opening it through the platform. A request to open is distinct from the recipient application successfully loading the object; a failure can be reported without changing stored GitHub data.
    share: Under the agent-proposed link-only default, when an eligible source link is available GitView supplies that link as its default payload to the platform share flow, without adding source text or credentials. The default payload remains an open product decision. Link-only describes GitView's own supplied payload, not a guarantee that the system or destination will never retrieve or display metadata from that URL; platform-generated previews are outside that guarantee. The platform share flow allows the operator to choose a recipient or cancel; presenting the flow is not evidence of delivery, recipient access or source mutation. This contract does not claim control over how a destination processes a link after handoff.
    related_target: When Open on GitHub or source-link Share is explicitly invoked from a committed related-object overview, the selected source object is that target, with its own confirmed Repository and eligible observed link, even if it was reached through an Issue or PR in another Project. Do not substitute the origin object's link or fabricate a Project URL. Under the proposed link-only payload, do not attach the origin title, relationship or source text; the default payload remains a product decision. An origin relationship does not authorize the target link; evaluate target identity, link association and disclosure independently under 0078 and 0121. System-generated metadata after handoff is outside this payload guarantee.
    unavailable: If no source-observed association between an eligible link and the selected object is established, identify the operation as unavailable rather than inventing a URL from a title, number or previous unrelated address. A previously associated permitted link with no contradictory evidence may be offered as last known under observed_link; its present destination is not thereby verified. If its current destination is unknown, preserve that uncertainty and observation context rather than asserting it is current.
    access: Before exposing a link associated with restricted private cached content, apply the current access policy in 0019. A recipient's GitHub permissions determine access after sharing; a link is not a grant. Credentials must not be added to the share payload or diagnostics.
    access_at_handoff: Re-evaluate the available evidence and access policy when initiating source opening or supplying a payload to the share flow, not only when the originating cell was first rendered. If the link has become restricted before handoff, do not supply it; show a permitted recovery path. Once information has been handed to another application, this contract does not claim GitView can retract copies or control the recipient.
    delayed_handoff: If an app-controlled share provider supplies a link after the share interface has appeared, apply the current access and link eligibility at actual payload provision as well as at initial activation. If access becomes restricted before provision, withhold the restricted link and offer an allowed limitation where the platform permits. If the link has already been supplied outside app control, do not claim it was retracted; the platform or recipient may retain it. No particular platform callback or guarantee of revocation is assumed.
    handoff_result: Distinguish GitView preparing a link, the platform accepting an open request or presenting a share flow, cancellation, reported platform or activity outcome, and independently verified source access or recipient delivery if such evidence is ever available. A platform success callback is attributed only to the semantics that platform actually documents; it is not automatically proof that the intended source object loaded, that a recipient read the link, or that GitHub permissions changed.
    failure: Failure to open an external handler or a recipient's later access denial does not prove the object was deleted. The existing GitView context remains recoverable under 0024.
    provenance: The owner requested source navigation and lightweight sharing. Link-only default and detailed failure rules are agent-authored proposals.
  scenarios:
    cross_repository:
      given: Two repositories have Issues numbered 42 and each has its own observed source URL.
      when: The operator opens or shares the second repository's Issue 42.
      then: The URL passed to the platform is the eligible URL source-associated with that Issue and is not the first repository's URL; any unverified current destination remains qualified under observed_link.
    shared_related_target:
      given: The proposed link-only default is selected, and the operator is viewing permitted PR B in Repository R2 after following a relation from Issue A in Repository R1 and Project P; distinct eligible links exist for A and B.
      when: The operator explicitly shares from B's committed overview.
      then: The app-controlled default payload is B's eligible link only, not A's link or a statement about their relationship; R2 is not added to P and the share flow is not proof of delivery.
    missing:
      given: A selected PR has no source-observed association with an eligible URL; neither a current nor a last-known eligible link is established.
      when: The operator tries to open or share its source.
      then: The operation is unavailable or reports why it cannot proceed and does not fabricate a URL.
    private_share:
      given: The proposed link-only default is selected, and a private PR is currently permitted for display with a known source URL.
      when: The operator opens the platform sharing flow.
      then: The default payload contains the link without automatically adding private text or credentials, and no delivery or access is asserted.
    cancelled_share:
      given: The platform sharing flow is visible for an Issue link.
      when: The operator cancels it.
      then: GitView remains recoverable at its prior context and does not record a successful delivery solely from presenting the flow.
    reused_old_address:
      given: Repository A was observed at an address that is later confirmed to belong to Repository B with a different identity.
      when: The operator opens or shares the original source of A.
      then: The reused address is not offered as A's link; an independently confirmed new link for A may be used or the action remains unavailable or uncertain.
    denied_before_handoff:
      given: A private PR link was visible while allowed, but explicit access denial is established before the operator starts sharing.
      when: GitView evaluates the share action.
      then: The restricted link is not supplied to the platform flow and an accessible recovery path is available.
    independent_link_with_incomplete_ci:
      given: A permitted identified PR has an eligible source-associated link, while its current checks or review observations are incomplete.
      when: The operator opens or shares the source link.
      then: The action can use the eligible link under its own association and access context without claiming CI or review completeness; an independently unverified current destination remains identified as last known.
    permitted_last_known_link:
      given: An object has a previously source-associated eligible link, no conflicting address evidence and no current resolution observation, while access policy permits its use.
      when: The operator opens or shares the source.
      then: The link may be offered as last known with its limitation, without claiming its present destination has been verified or inventing a replacement address.
    credential_bearing_link:
      given: A source response or local record supplies a purported PR URL containing an embedded credential or an unsafe scheme.
      when: The operator invokes Open or Share.
      then: That address is not passed to the platform or printed as a diagnostic, and a separately evidenced eligible link or a safe unavailable state is used instead.
    denial_before_delayed_provision:
      given: The platform share interface has appeared but an app-controlled provider has not yet supplied a private PR link.
      when: Explicit denial is established before the provider supplies its payload.
      then: The provider does not supply the restricted link; no claim is made about revoking any data already handed outside app control.
  unresolved:
  - Source URL verification, stale links after rename or transfer and supported destinations require source and platform refinement.
  - Optional payload beyond the source link remains a separate product and privacy decision.
