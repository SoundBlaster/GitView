acceptance:
- The selection decision receives normalized scoped facts, explicit filter context and their supported truth values; it performs no source, storage or navigation effects.
- A confirmed true Today alternative remains sufficient when another alternative is unknown; a confirmed false required condition excludes within its valid context.
- Each confirmed source object appears at most once, while unresolved identity and restricted presentation do not become a confirmed distinct card or revealing count.
- Per-object classification, collection coverage and an intentional all-states-excluded result remain separate outcomes.
- The output retains enough input and time context to avoid relabeling stale or mixed-time facts as a simultaneous current source snapshot.
- The decision is specified for deterministic TDD with injected facts and time, while real source, storage and native interaction evidence remain separate.
specification:
  current_intent_boundary: The owner selected Today to include older unfinished work and work completed during the current calendar day in the user's local time zone; a previous day's completion alone does not qualify an object for the new Today. The complete O OR C OR E formula, creation-time alternative and technical decision interface below remain candidates, not automatically accepted by that decision. A confirmed merged PR leaves unfinished-only work but can remain eligible in unfiltered Today. Applicable lifecycle states and persistent filters remain selected; coverage, persistence scope and exact decision remain open. See canonical 0001 and 0007 and sketch revisions cc419cb9283f471b88b6f4b66e56c5ad and 3077fdcd9a8247769def8d6403c2e61c.
  objective: Define an implementation-facing pure decision boundary for Today selection over already interpreted evidence without selecting source requests or UI components.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    owner_all_states_today_boundary: The base Today grid and an optional unfinished-only filter are distinct. A confirmed merged PR is eligible for unfiltered Today only when it meets a supported applicable inclusion condition under the selected source scope, while it is a non-match for an explicitly selected unfinished-only condition. User-selected filters are persisted and restored by the route or storage owner, not by this pure decision; its actual restored context is an input. Identity, source completeness, access and current-state applicability remain independent and no retrieval horizon is selected here.
    owner_merged_pr_decision: Given a permitted confirmed PR identity and applicable source-supported current merged lifecycle within the selected scope, the PR is a known non-match for current unfinished work. If the current lifecycle is unknown or only an inapplicable last-known observation is available, omission or refresh failure alone does not establish merged or a lifecycle-based non-match; preserve the actual context and uncertainty. Metric evaluation is separate and requires its own applicable evidence, period, access and population coverage. Unfiltered Today includes other closed lifecycle states when their objects satisfy an applicable inclusion condition; the source range and actual filter context remain to be specified.
    input_composition_candidate: The pure decision requires the supported input meanings and context described below. The initial FSD assembly in 0107 is one proposal for preparing those inputs; an alternative composition must independently provide them and enforce applicable access, but the decision does not depend on a particular screen, setup or storage design.
    scope: This candidate contract evaluates normalized work candidates for one selected Project-wide or explicit Repository context, one Today interval and explicit filters. The user selected their local time zone; the device binding and exact interval and time-zone-change mechanics remain candidates. It does not fetch candidates, prove the source population complete, order cells, perform access authorization or open an object. The application must complete applicable parent and dependency decisions before using this leaf to begin product implementation.
    inputs: Supply the selected Project and Repository intent, captured eligible Repository identities or explicit membership uncertainty, captured Today interval and selected boundary interpretation, selected object types and lifecycle states, any active predicates, per-candidate normalized identity and permitted presentation status, and source-supported predicate facts with their observation, event-time, revision and applicability context. Separately, the collection assembler obtains a scoped population-coverage assessment and source or storage limitations where established; those are not required inputs to the per-candidate result. A fact omitted, incompatible, unobserved or inapplicable to the requested current context enters as unknown rather than false.
    candidate_units: Before decision evaluation, source representations that are proven to denote one PR or Issue are associated under 0101. Evaluate each confirmed object identity once for the selected scope. An unresolved possible identity association is not silently coalesced by name or number and cannot yield an exact distinct-object count. A linked Issue and PR remain distinct. Identity and access restrictions are evaluated under 0036 before presenting a candidate or a derived count.
    untyped_input_boundary: The per-object decision accepts a confirmed typed PR or Issue reference, not an untyped source record or a locally invented placeholder. Selecting all supported types removes an operator type restriction; it does not establish that an untyped, malformed or newly introduced source kind is a PR or Issue, or that its source identity is confirmed. Preserve such a record under 0101 as an unresolved representation where retention and access permit. The caller accounts for its potential relevance separately in collection coverage, without manufacturing a typed match, non-match, card or exact count. A separately permitted limited inspection may describe only source-supported facts under 0042; an unobserved or restricted record is not exposed merely to explain a gap.
    predicates: Conditional on the unselected O OR C OR E formula and its creation alternative, for each eligible candidate derive a three-valued scope condition S, open-work alternative O, in-interval creation alternative C, and qualifying in-interval closure or merge alternative E using the applicable facts, captured Today interval and selected boundary rule. The device-local half-open day is one proposed interpretation under 0049. Derive each explicitly active type, lifecycle or attention filter F independently. True and false mean supported in the stated context, not eternal or necessarily simultaneous source truth. A timestamp of retrieval alone is not an event; a closure outside the interval is not a qualifying Today event. A candidate's current state and an event that qualifies it are distinct facts.
    restricted_predicate_inputs: Before preparing a result for app-controlled disclosure, evaluate each predicate using only facts currently eligible for that disclosure and the captured source and access context. If a PR's identity and title are permitted but its old CI or review input is still restricted, that restricted input cannot establish a visible match, visible non-match, ordering group, count, badge or explanation. For the permitted candidate the affected predicate is unknown unless independently supported permitted evidence determines it; an independently supported false required condition may still exclude it without disclosing the restricted fact. If even the candidate's existence or identity is restricted, do not expose it as an unknown card. Apply 0112 to partial restoration and revalidate current access at projection so an earlier decision cannot outlive a newer restriction. This rule prevents a filtered section from revealing a previously restricted predicate through inclusion or exclusion.
    truth_domain: For the unselected proposed O OR C OR E formula, use values true, false and unknown. For OR, true dominates; all operands false yields false; otherwise the result is unknown. For AND, false dominates; all operands true yields true; otherwise the result is unknown. No active optional filters means their conjunction is true. For each candidate evaluate base as O OR C OR E and result as S AND T AND base AND every applicable active filter, where T is the explicit selected-type and type-applicability gate described below. Interpret true as a confirmed match in the supplied context, false as a confirmed non-match in that context and unknown as an uncertain candidate. A negated filter must preserve unknown rather than turning it into true.
    compound_reference_preparation: The truth table applies only after the caller prepares facts for the requested claim and its reference under 0089 and 0116. For a conjunction asserted at one reference, independently true observations at different times or revisions do not automatically supply true operands for that shared reference. An unestablished required constituent is unknown, unless an independently supported false condition for that same context determines non-match. Individually supported historical or mixed-time facts may still be shown with their own contexts; an observed-reference working view under 0115 must not label them a simultaneous current source snapshot. This is an applicability requirement for inputs, not an extra Boolean rule or a demand that unrelated facts share a timestamp.
    filter_facets: For the first-version working policy, selected object types form a union, and explicitly selected lifecycle alternatives form a union within each object type; different active filter facets are combined as required conditions. The default is no type or lifecycle restriction, represented by all supported choices selected in the control. For an identified supported type with no lifecycle restriction, the lifecycle filter condition is true even when its current lifecycle is unknown or an unrecognized source value; the displayed lifecycle still remains unknown and other required predicates retain their own truth values. An explicit restriction to a subset of lifecycle alternatives needs applicable state evidence; an unavailable, incompatible or unrecognized lifecycle is then unknown rather than a match or exclusion. Explicitly deselecting every lifecycle state for one type excludes that type while leaving another type's selected states intact; deselecting all applicable states for all selected types produces the intentional filtered-empty state. An unavailable applicable draft fact remains unknown when a draft restriction is active; negation does not turn it into a supported false fact.
    facet_reset_input: The route supplies explicit facet selections and their restriction semantics, distinguishing an unrestricted default from an intentionally empty set. Under the proposed 0092 clear-all action, reset maps to no type or lifecycle restriction with all supported choices visually selected and no attention predicate; it does not pass an empty allowed-state set as shorthand for no restriction. When every supported lifecycle choice is re-enabled for a type through the first-version control, treat that facet as unrestricted for that type rather than inferring a hidden exclusion of unknown or future source states. A pure policy interprets only its supplied normalized selection and cannot infer a user edit or mutate UI state. An empty selected type set is an intentional filter exclusion, not evidence that the source population is empty or fully observed.
    typed_attention_filters: A failed-CI, review-required, review-request, changes-requested, unresolved-review-thread or inactive-review-discussion selection describes PRs under the applicable predicate and source context. A blocked-Issue selection describes Issues under 0063. Restrict the selection to the predicate's applicable object type before evaluating its source facts. An Issue does not pass a failed-CI selection merely because CI is inapplicable, and a PR does not pass a blocked-Issue selection. This known type-scope exclusion is not a claim that the excluded object has healthy CI or no blockers. For simultaneous required attention predicates, intersect their applicable type scopes; a PR-only and an Issue-only condition have no supported candidate type in common. A selected-type conflict can yield an intentional empty result without asserting that the source has no work; preserve active conditions and independent coverage or failure limitations.
    candidate_non_draft_filter: If the optional 0125 open non-draft filter is included and explicitly selected, treat it as a PR-only conjunction of applicable open lifecycle and draft false, not as a predicate on Issue or a source mergeability verdict. An identified Issue is outside that typed selection, regardless of any missing PR draft fact. For an identified PR, evaluate the open condition and draft restriction using the truth_domain rules; false open or true draft is sufficient for a known non-match, while an unknown required condition remains unknown unless another supported false condition decides the conjunction. An older draft observation not established for the requested context is unknown, not false. Today base inclusion, membership, access and collection coverage remain independent; a current open PR satisfies Today base only when its open evidence is applicable. If offered, the route makes this named condition discoverable without applying it by default; exact control remains open.
    type_gate_scope: For a confirmed typed candidate, the type gate is true when its supported type is selected and is false when that confirmed type is intentionally excluded or is outside an active typed predicate's scope. Re-enabling all supported object-type choices removes the user type restriction; it does not make unrelated future source kinds supported or resolve a missing PR-versus-Issue discriminator. An unresolved record that could be a selected type stays an identity or population limitation outside the per-object decision, not a known-false type gate. If independent evidence establishes that an unresolved record cannot be in the selected scope, it need not prevent a coverage claim for that scope; the evidence and access context must support that narrower exclusion.
    signal_and_today: A current attention signal may begin with a Project-wide open-work scope and its exact condition and metric context under 0057 and 0092; retain that scope when opening the matching work-object collection. A historical merge or closure outcome carries its explicitly selected period and event predicate under 0056 and uses its historical selection contract rather than this Today-only decision; do not intersect it silently with dynamic Today. The destination can have a different number of cards from a thread, check or event count because its unit is distinct work objects. If an operator changes an active condition, evaluate the resulting explicit selection instead of retaining an invisible origin predicate.
    applicability: Derive O, C, E and each filter only from facts applicable to the actual object type, identity, scope, event time and relevant revision under 0089. A true same-day event need not establish current lifecycle or a separate CI filter. An unavailable current CI value is unknown even if an old result remains visible as last known. A confirmed false condition may determine exclusion despite another unknown condition, but only for the supported scope and time. This pure decision must not turn an unsupported absence into false.
    prepared_alternatives: The upstream preparation boundary supplies O as true for an applicable source-supported open state, false for an applicable supported non-open lifecycle, and unknown when the state or its current applicability is insufficient. It supplies C as true when the applicable source-supported creation instant lies within the captured Today interval and false when a sufficiently established creation instant lies outside that interval; a missing, conflicting or inapplicable creation instant is unknown. It supplies E as true when an applicable supported Issue closure, PR merge, or PR closure independently established as without merge for that same object lies in that interval. A PR ClosedEvent alone with unknown merge classification does not establish the unmerged-closure alternative; retain E unknown unless another supported qualifying event establishes it. E is false only when evidence sufficiently covers the relevant event kinds and interval for that object and supports no qualifying event; an absent event, a single earlier closure, a current lifecycle or a completed page without adequate event coverage alone leaves E unknown. The device-local half-open day is one proposed interpretation under 0049. For each value preserve evidence context and apply any newer access restriction before presentation. A source-specific rule may support equivalent evidence for a particular object and interval, but the policy does not invent such a guarantee from a timestamp or source list.
    temporal_precision: Interpret a timestamp according to the supported meaning and precision of the actual source representation, not an assumed rounding rule. If source evidence determines an exact instant, evaluate against the captured Today interval using its selected boundary rule. If it instead supports only a time range, C or an individual event's in-day condition is true only when the entire possible range lies inside the day, false only when the entire range is outside, and otherwise unknown. Derive such a range only when the source semantics support it; missing precision or unknown truncation behavior is not permission to invent one. For E, one independently applicable event known to be in-day still makes E true even when another event overlaps a boundary; proving E false additionally requires the sufficient event coverage in prepared_alternatives. A changed selected interval or boundary interpretation supplies a new evaluation context without modifying the source evidence; a device clock or time-zone change alone does not alter an independently fixed interval. This rule is conditional and does not claim that a particular GitHub timestamp is imprecise.
    input_evidence: The input review distinguishes identification and presentation fields from the independently evaluated open, creation and closure-or-merge alternatives, active filter facts and population coverage. A source-reported creation instant can support C in the selected Today interval; an applicable source-supported merge or qualifying closure event can support E in that interval. Current open or closed state alone is not an exhaustive history of today's transitions. An updated timestamp is an ordering observation, not an event type. A null, older or unavailable closure timestamp is not automatically proof that no qualifying closure occurred during the whole day without source-backed event and coverage semantics.
    output: Return for one eligible confirmed-identity candidate its classification and supporting context or references to that context. This per-candidate result neither returns nor establishes the collection's population coverage; the caller separately supplies and attributes that evidence under collection_composition. The assembled result need not expose restricted candidate identity or existence to report an allowed scope-level limitation. Complete per-candidate classification of the known input list does not prove the entire requested source population was observed or all matching objects were materialized. A source aggregate can support its own count without identifying every matching object; retain this separately from object-level collection coverage under 0102. Do not derive a source count, current timestamp or coherent snapshot merely from the number of classified inputs.
    candidate_decision_exchange: The caller constructs an immutable candidate context containing a confirmed typed object reference, one captured scope and day evaluation context, and the prepared three-valued scope, inclusion, type and applicable filter facts with references to their supported evidence or limitations. The pure per-candidate decision returns one explicit match, non-match or unknown plus the captured evaluation identity and enough evidence references or safe reason categories to explain that outcome. Return the known false deciding condition for a non-match where it can be safely represented; unknown or unassessed sibling conditions remain distinguishable and are not described as false. A match can identify the supported inclusion alternative without asserting that other alternatives are false. This is an information contract rather than a mandated Swift type, storage schema or public display of evidence.
    collection_composition: The caller validates the common context once, associates each outcome with its original candidate and combines those outcomes with a separately supplied coverage assessment, intentional-filter-empty state and source or storage limitations. The policy's per-candidate result is not itself the aggregate collection result. An unresolved identity association or an unexpected top-level no-match remains an integration or identity limitation that can affect counts and coverage; it is not converted into a synthetic candidate, a source-empty result or an ordinary non-match. Apply current disclosure at projection time, not by assuming a decision result or retained evidence remains permanently authorized. Selection, refresh, persistence, navigation and accessible presentation remain caller responsibilities.
    filtered_empty: If the operator explicitly excludes every lifecycle state applicable to the selected object types, the visible result is intentionally filtered empty. Preserve the active exclusions and any separately applicable incomplete coverage, refresh failure or access limitation; this empty view is not evidence that the source has no work. In ordinary cases, confirmed empty requires adequate population and filter coverage under 0102 and no uncertain matching candidate in the claim's permitted scope.
    effects_and_determinism: The same normalized inputs and captured calendar context yield the same classifications without reading a clock, database or network during evaluation. A day, time-zone, source, access or membership change is supplied as a new evaluation context, not an implicit mutation of the earlier result. A later observation or route transition cannot retroactively give an earlier mixed-time result a common snapshot time.
    typed_decision_proposal: As the agent-authored working integration with SpecificationCore, implement the applicable Today policy as a typed DecisionSpec outcome of match, non-match or unknown; reserve the optional nil for rule non-applicability. For the top-level policy over a validated eligible candidate, a no-match return is not an ordinary unknown, confirmed exclusion or empty result. Treat unexpected no-match as an integration limitation or diagnostic and do not present the candidate as excluded; malformed context is validated separately rather than hidden as a domain fact. This is a working interface contract, not a compiled API or a resolved package version.
    information_boundary_candidate: The accompanying information contract specifies the minimum per-evaluation identity, confirmed typed candidate, explicit unrestricted-or-empty filter semantics, three-valued prepared facts and permitted evidence context supplied to this pure decision. The result distinguishes match, non-match and unknown from non-applicability or an unexpected missing top-level decision; each is bound to its captured evaluation context. Preparation, current disclosure and later projection are coordinated outside the pure rule. Collection coverage and loading remain independent inputs to assembly and cannot be inferred from the number of per-object results. This is an agent-authored candidate for public interface design, not a selected Swift signature or compiled implementation.
    local_version_evidence: For a reproducible review candidate, the local SpecificationCore repository exposes tag `2.1.0` at commit `9b5fc40c16677e868856d0b24b70019cd5ea4687`. Its inspected `DecisionSpec.swift`, `FirstMatchSpec.swift` and `Package.swift` are byte-identical to those paths in the separately checked local branch at `483214469828c42f7b615654aa70d0acbecc4dbf`. The tagged protocol's `decide` returns an optional typed result, so the proposed distinction is expressible at the source-contract level. This is a candidate reference, not a resolved SwiftPM dependency, proof of a latest release, package build, or validation of the concrete GitView policy. Resolve and verify the actual dependency and platform toolchain before relying on the interface.
    composition_boundary: The inspected Specification protocol and its standard Boolean operators evaluate Bool, while FirstMatchSpec applies Boolean predicates in order and returns the first matched result or nil. Boolean negation of a predicate whose unavailable input was collapsed to false would incorrectly turn unknown into true. Preserve the three-valued facts and 0110 truth table explicitly within the typed policy; use Boolean specifications only for conditions whose inputs are actually known and whose no-match semantics do not erase unknown. A FirstMatch fallback to unknown is permitted only if independently shown to cover precisely the intended unknown cases and not a programming or applicability gap; no such fallback is selected here.
    testing: Under 0040 and 0079 specify failing-then-passing behavior tests for the truth table, identity normalization, privacy projection, half-open time boundaries, stale or mismatched revision, incomplete population and all-states-excluded view. The existing finite model checks a simplified logic abstraction only; actual domain caller, source semantics, storage, platform calendar and UI remain separate evidence. Use the chosen SpecificationCore API while preserving true, false, unknown and rule non-applicability as required under 0095; verify the actual resolved version and caller behavior during implementation.
    provenance: The owner selected applicable lifecycle states when no saved exclusion applies, explicit persistent filters, and the bounded user-local-day completion rule stated above. The full same-day selection formula, three-valued truth rules and this pure-decision interface are agent-authored proposals; input names here describe a contract, not mandated Swift types or ontology entities.
  scenarios:
    last_known_open_and_today_creation_candidate:
      given: Two permitted identified PRs are in the selected scope with supported type and unrestricted filters. The first was observed open before Today but has no applicable current lifecycle, its creation is known before Today, and in-day outcome evidence is incomplete. The second has a supported creation within Today and unknown current lifecycle.
      when: The current-context Today policy evaluates the prepared alternatives.
      then: The first is an uncertain candidate, not a confirmed current-open match or a confirmed non-match; its permitted earlier observation retains its original time and remains inspectable through the uncertainty route. The second is a match by creation while its lifecycle remains unknown. Neither individual result establishes complete population coverage or a new source observation.
    event_precision_overlaps_day_boundary:
      given: An eligible Issue has a supported closure event whose source semantics establish only a possible time range spanning the captured start of Today; open and creation alternatives are independently false, and no other in-day outcome is established.
      when: The Today decision is prepared and evaluated.
      then: The closure's in-day condition is unknown rather than assigned to either day by rounding, so the Issue remains an uncertain candidate. A different independently supported in-day event could establish E as true; a positive event does not prove complete population coverage.
    empty_candidate_list_different_coverage:
      given: Two evaluations use the same valid Project and selection context and contain no materialized candidate objects; one has independently established exhaustive candidate materialization and applicable predicate coverage for that scope, while the other has an unobserved Repository scope.
      when: The collection assembler combines the empty candidate results with each separately supplied coverage assessment.
      then: The first can support a confirmed empty selection if its other applicable conditions and disclosure allow it; the second remains incomplete or unknown. No per-candidate result or empty input list supplies either coverage claim.
    same_candidate_different_population_coverage:
      given: The same permitted PR and candidate facts produce a match in two evaluations, but only one evaluation has independent evidence of exhaustive candidate materialization and applicable predicate coverage for the selected Project and context.
      when: The caller assembles each selection.
      then: The PR classification remains the same for those inputs, while only the independently supported evaluation can claim complete collection coverage; the match does not upgrade the other coverage result.
    old_closed_object_with_partial_events:
      given: A permitted Issue is observed currently closed, its supported creation occurred before the local day, and one older closure event is known but the day's closure-event coverage is incomplete.
      when: The prepared alternatives are evaluated without additional filters.
      then: O and C are false in their respective applicable contexts, E is unknown rather than false, and the Issue remains an uncertain candidate instead of being excluded or counted as a confirmed same-day closure.
    old_closed_object_with_covered_events:
      given: A permitted Issue is observed currently closed, its supported creation occurred before the local day, and independently sufficient event evidence establishes no qualifying closure in the captured day.
      when: The prepared alternatives are evaluated without additional filters.
      then: O, C and E are false in their supported contexts, so the Issue is a confirmed non-match for those contexts; that per-object conclusion does not establish complete Project-wide population coverage.
    type_unknown_in_all_types:
      given: A permitted source record has a title and a Today creation instant, but its PR-versus-Issue discriminator and typed source identity are unavailable; both supported object types are selected without restriction.
      when: The collection is constructed.
      then: The record is not relabeled as a confirmed PR or Issue or silently counted as a non-match. It remains an access-safe source limitation or limited inspection where supported, and exhaustive object-level coverage is not claimed if it could affect the selection.
    unresolved_type_under_pr_filter:
      given: A permitted same-Repository record might be a PR or an Issue, its type is unproven and no independent evidence rules it out of the selected scope.
      when: The operator selects only PRs or applies a PR-only failed-CI condition.
      then: The record is not classified as a confirmed Issue or a confirmed PR non-match merely because its type is missing; any affected population coverage remains limited without fabricating a PR card or CI value.
    known_issue_under_pr_filter:
      given: A source-confirmed Issue and its Repository identity are permitted and the active selection explicitly includes only PRs.
      when: Its typed selection gate is evaluated.
      then: The Issue is a contextual non-match due to the known type restriction, without a claim about its CI or whether a different untyped source record exists.
    unfiltered_event_with_unknown_lifecycle:
      given: A permitted identified PR has a confirmed merge event during Today but its applicable current lifecycle is unavailable; the ordinary work route has no lifecycle or attention restriction.
      when: The Today decision evaluates that PR.
      then: The merge event confirms base inclusion and the unrestricted lifecycle condition does not make it uncertain; the PR is a contextual match while its displayed current lifecycle remains unknown and population coverage is evaluated separately.
    pr_close_event_without_merge_classification:
      given: A permitted identified PR was created before the captured Today interval, its current open status is unknown, and a subject-associated ClosedEvent falls within the interval; source evidence does not establish whether that specific closure was without merge and no qualifying merge instant is known.
      when: The unfiltered Today decision is evaluated.
      then: The close event alone does not establish the unmerged-closure alternative or its negation, so the candidate remains uncertain unless another applicable alternative independently confirms inclusion. A current CLOSED state or null mergedAt without event-specific applicability is not invented as historical closure classification.
    fixed_interval_after_device_day_change:
      given: A permitted PR has a confirmed merge instant within a captured Today interval and the selected interpretation retains that same interval despite a device day or time-zone change; scope and filters remain unchanged.
      when: The decision is reevaluated with that unchanged captured interval.
      then: The merge alternative remains supported for the same scope and interval; the device change alone does not rewrite the event or invent a new boundary. A changed selected interval is a separate evaluation.
    same_event_with_lifecycle_restriction:
      given: The same permitted PR has a confirmed Today merge event but its applicable current lifecycle is unavailable, and the operator explicitly restricts lifecycle to currently open PRs.
      when: The Today decision evaluates that PR.
      then: Base inclusion remains true but the current-open condition is unknown, so the filtered result is uncertain rather than confirmed open or excluded solely from the historical merge event.
    restored_title_restricted_ci_filter:
      given: A post-restriction response makes one PR's identity, title and applicable open state permitted, but its old failed-CI observation remains restricted and no new applicable CI evidence exists.
      when: The operator views the failed-CI filtered collection and its summary.
      then: The old CI result cannot place the PR in the confirmed failed or confirmed nonfailed set or contribute a revealing failure count. The PR may appear only in a safely permitted uncertainty path, with coverage limited; neither its old CI value nor an inaccessible count is revealed.
    independent_false_does_not_reveal_restricted_ci:
      given: A permitted Issue is independently known to be outside a PR-only failed-CI selection, while some unrelated restricted source fact is present in retained storage.
      when: The applicable type gate and filter are evaluated.
      then: The Issue can be excluded because of its known type without using or revealing the restricted fact; that exclusion is not described as a CI result.
    known_false_with_unknown_sibling:
      given: A validated PR context has a supported false Repository-scope condition and an unknown CI condition, with evidence references for both in the captured evaluation context.
      when: The pure decision evaluates the candidate and the caller prepares a permitted explanation.
      then: The outcome is non-match due to the supported scope condition, while CI remains unknown rather than false or healthy. No source request, storage mutation or navigation follows merely from evaluating the decision.
    unexpected_no_match_does_not_erase_candidate:
      given: A confirmed eligible candidate and valid context reach the top-level policy, but its implementation unexpectedly returns no decision.
      when: The caller composes the collection result.
      then: It records a safe integration limitation and does not present the candidate as a confirmed non-match or claim an exhaustive empty collection solely from the missing decision.
    open_with_unknown_closure:
      given: A permitted identified Issue is in scope, is confirmed open, was not created today and has unknown closure history; no optional filter excludes it.
      when: The decision evaluates Today.
      then: The open alternative makes the base inclusion true and the Issue is a confirmed contextual match despite unknown closure history.
    old_closed_with_unproven_day_events:
      given: An identified permitted Issue is confirmed closed in the supplied current context, was created before today, and no source-backed evidence establishes whether any closure occurred during today.
      when: The unfiltered Today decision evaluates it.
      then: Open and creation alternatives are false but the closure alternative is unknown, so the Issue remains an uncertain candidate rather than a confirmed exclusion or a confirmed same-day outcome.
    reopened_with_confirmed_today_closure:
      given: An Issue created before today has a source-confirmed closure event today and is independently observed open after a reopen.
      when: The unfiltered Today decision evaluates it.
      then: It is one confirmed matching Issue through both supported alternatives, with current open state and the earlier closure event kept distinct; it is not two cards or proof that every intervening event was observed.
    repeated_closure_one_card:
      given: A permitted Issue created before Today has two independently confirmed closure events during Today, a supported intervening reopen, and a later applicable open observation; both closure events were independently recovered after restart.
      when: The unfiltered Today selection and a separately selected current-open filter are evaluated.
      then: The same confirmed Issue matches once in the grid and the open filter on the supported current observation; its two historical closures remain separate evidence and do not create extra cards or imply exhaustive history.
    title_without_lifecycle:
      given: A partial response contains a permitted PR identity and title but fails to provide applicable lifecycle, creation and closure-or-merge evidence.
      when: The unfiltered Today decision evaluates the candidate.
      then: The title remains independently usable for safe identification and the Today result remains unknown, not confirmed open, absent or excluded.
    candidate_non_draft_with_unknown_inputs:
      given: The explicitly chosen open non-draft selection is active for a Project Today context. PR A is open with draft false, PR B is open with draft unavailable, PR C is confirmed merged with draft unavailable, and Issue D is confirmed open; all are identified, permitted and applicable facts are supplied.
      when: Each candidate is evaluated under the type gate and three-valued conditions.
      then: A matches, B is uncertain, C is a non-match because open is false, and D is outside the PR-only selection. No unavailable draft is called false, no Issue is assigned a draft flag, and the results alone do not establish complete Project coverage or merge readiness.
    incompatible_typed_attention_filters:
      given: A valid Today context has both supported object types selected, and its explicit active conditions include both a PR-only failed-CI predicate and an Issue-only blocked-Issue predicate.
      when: The decision evaluates confirmed PR and Issue candidates under the combined required conditions.
      then: No supported candidate type satisfies both type scopes, so the selection is intentionally filtered empty. The active conditions and independently applicable coverage or refresh limitations remain discoverable; this does not claim there are no source PRs or Issues, that either signal is zero, or that either object type has a predicate belonging to the other.
    pr_only_signal_with_issue:
      given: A permitted open Issue and a permitted open PR are both in Today and the PR has a supported current failed check.
      when: The operator applies a failed-CI selection across the mixed work collection.
      then: The PR is a confirmed match, the Issue is outside the PR-only selection rather than a healthy-CI match or uncertain CI item, and its source Issue state is unchanged.
    empty_one_type_only:
      given: PR and Issue types are selected, every PR lifecycle state is explicitly deselected and the Issue open state remains selected.
      when: The work collection is evaluated.
      then: PRs are excluded by the explicit selection while eligible open Issues can remain; the whole collection is not described as intentionally empty solely because PR states are all deselected.
    false_scope_masks_unknown:
      given: A permitted identified PR is confirmed outside an explicitly selected Repository and its lifecycle and CI are unknown.
      when: The current selection is evaluated.
      then: The known false scope yields a contextual non-match without inventing its lifecycle or CI state.
    same_day_event_unknown_ci:
      given: A permitted PR has a confirmed merge event within Today and its applicable current CI is unknown while a failed-CI filter is active.
      when: The decision evaluates the candidate.
      then: Base inclusion is true, the filter is unknown and the final classification is uncertain rather than a confirmed match or exclusion.
    one_object_many_representations:
      given: A PR has two source-confirmed representations of one identity and satisfies both creation-today and merge-today alternatives.
      when: Normalized input is evaluated.
      then: The selected population contains that confirmed PR once; neither multiple representations nor multiple true alternatives create another card.
    unobserved_population:
      given: Every supplied PR is classified as a confirmed non-match but another Repository's applicable work population is unobserved.
      when: The caller requests the Project-wide selection.
      then: No supplied PR matches, but the unobserved scope remains incomplete and the Project is not declared confirmed empty.
    known_count_missing_candidates:
      given: An exact permitted aggregate supports a count of two matching PRs in a fixed context, but only one matching PR identity is supplied to the policy and exhaustive object-level coverage is not established.
      when: The policy classifies that candidate and the grid is prepared.
      then: The known PR is classified on its facts, the aggregate remains separately attributed, and the candidate list is not called exhaustive or supplemented with an invented second PR.
    intentional_empty_and_failed_refresh:
      given: The operator excludes every applicable lifecycle state while the last scoped source refresh failed.
      when: The selection is rendered.
      then: The view is intentionally filtered empty, the active exclusions and refresh limitation remain discoverable, and no claim is made that GitHub contains no work.
    restricted_unknown_candidate:
      given: A private PR's identity and existence are restricted while its internal filter evaluation would otherwise be unknown.
      when: The presentation result is prepared.
      then: No revealing card or restricted derived count is exposed and any permitted scope-level uncertainty remains separate from a false filter result.
    unknown_is_not_rule_absence:
      given: A validated in-scope PR has confirmed Today inclusion and an unavailable applicable CI fact under an active failed-CI filter.
      when: The top-level typed Today policy evaluates it.
      then: It returns the explicit domain unknown result, rather than nil for no applicable rule or a Boolean non-match; population coverage remains separately attributed.
    unexpected_no_rule:
      given: A validated candidate is expected to be handled by the top-level Today policy but no rule returns a result because the policy composition is incomplete.
      when: The caller receives no decision.
      then: The caller does not label the candidate as a confirmed exclusion or silently turn the failure into a domain unknown; it identifies an integration limitation without exposing restricted facts.
