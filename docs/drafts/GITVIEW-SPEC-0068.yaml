acceptance:
- The operator can reach available metric history for a Project while preserving its identity and the selected metric and period.
- Each displayed series distinguishes object type, unit, period, membership basis and relevant evidence or coverage.
- Missing history, incomplete values and an observed zero are distinguishable both visually and through an accessible path.
- A displayed historical outcome can open its corresponding object selection only with the original scope and event condition preserved, or with an explicit limitation.
- Returning from metric history preserves a valid originating Project context and does not silently change its filters or source data.
specification:
  objective: Make agreed metrics and historical limitations inspectable without treating a chart as proof of source completeness.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    entry: Provide a discoverable route from an identifiable permitted Project context or its summary to that same Project's history surface, including when no usable history has yet been established. The operator can identify the displayed metric and period; a Project with no usable history still exposes an understandable unavailable or incomplete state rather than a fabricated empty chart. Exact control, layout and initial set of visible series remain open.
    agreed_metric_selection: Candidate 0097 proposes discoverable access to the remaining agreed summary metrics beyond the initial four series in 0069. An unavailable series remains identifiable with its limitation; its inclusion in a catalog does not prove usable history or authorize reconstruction from current state.
    scope: Describe the membership basis and included Repository scope under 0064. As a working proposal, source-work retrospective metrics initially use the confirmed current members captured for evaluation; do not call that the actual past membership. Candidate 0097's separately labeled observed local membership-count history has its own actual-configuration observation basis. If configuration becomes unavailable or membership changes, a displayed source-work series retains its prior basis or is explicitly recalculated with the new basis and coverage.
    units: Display open PR and open Issue state series separately; merged PR and closed Issue outcome series are separate from them and from each other. Identify whether outcomes count events or distinct objects and identify the applicable time buckets. Do not label the sum of PR and Issue as independent completed tasks or imply a burn-down without the defined cohort and evidence in 0055.
    states: A confirmed zero requires sufficient evidence for its metric and bucket. Missing history is a gap; incomplete coverage is indicated as incomplete and not visually indistinguishable from a complete value. When only one supported observation is available, it may be presented as a point with its time but does not establish a trend or fill adjacent buckets. Do not interpolate missing observations as if observed.
    initial_chart_presentation: As an agent-authored first-version presentation proposal, initially expose the four 0069 series separately, using time-positioned points for open PR and open Issue state observations and bars for merged PR and closed Issue distinct-object outcomes in their captured calendar buckets. Each visible chart identifies the metric, object unit, selected Project, period and membership basis; it never combines the four values into a single work or completion total. Place a state point at its actual supported sample time, not at an invented day end. A supported complete zero remains visibly and accessibly distinguishable from a missing or incomplete bucket. Show limitations and actual point or bucket context through a reachable detail or accessible representation, including where the chart cannot display full text. Do not join sparse points with a line that implies an observed trajectory through unknown intervals under gaps_and_connections. Additional agreed metrics remain reachable through 0097, with their own units and suitable state or outcome semantics. These are adaptive content and mark choices, not a fixed native API, screen layout, color palette or guarantee that sufficient history exists.
    gaps_and_connections: Do not draw a solid continuous line or filled area across an interval known to lack sufficient observations when it would imply that intervening values or their trajectory are known. Represent the interval as a visible gap or otherwise clearly distinguish it from supported observations; accessible descriptions and exported or shared chart representations must preserve the same distinction. Separate supported endpoint values may remain inspectable with their own contexts. An explicitly identified interpolation or estimate would require a separately selected product policy and its own disclosure; it is not introduced by this first-version rule.
    timing: Show or make discoverable the period boundaries, time-zone interpretation and actual observation context. If a metric is composed from observations at different times, do not call it an exact simultaneous source snapshot. Candidate 0069 proposes calendar presets and fixed-period behavior; these working choices require source and native evaluation.
    outcome_navigation: Where a period outcome is actionable, retain the original Project or Repository identity, captured membership basis, period, event condition, metric unit and origin coverage as the origin context under 0056. The destination separately identifies its own object evidence, evaluation or observation context and coverage; it does not inherit the origin's completeness or time merely by preserving the condition. When the origin counts events and a destination shows objects, identify the different units. If available evidence cannot support a selection, present its limitation rather than silently opening Today or a current-state list.
    origin_contributors_and_later_selection: If sufficient evidence identifies exactly the objects that contributed to the origin, the operator may inspect that contributor set with the origin's actual context and current access. Otherwise, if later independently supported event evidence permits a selection using the same captured scope, period and condition, identify that selection as based on its own later evidence, including its own coverage and reference, rather than describing it as the original point's exact contributors. Its count may differ from the origin or coincidentally match it; equality alone does not prove identical membership. Where the operator asks specifically for original contributors without adequate identity evidence, expose that limitation. Preserve the graph's origin value as its original observation rather than replacing it with the later selection's count; a newly selected evaluation is a separate result.
    selection_lifetime: A graph point and its object-selection request retain their actual evaluation scope, period, predicate, unit, coverage and source observation context. A later membership edit, time-zone change or refresh cannot relabel an older result as the newly selected graph or replace its historical object selection with a current list. Results arriving after the operator has selected a different metric or period do not overwrite that selection; permitted older evidence may remain associated with its own context. Access restrictions apply immediately before presentation and navigation, including to chart labels and app-controlled accessibility output.
    captured_members_changed: For the working current-member retrospective, surface the distinction in 0064 when a confirmed Project edit changes membership while the graph is visible. Keep the old permitted series clearly attributed to its earlier captured basis and offer an explicit evaluation for the newly confirmed current members without changing the selected metric or period. Do not call the earlier basis current, automatically convert its points or imply a same-scope trend across the two evaluations. A user who selects the new evaluation receives its independently supported coverage and may encounter gaps; an older asynchronous result cannot replace that newer selection. Apply current disclosure before exposing either scope or any comparison.
    context: Opening or closing the history surface does not modify Project membership, underlying observations or existing work filters. Returning restores the originating context under 0024 where still valid. An independently selected historical period or metric is not silently relabeled as dynamic Today.
    access: Apply current access restrictions before drawing or announcing historical input or revealing derived counts. A chart with a restricted member is incomplete or unavailable rather than showing a full-project zero. A cleared local history is distinguished from no source events under 0067.
    restricted_value_surfaces: Apply 0064's current input-provenance rule to chart marks, axes, value labels, selections, accessible representations, cached thumbnails and app-generated share content before each app-controlled presentation or handoff. Remove an affected exact point or display a permitted gap after restriction, and prevent a saved total plus a permitted subset from newly exposing the restricted contribution. A separately supported permitted subset may remain visible with safe scope and incomplete labeling. This does not promise retroactive erasure of an earlier observation or control of content already shared outside the app.
    accessibility: Essential metric names, values, units, scope and gaps have a non-color accessible representation and can be inspected without requiring a drag gesture or relying solely on spatial chart position. Preserve meaningful focus on return under 0032. Exact native controls and chart design require device evaluation.
    provenance: The owner accepted Project summaries and graphs where adequate history exists. The entry route, current-member default and concrete uncertainty behavior are agent-authored refinements; no running chart or source coverage is claimed.
  scenarios:
    first_project_without_history:
      given: A Project has been saved and is identifiable, but no eligible local history samples or independently supported historical source facts are available for its selected metrics.
      when: The operator opens its history from the Project context.
      then: The history route and selected metrics remain identifiable with an unavailable or insufficient-history state, not a graph of zeroes or a claim that GitHub had no work. Opening the surface does not itself create a historical sample, promise background collection or imply a source refresh; any separately available eligible recovery or refresh action remains explicit and access-safe.
    first_history_with_mixed_evidence:
      given: A permitted Project has an open-PR sample at Tuesday 10:30, a complete zero merged-PR outcome for Tuesday, and no supported closed-Issue outcome for that day; the selected period and membership basis are known.
      when: The operator opens the initial history view visually or through an accessible alternative.
      then: The PR state point retains 10:30 and its own coverage, the merged-PR bucket is identified as a supported zero distinct PRs, and the closed-Issue bucket remains a gap or unavailable rather than zero. Each series retains its own unit and scope; no continuous trend, combined completion total or exact contributor list is invented.
    later_evidence_changes_outcome_selection:
      given: A permitted earlier graph point records two distinct Issues for a fixed Project basis and period without retaining contributor identities. A later permitted observation independently identifies three Issues with matching closure events for that same fixed basis and period, with its own supported coverage.
      when: The operator opens the point and inspects the available later selection.
      then: The graph retains its earlier value and context, while the three Issues are identified as a selection from the later evidence with its own context and coverage. GitView does not claim that those three were the original point's contributors or silently rewrite the earlier count; an exact-original-contributors request remains limited.
    no_history:
      given: A saved Project has current PR observations but no supported historical observations for the selected earlier period.
      when: The operator opens its open-PR history.
      then: The history surface remains identifiable and reports unavailable history or gaps rather than zero previous PRs or a copied current point.
    one_point:
      given: Exactly one sufficiently supported open-Issue observation exists in the selected period.
      when: Its history is displayed.
      then: That point and its actual time may be inspected; the app does not invent a trend or values for other dates.
    gap_between_supported_samples:
      given: Complete compatible open-PR observations exist on Monday and Wednesday, while Tuesday and the intervening trajectory lack sufficient evidence.
      when: The history is presented visually, through accessibility or as an app-generated chart share.
      then: Monday and Wednesday remain inspectable with their own contexts, and the intervening unknown is distinguishable rather than presented as a supported continuous line or an observed Tuesday value.
    event_signal_to_objects:
      given: A period outcome counts two closure events for the same Issue with adequate source evidence.
      when: The operator opens the corresponding distinct-Issue selection.
      then: The destination identifies one Issue, retains the period and closure condition, and does not imply that the two events were two Issues.
    restricted_member:
      given: A historical Project series has one accessible Repository and another whose private inputs are restricted.
      when: The chart is displayed visually or through accessibility.
      then: Restricted values and revealing derived counts are not exposed, and the Project series is incomplete or unavailable rather than a complete accessible-subset total.
    restriction_while_chart_open:
      given: A chart and accessible point detail show a supported total for A and B while a permitted A-only comparison also exists; B's private input then becomes restricted.
      when: The chart updates or its point is selected or shared.
      then: The affected total and its app-controlled accessible and share representations are no longer exposed, while a separately supported A-only value can remain with safe scope and coverage; the missing B contribution is not replaced with zero.
    return_to_project:
      given: The operator opens metric history from a Project overview and later returns while that Project is still valid.
      when: The overview is restored.
      then: It retains the originating Project and valid navigation context without adopting an unrelated historical filter or mutating data.
    graph_selection_changes_before_result:
      given: A graph for the earlier A and B membership basis is loading while the operator selects a new A and C basis for the same metric and period.
      when: The A and B result arrives after the A and C selection.
      then: The displayed selected graph is not overwritten or relabeled with the old result, and each available result retains its own membership basis, coverage and access context.
    aggregate_without_object_membership:
      given: A permitted graph point has a supported aggregate but no evidence identifying its contributing objects.
      when: The operator requests its object list.
      then: GitView explains that the historical object selection is unavailable or limited rather than substituting the current filtered list or inferring object identities from the total.
  unresolved:
  - Validate the initial series and period proposal in 0069, and determine presentation and evidence for the other agreed summary metrics.
  - Source and local evidence sufficient for each metric and actual graph accessibility require further validation.
  - Exact native chart interaction, layout and focus behavior need device evaluation; no UI has been implemented.
