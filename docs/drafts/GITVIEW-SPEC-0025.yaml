id: GITVIEW-SPEC-0025
title: GitView - Project lifecycle and default association
kind: spec
created_at: '2026-11-14T13:30:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0005
depends_on:
- GITVIEW-SPEC-0002
- GITVIEW-SPEC-0019
sources:
  parent: docs/drafts/GITVIEW-SPEC-0005.yaml
  startup: docs/drafts/GITVIEW-SPEC-0022.yaml
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Saved Projects have stable local identities, names and at least one repository member.
- A Repository may participate in several Projects and an edit to one membership does not mutate other Projects or GitHub.
- Default Project creation is idempotent for an existing default association and deletion does not silently remove the repository or its other memberships.
- Cancelling a project edit or an invalid attempt to remove the final member preserves the last saved Project.
specification:
  objective: Specify creation, editing and removal of local Projects and the default association used by setup.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:User
  contract:
    identity: A saved Project has a stable local identifier independent of its name and repository addresses. Rename and transfer of a confirmed same Repository do not change Project identity or membership.
    default_association: A default association identifies the locally created default Project for one source Repository, separately from an arbitrary Project that happens to contain the same Repository. It is project configuration for idempotent setup, not a new ontology entity. For an existing association, confirming the Repository again reuses the same Project. Other existing Projects containing that Repository do not become the default implicitly.
    creation: Confirmation of one or more selected accessible Repositories establishes a separate single-member default Project for each one lacking a default association. An existing association is reused. The initial name is the observed repository name; subsequent source renames do not automatically rename Projects.
    editing: The operator can change a Project name or its repository membership. Edits are pending until saved; cancellation preserves the last saved state. A saved Project must have a nonempty name and at least one member. An attempted save with no members or an empty name is rejected and does not modify the saved Project.
    edited_default: Editing a default Project's membership or name does not by itself change its local identity or its default association. The association records its origin rather than requiring the Project to remain single-member; a source Repository can be removed from that Project only if at least one member remains.
    removal: Explicit removal of a local Project deletes its local configuration and its default association if any, but does not remove the Repository from GitHub, erase observations needed by other Projects, or change other memberships. After deletion, a later explicit setup confirmation may create a new default Project with a new local identity; merely rediscovering the repository does not create one.
    persistence_failure: A failed save or delete must not report success. Previously saved data and unrelated memberships remain intact; retry must not create duplicate default associations. How a partially completed batch is reported follows 0022.
    scope: Saved Projects contain only GitHub-managed Repositories in the current product scope. Temporary offline discovery or source rename is not a command to change membership. Access restrictions follow 0019.
    provenance: These detailed lifecycle and default-association rules are agent-authored proposals under autonomous refinement, not independently approved owner decisions.
  scenarios:
    shared_repository:
      given: Repository R is in default Project P and another Project Q.
      when: The operator removes R from P while retaining another member in P.
      then: P retains its identity and default association; Q and the source Repository remain unchanged.
    reject_last_member:
      given: A saved Project has exactly one Repository member.
      when: The operator attempts to save an edit that removes it.
      then: The save is rejected and the previously saved Project remains available.
    delete_and_rediscover:
      given: The operator explicitly removed the default Project for R while R remains in Project Q.
      when: R appears in a later discovery result without a new setup confirmation.
      then: Q is unchanged and no replacement Project is created merely by discovery.
    repeat_setup:
      given: An existing default association for R points to Project P and R also belongs to custom Project Q.
      when: The operator reconfirms R in setup.
      then: P is reused and Q is unchanged.
  unresolved:
  - Whether a default association should persist after its origin Repository is removed from its edited Project needs domain review; the current proposal chooses persistence to maintain idempotence.
  - User-facing deletion confirmation and the exact policy for data no longer referenced by any Project require storage and UX specifications.
