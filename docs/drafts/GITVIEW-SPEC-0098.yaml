acceptance:
- The proposed initial connection uses GitHub App user authorization via an external system-supported
  browser session and authorization code with S256 PKCE, with a separate validated attempt and callback
  state.
- Under the proposed GitHub App connection, GitView uses a user access token rather than an installation
  private key, and a public-client identifier or embedded client secret is not treated as proof of a genuine
  app instance or confidential material.
- User identity, token usability, GitHub App installation, repository grant and actual data coverage remain
  independently established facts.
- Renewal of an expiring credential cannot be treated as a locally reversible operation if GitHub may
  have rotated the credential remotely; an indeterminate result offers safe recovery.
- Cancelled, replayed, mismatched or superseded authorization results cannot establish a connection or
  undo a later disconnect.
- No credential, authorization code, verifier or private source detail is exposed through ordinary diagnostics,
  sharing or unrelated UI.
specification:
  objective: Select a reviewable first-version GitHub connection direction and its trust, authorization
    and token-rotation boundaries without registering an app or implementing a client.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Project
  - gitview:Repository
  contract:
    selection: As an agent-authored working architecture for the initial single-account GitHub.com scope,
      use a GitHub App user access token obtained through GitHub's authorization-code flow with S256 PKCE
      and a platform-supported external authentication session. The selected public-client direction requires
      no separately operated GitView backend for the token exchange; GitHub and the system authentication
      surface remain external dependencies. This is a candidate product decision, not evidence that an
      app registration, client, source request or device behavior exists. The data and permission coverage
      still requires verification before a complete implementation can be claimed.
    rationale: A GitHub App can express fine-grained permissions and a user token applies the relevant
      user's and app's access; this aligns with the read-oriented overview and partial-organization access
      model. A browser-capable iPhone does not need device flow as a default. GitHub warns that enabling
      device flow can enable phishing impersonation and recommends authorization code with PKCE for public
      clients. A broader OAuth App repo grant or a personal access token is not adopted as the normal
      onboarding path. This choice does not claim any flow can prevent all phishing or prove every organization
      grants the app access.
    public_client: GitHub currently documents `client_secret` as required for authorization-code exchange
      and for refreshing a user token generated by that flow. Its public-client guidance explicitly says
      a native client cannot keep that value confidential. The no-backend candidate therefore depends
      on distributing an extractable application registration value; treat it as public client material,
      never as proof of a genuine GitView installation, a user credential or a server-held secret. PKCE
      helps protect the authorization code but does not attest the client binary. Never ship a GitHub
      App installation private key or generate installation tokens on the device. Do not commit actual
      registration values or embed user tokens, authorization codes or PKCE verifiers in source, examples,
      ordinary logs, shares or screenshots. Rotation, revocation, distribution of an updated registration
      value and abuse response remain operational decisions; recheck provider documentation and the chosen
      registration before implementation.
    combined_credential_risk: GitHub documents application-authorization management operations that authenticate
      with the app client ID and client secret and also require a valid user access token identifying
      the affected grant. If both the extractable registration value and a valid user token are obtained,
      those operations can affect that token or its user's application authorization; exposure of the
      registration value alone is not evidence that an attacker possesses any user token or can revoke
      an arbitrary user's grant. Protect user tokens independently, do not use the public registration
      value as an authorization boundary, and include this combined-compromise and recovery consequence
      when reviewing the no-backend candidate. A local disconnect under 0058 is not itself proof that
      GitHub revoked a token or grant. Actual provider use and an abuse-response procedure remain unverified.
    authorization_attempt: On an explicit user connection action, create a distinct short-lived authorization
      attempt with an unpredictable state and PKCE verifier and derive an S256 challenge. Use a system-supported
      external authentication session, such as the platform authentication session documented by Apple,
      for GitHub's authorization page. The app-owned UI explains the source and requested access; GitHub
      collects its own credentials. A registration must configure the permitted callback and requested
      GitHub App permissions; do not turn wildcard callback matching on merely for convenience. Exact
      callback scheme or verified URL and deployment registration are later implementation and operational
      choices.
    callback_candidate: As an agent-authored first-version direction, use an exact registered non-HTTP
      callback handled by the active ASWebAuthenticationSession for the user-authorization flow, with
      an app-specific custom scheme selected together with the eventual bundle and GitHub App registration.
      Explicitly send the registered redirect_uri rather than relying on the first configured callback,
      and do not add unregistered parameters to that URI. GitHub distinguishes the authorization callback
      from the installation setup URL; an installation return does not substitute for the authorization
      callback, validate state or establish a credential. Apple documents callback delivery to the calling
      authentication session even when another app registers the same scheme; this platform property does
      not authenticate the public binary or replace state and PKCE validation. Registration acceptance
      of the exact callback, deployment target, native session lifetime and actual callback handling remain
      to be verified; no URI, app registration or service is created here.
    callback_and_exchange: Accept a callback only for the currently active unexpired attempt, the expected
      callback target and matching state; a mismatch, cancellation, duplicate, superseded attempt or unexpected
      callback does not authorize a token exchange or create a connection. Use the original verifier for
      the S256 challenge in the exchange and never expose the code or verifier in ordinary diagnostics.
      PKCE and state bind the exchange to the initiating attempt; neither proves the public client binary
      is authentic. A GitHub redirect or received code is not by itself an authenticated account or confirmed
      durable connection.
    interrupted_authorization: If a session or process interruption loses the verified attempt context,
      state or verifier, abandon that attempt and offer a new user-initiated authorization rather than
      accepting an orphaned callback or reconstructing a verifier. If a code exchange may have reached
      GitHub but its outcome is unknown, do not assume the single-use code remains usable or an account
      was connected; recover only if the current credential and binding are independently confirmed, otherwise
      offer a fresh attempt. Existing saved Projects and observations retain their access and observation
      context.
    identity_and_grants: After a successful exchange, use an authorized source observation to establish
      the GitHub identity associated with the token, then securely persist and bind the applicable credential
      and identity under 0086. User authorization, app installation, organization approval, repository
      selection and a successful category observation are different facts. The intersection of the app
      and user's permitted access applies; an uninstalled or unapproved organization is not an empty organization
      or proof the person lacks access. Discovery and 0088 preserve independent available scopes. A different
      verified account does not unlock earlier restricted observations merely because its display name
      matches.
    offline_access_request: For this candidate request the documented offline_access authorization scope
      to obtain an expiring GitHub App user token and refresh token where supported, while still interpreting
      the actual response and configured app behavior. This scope selects expiring-token behavior and
      is not the GitHub App repository-permission profile; do not infer any Repository grant or category
      access from it. Missing or unexpected refresh credentials remain an explicit limitation under credentials_and_expiry
      rather than a fabricated token.
    identity_lookup_candidate: As an agent-authored initial mapping for GitHub.com, use the documented
      authenticated-user REST operation with the candidate user access token to obtain a source-confirmed
      user identity before binding the credential. The documented response example distinguishes the user
      numeric id, node_id and login; preserve identifier kind and source instance, and compare a validated
      numeric user id exactly within that instance as the candidate account binding key. Treat login as
      a mutable display attribute, not identity; do not equate a user id with a Repository id or a GraphQL
      node id. A failed, 304-without-matching-baseline, malformed or unavailable identity response cannot
      establish an account; source response and credential use must belong to the same still-active authorization
      attempt. The lookup documents support for GitHub App user tokens and does not by itself prove an
      installation, Repository grant or work observation. The example and candidate matching rule do not
      prove behavior across all identity migrations or instances; migration and concrete adapter verification
      remain open.
    credentials_and_expiry: Prefer expiring user access tokens and their refresh tokens as an agent-authored
      initial security choice, subject to the configured GitHub App flow and source response. Keep the
      token pair and associated identity and expiration context in platform-provided secure storage under
      0019 and 0086. Use the source-returned expiry where available; do not assume the existence of refresh
      credentials or invent their lifetime. Secure storage unavailability, expiry, temporary network failure,
      explicit denial and disconnect remain distinguishable under 0085 and 0036. The GitHub App registration
      client_secret cannot be used as a reason to omit protection of user tokens or the one-time PKCE
      verifier.
    rotation: For an expiring GitHub App user token, GitHub documents that successful use of a refresh
      token yields a new pair and invalidates the prior refresh token and prior access token. Coordinate
      renewal for one current credential binding so overlapping foreground and background refreshes do
      not race to rotate the same refresh token. After a confirmed response, bind and durably retain the
      replacement pair and expiry context together with the same identity and still-current connection
      generation before reporting durable renewal. A local write failure or lost response cannot be treated
      as proof that GitHub kept the old pair valid; preserve Projects and observations and expose renewal
      or connection uncertainty under 0085 and 0086.
    uncertain_remote_outcome: If a rotation request might have reached GitHub but its result or replacement
      pair is lost, the provider may have invalidated the prior pair even though local state still contains
      it. Do not promise transparent recovery, infer provider revocation of the account, silently mark
      the old token valid, or automatically replay the old refresh as if it were guaranteed unused. Reconcile
      only when source and secure-store evidence suffice; otherwise require a new user-mediated authorization
      when needed and preserve permitted last-known data under current access policy. An unconfirmed renewal
      does not advance a source observation timestamp.
    disconnect_and_replacement: Explicit disconnect stops affected new source work and admission for the
      binding. Previously saved data remains locally accessible with supported time and connection limitation;
      a callback or renewal from an earlier generation cannot reactivate the connection or authorize new
      work after disconnect or account replacement. Credential removal and provider-side revocation are
      separate, and membership is not deleted.
    permissions_and_recovery: Candidate 0100 describes a proposed permission profile, not an accepted
      exhaustive minimum. Before selecting final permissions, trace each chosen source operation to documented
      and independently verified permissions. Explain established missing grants or approvals and distinguish
      unknown causes. When a source operation is unavailable, keep previously saved local observations
      accessible with their supported times and applicable limitation under 0019; do not infer zero, a
      successful refresh or a new grant. Offer applicable recovery and keep account and sharing rules
      separate.
    verification: Before marking this branch implementable, define callback target and account identity
      evidence, source-supported read permission coverage, native secure-store binding and token-rotation
      recovery, and their independently observable tests. Planned deterministic tests inject browser callbacks,
      clock, source and secure-store outcomes, including state mismatch, duplicate callback, lost remote
      rotation response, local write failure, simultaneous renewal and disconnect. Real GitHub registration
      and source access, secure-store restart behavior and native accessibility are separate later evidence;
      mocks alone do not establish them. No network budgets or product API query sizes are selected here.
    provenance: A personal, read-oriented iOS overview and local data follow the owner's direction. GitHub
      App, public-client PKCE, expiring credentials and no separate backend are agent-authored working
      decisions based on the cited documentation, not claims of owner review, deployment or successful
      authentication.
  scenarios:
    code_flow_refresh_requires_registration_value:
      given: The first-version candidate uses GitHub App authorization-code flow with PKCE and an expiring
        user-token pair, under the currently documented exchange and renewal requirements.
      when: The design specifies direct native code exchange and token refresh without a separate backend.
      then: Both requests account for the required application registration value without calling it a
        protected user secret or trusted client-instance identity; no actual value is committed, logged
        or disclosed by the specification.
    installation_return_is_not_auth_callback:
      given: An operator opens an installation or approval route while a separate user-authorization attempt
        is active.
      when: The installation setup URL returns without the expected authorization callback and matching
        attempt state.
      then: GitView may resume its installation review, but does not exchange a code, establish a user
        credential or mark the authorization attempt successful solely from that return.
    offline_scope_does_not_grant_repository:
      given: An authorization response provides an expiring user token after the candidate requested offline_access,
        while a particular Repository grant is not established.
      when: GitView prepares discovery or Project setup.
      then: The token's expiry behavior does not establish Repository or category access, and the scope
        remains unavailable or unresolved until independently supported grant and identity evidence exists.
    identity_lookup_without_usable_body:
      given: A valid authorization attempt yields a candidate token, but the authenticated-user operation
        fails or yields a conditional response without its matching validated baseline.
      when: GitView attempts to establish the active user binding.
      then: The account remains unresolved and is not inferred from a login, prior account or token format;
        a permitted retry or new authorization route is available and no Repository grant is claimed.
    same_login_different_user_id:
      given: A prior binding and a new authenticated-user observation have the same displayed login but
        different confirmed numeric user IDs in the same GitHub instance.
      when: The new binding is considered.
      then: The observations are not silently treated as the same user based on login, and prior restricted
        Repository data is not unlocked by the textual match.
    callback_state_mismatch:
      given: An active authorization attempt has an expected callback and state.
      when: A callback arrives for that target with a missing or different state.
      then: It does not establish a connection or exchange a code, the attempt can be safely abandoned
        or restarted, and no sensitive callback value is exposed in diagnostics.
    prior_attempt_returns_late:
      given: Attempt A is cancelled and a later attempt B has been durably confirmed for a verified identity.
      when: A's callback or response arrives afterward.
      then: A cannot replace B, associate a credential with B's identity or unlock A's private observations.
    authorization_context_lost:
      given: The process is interrupted during GitHub authorization and the active attempt's verifier
        cannot be recovered.
      when: The previous browser session later returns a callback.
      then: GitView does not exchange the orphaned code or confirm an account; a new user-initiated authorization
        remains available and existing Projects are retained.
    installation_not_approved:
      given: A user token and identity are established, while a particular organization has not approved
        an app installation and other repositories are permitted.
      when: GitView shows discovery and Project access.
      then: Permitted scopes remain usable, the unapproved scope is not called an empty organization,
        and any specific remedy is shown only where source evidence supports it.
    rotation_response_lost:
      given: A refresh request for a previously valid user-token pair may have succeeded at GitHub, but
        the response is lost and the new pair is not recoverable locally.
      when: The app recovers or the operator requests a refresh.
      then: The old pair is not asserted valid and a successful new pair is not invented; previously permitted
        observations retain their own access and freshness context and user-mediated reauthorization is
        available when needed.
    rotation_local_write_fails:
      given: GitHub confirms rotation and returns a new pair, but secure storage cannot durably establish
        a consistent binding for it.
      when: The result is displayed or the app restarts.
      then: GitView does not report a confirmed durable renewal or assume the now-invalid prior pair is
        usable; it preserves saved Projects and offers an accessible recovery path without revealing tokens.
    concurrent_renewal:
      given: Foreground and background work both need an access token for the same active binding.
      when: Renewal is necessary and both requests overlap.
      then: The app coordinates them as one rotation attempt for that binding or otherwise prevents duplicate
        competing rotations; each waiting operation uses only a subsequently confirmed applicable credential
        or receives a recoverable failure.
    disconnect_during_renewal:
      given: Renewal has started for account A and the operator disconnects before its result is durably
        bound.
      when: The late result or attempted write completes.
      then: The late result cannot restore the active connection or authorize new source work; previously
        saved local data remains accessible with supported time and connection limitation. Credential-removal
        uncertainty remains recoverable.
    client_identity_spoof:
      given: A third party obtains the public-client registration identifier and extractable client_secret
        from a distributed binary.
      when: A service or GitView component evaluates whether this proves an authentic app instance.
      then: It does not treat those values as confidential or as instance authentication, and PKCE is
        not represented as an attestation of the binary.
  unresolved:
  - Establish the exact app-specific callback target and supported deployment version, verify GitHub registration
    acceptance and native session behavior, and define handling and rotation of the extractable client
    registration value and per-operation permission coverage; no credentials or registration are created
    by this proposal.
  - Verify the authenticated-user mapping, ID stability and migration assumptions with the selected provider
    and source context; no live identity lookup has run.
  - Choose and verify platform secure-store access and interruption handling, source identity lookup and
    the implementation of coordinated rotation and recovery.
  - Validate that the chosen user experience, app-installation process, permissions and public-client
    tradeoffs are acceptable with real GitHub and an iOS device; no product integration has run.
