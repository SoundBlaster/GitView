acceptance:
- Matching numeric repository IDs from the same GitHub instance preserve one Repository, its history and
  every Project membership across rename or transfer.
- The current source address follows a confirmed change while prior observations retain the address recorded
  at their observation time.
- A different numeric repository ID from the same GitHub instance identifies a separate Repository with
  independent history and membership, even when it uses a previous address.
- A repository lookup that returns HTTP 404 leaves the current source state unknown and preserves the
  last known Repository, history and Project memberships.
acceptance_evidence:
- criterion: Matching numeric repository IDs from the same GitHub instance preserve one Repository, its
    history and every Project membership across rename or transfer.
  evidence: The confirmed_rename and confirmed_transfer scenarios define expected outcomes for future
    verification.
- criterion: The current source address follows a confirmed change while prior observations retain the
    address recorded at their observation time.
  evidence: The confirmed_rename and confirmed_transfer scenarios distinguish the latest address from
    historical snapshots.
- criterion: A different numeric repository ID from the same GitHub instance identifies a separate Repository
    with independent history and membership, even when it uses a previous address.
  evidence: The reused_address scenario separates the records for IDs 42 and 99.
- criterion: A repository lookup that returns HTTP 404 leaves the current source state unknown and preserves
    the last known Repository, history and Project memberships.
  evidence: The unavailable_observation scenario keeps the stored record intact while recording uncertainty
    about the source.
specification:
  objective: Keep repository history and all Project memberships intact when GitHub confirms a repository
    has changed name or owner.
  scope:
    in:
    - Comparing the numeric REST repository id within one GitHub instance.
    - Rename, transfer, reuse of a previous address, and HTTP 404 for a previously observed repository.
    - Current address, previously recorded observations and Project memberships across that change.
    out:
    - Local storage keys, alias resolution, ID-format migration and matching across GitHub instances.
    - Cross-provider migration, repository deletion, and automatic renaming of Projects.
    - Changes to GitHub permissions or replaying repository registration.
  ontology_refs:
  - gitview:GitHub
  - gitview:Repository
  - gitview:GitHubRepository
  - gitview:Project
  - gitview:managesRepository
  - gitview:projectIncludesRepository
  identity_rule: Two valid GitHub REST repository observations with the same numeric id from the same
    GitHub instance identify one Repository. A different numeric id in that scope identifies a different
    object. The GitHubRepository context and every Project membership follow the Repository identity.
  address_rule: Owner, name and URL describe the source address. GitView compares the source identity
    before applying an address change or associating history and memberships with a repository. Matching
    identity alone does not establish which conflicting address is newer; 0038 and 0053 describe the
    additional ordering evidence and uncertainty.
  unavailable_rule: HTTP 404 supplies no current repository object. Keep the last known record and distinguish
    unknown current state from a confirmed change.
  scenarios:
    confirmed_rename:
      given: Repository R with REST id 42 is tracked in Projects P and Q at egor/OldName.
      when: The same GitHub instance returns id 42 at egor/NewName and sufficient source evidence confirms the change is current.
      then: R remains in P and Q with its existing history. The current address becomes egor/NewName.
        Prior observations keep egor/OldName.
    confirmed_transfer:
      given: The same R is tracked in P and Q at egor/NewName.
      when: The same GitHub instance returns id 42 at team/NewName after transfer and sufficient source evidence confirms the change is current.
      then: R remains in P and Q with its history and GitHub management context. The current owner and
        address become team and team/NewName. Prior observations keep their recorded owners and addresses.
    reused_address:
      given: R with id 42 was previously observed at egor/OldName and belongs to Projects P and Q.
      when: The same GitHub instance returns id 99 at egor/OldName.
      then: GitView treats id 99 as a separate Repository. The history and memberships of R remain with
        id 42.
    unavailable_observation:
      given: GitView has a last known record for R with id 42 and its history and memberships.
      when: GitHub returns HTTP 404 for a lookup at R's last known address.
      then: The current state of R remains unknown. GitView keeps the last known record, history and memberships.
  unresolved:
  - How to persist identity, resolve aliases and distinguish outdated observations in the UI.
  - How to handle other lookup failures, conflicting source observations or migration between API ID schemes.
  provenance_boundary: The owner selected continuity, the REST id comparison, separate history on address
    reuse and unknown current state on HTTP 404. Retaining historical addresses verbatim remains a draft
    requirement for review. The examples are specification scenarios awaiting execution.
