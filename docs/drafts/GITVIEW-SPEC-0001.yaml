specification:
  objective: Give the owner of many GitHub repositories a compact, native iOS overview of current work,
    review and problems, including work produced by coding agents, with a path to the original GitHub
    object.
  reconciliation_scope: This agent-authored consolidation records explicitly selected product directions
    and property sets from the pinned conversation and project sources. Selection of one topic does not
    approve the whole document, ontology package or implementation. Source refs identify local excerpts,
    not authenticated message IDs. Open questions and agent proposals retain their separate statuses.
  terminology:
    GitView: The product and root of the owner's authored composition, not an automatically declared DomainEntity
      or a replacement for GitHub.
    User: The operator of GitView, as explicitly selected by the owner. GitHub identities and source authors,
      reviewers and assignees are separate roles or references; identity details remain open.
    Project: A GitView project; the membership rules below are distinct from the meaning of the term itself.
    Repository: Code in which a version control system acts, in the owner's working formulation. For the
      same GitHub object confirmed by the source, rename/transfer preserve one Repository, history and
      Project membership. The numeric GitHub REST repository id is compared within one GitHub instance.
    Code: Code is essentially a folder with files in the owner's working formulation; its precise boundary
      remains open.
    VersionControlSystem: A system that acts on code to manage versions; Git is an example.
    GitHub: The actor that establishes repository management through RegisterRepository.
    GitHubRepository: The contextual role of a Repository under GitHub management. The working ontology
      represents it as a protocol over the same Repository identity.
    Issue: A source-recorded issue addressing a question, problem or work request. An Issue may be
      associated with a motive for an actor in a particular case but does not itself act; the association
      and actor are not inferred merely from an Issue or a link.
    PullRequest: A source-recorded proposal of code changes for consideration and possible inclusion.
      Creating a pull request does not imply approval, merging or an achieved outcome.
    ReviewThread: A discussion relevant to review. Duration and resolution are separate; thresholds and
      data availability remain open.
    CIStatus: Working term for the observed source-reported state of one status-check entry. The owner
      selected counters of current individual PR checks following GitHub's behavior, not counts of workflow
      runs or accumulated attempts. Exact
      source mapping, special states, freshness and readiness interpretation remain open.
    Metric: A measured result interpreted according to a rule and applicable subject, scope, time and
      evidence. Its population, period and units need a separate definition for each metric.
  terminology_status:
    source_refs:
    - conversation:gitview/excerpt-16
    - conversation:gitview/excerpt-17
    - conversation:gitview/excerpt-24
    - conversation:gitview/excerpt-25
    - conversation:gitview/excerpt-31
    - conversation:gitview/excerpt-32
    - conversation:gitview/excerpt-53-reply
    - conversation:gitview/excerpt-58-reply
    - conversation:gitview/excerpt-59-reply
    boundary: Meanings, distinguishing characteristics, properties and relations are separate concerns.
      Ontology keeps specification vocabulary consistent; ordinary controls do not become entities by
      default. Matching a selected package name does not approve a meaning or establish an instance binding.
    unresolved_bindings:
    - GitView need not become an ontology class merely to export the authored composition.
    candidate_definitions: Full definitions of PullRequest and Issue remain under review separately from
      the selected property sets below. CIStatus and Metric are working terms with unresolved boundaries.
    deferred_concepts: Activity likely concerns actions, but remains a hypothesis rather than a standalone
      entity or metric. Organization is metadata. Group is currently redundant; generalized management
      systems and non-GitHub providers are deferred.
    activity_source_ref: conversation:gitview/excerpt-28-reply
  ontology_refs:
  - motivcore:Motive
  ontology_reference_scope: The Motive reference is a review candidate for the owner's Issue-to-actor
    example, using org.0al.motivation.core 0.1.0 in the working composition. It does not assert that an
    individual Issue motivated a particular action, settle the Issue-to-Motive mapping, establish causation
    or approve a term. All terminology above remains draft, even when a name matches a package.
  project_membership:
    source_refs:
    - conversation:gitview/excerpt-10
    - conversation:gitview/excerpt-11
    - conversation:gitview/excerpt-12
    - conversation:gitview/excerpt-31
    contains: A project contains one or more repositories.
    reuse: A repository can belong to more than one project.
    default: By default one project corresponds to one repository.
    organization: GitHub organizations are metadata; a project may contain repositories from different
      organizations.
    undecided: Project identity representation and lifecycle, and the mechanics of creating, naming, editing
      and synchronizing default projects, remain open.
    provider_scope: Current projects expect GitHub-managed repositories and their GitHub-specific properties.
      GitLab and BitBucket are possible later providers, not included integrations.
  selected_property_sets:
    status: User-selected scope for further specification; not a complete typed schema or state machine.
    project_summary: docs/drafts/project-summary-proposal.md
    pull_request: docs/drafts/pull-request-ontology-options.md
    issue: docs/drafts/issue-ontology-options.md
    boundary: The linked source-attributed checklists retain the itemized choices, their qualifications and references; they do not establish ontology acceptance, implementation or independent-task counts. Candidate 0005 refines Project, 0008 PullRequest and 0009 Issue.
  description_format:
    source_document: docs/drafts/github-templates/README.md
    source_refs:
    - conversation:gitview/excerpt-37
    - conversation:gitview/excerpt-38
    selected_issue_sections:
    - Problem
    - Motivation
    - Expected outcome
    - References
    selected_pr_sections:
    - Problem
    - Motivation
    - Expected outcome
    - Changes
    - Validation
    - References
    process_requirement: The owner requires Issue and PR templates with the selected sections. Deployment
      repositories, enforcement mechanism and format version remain open; the saved templates are not
      active GitHub configuration. The requirement does not imply rejecting objects with older or other
      descriptions.
    meaning_boundary: These are properties of description content, not six ontology entities. Motivation
      is a sourced author statement, not proof of every actor's motive. Expected outcome is an intention,
      not an achieved result. Validation is an author statement, separately from observed CI or executed
      evidence. Missing text must not be filled with an invented motive.
    open: Parsing, edits, missing sections, provenance and handling repositories without the template
      need specification. Specific creation-time gates have not been selected or implemented.
  ci_counter_direction:
    source_refs:
    - conversation:gitview/excerpt-34
    - conversation:gitview/excerpt-35-proposal
    - conversation:gitview/excerpt-35-reply
    selected_direction: Count current individual PR checks following GitHub's check list behavior. Do
      not count workflow runs or add earlier failed attempts to a later success for the same check.
    illustrative_counts:
      red: 3
      yellow: 4
      green: 8
      total: 15
    example_boundary: These are the owner's example numbers, not live data or an invariant that the three
      colors always sum to total. Unavailable data is not zero.
    open: Relevant revision, check identity, latest attempt, sources, color mapping, cancelled/skipped/neutral
      states, incompleteness and freshness require specification and verification against GitHub.
    readiness_boundary: Review assessment, unresolved threads and CI are distinct properties. No merge
      readiness predicate is accepted by this counter selection. Review glyphs remain deferred UX proposals.
  overview_scope:
    source_refs:
    - conversation:gitview/excerpt-01
    - conversation:gitview/excerpt-02
    - conversation:gitview/excerpt-03
    - conversation:gitview/excerpt-14
    - conversation:gitview/excerpt-15
    includes:
    - Current work, work awaiting review, ready work and visible problems.
    - Pull requests and issues with compact title, ID, badges and text as applicable.
    - Metrics such as changed lines, commits, runs and review threads.
    - Navigation from an object to its original source in GitHub.
    - Metrics and charts, lightweight review and convenient sharing.
    boundaries:
    - GitView is an overview, not a replacement for GitHub.
    - Internal pull-request exploration is deferred; its later scope is open.
    - A ready label, a failed check, review status and activity volume are not interchangeable.
    - Unknown or stale information must not be presented as confirmed ready.
    readiness_gap: The owner's original request to see what is ready remains a product obligation whose meaning has not yet been established. Showing merged PRs and closed Issues addresses observable completed lifecycle outcomes but does not establish whether an open PR is ready for review, ready for merge, or ready in another intended sense. Candidate 0125 proposes an optional, precisely named open non-draft selection as one observable review-stage view, not a confirmed interpretation of the whole need. The optional checks-and-review-passed candidate in 0057 is not a confirmed interpretation or a complete mergeability decision. Keep these outcomes and independent source signals inspectable without presenting the ready-work need as resolved; further refinement must define the intended subject, predicate, applicable evidence and unknown state before offering a ready label or count.
    undecided: Readiness criteria, thresholds, data freshness, sharing content, supported accounts, access
      and synchronization need further specification.
  experience:
    source_refs:
    - conversation:gitview/excerpt-04
    - conversation:gitview/excerpt-06
    - conversation:gitview/excerpt-41
    - conversation:gitview/excerpt-43
    - conversation:gitview/excerpt-44
    - conversation:gitview/excerpt-46
    - conversation:gitview/excerpt-47
    - conversation:gitview/excerpt-55-reply
    - conversation:gitview/excerpt-56-reply
    direction: A Photos-inspired grid that can zoom between broader and more detailed views, using native
      iOS system components, SF Symbols, system colors and Liquid Glass with minimal custom decoration.
    optional_calendar: A contribution-style calendar is a possible farthest view; its time cells and repository
      or project cells have different meanings.
    selected_density_direction: Many zoom densities exist within the same scope, not just one density
      per Project/Repository/object level. Around eight cells per row and around one hundred objects illustrate
      a dense view, not fixed layout constants or a complete performance requirement.
    selected_timeline_grid:
      default: Show PR and Issue cards in all lifecycle states within the current scope and time group.
      today: Include unfinished work even when the PR or Issue was created on an earlier day.
      today_outcome_working_interpretation: When a card in Today is merged or closed today, retain it
        there with its new state in the unfiltered view.
      filtering: Users can explicitly exclude states such as Merged and Closed to focus on open work.
      undecided: The precise boundary of unfinished work, grouping of past outcomes, and the specific
        filter control.
    first_version_preview: Long-press Peek and Pop on cards, showing a preview before opening the object.
    later_preview_direction: A single sliding rich preview changes details with the object under the finger,
      allowing inspection without leaving the dense bird's-eye view. Hover is a possible pointer counterpart,
      not a required assumption about every target device.
    activation_hypothesis: Long press to activate the later sliding mode is the owner's tentative proposal,
      not a settled gesture contract. The first-version long press requirement is distinct.
    proposal_boundary: The full scale-level proposal, exact preview contents/actions, focus restoration,
      gesture thresholds, animation, hover/pan arbitration and accessibility mechanics are not approved
      by agreement with a prototype. Saved HTML/CSS/JS prototypes are exploratory examples, not app code
      or evidence of native component behavior. Calendar and deeper PR exploration remain optional/deferred.
    undecided: Complete navigation and return behavior, scope-versus-density transitions, accessibility
      alternatives, preview mechanics, calendar transitions and the iOS deployment target need review.
  action_and_motive:
    source: conversation:gitview/excerpt-21 through conversation:gitview/excerpt-23
    working_example: An actor acts on Code under a motive associated with an Issue, with a PullRequest
      described as a consequence. This is a conceptual example, not an observed instance or a complete
      event or state model.
    distinction: A general link and an Ontology relation are distinct in the owner's formulation; an Ontology
      relation is a property arising through an actor's action on an object. The Issue is not the acting
      participant.
    undecided: Formal actor roles, the nature of the consequence, relation lifetime, provenance and mapping
      to shared packages require review.
  review_examples:
  - A project can include repositories from two GitHub organizations, while either repository also belongs
    to another project.
  - A pull request overview can show a failed CI result and review-thread information and provide a link
    to the original GitHub object.
  - An activity calendar and the repository overview must not be treated as the same type of cell merely
    because both use a grid.
  review_examples_status: Agent-authored illustrations for review, not acceptance criteria, executed tests
    or evidence that a result was achieved.
  specification_work_order:
    source_refs:
    - conversation:gitview/excerpt-07
    - conversation:gitview/excerpt-08
    - conversation:gitview/excerpt-09
    - conversation:gitview/excerpt-52-reply
    selected_priority: Establish the idea, ontology, application boundary and UX without application code;
      complete the bounded product ontology, then build the specification graph on it. Visual review-glyph
      polishing is deferred.
    tooling_direction: SpecGraph supports specification work; FSD-iOS informs application architecture;
      SpecificationCore is intended for suitable domain decisions. No integration, package version or
      resulting implementation architecture is claimed here.
    next_bounded_step: Refine the product specification graph top-down, including parent obligations and
      dependencies, until leaves in scope are sufficiently specified for implementation and verification.
      Defer pilot implementation and premature API budget decisions; assess readiness using the complete
      branch and its dependencies, not leaf position or a structural check alone.
    technical_boundary: The selected package and optional composition remain draft. User and GitHubRepository
      are not silently inserted into them. This update does not select sgcore as a domain vocabulary or
      activate the proposed external specification-artifact meta-check.
  authority_boundary: This source-attributed candidate and its refining drafts share the following boundary.
    The owner authorized autonomous specification in excerpt-72; agent working details are not all separately
    owner-approved. IDs are provisional, scenarios describe expected future verification rather than executed
    tests, and neither a structural check nor a local commit accepts a specification, ontology, behavior,
    implementation or associated causal claims. The application is not claimed to exist.
  repository_identity:
    status: user_selected_scoped_rule_not_whole_spec_approval
    source_refs:
    - conversation:gitview/excerpt-54-proposal
    - conversation:gitview/excerpt-54-reply
    - conversation:gitview/excerpt-60-reply
    condition: Observations with the same numeric GitHub REST repository id from the same GitHub instance
      identify one Repository.
    selected_rule: Rename and transfer preserve one Repository, its history and its memberships in Projects.
    example: egor/OldName -> egor/NewName -> team/NewName, under the same-object condition, remains one
      Repository.
    address_boundary: Observed name, owner and address may change; no literal address is selected as the
      identity key.
    reused_address: A different numeric id from the same GitHub instance identifies a separate Repository
      with independent history and memberships.
    unavailable_observation: HTTP 404 leaves current state unknown and preserves the last known record.
    agent_implications_for_review:
    - Preserve the owner and name recorded in each historical observation.
    open: Local persistence keys, alias and ID-format migration, cross-instance identity and automatic
      Project renaming remain specification work.
  pilot_status: The owner authorized autonomous pilot specification in excerpt-72. The graph describes
    a bounded first pilot and reviewable working choices, with later scope and implementation details
    distinguished. This does not claim app implementation or executed acceptance scenarios.
acceptance:
- The operator can view authorized GitHub work grouped into GitView Projects without treating GitView
  as a replacement for GitHub.
- The overview keeps unfinished work and same-day outcomes visible by default and supports explicit filters,
  density changes and object preview.
- Project composition, source identity and distinct PR, Issue, CI and review meanings follow their linked
  specifications.
- Stored observations remain usable subject to access policy, with visible freshness, failure and incomplete
  coverage.
- The pilot offers source navigation, lightweight sharing, meaningful metrics and accessible alternatives
  to gestures.
acceptance_evidence:
- criterion: Pilot behavior is checkable end to end.
  evidence: GITVIEW-SPEC-0020 records expected scenarios; implementation and execution remain future work.
