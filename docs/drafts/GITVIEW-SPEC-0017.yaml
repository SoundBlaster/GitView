specification:
  objective: Make the main overview and object access usable with iOS accessibility features.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - Provide ways to navigate and open objects without relying solely on pinch, long press, hover or color.
  - Expose understandable object type, permitted title, state and relevant indicators to assistive technologies without disclosing restricted private data.
  - Adapt presentation to Dynamic Type and motion to the system's Reduce Motion preference.
  - Keep system visual language and use native controls where appropriate; implementation details remain
    open.
  review_scenarios:
  - Given VoiceOver, the operator can identify and open a PR without relying on its color.
  - Given larger text or Reduce Motion, important information remains available and navigation remains
    usable.
  unresolved:
  - Exact native accessibility actions, focus fallback and supported platform versions require device
    checks.
  evidence_boundary: Scenarios are expectations for future verification, not executed tests. The ontology
    selection and specification remain drafts; implementation is not claimed.
  pilot_contract:
  - Every essential operation can be reached without relying exclusively on pinch, long press, hover or
    color.
  - Assistive labels identify object type and permitted repository context, title or number and important state when
    known; unknown data is not announced as success and restricted data is not disclosed.
  - Dynamic Type permits a more spacious layout; Reduce Motion avoids requiring motion to understand navigation.
  - Restoring accessibility focus after preview or return should use the original object when it remains
    available and a sensible fallback otherwise.
  pilot_scenarios:
    voiceover:
      given: VoiceOver is active on a dense Project grid.
      when: The user moves focus to a PR and opens it.
      then: Its identity and relevant known state are available without interpreting cell color.
    reduced_motion:
      given: Reduce Motion and a large text size are enabled.
      when: The user changes scope and returns.
      then: Navigation and content remain understandable and available without a fixed density requirement.
  pilot_provenance: The owner authorized autonomous pilot specification in excerpt-72. Working details
    are specification choices, not claims that the app exists or that every detail was separately discussed.
acceptance:
- Every essential operation can be reached without relying exclusively on pinch, long press, hover or
  color.
- Assistive labels identify object type and permitted repository context, title or number and important state when
  known; unknown data is not announced as success and restricted data is not disclosed.
- Dynamic Type permits a more spacious layout; Reduce Motion avoids requiring motion to understand navigation.
- Restoring accessibility focus after preview or return should use the original object when it remains
  available and a sensible fallback otherwise.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
