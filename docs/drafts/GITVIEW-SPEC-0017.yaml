specification:
  objective: "Make the main overview and object access usable with iOS accessibility features."
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:PullRequest
  - gitview:Issue
  requirements:
  - "Provide ways to navigate and open objects without relying solely on pinch, long press, hover or color."
  - "Expose understandable object type, title, state and relevant indicators to assistive technologies."
  - "Adapt presentation to Dynamic Type and motion to the system's Reduce Motion preference."
  - "Keep system visual language and use native controls where appropriate; implementation details remain open."
  review_scenarios:
  - "Given VoiceOver, the operator can identify and open a PR without relying on its color."
  - "Given larger text or Reduce Motion, important information remains available and navigation remains usable."
  unresolved:
  - "Exact VoiceOver order, actions, focus restoration and supported OS versions require platform validation."
  evidence_boundary: "Scenarios are expectations for future verification, not executed tests. The ontology selection and specification remain drafts; implementation is not claimed."
