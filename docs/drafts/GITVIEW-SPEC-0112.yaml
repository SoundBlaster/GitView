  github_user_access: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/authenticating-with-a-github-app-on-behalf-of-a-user
  github_installation_discovery: https://docs.github.com/en/rest/apps/installations#list-repositories-accessible-to-the-user-access-token
