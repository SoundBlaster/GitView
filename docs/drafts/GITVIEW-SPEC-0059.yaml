id: GITVIEW-SPEC-0059
title: GitView - Repository discovery and selection continuity
kind: spec
created_at: '2026-11-14T15:52:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0019
depends_on:
- GITVIEW-SPEC-0022
- GITVIEW-SPEC-0038
- GITVIEW-SPEC-0045
- GITVIEW-SPEC-0058
sources:
  parent: docs/drafts/GITVIEW-SPEC-0019.yaml
  first_launch: docs/drafts/GITVIEW-SPEC-0022.yaml
  selection: docs/drafts/GITVIEW-SPEC-0045.yaml
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Discovery results identify their source account and coverage; an incomplete or failed result is distinct from an observed empty result.
- An eligible discovered Repository can be selected by confirmed source identity without relying on its display name alone.
- Refreshing or narrowing discovery does not silently discard a pending selection or mutate saved Project membership.
- A stale discovery response cannot be relabeled as belonging to a different active connection or prove restored access after disconnect.
- Confirmation rechecks the identity and applicable access required by the selected operation and preserves individual unresolved outcomes.
- The operator can find Repositories within the available discovery scope without losing pending selections or confusing search results with source-wide absence.
specification:
  objective: Specify continuity from authorized repository discovery to explicit Project setup while preserving identity and coverage.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Repository
  - gitview:Project
  contract:
    result_scope: Attribute each discovery result to its source identity, query or selection scope, applicable access context and coverage. Returned accessible Repositories may be offered for selection while the result is incomplete, with that limitation visible. Only sufficiently covered discovery can establish that no repositories match its stated scope; it does not establish that the source account has no other repositories outside that scope.
    search: Offer a way to narrow discovery by a permitted Repository name or source context and return to the broader available discovery scope by clearing the restriction. Searching is distinct from the saved Project collection and does not alter pending selections. A result set identifies the active search and access scope; a complete no-match statement applies only to that scope. If filtering only an incompletely observed local subset, show that the displayed matches and any no-match state are incomplete rather than asserting there are no source matches. Matching, ordering, supported fields and whether search is source-side remain unselected until source and UX design.
    search_response_order: Associate each discovery or search response with its source identity, active connection, requested query and attempt context. A late response for a superseded query cannot be presented as the complete result for the current query or replace a newer result without an applicable ordering rule. It may be retained only with its original context and current access policy. Resetting the search initiates or displays the broader scope under its own coverage; it does not make a partial cache complete.
    distinct_intents: Repository discovery may serve default setup or a separately initiated custom-Project creation. Retain the selected operation intent through query changes and pagination; the same pending selection must not be submitted under another intent without an explicit operator choice and review. Default setup follows 0045, and custom creation follows 0025; source identity and access requirements apply to both.
    app_access_scope: Candidate 0098 proposes GitHub App user authorization; 0099 refines discovery across the app's observed installations and Repository grants. Identify the applicable source scope without asserting that an installation or user token proves access to every Repository or data category. A Repository absent from the app's accessible results is not thereby proven inaccessible to the person using GitHub, nor are uninstalled organizations proven empty. Actual source-specific discovery coverage and permissions remain unverified.
    identity: Select and reconcile an entry by confirmed Repository identity under 0038. Different names or owners can refer to the same confirmed source object, while the same display name alone cannot establish identity. An entry lacking the identity or access evidence required for setup remains unresolved rather than being silently substituted or merged.
    pending_selection: Pending selection is separate from discovery's visible subset and from saved Project membership. Pagination, a changed search query, a refresh or a temporary source failure does not silently clear previously selected confirmed identities. The operator can inspect and explicitly remove selections; an unavailable entry is identified as such without disclosing restricted details.
    recheck_projection: After a user-initiated access recheck or resumed installation review under 0099, apply each supported discovery or grant result only to its original current-account, installation, query and Repository scope. For each pending selection keep its confirmed identity and original setup intent separately from its current eligibility evidence. Present an entry as eligible only when applicable evidence satisfies the admission policy; a selected entry whose current eligibility cannot be established stays selected but unresolved, unless the operator explicitly removes it. An explicit applicable denial restricts the entry under 0036 without exposing its name or revealing counts; a partial response, source error or absence from a subset does not itself prove denial, deletion or deselection. Independently permitted entries remain reviewable and can be processed per 0045 after explicit confirmation and coordinated admission. A returned browser, successful unrelated scope or selection retained from before recheck does not itself refresh an entry's grant. Do not claim that a partial recheck invalidates every prior fact or proves uninterrupted remote access; apply the established admission and current-disclosure policy to each affected entry.
    incomplete_or_absent: A Repository not returned by a partial result is not confirmed deleted, denied or deselected. A complete result can establish absence only within its stated source and query scope and according to source permissions; it does not alone delete saved Projects or prove source deletion. Explicit denial follows 0036.
    confirm: The operator explicitly confirms a nonempty selection. Before a selected entry changes local Projects, establish the required source identity and applicable access at processing time; failures or uncertainties are per-entry outcomes under 0045. An earlier discovery result does not itself prove present access after a connection change.
    changing_connection: Bind a discovery attempt to the identity and active connection context that initiated it. A late result after disconnect, authorization denial or confirmed replacement cannot re-enable access, replace the new account's results or make restricted private details visible. A new valid connection requires its own applicable discovery and access evidence.
    pending_across_account_change: A pending selection retains its original source context and is not silently treated as a selection made under a different account. When the active account changes, do not expose restricted identifiers or submit earlier choices automatically. The operator can review any permitted retained selection and explicitly confirm entries in the new context after the required identity and access are re-established; an unavailable entry remains unresolved or can be removed. Already saved Projects remain separate from this pending selection.
    retry: A retry or continuation preserves already confirmed selected identities and reports its own coverage and error without assuming the remaining source is empty. Exact source pagination, query syntax and selection layout remain unchosen.
    provenance: Explicit default-per-Repository setup follows the owner's choice; continuity, scope and race boundaries are agent-authored refinements.
  scenarios:
    incomplete_search_no_matches:
      given: Discovery has returned only a partial accessible subset and a local search finds no match in that subset.
      when: The operator reads the result and clears the search.
      then: The app does not claim that no source Repository matches; any retained selections remain pending and the broader view retains its own incomplete coverage.
    superseded_search:
      given: Search A was issued, then the operator enters search B under the same valid connection and B's result is presented.
      when: A's response arrives late.
      then: It is not labeled as B's result or used to claim B's coverage; any permitted retention preserves A's own scope and attempt context.
    creation_mode_preserved:
      given: The operator selects two eligible Repositories for a custom Project and changes the search query.
      when: The selection is reviewed before confirmation.
      then: Both pending selections and the custom creation intent remain identifiable; no default-setup submission or Project mutation occurs without an explicit choice and confirmation.
    selection_across_search:
      given: A Repository R with confirmed identity is selected in one partial discovery result.
      when: The operator changes the search and R is not in the currently visible result.
      then: R remains in the pending selection until explicitly removed and the visible subset is not presented as the complete source.
    partial_recheck_preserves_pending:
      given: Under one unchanged account the operator has selected Repositories A and B for default setup; after an access-review return a recheck independently confirms A eligible but cannot establish B's current eligibility because B's installation scope failed.
      when: The pending selection is reviewed and explicitly submitted.
      then: The selection is not silently discarded; A can proceed under its applicable admission evidence while B remains selected and unresolved, without assuming B is denied, deleted or unselected. The partial failure and available recovery are discoverable without exposing restricted details.
    denial_during_recheck:
      given: A pending selection includes private Repository B and an applicable explicit denial is established while another selection A remains independently eligible.
      when: The recheck results and pending selection are presented.
      then: B's restricted identity and revealing details are not exposed and its entry cannot be admitted on the old grant; A remains independently eligible under its own evidence, and an access-safe way to review or remove pending choices remains available.
    partial_result_failure:
      given: Some accessible Repositories were returned and one was selected before discovery fails.
      when: The selection screen displays the failure.
      then: The selection and returned permitted entries remain available with incomplete coverage and a retry path; unreturned entries are not declared absent.
    source_identity_changes:
      given: Discovery began under source identity A and a different identity B is subsequently confirmed.
      when: The late A result arrives.
      then: It is not labeled as B's discovery or used to unlock A's restricted data; Project mutations are not initiated by its arrival.
    lost_access_before_confirmation:
      given: A Repository was selected from a previously permitted result but its access cannot be established when the selection is processed.
      when: The operator confirms setup.
      then: The affected entry is unresolved or failed under 0045 and no replacement Repository is inferred from a matching name; unrelated completed entries remain intact.
    selection_followed_by_account_change:
      given: The operator selected a private Repository under A but has not confirmed setup, then B becomes the active account.
      when: The pending selection is revisited.
      then: The prior selection is not submitted or relabeled as B's, private details remain subject to access restrictions, and any setup under B requires explicit confirmation with applicable identity and access evidence.
  unresolved:
  - Source-specific discovery scope, permission semantics, search and pagination evidence require verification.
  - Exact user-facing recovery and retention of a pending selection across an account switch remain open within the stated privacy and explicit-confirmation boundaries.
  - Device and real-adapter evidence is absent; no source endpoint or request budget is chosen.
  - Search matching, field availability, response ordering and presentation of query coverage require source and native verification.
