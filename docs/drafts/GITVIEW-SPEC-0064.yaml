id: GITVIEW-SPEC-0064
title: GitView - Project membership basis for historical metrics
kind: spec
created_at: '2026-11-14T16:14:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0030
depends_on:
- GITVIEW-SPEC-0025
- GITVIEW-SPEC-0044
- GITVIEW-SPEC-0046
sources:
  parent: docs/drafts/GITVIEW-SPEC-0030.yaml
  agreed_summary: docs/drafts/project-summary-proposal.md
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Every Project historical series identifies its supported membership basis, actual scope, time and coverage;
  confirmed GitHub revocation alone does not hide an already saved local series under 0019.
- A retrospective series for current members is not described as the Project's historical membership at
  the time of past events.
- An exact point or bucket requires sufficient evidence for the metric and stated membership; absent history
  remains a gap or incomplete result.
- A Project membership edit does not silently rewrite the provenance or source observations of a previously
  produced series.
- Unknown member inputs are not presented as zero or as a confirmed exact derived value; confirmed revocation
  alone does not hide an already saved supported local result under 0019.
specification:
  current_intent_boundary: The owner selected recalculating Project historical graphs over the selected
    period using current Project Repository membership. See canonical 0013/0047 and conversation_memory/sketches/gitview/revisions/a55f271ca16f4283bfaf67095616ee7a/notes.hc.
    Exact graph evaluation, captured-scope lifetime, time buckets, evidence, access and broad historical-counter
    navigation below remain candidates except the selected merged-counter transition in 0047; this choice
    does not establish actual past Project membership or a complete history.
  objective: Define interpretable Project metric history when locally managed Repository membership changes
    over time.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    project_membership: GitView Project membership is local product configuration under 0025, not a GitHub
      organization or GitHub Projects membership. GitHub repository events do not by themselves establish
      when an operator added or removed a Repository from this local Project. The existence or retention
      of local membership history is not assumed.
    working_default: The owner selected current Project Repository membership as the basis for historical
      graphs. As an agent-authored technical candidate, capture its confirmed saved set for a graph evaluation
      as a fixed retrospective scope across the selected period. Clearly identify that basis as current
      members, not the actual Project membership at each historical time. If current membership cannot
      be established, do not invent a fixed set or claim a complete Project series.
    fixed_evaluation: Keep the captured Repository identities and membership basis associated with a displayed
      series while its results are assembled. A later saved membership change does not relabel old results
      as describing the new set. If the UI presents a newly recalculated current-member series, identify
      the changed scope and reassess all affected bucket coverage; exact refresh interaction remains open.
    membership_change_presentation: As an agent-authored first-version interaction, when a displayed or
      still-loading current-member retrospective is known to use a captured membership that differs from
      the newly confirmed current Project configuration, keep its original metric, period, captured basis
      and observations attributable but identify that the series uses the earlier captured members, not
      the Project's current members. Make the change and a deliberate action to evaluate the same metric
      and period for current members discoverable without relying only on color or silently replacing
      the operator's selection. The new evaluation has its own captured membership, access, evidence and
      coverage; it may contain gaps even where the previous series had values. If current configuration
      or its relation to the captured set is unknown, present that uncertainty rather than assert either
      equality or a particular change. Apply current disclosure before showing old member names, counts,
      points or an explanation; a general limitation must not reveal restricted details. A known membership
      change alone neither proves source activity nor deletes independently permitted history used by
      another Project.
    competing_evaluations: Bind each graph evaluation to its captured metric, predicate version, period
      and time zone, membership basis, Repository set, access context and relevant observation evidence.
      If a newer evaluation is selected while an older one is still being assembled, a late older result
      may be retained with its own supported context but cannot replace or be labeled as the selected
      new series solely because it completed later. An older result's use after an access change remains
      subject to current restrictions; its prior context does not authorize disclosure.
    historical_membership: A series claiming the Project's membership at each past time requires independently
      sufficient local historical membership evidence with timing and identity semantics. If that evidence
      is absent or incomplete, such a series is unavailable or incomplete. This candidate does not require
      GitView to retain a historical membership ledger or imply that one already exists.
    observed_membership_count: Candidate 0097 proposes a separately labeled history of the Project's confirmed
      local membership count at actual observed configuration states. The fixed current-member retrospective
      default is not a substitute for this series. A retained count point need not establish a complete
      membership ledger or prove the Project's count between observed states; the points and any gaps
      retain their own observation context and access limitations.
    event_series: A confirmed PR merge or Issue closure event can support the relevant event-time bucket
      only for the stated source identity, metric unit, period and evidence. GitHub documents issue timeline
      event types, but an API's existence or a single known event does not prove complete event history
      for all Repositories or all past periods. Closure reasons require evidence for the relevant event
      under 0030 and 0056.
    state_series: A historical count of open PRs, open Issues or review/CI attention requires a qualifying
      observation at the stated point or independently justified reconstruction for that exact predicate
      and scope. An available present state or an isolated closure event alone does not establish a past
      snapshot. CI/review history and source retention may have separate limits; a skipped or missing
      collection is not zero.
    per_repository: Repository-level observations retain their own time, coverage, identity and access
      context. A previous aggregate for A and B cannot establish a total for A and C unless each required
      input, including C, independently supports the new point. If a permitted input covers only a subset,
      a partial observation may be shown with its stated coverage; it is not a complete total or an automatic
      current lower bound.
    removed_member_aggregate: A retained aggregate for members A and B does not by itself establish A's
      historical value after B is removed from the selected retrospective basis. Derivation by subtraction
      is valid only when independently supported compatible per-member values, metric units, distinct
      identity or disjointness, reference, coverage and current disclosure policy make that derivation
      sound. A count with unknown contributing identities or lineage cannot be split by assuming an equal
      contribution, using B's current count, or taking the latest values from different times. When sufficient
      evidence is missing, the A-only point is incomplete or unavailable, while any still-permitted A-and-B
      aggregate retains its original basis.
    cross_basis_comparison: A change from an A-and-B series to an A-and-C series changes the measured
      scope. Preserve each evaluation's membership basis and time context, and do not connect, label or
      announce the two values as a continuous same-scope change unless independently recomputed comparable
      data supports that interpretation. A clearly labeled comparison of different scopes may be offered
      where permitted, but must not attribute the difference solely to PR or Issue activity. This applies
      to visual charts, accessibility descriptions and exported or shared representations under current
      disclosure policy.
    privacy: Previously saved supported historical values and counts remain visible as last known after
      confirmed private Repository revocation under 0019 with their observation times, coverage and applicable
      revocation indication. Do not treat unknown inputs as zero or claim a partial series is complete.
      Independently applicable cross-account and external sharing questions remain separate.
    derived_value_admission: A saved supported historical point or aggregate remains available as last
      known after confirmed private Repository revocation under 0019 with its actual source scope, coverage
      and observation times. Do not present it as newly current or infer unknown values. The rules for
      newly computed mixed-account results or external sharing remain separate and are not decided by
      local visibility.
    recoverable_lineage_candidate: As an agent-authored initial representation, retain with each derived
      point a recoverable attribution to the actual metric and predicate version, subject, fixed membership
      basis, period or reference, coverage and each source-derived evidence scope needed to establish
      that value, including the applicable account, Repository, category and retained evidence identity
      where supported. Derivations from other aggregates carry the transitive lineage needed to interpret
      those aggregates; a locally stored total is not a new independent permission witness. Local configuration
      facts and source-derived names or observations keep their distinct origins. This is an information
      contract, not a requirement to persist a full calculation tree, duplicate raw private payloads or
      add ontology entities. If the necessary lineage cannot be recovered or its completeness cannot be
      established, the exact affected value remains unavailable until independently supportable permitted
      evidence is obtained.
    recomputation_after_restriction: On confirmed private Repository revocation retain previously saved
      supported points, totals and accessible equivalents as last known under 0019 with their original
      context and indication. A separately recalculated value must identify its actual input scope, coverage
      and time; a partial new observation cannot refresh unrelated facts or establish a complete Project
      total. Late results begun before revocation are not accepted as fresh updates.
    differential_disclosure: Confirmed GitHub revocation alone does not require hiding a previously saved
      supported local total or its available inputs under 0019. Distinguish last-known values, scope,
      coverage and times from current source facts; do not fabricate missing contributions. Cross-account
      isolation and values handed outside the app remain separate policy questions.
    disclosure_boundary: Confirmed GitHub revocation does not remove the locally available saved history
      under 0019. Show its limitation and supported time when known without asserting current source access.
      Information already delivered outside the app cannot be recalled; external handoff and account boundaries
      remain separate questions.
    source_boundary: Repository source events, GitView local membership history and GitView local saved
      observations are distinct evidence classes. Their existence, availability, timestamps and retention
      do not imply one another. Specific API, snapshot storage, background schedule and retention policy
      are not selected here.
    provenance: The owner selected Project historical graphs based on current Repository membership when
      sufficient history exists. Fixed evaluation mechanics and other detailed history policies remain
      agent-authored candidates.
  scenarios:
    historical_graph_open_during_membership_edit:
      given: A permitted Project P history graph for a fixed period was evaluated for then-current members
        A and B. A confirmed edit later replaces B with C, which is also a member of Project Q but lacks
        sufficient observations for the chosen metric.
      when: The operator remains on P's graph and then explicitly requests evaluation for P's current
        members.
      then: The original graph remains identified as the earlier A-and-B basis rather than current A-and-C
        membership. The new evaluation keeps the metric and period but identifies A-and-C and its own
        incomplete coverage; it does not call C zero or claim that the difference is source activity.
        Q's membership and independently permitted retained observations are not changed.
    partial_restore_does_not_unseal_point:
      given: A retained A-and-B historical failed-CI point depends on B's PR state and CI observations,
        which were restricted; later only B's Repository name and one PR title are newly permitted.
      when: The operator opens the historical chart and an A-only independently supported series.
      then: For confirmed revocation, the previously saved supported A-and-B point remains locally accessible
        as last known with its original scope, time, coverage and applicable revocation indication under
        0019. A separately supported A-only point keeps its own context. Newly observed metadata or a
        title does not refresh prior CI or prove completeness.
    delayed_chart_result_after_restriction:
      given: A chart calculation for A and B captured permitted evidence and starts before B becomes restricted;
        a newly selected A-only evaluation is in progress.
      when: The older A-and-B calculation finishes after the restriction.
      then: Its restricted-input point, value, accessible text and share payload are not published from
        the stale result, and it does not replace the A-only evaluation. The app does not claim it can
        retract any earlier external disclosure.
    lost_aggregate_lineage:
      given: A retained numerical point remains readable after restart but a required dependency record
        cannot establish whether it includes a now-restricted Repository's CI input.
      when: The chart requests the exact point.
      then: The exact value stays unavailable rather than being treated as independently public, zero
        or a safe A-only point; independently evidenced permitted data can be evaluated with its own scope.
    remove_member_without_contribution:
      given: A retained permitted historical point counts ten distinct PRs for A and B together, but the
        historical B-only contribution and contributing identities are unavailable.
      when: B is removed and a historical series for current member A alone is requested.
      then: The prior ten remains an A-and-B observation, not an A-only point; the new A point is incomplete
        or unavailable unless independently supported compatible evidence permits its calculation.
    different_membership_not_one_trend:
      given: A permitted graph evaluation for members A and B records ten open PRs, and a later evaluation
        for members A and C records six, with no independently comparable same-membership series.
      when: The operator inspects the two values visually or through an accessible description.
      then: Each value retains its own member basis and context; the change is not announced or drawn
        as a continuous same-scope reduction of four PRs.
    member_added:
      given: Project P contained A last week and now contains A and B; historical event coverage exists
        for A but not B.
      when: A current-member retrospective graph for last week is evaluated.
      then: The scope is labeled A and B and the missing B contribution makes affected buckets incomplete
        or unavailable; the old A-only graph is not relabeled as complete for A and B.
    historical_basis_unknown:
      given: A Project currently contains A and B but no record establishes whether B was a member last
        week.
      when: A graph is requested for actual membership at each past time.
      then: The historical-membership claim remains unavailable or incomplete; the current A and B set
        is not asserted as last week's membership.
    subtractable_private_contribution:
      given: A previously stored Project bucket totals 10 PRs from A and B, A's independently supported
        permitted contribution is 7, and B's private inputs have since become restricted.
      when: GitView renders or restores the Project graph and an A-only view for the same bucket.
      then: For confirmed GitHub revocation, a supported saved A-plus-B total and separately supported
        A-only value remain locally accessible as last known with their actual scope, time, coverage and
        applicable indication under 0019. Do not fabricate a missing contribution or claim newly current
        data; cross-account and external handoff decisions remain separate.
    unknown_lineage:
      given: A saved aggregate predates the current access restriction but its retained evidence cannot
        establish whether it depends on the restricted input.
      when: The metric history is opened.
      then: The exact aggregate remains unavailable until independently supported permitted inputs establish
        its scope; the app does not assert zero or use the stored value as an access witness.
    limitation_already_seen:
      given: The operator saw an aggregate before a later source restriction and may remember it.
      when: The app applies the restriction.
      then: App-controlled future output follows the present policy, without claiming to erase the operator's
        knowledge or retract prior external shares.
    old_series_after_edit:
      given: A displayed historical series was evaluated for current members A and B, and a later saved
        edit replaces B with C.
      when: The old series or a recalculated series is displayed.
      then: The old series remains attributed to A and B; a new current-member series identifies A and
        C and reassesses its own coverage.
    old_evaluation_completes_late:
      given: A graph evaluation for current members A and B starts, then membership changes and the operator
        selects a newly evaluated A and C series.
      when: The earlier A and B evaluation completes after the A and C selection.
      then: The earlier result cannot overwrite or be labeled as the selected A and C series; each permitted
        result retains its own scope, access and coverage context.
    current_state_not_history:
      given: The current open PR count is known for all current members but no historical observations
        or sufficient reconstruction exist for yesterday.
      when: Yesterday's open-PR point is shown.
      then: It is a gap or incomplete, not today's value or zero.
    event_known_scope_incomplete:
      given: One confirmed merge event in the selected period is known for A while B's event coverage
        is incomplete.
      when: A period outcome series for current members A and B is shown.
      then: The known A event may be represented with incomplete scope, but one is not asserted as the
        complete Project outcome count.
    access_revoked:
      given: A previously permitted historical graph includes values derived from a private Repository
        that later becomes explicitly restricted.
      when: Revocation of access to the private Repository is confirmed and the graph is viewed again.
      then: Previously saved supported graph values remain visible as last known with the revocation indication
        and supported observation times; unknown coverage remains incomplete rather than zero, and synchronization
        stops.
  unresolved:
  - Specify a practical provenance representation and evidence for whether a computed point depends on
    currently restricted inputs; validate any broader safe-aggregate policy before relaxing suppression.
  - Define native presentation and evaluation behavior when membership changes while a current-member
    historical graph is visible; the current-member basis for Project graphs is owner-selected.
  - Source-specific history completeness, event reason, CI/review reconstruction and membership retention
    guarantees remain unverified.
  - No local storage model, historical graph or device behavior has been implemented or tested.
