acceptance:
- The agreed Project summary distinguishes Repository coverage, open PRs, draft PRs, open Issues, attention signals and period outcomes by their units and scope.
- A summary count identifies its observation context and is complete only when the necessary inputs cover the stated Repository set and condition.
- Graphs of selected summary metrics use explicitly defined snapshot or outcome semantics and show insufficient history as incomplete or missing rather than zero.
- Current check counts, affected PRs, threads, Issues and outcome events are not silently substituted for each other or combined into independent-task totals.
- A metric or its graph does not claim a source fact, historical state or completion reason unsupported by the relevant evidence.
- A Today lifecycle breakdown and historical outcome or fixed-cohort series are distinguishable by population, time and unit.
specification:
  objective: Define the agreed Project summary's measurements and the evidence needed to interpret their values and historical graphs.
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:ReviewThread
  - gitview:Metric
  contract:
    scope: The Project summary uses the confirmed current saved member Repository identities under 0029. The same Repository contributes separately to each Project containing it, while a unique portfolio uses the deduplicated union. A selected Repository summary uses that Repository only. A past series must identify its membership basis under 0030; current membership alone is not historical membership evidence.
    coverage: Each value states or makes discoverable its object type, unit, condition, relevant time or period, scope and completeness. Coverage is assessed per metric and applicable Repository and field; an overall available-repository count alone does not prove that CI, review, Issue links or history are complete. Unknown and inaccessible inputs follow 0044 and 0046 rather than contributing zero.
    repository_count: Count distinct confirmed saved member Repository identities. If configuration or identity is uncertain, do not assert an exact distinct count. A coverage indication identifies the particular observed category and scope it describes; available membership is not itself evidence of successful GitHub observation.
    open_work: Count distinct source-confirmed open PRs, open draft PRs and open Issues separately for the stated observation context. Draft PRs are a subset of open PRs, not an additional category of work. Source data must establish identity, open lifecycle and, for the subset, the draft flag; an unknown flag is not non-draft. PR and Issue counts are not a count of independent tasks.
    today_breakdown: As an agent-authored refinement of the owner's wish to see work finish while all today's cards remain visible, make a current lifecycle breakdown available for the same explicitly identified dynamic Today selection under 0027. Count distinct PR identities separately as open, merged, closed without merge and unknown lifecycle; for Issues count distinct open, closed and unknown lifecycle separately, preserving any supported closure reason without equating closed to completed. Each count identifies its object type, selection scope, explicit filters, local day, observation context and coverage. A draft is a separate subset of open PRs and is not added to the open total. A PR and linked Issue remain distinct source objects, not necessarily independent tasks.
    today_breakdown_evidence: The breakdown follows the eligible visible or inspectable Today population and its access restrictions, not a silently captured cohort. Exact population or category totals require sufficient compatible identity, inclusion, state and access evidence for the stated context under 0027, 0044, 0046 and 0089. Individually confirmed facts or an observed subset may be available with their actual times and incomplete coverage; unresolved identity, inaccessible facts or unobserved population are not invented as a known number of unknown objects. A source-observed lifecycle and an event occurring today are distinct claims. Mixed-time inputs do not become one simultaneous source snapshot without evidence.
    today_filters_and_changes: The default unfiltered lifecycle selection retains open and same-day completed work; a deliberate lifecycle or other filter may change the visible population under 0007 and 0027. If a breakdown reflects that filtered population, identify the filters and do not describe it as all Today work. The operator may instead inspect an independently labeled unfiltered breakdown when its own scope and evidence permit. New eligible PRs enter dynamic Today without creating a new fixed cohort; transitions update the same identity when applicable, and a new local day reevaluates the population. Restricted details or revealing counts follow 0036.
    today_vs_history: A Today breakdown is a current observation of a changing selection. It is not automatically the number of merges occurring during Today, a sequence of past snapshots, a fixed-cohort burn-down or the remaining independent tasks. Event-time outcome counts require 0056 and 0065; a fixed PR cohort follows 0055; a chart of prior Today breakdowns requires retained or reconstructible observations for the respective populations, times, membership and coverage. If those inputs are absent, expose only the supported current breakdown or gaps rather than backfilling a trend.
    failed_ci: Count distinct open PRs with at least one confirmed current status-check entry in the failure category of 0061 for the applicable revision and observation context. This includes a supported timeout or status error without calling either a failed test. A positive may be known with partial check coverage, but absence requires sufficient coverage under 0028 and 0061. Optionally also report distinct affected Repositories as a separate unit; neither count is the number of failed entries. A zero failure count does not classify special outcomes or establish healthy CI.
    review_waiting: Count distinct open PRs for which source evidence establishes an outstanding review request in the stated context under 0062. A request for a team or person is not automatically a request to the GitView operator or proof of a review-required decision, and an unknown request state is not zero.
    changes_requested: Count distinct open PRs whose applicable source review assessment reports changes requested. Preserve its revision and observation context; do not derive it from thread count or assume every change request leaves an unresolved thread.
    unresolved_review_threads: Report the number of distinct unresolved review threads and the number of distinct open PRs containing at least one separately. The first unit is threads, the second PRs. A confirmed unresolved thread can establish a positive partial observation, while an empty or complete total requires sufficient thread identity and resolution coverage.
    long_threads: The owner's requested long-thread attention requires a separately selected and evidenced age predicate under candidate 0094. Do not derive inactivity, waiting time or a complete zero from creation age or unknown thread timestamps.
    blocked_issues: Count distinct open affected Issues with at least one explicitly linked direct blocker confirmed open in the relevant permitted observation context under 0063. A blocker may be outside the Project without becoming its member. A mention, parent relationship or unknown blocker state is not proof of this predicate; incomplete or restricted inputs prevent a confirmed absence and must not leak private details.
    period_outcomes: For an explicitly stated period, report merged PRs and closed Issues separately, using event time and sufficient event evidence. Identify whether a value counts distinct affected objects or events; when grouped by Issue closure reason, require reason evidence applicable to that closure. Unknown reason stays unknown and a non-completion closure is not a completed task. Object selections opened from such outcomes follow 0056.
    optional_ready: The suggested checks-and-review-passed selection remains conditional on a separately defined and accepted predicate, including empty and unknown inputs. Until then do not fabricate this count or call it merge readiness; known check, review and thread observations remain independently available under 0028.
    graphing: The selected Project proposal requests graphs of its summary metrics when history is sufficient. Candidate 0064 proposes a fixed current-member retrospective scope and distinguishes it from actual historical membership. For a current-state metric, each historical point requires an observation or justified reconstruction of the same predicate, membership basis and scope at that point under 0065. A period-outcome series requires event evidence and bucket boundaries as in 0030 and 0065. Missing history is a gap or explicitly incomplete value, never an invented zero or a line copied from a current snapshot. Graph style, default buckets and which graphs fit on an initial screen remain open.
    provenance: The Project summary and graphs are owner-agreed; exact count predicates and evidence requirements are agent-authored refinements. Source-specific mappings, current-state freshness thresholds and supported historical reconstruction remain open.
  scenarios:
    dynamic_today_breakdown:
      given: A fully covered Project-wide Today selection at one supported observation context contains 100 distinct PRs, 95 currently merged and five currently open.
      when: Its unfiltered lifecycle breakdown is shown.
      then: It identifies 100 Today PRs, 95 merged and five open in that context without claiming a historical trajectory or 100 independent tasks; a count of merges occurring today additionally needs the corresponding event evidence.
    new_pr_after_breakdown:
      given: The preceding 100-PR Today selection is fully covered and a new distinct eligible open PR is then confirmed in the same Project and local day.
      when: A new sufficiently covered dynamic Today breakdown is evaluated.
      then: It contains 101 PRs with 95 merged and six open; an earlier fixed 100-PR cohort remains unchanged and neither observation alone establishes intermediate trend points.
    filtered_not_all_today:
      given: A complete Today PR selection contains both open and merged PRs and the operator explicitly excludes merged PRs.
      when: A breakdown of the currently filtered selection is shown.
      then: Its merged exclusion and filtered scope are identifiable; zero visible merged PRs is not presented as zero merged PRs in all of Today.
    unknown_population_not_counted:
      given: A Project has one permitted Repository with known Today PRs and a second unobserved Repository.
      when: The Today lifecycle breakdown is displayed.
      then: Known eligible PRs may be shown as an incomplete subset, but the unobserved Repository is not assigned zero PRs or a fabricated number of unknown PRs and no exact Project total is claimed.
    separate_check_and_pr_units:
      given: Two open PRs in two Repositories have five failed current checks in total, with sufficient identity and observation coverage.
      when: Failed CI attention is summarized.
      then: The count is two affected PRs and optionally two affected Repositories; five refers to checks and is not labeled as a PR count.
    unknown_draft:
      given: A complete open-PR collection contains one PR whose draft flag is unavailable.
      when: Open PR and draft-subset counts are shown.
      then: The open PR can contribute to the open count, while the draft subset retains uncertainty rather than treating the missing flag as false.
    partial_thread_collection:
      given: An open PR has one confirmed unresolved thread and other thread observations are missing.
      when: Review-thread attention is shown.
      then: The positive observed thread and affected PR can be identified with incomplete coverage; a complete thread total or absence is not asserted.
    unknown_blocker_state:
      given: An open Issue has an explicitly linked blocker whose lifecycle is unavailable.
      when: Blocked-Issue attention is evaluated.
      then: The Issue is not asserted blocked or unblocked solely from the link and the missing state remains visible in coverage.
    closure_reason:
      given: An Issue closure occurred in the selected period but its reason at that event is unknown.
      when: Outcomes are grouped by reason.
      then: The closure is attributed to the unknown-reason portion and is not counted as confirmed completed.
    graph_without_history:
      given: Today's open PR count is known but no supported observations or reconstruction exist for the preceding three days.
      when: A daily open-PR graph is requested.
      then: Earlier days are gaps and today's count is not copied backward or turned into zeroes.
    timeout_and_special_outcome:
      given: One open PR has a current timed-out check and another has a current action-required outcome, both with sufficient context.
      when: The Project's failure-category PR count is displayed under the proposed 0061 mapping.
      then: The timed-out PR contributes once without being called a failed test; the action-required outcome remains discoverable as special and is not described as healthy solely because it does not contribute to this count.
  unresolved:
  - Verified GitHub source mapping and semantics for outstanding review requests, blocking links, check revision and historical closure reasons.
  - Selected period presets, graph buckets, retention and historical membership basis for each displayed series.
  - Exact uncertainty presentation, accessibility and initial visual placement; optional checks-and-review predicate remains unselected.
  - Which retained observations and source evidence can support historical dynamic-Today breakdowns or exact same-day outcome counts are not established.
