id: GITVIEW-SPEC-0054
title: GitView - Required Issue and PR description workflow
kind: spec
created_at: '2026-11-14T15:13:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0010
depends_on:
- GITVIEW-SPEC-0008
- GITVIEW-SPEC-0009
sources:
  parent: docs/drafts/GITVIEW-SPEC-0010.yaml
  agreed_formats: docs/drafts/github-templates/README.md
  mandatory_format: conversation:gitview/excerpt-37
  format_agreement: conversation:gitview/excerpt-38
  autonomy: conversation:gitview/excerpt-77
acceptance:
- The participating repository process requires the agreed Issue and PR description sections for new objects, including supported agent and non-web creation paths.
- A template or agent instruction alone is not evidence that the required sections were supplied or that every creation path is enforced.
- Structural conformance does not establish that an authored motivation, outcome or validation claim is true.
- GitView continues to display permitted legacy or external objects with missing or different sections without fabricating content.
specification:
  objective: Preserve the owner's mandatory structured-description requirement while distinguishing the authoring process from GitView's read-only overview.
  ontology_refs:
  - gitview:Issue
  - gitview:PullRequest
  contract:
    format: A participating Issue description requires Problem, Motivation, Expected outcome and References. A participating PR description requires those sections plus Changes and Validation. The format specifies authored statements, not an inferred actor motive or verified CI result.
    participation: The requirement applies to the repositories and authoring paths selected for the participating process. Which repositories participate and who configures each path remain deployment decisions; this draft does not claim authority over third-party repositories or existing external objects.
    creation_paths: A participating process must account for each supported way that a person or agent creates an Issue or PR, including paths that do not display a repository's web template. A prefilled template is a prompt, not proof that mandatory content was supplied or checked. An agent instruction is likewise a process input, not an automatic guard against nonconforming creation.
    enforcement_boundary: The process must be able to distinguish a conforming new description from an incomplete or unverified one using an agreed rule. Candidate 0090 proposes a declared checkpoint and evidence of path coverage. Whether a particular source mechanism can prevent creation, require correction afterward or enforce another stage remains unresolved and must not be represented as already guaranteed by GitView or by the mere presence of a template. Exact semantic content and exception handling require refinement.
    read_only: GitView reads available source descriptions under 0034 and 0051. Missing, unstructured or externally authored descriptions remain visible with their original text and uncertainty; the product does not rewrite an Issue or PR, infer a missing section, or suppress an object because authoring process compliance is unknown.
    claims: A present section is an authored assertion. No structural check establishes its truth, makes the description's author the actor of every change, or substitutes for an observed review, CI result or accepted outcome.
    provenance: The owner explicitly requested a mandatory format and accepted the section sets. Scope of participation, mechanisms and practical handling of exceptions are not established by that decision.
  scenarios:
    non_web_creation:
      given: An agent creates a PR through a supported non-web path in a participating repository.
      when: The process evaluates its new description.
      then: The same agreed required sections apply; the absence of an automatically inserted web template is not treated as compliance.
    legacy_unstructured:
      given: An existing external Issue has an unstructured description and no Motivation heading.
      when: GitView displays it.
      then: The original body remains available and no Motivation is fabricated; unknown conformance does not hide the Issue.
    structurally_present_but_unverified:
      given: A new participating PR contains all required headings and a Validation claim.
      when: Its structure and GitHub checks are reviewed.
      then: Headings alone do not establish that the claim is true or that CI passed; observed CI is represented separately.
  unresolved:
  - Participating repositories and supported creation paths; these must be selected before any installation or deployment.
  - Exact conformance rules for empty or placeholder sections, permitted exceptions, edits and the required enforcement point for each path.
  - Source capability and proof that the chosen mechanism actually covers each participating path; no deployment has been performed.
