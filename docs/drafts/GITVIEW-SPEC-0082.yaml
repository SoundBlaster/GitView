depends_on:
- GITVIEW-SPEC-0024
- GITVIEW-SPEC-0036
- GITVIEW-SPEC-0038
- GITVIEW-SPEC-0045
- GITVIEW-SPEC-0052
sources:
  parent: docs/drafts/GITVIEW-SPEC-0025.yaml
