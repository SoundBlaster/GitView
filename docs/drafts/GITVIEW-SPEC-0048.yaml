  trigger_intent: conversation:gitview/excerpt-63
  autonomy: conversation:gitview/excerpt-77
acceptance:
- The operator can request refresh using pull-to-refresh where appropriate or an equivalent accessible action for the current view.
- Available permitted saved data can be shown while a refresh is requested or in progress.
- Stale data can be refreshed when opening a relevant scope, and background refresh is opportunistic under iOS scheduling rather than a guaranteed interval.
- Success, partial progress and failure apply only to their actual observation scope and remain distinguishable in the affected view.
- A request deferred before it starts is distinguishable from a completed refresh and a source failure.
specification:
  objective: Specify user-visible refresh triggers and outcomes independently of endpoint selection and numerical API budgets.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    manual: An explicit operator action requests refresh for the currently described view or selected scope. Pull-to-refresh is appropriate where it fits; an equivalent accessible action is available when it does not. Triggering a request does not itself imply completion or success.
    foreground: When a view with previously saved observations opens, permitted saved content can be displayed without waiting for a network response. If its scope is considered stale, the app requests a bounded refresh when conditions and available budget allow; the actual staleness policy and prioritization require further definition.
    background: The app may request or use an iOS-granted background opportunity for bounded refresh. iOS controls whether and when it runs; absence of a background opportunity is not reported as a successful update or as an application failure.
    deferred: When a manual or foreground request cannot start because of a known budget or execution constraint, the affected scope remains identifiable as deferred or pending with a recoverable reason where available. No new source success time, confirmed empty result or fabricated GitHub failure is recorded merely because no source request was attempted. When the constraint is lifted, the request may be retried under the applicable scheduling policy; exact retry timing is not guaranteed.
    scope: A refresh identifies which Repository or Project members, object categories and applicable time range it attempts. A successful update for one category or member does not advance the success time or completeness of another. Outcomes and last-success times follow 0044.
    navigation_during_refresh: Capture the requested scope when an operator initiates refresh. Navigating to another Project, changing period or changing filters does not relabel the in-flight request as belonging to the new view. Its eventual permitted observations and outcome remain associated with the original scope; the new view presents only its own applicable state. Source access changes follow 0036 and 0037.
    membership_during_refresh: A saved membership edit changes the Project's current scope but does not retroactively alter an in-flight request's captured scope. Its accepted per-Repository observations may be reused under their own identity, access and coverage rules; a response for the former member set is not by itself a complete refresh of the new set. An unsaved or cancelled edit does not change the saved membership used for the current claim.
    partial_or_failure: Successfully observed facts from an incomplete operation can be retained with their own observation time, while coverage remains partial. A failed operation shows a visible indication in the affected scope and preserves previously accepted data and last complete observation time. A first failure remains an unobserved scope with error, not a confirmed empty collection.
    expired_background: If an iOS-granted background opportunity expires after some facts are accepted but before the requested scope is sufficiently covered, preserve accepted facts with their own times, mark the affected scope incomplete and do not report the entire scope as successfully refreshed. An expiration before any accepted facts leaves prior observations and their successful times intact; it is distinct from proving a GitHub error. Actual system delivery and timing require device evidence.
    concurrent: If another refresh is already active, the app may coalesce or schedule the request, but it must not lose the operator's requested scope or report success before the relevant work has an observable outcome. Conflicting results and access changes follow 0037; exact scheduling and duplicate-request strategy remain open.
    coalesced_coverage: A shared refresh may satisfy a request only to the extent that its actual covered scope includes that request's required inputs. A shared success for PRs cannot complete a request for both PRs and Issues, and a partial response does not become complete merely because several triggers share it. Requests can have distinct outcomes while reusing accepted facts.
    feedback: The operator can discover whether the relevant scope is loading, complete, incomplete or failed and see the applicable last successful observation time when available. UI placement and animation are not prescribed.
    conflict_recovery: When a scope contains an unresolved observation conflict, the operator can discover the affected scope and uncertainty and request a refresh where access and scheduling permit. A queued retry, a received response and resolution of the conflict are distinct outcomes. Even a successful source response does not establish resolution or a new complete-scope observation when the requirements of 0053 and 0044 remain unsatisfied. Previously accepted permitted values and their own observation context can remain available as last known. An explicit access denial requires the access recovery path in 0036 and does not permit disclosure merely to explain the conflict.
    boundaries: Do not specify an exact GitHub endpoint, page size, request count, numerical polling frequency or iOS execution guarantee here. Exact source mapping, budget and scheduling are later technical work.
    provenance: Background opportunities, refresh on stale open and manual refresh follow the owner's discussion; scope and outcome behavior are agent-authored refinements.
  scenarios:
    manual_offline:
      given: A Project has permitted saved PR observations with an earlier successful observation time and the device is offline.
      when: The operator requests refresh for that Project.
      then: Saved data and its successful time remain available and a visible failure describes the affected scope.
    first_load_failed:
      given: A Repository's Issue collection has never been observed.
      when: The first requested refresh fails.
      then: The collection remains unobserved with a failure and is not displayed as a confirmed empty list.
    background_not_granted:
      given: iOS does not grant a background refresh opportunity before the next app opening.
      when: The app displays previously saved data.
      then: Its actual observation time remains visible or discoverable and no background success is invented.
    simultaneous_scopes:
      given: The PR and Issue categories have separate prior successful observations.
      when: Issue refresh succeeds and PR refresh fails.
      then: Issue data receives its own result and time while PR data retains its prior time and visible failure.
    manual_deferred:
      given: A user requests a Project refresh but the current source budget does not allow a request to start.
      when: The Project remains visible.
      then: Existing permitted data and its observation time remain available, the pending or deferred state and relevant constraint are discoverable, and no GitHub failure or new success is invented.
    navigate_while_refreshing:
      given: A refresh is requested for Project P and remains in flight while the operator opens Project Q.
      when: The refresh for P completes.
      then: Its accepted result and outcome remain scoped to P; Q is not marked refreshed solely because it is currently visible.
    membership_saved_while_refreshing:
      given: A Project refresh was requested for saved members A and B, and an edit replacing B with C is saved while it runs.
      when: The request for A and B completes without covering C.
      then: The request retains its original scope, the current Project is not reported fully refreshed for A and C, and permitted observations of A remain eligible for reuse with their own times and coverage.
    background_expires:
      given: An iOS-granted background refresh accepted one page but has not covered the remaining pages.
      when: The granted execution opportunity expires.
      then: The accepted facts retain their own observation context and the requested scope remains incomplete without inventing a GitHub error or a new complete-scope time.
    coalesced_subset:
      given: A manual request covers PRs and Issues while an existing refresh covers only PRs.
      when: The PR refresh completes successfully and Issue data is still unobserved.
      then: The PR result may satisfy that portion but the combined request is not reported as fully successful or complete.
    retry_does_not_prove_resolution:
      given: A Project has an unresolved PR state conflict, a permitted last-known value and an earlier complete-scope observation time.
      when: The operator requests refresh and a source response arrives successfully but cannot be ordered against all conflicting observations.
      then: The affected scope and uncertainty remain discoverable, the permitted value remains last known with its own context, and the response alone does not advance the complete-scope time or declare the conflict resolved.
  unresolved:
  - Staleness classification and policies when refresh is deferred by source budget or platform constraints.
  - Exact scheduling and coalescing behavior for overlapping requests, including user-visible pending state.
  - Device evidence for background execution and accessible manual refresh controls.
