acceptance:
- The operator can request refresh using pull-to-refresh where appropriate or an equivalent accessible action for the current view.
- Available permitted saved data can be shown while a refresh is requested or in progress.
- Stale data can be refreshed when opening a relevant scope, and background refresh is opportunistic under iOS scheduling rather than a guaranteed interval.
- Success, partial progress and failure apply only to their actual observation scope and remain distinguishable in the affected view.
- A request deferred before it starts is distinguishable from a completed refresh and a source failure.
specification:
  objective: Specify user-visible refresh triggers and outcomes independently of endpoint selection and numerical API budgets.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    manual: An explicit operator action requests refresh for the currently described view or selected scope. Pull-to-refresh is appropriate where it fits; an equivalent accessible action is available when it does not. Triggering a request does not itself imply completion or success.
    foreground: When a view with previously saved observations opens, permitted saved content can be displayed without waiting for a network response. If its scope is considered stale, the app requests a bounded refresh when conditions and available budget allow; the actual staleness policy and prioritization require further definition.
    background: The app may request or use an iOS-granted background opportunity for bounded refresh. iOS controls whether and when it runs; absence of a background opportunity is not reported as a successful update or as an application failure.
    deferred: When a manual or foreground request cannot start because of a known budget or execution constraint, the affected scope remains identifiable as deferred or pending with a recoverable reason where available. No new source success time, confirmed empty result or fabricated GitHub failure is recorded merely because no source request was attempted. When the constraint is lifted, the request may be retried under the applicable scheduling policy; exact retry timing is not guaranteed.
    storage_unavailable: Under the working policy of 0105, a manual refresh can still be attempted transiently when local admission cannot be durably confirmed, if source access and execution permit. Its accepted facts and result are session-scoped unless their independent retention is established; make the storage limitation discoverable. Do not claim crash recovery or durable attempt history, and do not turn a local storage problem into a GitHub error. If source execution is also unavailable, use the applicable deferred or source-failure state instead of promising a request.
    local_storage_feedback: If retention or its admission is unavailable, distinguish the affected local save or recovery problem from the source attempt and its result. Where evidence supports a temporary storage contention, insufficient space, protected-data unavailability or an uncertain commit, provide a meaningful permitted explanation and a reachable recovery action appropriate to that condition; an unknown cause remains a general local-storage limitation. Do not expose database codes as the only explanation, assert available disk space or promise retry success without evidence. A source success may be shown transiently with its own time while the affected local save is uncertain or failed, but not as durably saved. A previously accepted value can remain last known only when independently readable and currently permitted. Avoid automatic destructive reset, deletion or reauthentication as a substitute for resolving local storage. Recovery of a pending operation retains its logical identity and follows 0103 and 0113; a button labeled retry does not create a second operation if an earlier effect could still commit. Make the limitation and last supported observation discoverable without relying on color or transient feedback.
    scope: A refresh identifies which Repository or Project members, object categories and applicable time range it attempts. A successful update for one category or member does not advance the success time or completeness of another. Outcomes and last-success times follow 0044.
    today_population: A refresh requested for an unfiltered Today work collection must not equate successful retrieval of only currently open work with complete coverage of Today. Account for the applicable open and same-day creation and outcome alternatives under 0027, or explicitly retain the selection as incomplete when the available source evidence does not establish their union. Reuse compatible saved facts without claiming that they were all refreshed; this requirement does not choose an API, page size or a full historical download.
    navigation_during_refresh: Capture the requested scope when an operator initiates refresh. Navigating to another Project, changing period or changing filters does not relabel the in-flight request as belonging to the new view. Its eventual permitted observations and outcome remain associated with the original scope; the new view presents only its own applicable state. Source access changes follow 0036 and 0037.
    membership_during_refresh: A saved membership edit changes the Project's current scope but does not retroactively alter an in-flight request's captured scope. Its accepted per-Repository observations may be reused under their own identity, access and coverage rules; a response for the former member set is not by itself a complete refresh of the new set. An unsaved or unsubmitted cancelled edit does not itself change the saved membership used for the current claim; an independent confirmed membership change is reconciled separately under 0025 and 0091 rather than ignored.
    old_scope_outcome: A late failure or completion for a former member remains attributable to the request and scope that actually produced it. It may remain discoverable as an earlier operation outcome where permitted, but must not be presented as the current Project's failure, successful coverage or observation time for a Repository that is no longer a member. A still-shared Repository can remain relevant to another Project under that Project's separately established scope. Do not hide a current Project's own incomplete new-member coverage merely because an old request completed.
    partial_or_failure: Successfully observed facts from an incomplete operation can be retained with their own observation time, while coverage remains partial. A failed operation shows a visible indication in its affected scope and does not itself erase independently supported data or advance a complete observation time. Another accepted observation may independently update that scope; retain each operation and observation context under 0026 and 0044. A first failure remains unobserved with an error unless independent observation evidence exists, not a confirmed empty collection.
    expired_background: If an iOS-granted background opportunity expires after some facts are accepted but before the requested scope is sufficiently covered, retain independently confirmed durable facts with their own times and identify incomplete coverage. Facts accepted only in memory are transient and cannot be promised after suspension or process termination. An expiration before any accepted facts does not itself update prior observations or successful times and is distinct from proving a GitHub error. A pending or indeterminate local write is reconciled under 0105 rather than reported as committed or rolled back. Actual system delivery and timing require device evidence.
    system_expiration: Apple's BackgroundTasks documentation describes an expiration handler with limited cleanup time and a completion report to the scheduler. When using that framework, stop or cancel applicable work promptly and complete the platform task according to its API contract; do not assume the handler always runs or provides time to finish a network request, durable write, cleanup or another retry. Local retention and each source attempt keep their independently supported outcomes. A scheduler completion report is not evidence that every requested Project scope was fully observed, and an unsuccessful or expired platform task alone is not a GitHub error. No exact execution duration or schedule is a product guarantee.
    cancellation_and_late_response: A cancellation request or expired execution opportunity is not proof that an in-flight source operation or local write has stopped or has no result. Preserve its attempt identity, scope and unresolved state until independently resolved under 0037 and 0105. If a permitted late response is delivered while processing is still possible, evaluate it against its original scope, identity, ordering and current access; it is not relabeled as a later refresh or as automatically durable. If termination prevents delivery, do not invent a source outcome.
    concurrent: If another refresh is already active, the app may coalesce or schedule the request, but it must not lose the operator's requested scope or report success before the relevant work has an observable outcome. Conflicting results and access changes follow 0037; exact scheduling and duplicate-request strategy remain open.
    coalesced_coverage: A shared refresh may satisfy a request only to the extent that its actual covered scope includes that request's required inputs. A shared success for PRs cannot complete a request for both PRs and Issues, and a partial response does not become complete merely because several triggers share it. Requests can have distinct outcomes while reusing accepted facts.
    feedback: The operator can discover whether the relevant scope is loading, complete, incomplete or failed and see the applicable last successful observation time when available. UI placement and animation are not prescribed.
    conflict_recovery: When a scope contains an unresolved observation conflict, the operator can discover the affected scope and uncertainty and request a refresh where access and scheduling permit. A queued retry, a received response and resolution of the conflict are distinct outcomes. Even a successful source response does not establish resolution or a new complete-scope observation when the requirements of 0053 and 0044 remain unsatisfied. Previously accepted permitted values and their own observation context can remain available as last known. An explicit access denial requires the access recovery path in 0036 and does not permit disclosure merely to explain the conflict.
    boundaries: Do not specify an exact GitHub endpoint, page size, request count, numerical polling frequency or iOS execution guarantee here. Exact source mapping, budget and scheduling are later technical work.
    provenance: Background opportunities, refresh on stale open and manual refresh follow the owner's discussion; scope and outcome behavior are agent-authored refinements.
  scenarios:
    completed_work_not_covered_by_open_list:
      given: A Project's unfiltered Today contains previously observed work and its requested refresh completes only the open-PR source scope, without establishing today's merge or closure population.
      when: The refreshed Project work collection is displayed.
      then: The open-scope result keeps its own time, older eligible permitted observations retain theirs, and the Project-wide Today population remains incomplete rather than being labeled fully refreshed or losing completed work solely because it is absent from the open list.
    removed_member_failure:
      given: A Project refresh starts for A and B, then its saved membership changes to A and C before B's request fails; C has not been observed.
      when: The failure and current Project are shown.
      then: B's failure remains associated with the earlier A-B request, not described as a current A-C member failure; C remains unobserved and A-C completeness or a new complete time is not asserted.
    manual_offline:
      given: A Project has permitted saved PR observations with an earlier successful observation time and the device is offline.
      when: The operator requests refresh for that Project.
      then: Saved data and its successful time remain available and a visible failure describes the affected scope.
    first_load_failed:
      given: A Repository's Issue collection has never been observed.
      when: The first requested refresh fails.
      then: The collection remains unobserved with a failure and is not displayed as a confirmed empty list.
    background_not_granted:
      given: iOS does not grant a background refresh opportunity before the next app opening.
      when: The app displays previously saved data.
      then: Its actual observation time remains visible or discoverable and no background success is invented.
    simultaneous_scopes:
      given: The PR and Issue categories have separate prior successful observations.
      when: Issue refresh succeeds and PR refresh fails.
      then: Issue data receives its own result and time while PR data retains its prior time and visible failure.
    source_success_local_storage_full:
      given: A source response independently establishes permitted PR facts at T2, but the local historical write cannot commit because storage capacity is confirmed insufficient; T1 evidence is independently readable.
      when: The operator views refresh status and history.
      then: Source success at T2 and the local storage limitation are distinguishable; T2 may be shown transiently with its context, the missing durable history point is not asserted saved, and an accessible appropriate recovery route is offered without claiming a GitHub failure.
    pending_commit_while_storage_busy:
      given: A Project refresh has an in-flight local retention operation whose commit is temporarily blocked and whose outcome has not been resolved.
      when: The operator requests retry or inspects its status.
      then: The affected local outcome is pending or uncertain as supported, not reported rolled back or saved; recovery works with the same operation identity and does not create a duplicate effect.
    manual_deferred:
      given: A user requests a Project refresh but the current source budget does not allow a request to start.
      when: The Project remains visible.
      then: Existing permitted data and its observation time remain available, the pending or deferred state and relevant constraint are discoverable, and no GitHub failure or new success is invented.
    manual_without_durable_admission:
      given: The operator can reach a permitted work scope but local storage cannot confirm a refresh admission, while the source can still be contacted.
      when: The operator requests refresh and a permitted source response is obtained.
      then: Applicable transient results can be shown with their own source context and the local durability limitation; the app does not claim the outcome or facts will survive restart unless their own retention is independently established.
    navigate_while_refreshing:
      given: A refresh is requested for Project P and remains in flight while the operator opens Project Q.
      when: The refresh for P completes.
      then: Its accepted result and outcome remain scoped to P; Q is not marked refreshed solely because it is currently visible.
    membership_saved_while_refreshing:
      given: A Project refresh was requested for saved members A and B, and an edit replacing B with C is saved while it runs.
      when: The request for A and B completes without covering C.
      then: The request retains its original scope, the current Project is not reported fully refreshed for A and C, and permitted observations of A remain eligible for reuse with their own times and coverage.
    background_expires:
      given: An iOS-granted background refresh accepted one page, some facts are durably stored and others remain in memory, but the remaining pages are not covered.
      when: The granted execution opportunity expires.
      then: Independently recoverable facts retain their own observation context, memory-only facts are not promised after termination, and the requested scope remains incomplete without inventing a GitHub error or a new complete-scope time.
    expiration_during_pending_write:
      given: A background source response was accepted but its local retention commit has an indeterminate outcome when the system requests expiration.
      when: The process terminates before the commit result is observed.
      then: Recovery reconciles the original retention operation under 0105, without assuming rollback or durable success; the system expiration does not become a GitHub failure or a complete observation.
    late_result_after_expiration:
      given: An expiration handler requested cancellation of a scoped source attempt, but the source response and local outcome are not yet resolved.
      when: A response is delivered while the process still runs.
      then: Any usable permitted facts retain that attempt's identity, scope and timing; cancellation alone does not prove the request failed, and storage and full-coverage claims require their own evidence.
    coalesced_subset:
      given: A manual request covers PRs and Issues while an existing refresh covers only PRs.
      when: The PR refresh completes successfully and Issue data is still unobserved.
      then: The PR result may satisfy that portion but the combined request is not reported as fully successful or complete.
    retry_does_not_prove_resolution:
      given: A Project has an unresolved PR state conflict, a permitted last-known value and an earlier complete-scope observation time.
      when: The operator requests refresh and a source response arrives successfully but cannot be ordered against all conflicting observations.
      then: The affected scope and uncertainty remain discoverable, the permitted value remains last known with its own context, and the response alone does not advance the complete-scope time or declare the conflict resolved.
  unresolved:
  - Staleness classification and policies when refresh is deferred by source budget or platform constraints.
  - Exact scheduling and coalescing behavior for overlapping requests, including user-visible pending state.
  - Device evidence for background execution and accessible manual refresh controls.
