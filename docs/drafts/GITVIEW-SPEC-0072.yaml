acceptance:
- Existing Projects remain individually identifiable and retain a stable relative order across ordinary source refreshes and density changes.
- Returning to the overview restores the same Project as position anchor when it remains available; an unavailable anchor is not silently replaced by a different Project as if it were the same one.
- Adding or removing a Project changes the displayed collection without duplicating, deleting or reidentifying unrelated Projects.
- A Project's position does not reveal a restricted source-derived name or imply a current urgency ranking.
- The collection remains navigable through accessible alternatives and access restrictions take effect even during an interaction.
specification:
  objective: Define a predictable initial Project overview order and identity-based position continuity without prescribing a grid implementation.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  contract:
    initial_order: As an agent-authored first-version default, keep saved Projects in a stable local order independent of GitHub names, organization, status, counts or refresh completion. Prefer the retained insertion order when supported; the order conveys no priority. Manual ordering, alternative sorts and synchronization between devices are not selected.
    durable_order: Preserve the supported local order across restarts when ordering data remains readable. When it is unavailable or inconsistent, keep independently readable Projects accessible in a deterministic local identity-based fallback and do not claim the previous order was restored. A retry, rename, membership edit or source refresh must not itself reidentify a Project.
    creation_sequence_candidate: An insertion-order key or another local ordering representation may be used, but a particular counter, transaction, allocation protocol or globally increasing sequence is not a product requirement. New Projects are appended when the retained order supports it; if ordering metadata is unavailable, a valid Project can still be created and included in the deterministic fallback. Do not duplicate an identity or derive chronology from callback arrival.
    sequence_lineage: A retained or fallback order is local to the current store, not a source event time, priority or cross-device order. A restored older snapshot only supports its own retained order; it does not prove later Projects never existed. Apply access policy before exposing any ordered representation.
    recovery: If ordering metadata is unavailable or inconsistent while Projects are independently readable, show eligible Projects in a deterministic local-identity fallback and make the ordering limitation discoverable. Do not reset Projects, infer an empty collection or prevent an otherwise valid Project creation solely because optional ordering metadata cannot be repaired. Recovery may record a new baseline but must not claim to reconstruct the previous order. If identity or collection completeness is also unavailable, follow 0023.
    return_position: During an active session, opening a Project and returning preserves that Project as the overview position or accessible-focus anchor when it is still present and eligible. The position may move as the viewport or density changes; the anchor is an identity, not a cell coordinate. A cold session follows 0024 and does not require preserving an old scroll position.
    missing_anchor: If the Project was durably deleted, use the next surviving Project from the previous order; if none exists use the previous surviving Project, else begin at the collection's start. Identify the changed context and never treat a fallback as the removed Project. If previous order or current membership cannot be established, expose that uncertainty and use an available recovery route rather than claiming a definitive fallback.
    partial_portfolio_return: If an earlier Project anchor is not present in a partial or unreadable local portfolio read, do not infer it was deleted. Independently readable permitted Projects may remain navigable; any temporary position and incomplete collection status must not claim a definitive successor to the absent anchor. A later valid restoration cannot override an explicit new user position or disclose restricted source-derived information.
    interactions: A source refresh or density change alone does not reorder Projects. During an active gesture or accessibility focus interaction, avoid relocating an otherwise valid anchor due only to a collection update. If the membership change must be presented, maintain a coherent interaction and apply the identity-based fallback; the timing and native transition remain to be validated.
    access: Apply denial and disconnection restrictions immediately under 0036, even if a gesture or transition is active; deferral of a visual rearrangement cannot defer removal of restricted content. A Project remains represented by a permitted neutral identity as required by 0047. Its order is not based on a restricted source-derived name or count.
    provenance: Stable local insertion order and fallback behavior are agent-authored proposals responding to the owner's dense overview and continuity direction, not separately approved choices.
  scenarios:
    refresh_during_return:
      given: The overview contains Projects P, Q and R in that order and the operator opened Q.
      when: Source refresh changes R's attention count and the operator returns.
      then: The relative order remains P, Q, R and Q is the position anchor if still permitted and present; R's changed signal does not become an implicit sort key.
    add_during_session:
      given: P and Q are saved in a supported retained insertion order and a new distinct Project R is confirmed while the overview is active.
      when: The updated collection is presented.
      then: P and Q keep their relative order and R is appended without changing either identity; an active gesture remains coherent.
    deleted_anchor:
      given: P, Q and R were displayed in that order and Q is durably removed while its detail is open.
      when: The operator returns to the overview.
      then: The changed origin is identifiable and R is the fallback anchor; R is not described as Q.
    unreadable_order:
      given: Saved Projects P and Q are independently readable but their ordering metadata is corrupt.
      when: The overview is restored.
      then: Both permitted Projects remain represented in a deterministic local fallback order with an identifiable ordering limitation, without claiming the previous order was restored.
    access_during_gesture:
      given: A Project name derived from a private Repository is visible while the operator is interacting with the overview.
      when: Explicit source access denial is established before that interaction ends.
      then: The restricted name and derived details are no longer exposed under 0036 even if the visual layout change is deferred; the neutral Project representation remains available.
    interrupted_batch:
      given: A confirmed repository batch saved Project P and the result for another selected Repository is unknown.
      when: The application restarts and reconciles that result as a new saved Project Q.
      then: P remains represented once and Q joins the ordering only after its saved identity is confirmed; retries do not create extra Projects or reorder P based on a source response.
    reverse_acknowledgements:
      given: Two new Project creation effects commit in the order P then Q in one continuing store, but Q's acknowledgement arrives before P's and P's acknowledgement is lost.
      when: The operator refreshes the overview and later reconciles P's original operation.
      then: Both saved Projects appear once in a supported stable order; callback arrival is not presented as creation order and replay does not create a second P. Exact relative order may follow the retained order or an identified deterministic fallback.
    metadata_recovery_with_concurrent_creation:
      given: A complete valid Project collection is readable but its old order metadata is inconsistent, and a fallback baseline repair races with creation of a new Project.
      when: Both operations complete under the selected coordinated storage boundary.
      then: Each saved identity has one unambiguous position in the valid retained order or deterministic fallback; the earlier order remains unproven and the limitation is discoverable. A valid creation is not blocked solely because the old ordering metadata was unavailable.
    rolled_back_order_history:
      given: A backup holds P and Q, and the continuing store later adds R; independent evidence establishes restoration of that older backup.
      when: The restored overview displays its saved order.
      then: P and Q may appear in the snapshot's supported order, but that order does not establish that R never existed or preserve R's later sequence; the restore limitation follows 0023 and 0122.
    partial_read_on_return:
      given: The operator opened Q from a portfolio, and on return only P is independently readable while the local collection read is incomplete.
      when: The portfolio is shown.
      then: P may remain navigable, Q is not asserted deleted or replaced by P, and the incomplete local read and recovery route are discoverable.
  unresolved:
  - Native collection update, focus and gesture behavior requires accessibility and device verification.
  - The local order representation and deterministic fallback need provider-specific design; failure of ordering metadata alone must not block otherwise valid Project creation.
  - User-controlled sorting, cross-device order and ordering leakage from pre-existing metadata remain separate privacy and product questions.
