acceptance:
- A first-time operator can discover the next step toward a GitHub-backed Project without an empty portfolio being mistaken for a network error.
- Cancelled or failed authorization and incomplete discovery remain recoverable and do not create a confirmed empty account or Project.
- A selected accessible Repository can be used in a default Project and its observed data remains distinguishable from data still being loaded.
specification:
  objective: Define the operator journey from an empty local Project collection to the first usable Project.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:GitHub
  contract:
    first_entry: When a successful read establishes that no local Project exists, the overview offers an understandable route to connect GitHub or choose repositories; a truly empty collection is distinct from unavailable observations. An unreadable or inconsistent local Project store is not a confirmed empty collection and must not be silently treated as first launch.
    connection: Connection and permissions follow 0019. Cancelling authentication returns control to the setup route without treating it as a completed connection or deleting local data.
    app_installation_setup: Candidate 0099 distinguishes a confirmed identity from accessible GitHub App installations and their Repository grants. First setup offers a user-initiated access-review or installation route when applicable; a completed authorization or browser return does not itself establish installation approval, discoverable Repositories or observed work. Empty and partial source scopes retain their actual meaning without erasing saved Projects.
    selection: After connection the operator can select from discovered accessible repositories. Incomplete or failed discovery is identified as such and permits retry; no selection is not proof that GitHub has no repositories. Pending selection is not yet a saved Project.
    empty_discovery: A sufficiently covered empty discovery result means no Repository matched that specific query and application-access scope at its observation, not that the GitHub account or an organization has no Repositories. Identify an active search restriction when applicable, allow its removal, and offer an appropriate retry or access-review route when supported by the available evidence under 0059 and 0087. A partial or failed discovery is not labeled a confirmed empty result. The operator can leave discovery and return to the saved-Project overview; existing Projects are not erased even if no new Repository can be selected.
    setup_choices: The default setup route creates or reuses one default Project per confirmed eligible Repository under 0045. A separately identifiable custom-Project route may use the same discovery interaction but creates one explicitly reviewed Project under 0025; selecting multiple Repositories in default setup does not implicitly select custom creation. A pending selection retains its associated intent so confirmation cannot silently switch modes.
    default_project: After explicitly confirming a nonempty selection, create one default Project per selected source Repository, with its own local identity and that single member, using the observed repository name as initial Project name. Reconfirming the same selection does not create another default Project for the same source Repository; existing custom Project memberships are unaffected. A Project has at least one member. Multiple repositories may subsequently be combined using 0005; selecting several does not silently create a multi-repository Project.
    cancellation: Cancelling before confirmation discards only the pending selection, preserves previously saved Projects and source observations, and leaves the operator able to resume setup. A failure to save must not report a Project as created unless it is actually saved; retries must preserve successful creations and avoid duplicates.
    rediscovery: A previously selected Repository that is temporarily absent from discovery remains associated with saved Projects; absence from a partial result is not deletion or proof of denied access. Source identity and permission handling follow 0002 and 0019.
    initial_data: The Project can be identified while work observations are loading. Never present an unobserved PR or Issue scope as a confirmed empty list; preserve explicit failure, last-success time and coverage under 0003 and 0019.
    repeat_entry: With existing Projects, use the normal overview and preserve configured membership. Launch restoration is a separate contract in 0024, not an assumption that setup repeats.
    configuration_recovery: If local Project configuration cannot be read or its completeness cannot be established, present a recoverable local-data problem and retain saved data; do not offer an automatic first-run reset or claim that no Projects exist. A retry that successfully reads saved Projects returns to the overview with their identities and memberships intact. This state is distinct from GitHub being offline, disconnected or denying source access.
    partial_batch_on_launch: If an interrupted confirmed selection left some Projects durably saved and other entries unresolved, show the confirmed saved Projects in the normal overview after configuration is readable. Recover the durable operation context and make unresolved entries discoverable under 0045 and 0052 when that context is readable; otherwise expose a local recovery problem. Do not assert that unconfirmed entries succeeded or erase confirmed Projects.
    boundary: Candidate 0098 proposes GitHub App public-client authorization and 0099 refines installation-scoped setup. Exact discovery queries, screen composition and copy remain unspecified; these are agent-authored proposals rather than claims of explicit owner selection.
  scenarios:
    no_matches_in_search:
      given: The active discovery search has complete coverage within its stated app-access scope and matches no Repository, while saved Projects already exist.
      when: The operator views the empty results and clears the search or exits discovery.
      then: The result is identified as no match for that search and scope, not an empty GitHub account; saved Projects remain accessible and the next discovery view uses its own coverage.
    default_and_custom_intents:
      given: Two eligible Repositories are selected through default setup while their default Projects already exist.
      when: The operator confirms that default setup selection.
      then: The existing default associations are reused rather than silently creating a combined Project; a custom Project requires its distinct explicit creation intent and confirmation under 0025.
    cancelled:
      given: No Project is configured and authorization is offered.
      when: The operator cancels authorization.
      then: The setup route remains available and no successful account or empty source is asserted.
    partial_discovery:
      given: A connected source has only partially returned the repository selection.
      when: The operator views available repositories.
      then: Returned repositories are selectable and the list is marked incomplete; failure or retry does not delete selections.
    first_project:
      given: A repository is accessible and selected.
      when: Its default Project is established and its work has not yet been observed.
      then: The Project is identifiable, and its PR and Issue data is shown as unobserved or loading, not confirmed empty.
    multi_selection:
      given: Two distinct accessible repositories are selected and neither has a default Project.
      when: The operator confirms the selection.
      then: Two distinct single-repository Projects are saved, and both are visible; no combined Project is implied.
    interrupted_save:
      given: A multi-selection is being saved and one default Project has been saved before a failure.
      when: The operator retries the same selection.
      then: The already saved default Project is reused and remaining selected repositories can be saved without a duplicate default Project.
    cancel_pending:
      given: The operator has pending repository selections and previously saved Projects.
      when: The operator cancels before confirmation.
      then: No pending Project is saved and existing Projects and observations are preserved.
    unreadable_local_configuration:
      given: Local Project configuration cannot be read at startup and its previous contents are unknown.
      when: The overview opens.
      then: The local-data problem is identifiable and recoverable; the app neither claims no Projects exist nor resets the saved configuration as a first-run default.
    restart_after_partial_selection:
      given: One selected Repository's default Project was durably saved, while another selection's outcome was unresolved when the app stopped.
      when: A new session successfully reads the saved configuration.
      then: The confirmed Project is available in the overview; any recoverable pending outcome remains distinct from a confirmed failure or success under 0052.
  unresolved:
  - Empty discovery and permission recovery details depend on source-access and Project-lifecycle refinement.
  - Default Project association after membership editing and deletion is proposed in 0025 and still requires domain review.
  - Per-entry confirmation, partial saves and cancellation recovery are proposed in 0045; in-flight persistence reconciliation remains open.
