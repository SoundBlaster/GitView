id: GITVIEW-SPEC-0036
title: GitView - Connection state and restricted observations
kind: spec
created_at: '2026-11-14T13:42:00Z'
status: idea
draft_status: pre_canonical
refines:
- GITVIEW-SPEC-0019
depends_on:
- GITVIEW-SPEC-0002
- GITVIEW-SPEC-0003
sources:
  parent: docs/drafts/GITVIEW-SPEC-0019.yaml
  observations: docs/drafts/GITVIEW-SPEC-0003.yaml
  autonomy: conversation:gitview/excerpt-77
acceptance:
- Temporary connectivity failure, explicit authorization denial and deliberate local disconnection have distinguishable effects on access to prior observations.
- Explicit denial or disconnection prevents restricted private cached content from being displayed while retaining the local records until an explicit clear operation.
- A source 404 or an incomplete discovery result alone is not treated as a confirmed deletion or revocation.
- Reconnection does not silently change the identity of existing Projects or treat a different source identity as proof of restored access.
specification:
  objective: Describe how connection and source access affect visibility and recovery of stored observations without choosing an authorization implementation.
  ontology_refs:
  - gitview:User
  - gitview:GitHub
  - gitview:Repository
  - gitview:Project
  contract:
    scope: The initial product slice concerns one connected source identity. The GitView User is its operator and is not inferred to be the author or reviewer of a particular PR.
    no_account: An unconnected state provides a route to connect and is not evidence that GitHub contains no repositories. Cancellation leaves connection incomplete and preserves existing local Projects and observations.
    network_failure: A temporary network or rate failure does not itself establish a new restriction or repository deletion. Previously permitted cached observations may remain eligible with their own observation time, coverage and scoped refresh failure under 0003 when the applicable account and restriction context remains sufficiently supported. An independently known denial, disconnect or indeterminate restriction context continues to govern affected private content.
    offline_after_restart: As an agent-authored working policy, after restart previously permitted cached observations remain eligible offline when the last confirmed local account context and relevant saved access restrictions are sufficiently readable and consistent, and no applicable durable denial, disconnect or unresolved access-changing operation is known. A locked or locally expired credential alone need not hide that content when the earlier account binding and absence of an unresolved replacement are independently supported. Show the prior observation time and that current access has not been reverified; do not present last-known evidence as a current grant. If the account or relevant restriction state is unreadable, inconsistent or known indeterminate, restrict only the affected private scope until recovery. This policy accepts that an event known only in a terminated process may be absent from durable evidence; it is not a guarantee that no such event occurred.
    missing_credential_cache_policy: Under the same working offline policy, a confirmed missing secure credential makes the current connection unusable, but alone is not an explicit source denial, local disconnect, evidence of an older restore or proof that prior permitted observations are false. If the historical account association, relevant restriction records and absence of an unresolved access-changing operation are independently recoverable and consistent, affected cached observations may remain eligible as last known, with connection recovery and unverified current source access made discoverable. This historical association is not a usable current binding and cannot authorize an authenticated request. If any prerequisite is unreadable, inconsistent or indeterminate, or a later applicable restriction or rollback is established, withhold the affected private content according to its actual context. Do not imply the missing item has been recovered or that a backup contains the latest access changes.
    known_restored_rollback: If independent reliable evidence establishes that the local snapshot predates a subsequent restriction, disconnect or other relevant access change, do not treat the older apparently consistent binding as current authority. Restrict the affected scope and pending work until the applicable recovery and post-restriction source evidence are established. A missing credential alone is not proof of rollback. If no independent evidence identifies a restored older snapshot, this offline policy cannot rule out later actions missing from it; last-known content may remain eligible with its original observation time and no claim of current access.
    explicit_denial: An explicit authentication or authorization denial is distinct from offline. Under the working private-cache policy from 0019, restrict display of affected private observations and their sensitive derived details until applicable post-restriction evidence supports disclosure under 0112. An explicit clear may remove retained records but does not itself restore source access. The denial is not represented as an empty collection.
    source_404: A 404 alone does not prove deletion or access revocation and does not erase Repository identity, Project membership or previously saved observations. It leaves current source state uncertain; access to cached private content remains subject to the other applicable access evidence, not to a fabricated confirmed denial.
    ambiguous_status: Interpret source errors using the applicable operation, response evidence and connection context. An HTTP status alone is not a universal reason classifier; for example GitHub may return 403 for a rate limit as well as other failures. Do not report a confirmed repository-level denial, deletion or empty result without sufficient evidence. The particular source mapping remains to be specified.
    disconnect: A deliberate local disconnect stops new refresh for that identity, restricts private cached content and attempts local credential removal. Removal is confirmed only when established; an unsuccessful or uncertain result remains a recoverable local-security problem under 0058. Records remain until an explicit clear operation; source Repositories and unrelated local Project memberships are not removed.
    reconnect: Successful reconnection identifies the source identity but does not alone establish access to every Repository, category, object or field. Under 0112, applicable post-restriction evidence can restore the specific facts and scopes it supports; a successful Repository metadata read is not by itself permission to display earlier PRs, Issues, checks or derived historical metrics. A different identity or a connection with only partial access does not automatically unlock prior private observations, and a pre-restriction response arriving late cannot restore them merely by arriving after reconnection.
    discovery: Partial discovery records its incomplete scope and does not treat unreturned repositories as deleted or denied. Complete-discovery interpretation is subject to source and permission rules that remain to be specified.
    provenance: Offline behavior and visible update failure follow the owner's direction; private-cache restriction, local disconnect and restoration policy are agent-authored working decisions.
  scenarios:
    offline:
      given: A previously permitted private Repository has saved observations, its applicable account and restriction context remains readable and consistent, and no independently established restriction or pending access change applies.
      when: A refresh fails due to network unavailability.
      then: Previously permitted data can remain visible with the last-success time and a visible failure, without claiming current source access was reverified.
    explicit_denial:
      given: A private Repository has saved observations.
      when: The source explicitly denies access to that Repository.
      then: Affected private data is not displayed, the problem is visible and the saved records and Project membership are not silently erased.
    different_identity:
      given: A local disconnect restricted previously observed private data for source identity A.
      when: A different source identity B connects.
      then: B's connection alone does not automatically unlock A's prior restricted private observations.
    partial_reconnect_after_late_response:
      given: Private PR and Issue observations were restricted after an explicit denial, an earlier background request remains unresolved, and the same account reconnects with a new successful Repository-name observation only.
      when: The old request delivers a PR response after reconnection and the operator opens the Project.
      then: The newly supported Repository name may be presented where permitted; the earlier PR response does not independently lift the restriction, and older PR, Issue and derived metric facts remain restricted or unknown until separately supported under 0112. The Project is not represented as empty merely because those facts cannot be shown.
    not_found:
      given: A saved Repository is referenced by an old source address.
      when: A source request returns 404.
      then: GitView records an uncertain source result and retains the Repository and membership instead of asserting deletion.
    restart_offline_known_binding:
      given: A terminated process left a readable consistent last confirmed account and previously permitted private observations, with no applicable durable denial or unresolved access-changing operation, and GitView is now offline.
      when: The operator opens the Project.
      then: Eligible last-known data can appear with its own observation time and unverified current access; a local credential that cannot currently be read does not itself establish denial or a new successful refresh.
    restart_known_pending_disconnect:
      given: A previously permitted private Repository has a durable record of a disconnect or access-changing operation whose outcome is not yet resolved.
      when: GitView restarts offline.
      then: The affected private scope remains restricted pending recovery while independently permitted unrelated data may remain available; the app does not assert that disconnect succeeded or failed without evidence.
    restart_missing_credential_but_recoverable_context:
      given: After restart a previously confirmed account association and its restriction records are consistently readable, no applicable denial or unresolved access-changing operation is known, and the corresponding secure credential slot is confirmed missing.
      when: The operator opens previously permitted private observations.
      then: They may be shown as last-known data with their own observation times and unverified current access; connection recovery is available and no authenticated refresh is claimed usable. A missing slot alone is not labeled a source denial or a proven rollback.
    missing_credential_and_unreadable_restriction:
      given: The saved account association is readable and the secure credential is confirmed missing, but the applicable private restriction or disconnect state cannot be recovered consistently.
      when: The operator opens the affected Project.
      then: The affected private content remains withheld pending recovery rather than assuming that no denial occurred; the local Project is not presented as deleted or an empty source.
  unresolved:
  - Distinguish source signals that prove an explicit repository-level denial from ambiguous HTTP or API failures.
  - Concurrent refresh and revocation ordering, exact authorization flow and secure credential lifecycle.
  - Explicit clear-data UX, retention scope and behavior after device migration.
