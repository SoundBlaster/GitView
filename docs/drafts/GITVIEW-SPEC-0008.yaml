specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Present the selected PR properties for rapid review and source navigation.
  ontology_refs:
  - gitview:PullRequest
  - gitview:Repository
  - gitview:ReviewThread
  - gitview:CIStatus
  requirements:
  - Present source ID and repository-local number, title, description and source URL when available.
  - Keep lifecycle and draft flag distinct; include labels, target repository, source and target branches,
    observed revision, author, requested reviewers and linked Issues.
  - Show the source review assessment and counts of total and unresolved review threads separately.
  - 'Show CI counts and change counts: additions, deletions, changed files and commits; preserve creation,
    update, closure or merge and observation times and observation source when available.'
  - Do not include diff, thread content, logs or commit-by-commit browsing in this scope; open the source
    for detail.
  review_scenarios:
  - Given an open draft PR with a failed check and unresolved threads, its draft, CI and thread indicators
    remain distinct.
  - Given unavailable thread count, do not present it as zero.
  unresolved:
  - Exact field layout and truncation; source mapping and availability.
  pilot_scenarios:
    pr_context:
      given: Repositories R1 and R2 both have PR 42.
      when: The operator opens PR 42 from R2.
      then: The overview and GitHub link refer to R2 and preserve its own status and metrics.
    unavailable_review:
      given: A PR has unknown review status and known failed CI.
      when: Its overview opens.
      then: Review remains unknown and the failed CI remains independently visible.
acceptance:
- A PR overview retains its confirmed object and Repository context and exposes the agreed field set when supported and permitted. Unavailable fields and source links remain unavailable or last known with their context; do not substitute another object.
- Separate open/closed/merged from draft, review decision, thread counts and check counts; missing values
  are not zero or approval.
- Expose supported permitted changed-line, changed-file and commit counts with their observation context; unavailable counts are not zero. Do not embed diff, file, commit or run detail.
- Read authored Problem, Motivation, Expected outcome, Changes, Validation and References as authored
  text when present and permitted; offer source and share actions when an eligible link is available under 0033.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
