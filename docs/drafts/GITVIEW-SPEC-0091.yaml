acceptance:
- An active work collection distinguishes Project-wide intent from an explicitly selected Repository scope even when the Project initially has one member.
- A confirmed membership change updates Project-wide selection against the new member set without silently changing the operator's filter, period or Project identity.
- An explicitly selected Repository is not silently replaced or widened when membership changes.
- Pending, failed or indeterminate edits do not become a confirmed new scope; coverage of the previous set is not presented as complete for an unobserved new member.
- An open permitted preview or object retains its identity; return follows the valid origin or reports an invalid or uncertain origin rather than substituting another Project.
- Route, membership and access changes preserve privacy and accessible recovery independently of display density.
specification:
  objective: Preserve the operator's work-scope intent and actual navigation origin when a local Project gains or loses member Repositories.
  ontology_refs:
  - gitview:User
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  contract:
    project_wide_intent: Under the agent-authored direct-entry candidate in 0074, ordinary entry to a Project opens its work collection directly with Project-wide intent for one or several confirmed members. This does not silently turn it into a permanently Repository-specific selection. The Project and source Repository remain distinguishable; the multi-member entry choice remains open.
    multi_member_project_wide: Under that candidate, a multi-member Project opens its all-members work route directly under 0074, independently of an attention signal. Its scope is the confirmed current Project membership, not an arbitrary Repository chosen from it; explicit Repository entry remains separately available. Period and filters follow the actual route, and unknown member work makes relevant coverage incomplete rather than empty.
    explicit_repository: When the operator explicitly opens a member Repository's work, its scope is that Repository within the originating Project, even if it currently happens to be the Project's only member. A later addition to the Project does not silently widen this explicitly chosen Repository scope. Density changes, refresh and source rename with confirmed identity do not change the scope intent.
    pending_edit: A pending or unsubmitted cancelled edit, a save confirmed not to have committed, or source discovery alone does not apply that operation's proposed membership. An independent confirmed edit or deletion can nevertheless change the actual current configuration; reconcile it under 0025 and 0082 and update the route according to that supported outcome rather than freezing or restoring an earlier snapshot. If a submitted edit's durable result is indeterminate, do not assert either the old or proposed membership as confirmed current unless reconciliation establishes the applicable state; show local configuration uncertainty before claiming a complete selection.
    expansion: When a Project-wide collection has confirmed membership A and a saved edit adds B, reevaluate the Project-wide scope as A and B without navigating to a different Project or silently clearing period, explicit filters or density. A prior complete observation for A does not establish B's data or complete coverage for A and B. A remains eligible under its own access and observation context; B is unknown or incomplete until supported evidence exists.
    contraction: When a saved edit removes B while A remains, a Project-wide collection reevaluates against the confirmed current member set. The change of local scope is not source deletion and must not erase B's observations needed elsewhere or alter another Project. An explicitly selected B scope that no longer belongs to the origin Project is not silently switched to A or another Project; use the changed-origin route under 0024.
    sole_member_replacement: When one confirmed edit replaces the sole member A of a surviving Project P with B under 0025, an existing Project-wide work route reevaluates its scope as B under the same P, period, filters and density; supported A observations retain their own old scope and do not prove anything about B's coverage. If that route has an open permitted A object or preview, it remains bound to that object while open; return or dismissal explains the changed origin and uses a valid P collection or safe recovery under 0024 rather than identifying B's object as A's. An explicitly A-scoped route is no longer a valid member route and must not silently change to B. Neither route switches to another Project containing A or asserts that A, its work or GitHub data were deleted. Unknown, failed or indeterminate replacement follows pending_edit rather than the confirmed rule.
    current_signal: If a current Project signal was calculated for an earlier member set and the operator opens it after membership changed, retain the signal's condition and original observation context. Evaluate the destination against the confirmed current Project-wide scope or explicitly expose that its scope cannot yet be established; do not label the old result as a complete current count for the new member set. A historical signal with an explicitly captured membership basis follows 0056 rather than silently adopting current membership.
    restoration_is_not_navigation: Access restoration may change which member facts can be projected but does not by itself push, replace or pop the active Project route. Preserve its actual origin and valid navigation state; apply fresh membership and work evidence only under its own context and access. A neutral route remains a valid retained origin where supported, while an explicitly chosen eligible destination or a later fresh entry may use the then-current disclosed membership rule. In particular, a newly visible Repository name does not establish work coverage or force a multi-member screen. A later explicit denial immediately restricts affected content and can require a safe fallback without pretending the denied member or Project was deleted.
    actual_route: Preserve the actual in-session origin when returning. A collection entered directly through a formerly single-member Project returns to its originating portfolio surface rather than fabricating a member-overview step after expansion. A Repository collection entered through a member overview may return to that same still-valid Project overview after contraction, even if only one member remains; under the direct-entry candidate, a later ordinary fresh Project entry follows 0074's Project-wide route. Exact presentation is a design question, not a requirement for a redundant permanent screen.
    open_object: An already opened permitted preview or PR or Issue remains bound to the same source identity across a membership edit and is not retargeted to a card at the old position. If its originating Repository leaves the Project or the Project is deleted, follow 0024 and 0031 for changed origin on return. Explicit source denial immediately applies 0036; remaining in another Project does not itself restore private access.
    accessibility_and_privacy: Explain a changed or uncertain scope, incomplete coverage and recovery through accessible non-color paths. Do not expose restricted Repository identities, counts or object details to explain a scope change; provide a safe general status where permitted. App-controlled restricted content is not retained merely to preserve an anchor or route.
    verification: Apply 0040 and 0079 to controlled tests for single-to-multi and multi-to-single changes, explicit versus Project-wide scope, interrupted edits, direct signal navigation and access denial. Verify native navigation and accessibility separately. These expectations do not choose a data store, screen transition or implementation architecture.
    provenance: One Project can contain several Repositories, and a Repository can belong to several Projects by owner decision. The default Project-wide intent and route handling above are agent-authored proposals based on that model and require native evaluation.
  scenario_scope: Expectations about the initial or later ordinary direct Project-wide entry apply when that agent-authored navigation candidate is selected; retained-origin, access and membership-change expectations apply to the actual route used.
  scenarios:
    replace_sole_member_with_object_open:
      given: Project P contains only A, another Project Q also contains A, and an A PR preview was opened from P's Project-wide Today collection with explicit filters and density. B is independently eligible but its work has not been observed.
      when: A reviewed replacement of A with B is durably confirmed while the preview remains permitted and the operator dismisses it.
      then: The preview remains the same A PR until dismissal; the P-wide collection is reevaluated for B with its existing period, filters and density and incomplete B coverage. Return does not substitute a B object for the former A anchor, switch silently to Q, or claim A's GitHub work was deleted. An explicitly A-scoped route instead reports its changed origin rather than becoming B-scoped.
    single_project_gains_member:
      given: Project P has only A and was opened directly to a Project-wide Today collection with an active filter; B has no work observation.
      when: A saved membership edit adds B to P while the collection remains open.
      then: The collection remains in P with the same period, filter and density, its Project-wide scope becomes A and B and its coverage is incomplete for B rather than reusing A-only completeness.
    explicit_member_remains_narrow:
      given: The operator explicitly selected A's Repository work within Project P.
      when: A saved edit adds B to P.
      then: The active work scope remains A until the operator explicitly changes it; B is not silently mixed into the Repository-specific selection.
    removed_selected_member:
      given: P contains A and B, and the operator is viewing B's explicitly selected work.
      when: A saved edit removes B from P while preserving A.
      then: The app identifies that the origin scope changed and offers an available route rather than silently switching to A or a different Project containing B.
    shortcut_return_after_expansion:
      given: P originally contained only A and the operator entered its work directly from the portfolio.
      when: P gains B and the operator returns to the originating surface.
      then: Return goes to the portfolio, not a newly invented member-overview step; the next explicit Project entry follows its then-confirmed membership.
    member_route_after_contraction:
      given: P contained A and B and the operator entered A's work through P's member overview.
      when: B is removed and the operator returns while P and A remain accessible.
      then: The actual origin may be restored as P's valid member overview without substituting an unrelated route; a later fresh P entry opens Project-wide work directly.
    signal_changed_members:
      given: A failed-CI Project signal was observed for members A and B, then P is durably changed to A and C while C is unobserved.
      when: The operator opens the current Project signal.
      then: The failed-CI condition remains identifiable, B is not described as a current P member and the A-C destination is incomplete for C; the old A-B signal context is not mislabeled a complete A-C result.
    failed_edit_with_independent_expansion:
      given: Project P's open Project-wide Today collection has member A. Edit X proposes removing A, while independent edit Y durably adds B and keeps A; X is confirmed not to have committed.
      when: The route reconciles the outcomes and Y's complete saved configuration is readable.
      then: X does not remove A, the current Project-wide scope becomes A and B under Y, existing filters and period remain, and B's unobserved work leaves coverage incomplete rather than restoring the earlier A-only scope as current.
    unreadable_edit_outcome:
      given: A membership edit from A to A and B may have committed, but durable configuration cannot be read or reconciled.
      when: The open Project-wide collection is restored.
      then: Its current membership and dependent complete counts are uncertain rather than asserted to equal either A or A and B, and an accessible recovery path remains.
  unresolved:
  - The default Project-wide intent and transient return to a surviving member overview are agent-authored product choices requiring UX evaluation.
  - Source coverage, local edit coordination and native navigation or focus restoration require independent implementation-level evidence.
  - The exact display of an old signal alongside a changed scope and access limitations remains to be designed.
