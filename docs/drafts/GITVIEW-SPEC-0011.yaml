specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Keep check results, review assessment and review-thread counts independently interpretable.
  ontology_refs:
  - gitview:PullRequest
  - gitview:ReviewThread
  - gitview:CIStatus
  requirements:
  - For the applicable source-supported PR check set, show individual-check counts as red, yellow, green
    and total when evidence suffices. If the current set or revision cannot be established, retain the limitation rather than claim a complete current count.
  - Do not sum workflow runs or historical attempts as independent current checks; retain special or unknown
    cases without pretending all categories sum to total.
  - Show aggregate review assessment and total/unresolved thread counts separately from CI.
  - Do not derive merge readiness from a successful review, zero visible threads, CI color or a single
    glyph alone.
  - Unknown, stale or partial data must not be represented as a confirmed zero or pass.
  review_scenarios:
  - Given a check that later succeeds, its previous failed attempt is not added as a second current check.
  - Given a change request without a corresponding open thread, preserve the change request independently
    of the thread count.
  unresolved:
  - Exact GitHub status mappings, check identity, head revision and retry equivalence require API verification.
  pilot_scenarios:
    retry:
      given: A check failed and source evidence establishes a later successful attempt as the applicable current check for the same logical check and revision.
      when: Current checks are counted.
      then: The failed old attempt is not added as another current check. If equivalence, revision or coverage is unestablished, do not infer a complete current set under 0060.
    review_without_thread:
      given: A source review assessment reports a change request and sufficiently covered thread evidence independently establishes zero unresolved threads.
      when: The review summary is displayed.
      then: The change request and zero known unresolved threads remain separate.
    review_ci_different_observations:
      given: A PR has an earlier permitted approval and successful CI observation for a prior revision. A later observation establishes a new revision and zero unresolved threads but supplies no applicable current approval or CI result.
      when: The operator inspects the PR's compact review and CI signals.
      then: The zero-thread fact retains its own supported context; the old approval and CI remain last known for their earlier context or unavailable rather than becoming current approved-and-clear, current green CI or a merge verdict. No particular dismissal or failure is invented.
acceptance:
- Count current individual PR checks only when the applicable set and revision are supported, not workflow runs or every historical attempt; retain total as a
  separate count from red/yellow/green and expose incomplete or unknown coverage.
- Preserve review assessment, review request and unresolved thread count independently; neither status
  implies the other.
- Pending or unavailable signals do not establish success; special check conclusions are not silently
  counted as green without a defined mapping.
- A complete zero-check result is distinguishable from unobserved checks and is not automatically a merge-ready
  verdict.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
