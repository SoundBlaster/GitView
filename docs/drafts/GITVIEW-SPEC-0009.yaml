specification:
  authority_boundary: Common provenance and evidence boundary follows GITVIEW-SPEC-0001.
  objective: Present the selected Issue properties and relationships without inferring motives.
  ontology_refs:
  - gitview:Issue
  - gitview:Repository
  - gitview:PullRequest
  requirements:
  - Present source ID and repository-local number, title, description, URL, open or closed state, state
    reason, labels and source type when available.
  - Retain repository, author, assignees, milestone and linked PRs, distinguishing a closing link from
    a mention when the source permits.
  - Show parent and direct sub-issues, blocking links, comment and participant counts, direct and closed
    sub-issue counts.
  - Keep creation, update, closure, observation and last-comment times distinct where available.
  - A closed issue is not automatically completed; linked objects do not prove actor motivation.
  review_scenarios:
  - Given an Issue closed with a non-completion reason, show its closure and reason without calling it
    completed.
  - Given a confirmed PR mention, incomplete closing-link coverage and no independently established closing link for that PR, show the supported mention without labeling it a closing link or claiming no closing link exists.
  unresolved:
  - API support and display priorities for individual fields.
  pilot_scenarios:
    linked_pr:
      given: An Issue mentions PR A and has an explicit closing reference to PR B.
      when: Its relationships are shown.
      then: A is a mention and B is a closing reference; no actor motive is inferred.
    unknown_reason:
      given: An Issue is closed but its reason is unavailable.
      when: Its summary is shown.
      then: The state is closed, and completion remains unknown.
acceptance:
- An Issue overview retains its confirmed object and Repository context and presents the selected fields and state reason when supported and permitted. Unavailable fields and source links remain unavailable or last known with their context; do not substitute another object.
- Expose selected labels, type, author, assignees, milestone, related Issues and PRs, discussion and direct-sub-issue
  counts when available.
- Differentiate independently supported closing PR references from mentions; one object may have both meanings. Unknown or incomplete link coverage is not confirmed absence; do not infer motive or actor from the
  link.
- A closed Issue with unknown or non-completion reason is not labeled completed; unknown counts are not
  zero.
acceptance_evidence:
- criterion: The pilot contract and its boundary scenarios are independently checkable.
  evidence: The pilot_scenarios describe expected results for future verification; no app test has run.
