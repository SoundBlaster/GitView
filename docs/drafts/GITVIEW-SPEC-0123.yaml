acceptance:
- A retained field, event or aggregate is recoverable only with the identity, scope and interpretation evidence needed for its own claim.
- Unobserved, supported absence, a supported value and conflicting observations are distinguishable without fabricating zero, empty or current state.
- Reusing context or retrying a local write cannot attach another object's evidence, create another source observation or advance unrelated coverage.
- A separately retained coverage claim, request outcome and metric-history point remain independently interpretable from a current field value.
- Access restrictions, identity ambiguity and history-clear generations remain applicable after recovery and migration.
- The logical model supports controlled verification without implying that a concrete schema, source integration or restart test exists.
specification:
  objective: Define the minimum recoverable associations and value states for local evidence consumed by Today and Project summary.
  ontology_refs:
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  contract:
    scope: This agent-authored logical record contract refines 0105 under the SQLite direction in 0113. The named record responsibilities may be implemented as tables, immutable bundles or another verified representation; they are not new product ontology entities, an implemented schema or an instruction to retain all source payloads.
    identity: Associate a stored claim with a confirmed source instance and typed subject identity, including the Repository where required. A PR, Issue, Repository, source event and local operation occupy distinct identifier domains; retain source ID kind and any independently supported association under 0038 and 0101. A repository-local number or mutable name alone cannot silently become a global identity. A record whose subject cannot be established cannot be relabeled as a confirmed object or used for a definite distinct count.
    repository_reference_candidate: As an agent-authored initial SQLite representation, allocate an opaque local Repository reference only after the applicable source instance and exact REST Repository numeric identity are established under 0080. Store that typed numeric identity as a canonical exact decimal text value, with source instance and identifier kind in its uniqueness scope; never round through a floating-point value. Use a binary, case-sensitive comparison for opaque Node ID text and store each confirmed Node ID as a separately typed association to that local Repository reference with recoverable supporting evidence. An owner/name, URL, local number or display label is an observation, not this reference or a uniqueness key. A Node ID alone, an unresolved source instance, malformed numeric input or an unconfirmed alias is not enough to create a confirmed numeric-identity record; preserve the source evidence separately as unresolved where policy permits. This is a candidate representation and does not authorize accepting out-of-contract source identifiers or define a complete physical schema.
    project_and_work_references: Store Project membership and default associations against the stable local Repository reference, not its mutable address; the same reference can be used in multiple Projects under 0104. Store an identified PR or Issue reference with its source instance, object kind and supported opaque source identity, and bind each fact or event to its actual Repository-association evidence and observation context under 0101. A later source-supported association change must not rewrite an earlier event's scope or transfer membership automatically. No Repository identity, work identity, Project membership, operation receipt or saved observation independently grants current access. A temporarily unresolved source record cannot be turned into a confirmed member or distinct PR by assigning it a local ordering token.
    resolved_work_association: If later supported evidence resolves an earlier work representation to a confirmed object, retain the association's evidence and time separately from the original record's event, observation and retention contexts. Reconcile duplicate representations and any newly comparable conflicts under 0101 and 0053 without fabricating a fresh field observation, reassigning an unrelated Repository or advancing coverage solely from the new association. A persisted association and its required evidence must remain recoverable together or follow an independently verified staged protocol; after a failed or indeterminate save, the UI cannot claim durable resolution until recovery supports it. Apply current disclosure before using or presenting the result.
    alias_commit_and_conflict: Publish a newly confirmed numeric-ID-to-Node-ID or old-to-new Node-ID association together with the source evidence and target reference in the same coordinated durable boundary, or use a separately verified recoverable protocol. Within an instance and identifier kind, one confirmed alias cannot simultaneously point to two distinct confirmed Repository references. If an observed alias is already bound to another numeric identity, either the binding is incomplete, association is conflicted or source evidence is incompatible, preserve the competing evidence and affected membership and report uncertainty under 0053; do not reassign the alias, merge Projects or overwrite existing facts solely to satisfy a constraint. On an indeterminate commit, recover its original operation and association before retrying; a missing acknowledgement is not a confirmed alias. Migration or compaction preserves the exact association and its interpretation or downgrades dependent claims when evidence is unavailable.
    evidence_envelope: For each accepted fact retain or reliably reference its field or event meaning and interpretation version, supported value or semantic absence, observation context, source and subject, applicable source or event instant and precision when supported, relevant revision or ordering witness, captured scope and access context, and limitations needed to interpret it. Optional context may be explicitly unknown, but a missing required association prevents the stronger claim. Preserve event time separately from retrieval and durable-save times; a shared immutable or versioned context is allowed only while its precise association remains recoverable.
    field_state: A known value, including a justified zero or empty collection, and source-supported semantic absence are accepted observations with their own evidence. Not requested, request failure and an error-affected field are attempt outcomes, not replacement values or implicit deletions. If no earlier accepted record can be independently read, the field is unknown or unavailable; if a permitted earlier record exists, it retains its own context. Incompatible observations without sufficient ordering remain a conflict or uncertainty rather than being overwritten by arrival order. Access restriction is a current disclosure decision, not an invented value or permanent proof of future denial.
    event_and_aggregate: An event claim retains its event type, source-supported event identity where available, confirmed subject and event time or explicit time limitation; equal timestamps or text do not prove event identity. An aggregate claim retains its metric and predicate version, unit, scope, reference or period, coverage and disclosure lineage. An aggregate value alone does not identify its constituent objects, establish membership materialization or support subtraction across incompatible contexts. Source facts, derived values and local observations are not interchangeable merely because their numeric values match.
    aggregate_disclosure_lineage: Retain or reliably reference the transitive source-derived evidence scopes needed to establish a derived point under 0064, including its actual source and account context, Repository and category, source or derived input identity and applicable restriction context where known. Link each dependency to the particular claim and derivation meaning; sharing a Project, equal value or common timestamp does not prove identical lineage. An independently source-supported aggregate retains the source semantics and scope it actually establishes rather than inventing constituent identities. Compaction may substitute an independently validated equivalent representation only while the required attribution and current-disclosure checks remain recoverable. If a required dependency is missing or cannot be assessed, downgrade or suppress the affected exact disclosure instead of marking that dependency permitted or treating it as zero. Apply current access after recovery; recorded historical permission is provenance, not present authorization.
    independent_coverage: A coverage record or recoverable equivalent identifies the exact source, account, Repository set, object category, predicate, period, access context, supported reference and evidence for its claim under 0102. Link it only to the observations and retained evidence it actually covers. A persisted field, final page, aggregate or later timestamp does not independently prove full population or advance an unrelated coverage reference. If supporting context becomes unavailable, downgrade the affected claim rather than manufacture a complete scope.
    attempts_and_effects: A source attempt, Project-level refresh request, accepted fact and local retention operation have separate identities and outcomes under 0103 and 0105. Bind each retention effect to its immutable logical operation and actual source observation; replay cannot become a newly initiated observation. If an effect and its required operation evidence cannot be jointly established after interruption, report the outcome as indeterminate. A historical applied receipt does not by itself prove that the fact and its interpretation are still readable.
    sqlite_reference_integrity: If the selected SQLite schema uses foreign keys to protect mandatory evidence associations, the provider must establish that the actual SQLite build supports enforcement and enable and verify it on every participating connection before the relevant transaction begins, including reopened, pooled and migration connections. SQLite documents that changing this setting inside a multi-statement transaction has no effect. An unavailable or unverified enforcement mode cannot be treated as a successful integrity guarantee. A migration or recovery that uses another protocol must independently preserve and validate equivalent references before exposing claims; no assumption is made that enabling enforcement retroactively repairs existing rows.
    sqlite_keys_and_null: Represent mandatory confirmed identity, operation and evidence references so that a missing component cannot satisfy an exact-identity or uniqueness claim. SQLite permits multiple NULLs in UNIQUE constraints and can allow NULL in some PRIMARY KEY definitions; nullable composite foreign keys also do not establish a parent when a component is NULL. Therefore a bare UNIQUE, PRIMARY KEY or foreign key declaration with nullable components is insufficient for these mandatory bindings. Use explicit non-null and consistency constraints or an independently verified equivalent. A source-supported absent value remains distinct from a missing required record association; SQLite NULL or an omitted row alone must not conflate those meanings. Do not infer semantic compatibility merely from two references existing.
    sqlite_value_integrity: A tagged value or absence representation must reject an invalid combination of tag, value and required context before reporting a durable accepted fact. SQLite CHECK expressions that evaluate to NULL do not fail, so their design must explicitly account for NULL and the selected provider's type behavior. Preserve opaque identifier kind and value without lossy numeric conversion, case folding or display-name substitution; validate source-specific range and encoding before treating it as a confirmed identity. The exact types, tags and schema remain open and must be validated against the selected SQLite build and adapters.
    compaction_eligibility: As an agent-authored initial rule, compaction may remove or replace redundant physical evidence only when every retained claim depending on it remains recoverable with the same supported meaning, identity, time, scope, coverage and disclosure lineage, and every potentially replayable or unresolved operation retains enough binding and outcome evidence under 0103. A stored raw payload or duplicate representation is not itself required if its independently validated replacement preserves the required evidence; an original PR or Issue body selected for offline availability remains subject to its own original-text retention contract rather than being replaced by a generated summary. Equal values, timestamps or visible names alone do not establish equivalence. Do not expire an eligible metric-history point solely due to age or silently evict it for capacity under 0066. A shared context cannot be removed merely because one Project or one fact stopped using it while another retained claim still depends on it.
    compacted_operation_evidence: A terminal operation may retain a minimized binding and result instead of a full payload only if that representation still distinguishes compatible redelivery, incompatible reuse and its historical applied or terminal non-applied outcome, and cannot expose restricted data through diagnostics. An indeterminate operation, potentially late effect or clear boundary cannot be discarded or assumed resolved merely because it is old or its originating screen closed. If safe equivalence, writer quiescence or a retention horizon cannot be established, preserve sufficient evidence or return a local limitation; do not treat a later delivery as a new operation. This does not assert that minimal evidence can always be represented without private data.
    compaction_commit: Coordinate a replacement, all affected references and any removal in one verified local consistency boundary, or specify an equivalent recoverable staged protocol under 0113 and 0122. A crash or failed commit cannot expose a claim with a dangling or substituted context; do not declare the compaction completed until its outcome and the retained associations are independently recoverable. An unknown commit result is reconciled under its own operation identity. If retained evidence cannot be verified during recovery, downgrade the affected claim or show a storage limitation rather than inventing a value, source absence or rollback. Apply current access and any history-clear generation while evaluating and committing; compaction cannot reintroduce cleared history or override a newer restriction.
    history_boundary: Current-cache facts and historical retention have independently recoverable outcomes even if physical storage is shared. A history-capable write carries the generation captured for the initiating work and is admitted under 0117; an old replay cannot re-create cleared history. Reconstructing an aggregate from retained inputs requires the same predicate, subject, scope, time and access evidence as a directly retained result. A current cache read is not itself a new historical sample.
    access_and_migration: Reevaluate current disclosure before returning source-derived values, identities or revealing aggregates to any presentation or handoff. A recovered old access context describes provenance, not a fresh permission. Schema migration under 0122 must preserve each claim's identity and interpretation associations and the clear fence; where a required association cannot be validated, return a limited or unavailable claim without attaching another context or deleting unrelated Projects. Do not persist credentials or raw authorization responses as evidence.
    verification: Before declaring the boundary implementation-ready, define physical encoding, constraints, atomic write and read contracts, retention and compaction rules, migration and provider-specific failure mapping. Plan deterministic TDD for same-ID replay, equal-value distinct observations, partial writes, omitted versus empty fields, unordered conflicts, access change, coverage evidence loss and clear races. Verify actual SQLite, interruption, restart, Keychain and source mappings separately; this document does not establish any of those results.
    provenance: Offline observations, metrics and testability follow owner direction. These record associations and evidence states are agent-authored refinements and are not proof of a selected database wrapper or implementation.
  scenarios:
    rename_and_reuse_after_restart:
      given: Projects P and Q reference the same confirmed Repository A by its local reference and source numeric ID; a work fact is bound to A with its own observation context. A later confirmed Repository B uses A's former address with a different numeric ID.
      when: The store is recovered after restart and both source identities are read successfully.
      then: P and Q still reference A and the historical work fact retains A and its original context; B is distinct and receives neither A's membership nor its fact merely because of the shared old address. Current address and access are separately evaluated.
    alias_conflict_during_commit:
      given: A Node ID is already durably associated with Repository A and a new attempted association would bind that same instance, identifier kind and value to different confirmed Repository B without source evidence reconciling them.
      when: The alias update reaches the coordinated commit boundary.
      then: The conflict remains explicit and neither membership nor old observations are reassigned to B; the operation is not called applied unless its supported outcome is durably established.
    unavailable_alias_evidence_after_recovery:
      given: A stored PR fact references Repository Node ID N and a local Repository reference, but after restart the evidence required to connect N to the stored numeric identity cannot be recovered.
      when: The Project work selection is reconstructed.
      then: That association and its dependent claim are limited or unknown instead of inferred from an old owner/name, while independently recoverable membership and unrelated observations retain their own context.
    shared_context_still_referenced:
      given: Two independently retained permitted facts reference the same immutable observation context, and only one fact becomes eligible for replacement.
      when: A compaction pass considers removing the original context.
      then: It preserves the exact context required by the second fact or a verified equivalent association; the second fact does not inherit the replacement's time or become unreadable merely because the first changed.
    replay_after_receipt_compaction:
      given: A confirmed applied local operation has a minimized retained receipt that preserves its immutable intent binding and outcome, and a compatible redelivery is still possible.
      when: That operation is retried after restart.
      then: Recovery identifies the same historical outcome without applying a second effect; an incompatible reuse remains a conflict rather than becoming a new operation.
    interrupted_compaction:
      given: A compaction operation is replacing retained context and its acknowledgement is lost before the effect and references are independently recoverable.
      when: A route asks for a dependent summary after restart.
      then: The original or replacement evidence is used only if independently established, otherwise the affected result remains limited or unavailable; no zero, complete coverage or successful compaction is inferred from the missing acknowledgement.
    compact_then_history_clear:
      given: A valid compacted evidence bundle still supports a history point and work from its original generation can be redelivered.
      when: A later history clear is confirmed and the earlier work is replayed.
      then: The clear generation prevents reintroducing the history point and the compacted operation evidence does not turn the replay into a new observation.
    reference_enforcement_unavailable:
      given: A newly opened storage connection cannot establish that the foreign-key enforcement required by the selected schema is active.
      when: A retention operation attempts to commit a fact with mandatory referenced evidence.
      then: The boundary does not claim the schema's reference guarantee or report the fact durably accepted on that basis; it reports a local limitation or uses an independently verified equivalent protocol.
    null_in_composite_identity:
      given: A proposed retained source-object record is missing one mandatory component of its composite identity, even though a SQLite UNIQUE or foreign-key declaration would permit NULL in that position.
      when: The boundary evaluates it for a confirmed object or distinct count.
      then: The incomplete identity is not admitted as confirmed and no second or matching object is inferred solely from the partial key; its limitation remains explicit.
    missing_tagged_value:
      given: A retention attempt claims a known numeric value but its value payload is absent, and a schema CHECK expression alone would evaluate to NULL.
      when: The boundary validates and attempts to retain the observation.
      then: It does not accept the malformed combination as zero or source-supported absence; any prior independently recoverable fact retains its own context and the new local outcome is not reported as a valid applied fact.
    shared_context_without_relabeling:
      given: A permitted PR title and CI result are retained with separately identified observations at T2 and T1 respectively, and both refer to the same confirmed PR.
      when: The local boundary recovers them for Today and summary.
      then: Title keeps T2 and CI keeps T1; their shared object identity does not make CI current at T2 or establish a simultaneous source snapshot.
    lost_coverage_evidence:
      given: A numeric Project aggregate and its metric context are readable but evidence needed to establish one member's coverage is unavailable after recovery.
      when: The summary requests a complete Project measurement.
      then: The aggregate cannot be reported as complete solely because the number is readable; independently supported permitted values retain their own context and the affected coverage remains limited or unknown.
    empty_versus_missing:
      given: A complete supported observation establishes an Issue assignee collection is empty, while a later attempt does not request that field.
      when: The earlier evidence and later attempt are recovered.
      then: The earlier empty collection retains its supported time and scope, and the later omission neither deletes it nor gives it a new observation time.
    restricted_old_evidence:
      given: A private Repository's old evidence remains readable in local storage after an applicable access denial.
      when: The route requests a summary or candidate input.
      then: Restricted source details and revealing values are not exposed as current presentation; the earlier record does not renew access or establish an empty Repository.
    old_history_generation:
      given: A source observation began under an earlier history generation and a clear was durably confirmed before its retention replay.
      when: The replay reaches historical admission after restart.
      then: It cannot be retagged as post-clear work or recreate the cleared history, while any independently permitted current-cache treatment follows its own rules.
  unresolved:
  - Select physical schema, identifier encoding, evidence-reference constraints, provider and migration paths without losing these associations.
  - Define bounded retention, compaction and privacy-safe lineage for aggregate and operation evidence, including unresolved late delivery.
  - Verify actual source fields, storage failure and restart behavior and real platform protection separately; no product implementation or TDD cycle has run.
