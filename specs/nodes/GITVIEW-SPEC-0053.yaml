id: GITVIEW-SPEC-0053
title: GitView - Conflicting source observations
kind: spec
created_at: '2026-11-16T08:59:00Z'
updated_at: '2026-11-16T08:59:00Z'
status: outlined
refines:
- GITVIEW-SPEC-0037
depends_on:
- GITVIEW-SPEC-0019
- GITVIEW-SPEC-0023
- GITVIEW-SPEC-0026
- GITVIEW-SPEC-0036
- GITVIEW-SPEC-0038
- GITVIEW-SPEC-0044
sources:
  predecessor_draft: docs/drafts/GITVIEW-SPEC-0053.yaml
specification:
  ontology_refs:
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  objective: Preserve the meaning of conflicting observations without treating transport arrival order
    as source freshness.
  authority_boundary: Keeping last-known data and showing failures are owner-selected. Conflict resolution
    rules are agent-authored refinements; source-specific ordering evidence and user-facing presentation
    remain open. No source protocol behavior is established by this node.
  requirements:
    comparability: Compare facts only for the same confirmed object, field and compatible scope; matching
      names or numbers alone do not establish identity or equivalent measurements.
    ordering: When reliable evidence establishes which value is newer for the particular fact and scope,
      a later-arriving older value does not replace the newer accepted value. Request arrival or completion
      order alone is not such evidence. A source revision or time orders only facts it actually covers.
    unresolved: If incompatible values cannot be ordered, represent the affected fact as uncertain or
      conflicted rather than silently declaring a current value or a coherent complete scope. A previously
      accepted saved value remains visible in the applicable disclosure context as last known with its
      supported time when known and an indication of the conflict or limitation. Confirmed private Repository
      revocation does not hide saved data under 0019. Cross-account disclosure remains open. If refresh
      also fails, make the failure discoverable under 0026; absence of a known time or accepted baseline
      does not justify inventing one.
    evidence: Retain enough supported evidence to identify the affected fact and scope, recognize unresolved
      competitors and assess whether a proposed result supersedes them. If evidence is incomplete or lost,
      do not claim resolution; representation and retention of individual values remain open.
    resolution: Resolve a conflict only with source evidence or a separately specified rule establishing
      a value that supersedes all relevant competitors for that fact and scope. A successful retry alone
      does not establish ordering or refresh unrelated fields.
    scope: Preserve independent observations and their own context in unaffected fields and scopes; a
      conflict alone does not change Project membership or another Repository's data. Attribute each observation
      to its supported source instance and request account context; a delayed response under another account
      does not establish the active account's access.
    review_context: A changed PR head revision does not by itself order an omitted review assessment or
      assign it to the new head. Preserve its supported revision or observation context and do not reassign
      it without evidence.
    access: Confirmed private Repository revocation leaves saved values and supported conflict context
      visible as last known, with revocation and known update time under 0019. A late pre-revocation response
      does not itself restore access or become a newly accepted update.
  scenarios:
    older_response: A value with source evidence establishing it as older arrives after a newer accepted
      value for the same fact; the older value does not replace it solely due to arrival order.
    insufficient_resolution: Two conflicting values cannot be ordered. A third is newer than one but cannot
      be compared to the other; the affected fact remains uncertain.
    supported_resolution: A source observation demonstrably supersedes both competing values for the affected
      field; that conflict can resolve without claiming unrelated fields refreshed.
    unrelated_scope: A changed PR head revision does not by itself order an omitted review assessment
      or establish that an unrelated Issue has refreshed.
    revocation: During an unresolved conflict, confirmed access revocation retains saved supported data
      and the conflict indication while preventing an old late response from restoring fresh access.
  open_questions:
  - Source-specific evidence for ordering each relevant fact and partial response.
  - Conflict presentation, representation of competing values and resolution when ordering cannot be established.
  ontology_status: Repository, PullRequest and Issue use the selected ontology vocabulary; an observation
    conflict is a data-quality condition, not a new domain entity.
acceptance:
- Comparable facts do not regress to a source-confirmed older value solely because a response arrived
  later.
- Unordered conflicts remain uncertain and do not fabricate a current value or complete scope.
- Conflict resolution requires evidence covering all relevant competing observations for that fact.
- Unaffected scopes retain their own observation context, and confirmed access revocation preserves supported
  saved data.
