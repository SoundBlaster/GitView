id: GITVIEW-SPEC-0084
title: GitView - Project membership and its evidence
kind: spec
created_at: '2026-11-16T12:37:00Z'
updated_at: '2026-11-16T12:37:00Z'
status: outlined
refines:
- GITVIEW-SPEC-0025
depends_on:
- GITVIEW-SPEC-0002
- GITVIEW-SPEC-0019
- GITVIEW-SPEC-0023
- GITVIEW-SPEC-0038
- GITVIEW-SPEC-0091
sources:
  predecessor_draft: docs/drafts/GITVIEW-SPEC-0084.yaml
  ontology_review: ontology/review/membership-lifecycle-state-evidence.md
specification:
  objective: Keep current Project membership distinct from an intended change and evidence about a particular
    actor's past action.
  authority_boundary: The owner selected one or more Repositories per Project and shared membership across
    Projects. Evidence and lifecycle distinctions are refinements; this node does not choose a default-association
    mechanism, event journal, storage transaction or historical membership interface.
  requirements:
    current_membership: A confirmed valid saved Project configuration supports presence or absence of
      membership for the same identified Project and Repository. A valid saved Project has one or more
      members under 0025; that invariant does not imply an internal intermediate state. Membership is
      scoped to that Project and not a Repository property independent of Project. An unreadable, inconsistent
      or indeterminate configuration is unknown, not a confirmed presence or absence.
    intent_and_outcome: An editor selection or submitted edit is an intention, not by itself a confirmed
      saved change. A missing acknowledgement or cancellation after submission does not alone prove commit
      or rollback; preserve the applicable uncertainty and recovery under 0025.
    comparison: Comparing compatible confirmed valid configurations of the same identified Project and
      Repository can support a membership difference. It does not by itself establish the actor, motive,
      exact change time or all intermediate changes. Equal membership at two observations does not prove
      uninterrupted membership between them.
    replacement: A valid saved edit can replace sole member A with eligible B under 0025. The before and
      after configurations do not establish an observed empty intermediate Project, the internal action
      order or evidence that separate add and remove actions were executed.
    readdition: A later valid edit can add the same confirmed Repository back to the same surviving Project.
      Preserve their supported identities and any supported earlier removal as historical evidence; the
      change does not alter another Project or the source Repository.
    actor_boundary: A source or local membership link alone does not establish an actor-action-derived
      relation in the owner's ontology sense. When actual action evidence exists, attribute only its supported
      actor, object, scope and time; do not infer a motive from membership or an Issue link.
    saved_data: On GitHub-confirmed private Repository access revocation for the relevant account, keep
      already saved local data visible as last known with indication and supported update time when known
      under 0019. Revocation does not silently remove membership; synchronization of the affected Repository
      stops while revocation applies.
  scenarios:
    inconsistent_configuration: A persisted Project configuration lists R but is inconsistent and its
      validity cannot be established. Do not present R's membership as confirmed solely from that list.
    shared_membership: Repository R belongs to Projects P and Q. A valid saved edit removes R from P while
      leaving P nonempty. Q and the source Repository are unchanged.
    remove_then_readd: R is removed from P and later explicitly re-added to the same surviving Project.
      P and R retain their identities; a supported earlier removal remains a past observation.
    same_endpoints: P contains R in two compatible confirmed observations, but no intervening history
      is available. Do not assert either uninterrupted membership or a removal and re-addition between
      them.
    different_causes: A submitted edit has an indeterminate outcome, while a later configuration shows
      R absent. Without operation-specific evidence, do not credit that submitted edit or a particular
      actor as the cause of the difference.
  open_questions:
  - Evidence and recovery for an indeterminate Project edit, including concurrent changes.
  - Whether a separately defined default association is needed and how it relates to membership.
  - Any retention or presentation of historical membership and action evidence.
  ontology_status: Project, Repository and User use working draft vocabulary. A supported membership link
    is not by itself evidence that a particular actor performed a specific action or had a motive.
acceptance:
- Membership presence or absence is attributed to a confirmed valid configuration for the same identified
  Project and Repository; unreadable, inconsistent or indeterminate configuration remains unknown.
- Pending or uncertain changes are not represented as confirmed committed or rolled back without applicable
  evidence.
- Removing or re-adding a Repository to one Project does not change another Project or the source Repository.
- Comparing saved configurations does not by itself prove an actor, motive, exact action time or complete
  history.
- Confirmed private Repository revocation does not silently erase membership or hide supported saved local
  data under 0019.
