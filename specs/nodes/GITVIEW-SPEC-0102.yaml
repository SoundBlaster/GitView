sources:
  predecessor_draft: docs/drafts/GITVIEW-SPEC-0102.yaml
specification:
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  - gitview:projectIncludesRepository
  objective: Explain what a Today work collection or count covers without assuming all matching source
    objects have been identified or that a finished refresh is a complete snapshot.
  authority_boundary: Today includes earlier unfinished work and work completed during the user's current
    local day under 0027. Source acquisition strategy, pagination, request budgets and completeness method
    remain open; this node does not establish source capabilities or an implemented synchronization path.
  requirements:
    coverage: Attribute each supported population claim to its metric, unit, Repository and Project scope,
      membership basis, object types, applicable selection and filters, source context, coverage and supported
      reference time or interval. A successful request or completed traversal alone does not prove a complete
      or continuously current source snapshot. An unknown reference or denominator is not invented.
    count_and_cards: A sufficiently supported count for a specific predicate, scope and time can be known
      without identifying every contributing object. Show independently supported cards with their actual
      selection context and make incomplete materialization discoverable; do not fabricate missing cards.
      Equal counts do not alone establish identical object membership even at the same stated time and
      scope. An exhaustive grid claim also needs sufficient distinct identity and applicable predicate
      evidence; uncertain candidates remain distinguishable under 0042. Thread, event and PR units are
      not interchangeable merely because their numbers are equal.
    partial_results: Show available identified objects from partial responses with their own supported
      facts and accessible limitations under 0042. An unobserved source portion is not automatically an
      empty list, a known number of missing cards, a denied Repository or a source deletion.
    separate_outcomes: A later failed or incomplete refresh does not erase an earlier supported observation
      or advance its complete-coverage claim to the later time. Newly observed facts, old observations
      and each request outcome retain their own contexts under 0044 and 0026.
    changed_scope: Membership, day, filters or applicable access can change the selection. Reevaluate
      coverage for the actual scope without relabeling an earlier result as exhaustive for the new one;
      a late result does not replace a different selected context solely due to arrival order.
    saved_data: After GitHub confirms private Repository access revocation for the relevant account, previously
      saved supported data remains visible as last known with revocation indication and supported update
      time when known under 0019; synchronization stops. A late prior response is not treated as a fresh
      update or renewed source access. Other account and sharing policies remain open.
    accessibility: Make collection scope, incomplete coverage, known counts and available actions understandable
      without relying solely on color or transient feedback.
  scenarios:
    known_count_one_card: A supported exact count says two matching PRs for a stated scope and time, but
      only one PR has been identified. Show the supported PR and count with their contexts; do not invent
      a second card or claim an exhaustive grid.
    different_times_equal_counts: A count of two at T1 and two identified cards at T2 have no evidence
      of matching membership. Equal numbers do not prove identical PRs or a complete T1 grid.
    same_scope_uncertain_card: An exact count is two and two cards appear in the same scope and time,
      but one card's active filter outcome is uncertain. Their equal number does not prove that the visible
      cards exhaust the two confirmed matches.
    no_known_cards: No matching objects are individually known while a relevant Repository has incomplete
      coverage. Make the limitation discoverable rather than reporting a confirmed empty source.
    incomplete_refresh: A complete observation exists at T1; a later request at T2 returns partial facts.
      Keep the T1 claim and T2 facts separately contextualized rather than claiming a complete T2 snapshot.
  open_questions:
  - Source-backed evidence and feasible collection strategy for each requested selection and filter.
  - User-facing explanation of partial population and independently supported counts.
  - Native behavior and source access under account changes beyond confirmed private revocation.
  ontology_status: Project, Repository, PullRequest and Issue use selected ontology vocabulary; coverage
    and materialization are observation concepts rather than new domain entities.
acceptance:
- A population claim retains its supported scope, selection, time and coverage and is not inferred complete
  from request success alone.
- An independently supported count is not conflated with the identities or completeness of visible cards.
- Partial responses preserve supported objects and limitations without inventing missing cards or a confirmed
  empty source.
- Changed scopes and failed or partial refreshes do not relabel earlier observations as complete for a
  new context.
- Confirmed private Repository revocation preserves supported saved local data with indication and supported
  time when known.
