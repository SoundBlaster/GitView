id: GITVIEW-SPEC-0065
title: GitView - Evidence for historical metric values
kind: spec
created_at: '2026-11-16T11:39:00Z'
updated_at: '2026-11-16T11:39:00Z'
status: outlined
refines:
- GITVIEW-SPEC-0030
depends_on:
- GITVIEW-SPEC-0019
- GITVIEW-SPEC-0044
- GITVIEW-SPEC-0046
- GITVIEW-SPEC-0064
sources:
  predecessor_draft: docs/drafts/GITVIEW-SPEC-0065.yaml
  metric_catalog: docs/drafts/GITVIEW-SPEC-0057.yaml
  source_research_candidate: docs/drafts/github-history-evidence-20261114.md
specification:
  ontology_refs:
  - gitview:Project
  - gitview:Repository
  - gitview:PullRequest
  - gitview:Issue
  - gitview:Metric
  - gitview:projectIncludesRepository
  objective: Make historical metrics explain what their evidence supports without assuming complete source
    history.
  authority_boundary: The owner selected metrics and graphs when history is available. Evidence criteria
    are refinements; source queries, reconstruction algorithms, collection frequency and storage remain
    open. This node does not establish available GitHub history or a working implementation.
  requirements:
    occurrence: A supported event with its subject, type, source scope and event time establishes that
      occurrence, not a complete period population. The observation time is separate from the event time.
    units: Distinguish an event count, a count of distinct objects with events, and a state snapshot at
      a stated time. Reobserving an event does not create another event; sufficiently supported identity
      and coverage are necessary for an exact total or zero in the stated scope.
    object_type: A PR closure is not an Issue closure or automatically a PR merge. If the source subject
      type is unresolved, do not silently classify it as an Issue, discard it as definitely irrelevant
      or assert a complete type-dependent count.
    state: A past count of open work or attention requires sufficiently covered observations for the relevant
      population and facts at that time, or a separately justified reconstruction with sufficient baseline,
      transitions, ordering, identity and source evidence. A present snapshot or isolated event does not
      by itself prove a historical state.
    reasons: A historical closure reason requires evidence applicable to that event; a current reason
      observed later is not automatically its historical reason. Unavailable reason remains unknown.
    coverage: Retain and show the supported Project membership basis, per-Repository source scope, period,
      times and coverage available for each value or gap under 0064. Unrecoverable attribution remains
      a visible limitation rather than invented context or grounds to hide a supported saved value after
      confirmed private revocation. A known event within incomplete scope is partial, not a confirmed
      full total.
    saved_data: On GitHub-confirmed private Repository access revocation for the relevant account, keep
      previously saved supported historical values locally visible as last known with indication and supported
      times when known under 0019; synchronization stops. Missing evidence remains a limitation, not zero
      or a new source grant. Other account-change and external-sharing policies remain open.
    accessibility: Make metric unit, scope, applicable gaps and known values understandable without relying
      solely on color or transient feedback.
  scenarios:
    repeated_event: One Issue has two supported closure events in a period and one event is observed twice.
      Known observations support two events and one distinct Issue, not three events or two Issues; full
      period totals still require coverage.
    subject_unknown: A closure is supported but its subject is not established as Issue or PR. Keep its
      type-dependent contribution uncertain rather than calling it a confirmed Issue closure or zero.
    missing_snapshot: Monday and Wednesday observations exist but no adequate Tuesday state or transition
      evidence exists. Tuesday remains a gap, not Monday carried forward or a fabricated zero.
    unknown_reason: An Issue closure has no supported event reason, though a later current reason is known.
      The earlier event reason remains unknown unless independently established.
    review_event: A review request was observed Monday but subsequent actions are unobserved. That event
      alone does not establish a still-pending request or aggregate review decision on Tuesday.
    missing_later_check: A previously saved check observation is absent from a later source result with
      no evidence explaining why. The earlier observation retains its own context; the absence does not
      prove the check never existed or establish a deletion reason.
  open_questions:
  - Source-specific history coverage, identity, ordering and permissions for each selected metric.
  - Appropriate snapshot and reconstruction evidence, sampling and retention per metric.
  - Native presentation of partial historical values and gaps.
  ontology_status: Project, Repository, PullRequest, Issue and Metric use selected ontology vocabulary;
    historical evidence and measurement are not new domain entities.
acceptance:
- Historical event, distinct-object and state-snapshot measurements keep their units and evidence distinct.
- A known event is not by itself proof of complete event or Project population coverage.
- Unknown type, missing historical evidence and incomplete coverage do not become confirmed zero or an
  exact total.
- Previously saved supported values remain visible after confirmed private Repository revocation with
  indication and supported time when known.
- Metric units, coverage and gaps are accessible without relying only on color or transient feedback.
