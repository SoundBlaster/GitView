apiVersion: ontology.specgraph.io/v1alpha1
kind: DomainOntologyPackage
metadata:
  id: local.gitview.domain
  namespace: gitview
  version: 0.2.0-draft.3
  publisher: GitView
  source: conversation_memory/sketches/gitview
  approvalStatus: draft
spec:
  imports:
  - id: ontology.foundation
    namespace: ont
    version: 0.2.0
  classes:
    User:
      extends: ont:DomainEntity
      description: Identified participant operating GitView in this interaction. A GitHub author, reviewer or
        assignee reference alone does not identify this operator. Identity storage and authentication belong
        to the application.
    AddRepository:
      extends: ont:Action
      description: Add the referenced existing Repository to the Project named as the object of this interaction.
      fields:
        repositoryId:
          type: string
          required: true
          description: Opaque reference resolved against the application's repository inventory.
    Project:
      extends: ont:DomainEntity
      description: A GitView project. Membership, identity and lifecycle are discussed separately.
      fields:
        name:
          type: string
          required: false
          description: Selected display name; optional here only for a partial projection, not a completed-project
            creation rule.
        description:
          type: string
          required: false
          description: Optional selected purpose description.
    Code:
      extends: ont:DomainEntity
      description: Code, described by the owner as essentially a folder with files. Its precise boundary remains
        open.
    VersionControlSystem:
      extends: ont:DomainEntity
      description: A system that acts on code to manage versions; Git is the example named for GitView.
    Repository:
      extends: ont:DomainEntity
      description: Code in which a version control system acts, in the owner's working formulation.
    GitHub:
      extends: ont:DomainEntity
      description: GitHub, which can occupy the actor role when managing a repository and its change workflow.
    Issue:
      extends: ont:DomainEntity
      description: A GitHub issue; in the discussed example it provides a motive for an actor's action.
      fields:
        sourceId:
          type: string
          required: false
          description: Opaque identifier as observed in GitHub; not a decision about stable cross-owner identity
            or framework id mapping.
        number:
          type: integer
          required: false
          description: Number within the source repository; not a portfolio-wide identifier.
        title:
          type: string
          required: false
          description: Title from the source.
        body:
          type: string
          required: false
          description: Original description text; missing text is not generated.
        url:
          type: string
          required: false
          description: Original object link; URL identity and normalization rules remain open.
        lifecycleState:
          type: string
          required: false
          description: Selected lifecycle vocabulary; mapping and enum constraints require review.
        problemText:
          type: string
          required: false
          description: Problem section text, if present.
        motivationText:
          type: string
          required: false
          description: Authored Motivation section; does not prove an actor motive.
        expectedOutcomeText:
          type: string
          required: false
          description: Intended result section; not evidence of achievement.
        referencesText:
          type: string
          required: false
          description: Raw References section text, not a serialized structured link collection.
        stateReason:
          type: string
          required: false
          description: State/closure reason if supplied; closed is not automatically completed.
        issueType:
          type: string
          required: false
          description: Source Issue type when present; not the labels collection.
        commentCount:
          type: integer
          required: false
          description: Comments; known nonnegative count, no default for unavailable data.
        participantCount:
          type: integer
          required: false
          description: Discussion participants; known nonnegative count, no default for unavailable data.
        directSubIssueCount:
          type: integer
          required: false
          description: Direct sub-issues; known nonnegative count, no default for unavailable data.
        closedDirectSubIssueCount:
          type: integer
          required: false
          description: Closed direct sub-issues; known nonnegative count, no default for unavailable data.
    PullRequest:
      extends: ont:DomainEntity
      description: A GitHub pull request associated with proposed code changes; creation does not imply merging.
      fields:
        sourceId:
          type: string
          required: false
          description: Opaque identifier as observed in GitHub; not a decision about stable cross-owner identity
            or framework id mapping.
        number:
          type: integer
          required: false
          description: Number within the source repository; not a portfolio-wide identifier.
        title:
          type: string
          required: false
          description: Title from the source.
        body:
          type: string
          required: false
          description: Original description text; missing text is not generated.
        url:
          type: string
          required: false
          description: Original object link; URL identity and normalization rules remain open.
        lifecycleState:
          type: string
          required: false
          description: Selected lifecycle vocabulary; mapping and enum constraints require review.
        problemText:
          type: string
          required: false
          description: Problem section text, if present.
        motivationText:
          type: string
          required: false
          description: Authored Motivation section; does not prove an actor motive.
        expectedOutcomeText:
          type: string
          required: false
          description: Intended result section; not evidence of achievement.
        referencesText:
          type: string
          required: false
          description: Raw References section text, not a serialized structured link collection.
        isDraft:
          type: boolean
          required: false
          description: Draft flag separately from lifecycle, review and CI.
        baseBranch:
          type: string
          required: false
          description: Source-provided target branch name/reference; no branch entity introduced.
        headBranch:
          type: string
          required: false
          description: Source-provided source branch name/reference.
        revisionRef:
          type: string
          required: false
          description: Reference to the observed current change revision; relevance/attempt rules remain open.
        reviewAssessment:
          type: string
          required: false
          description: Source aggregate review assessment; unavailable assessment is not approval.
        changesText:
          type: string
          required: false
          description: Authored Changes section.
        validationText:
          type: string
          required: false
          description: Authored Validation section; not independently verified evidence.
        reviewThreadCount:
          type: integer
          required: false
          description: All review threads; known nonnegative count, no default for unavailable data.
        unresolvedReviewThreadCount:
          type: integer
          required: false
          description: Unresolved review threads; known nonnegative count, no default for unavailable data.
        redCheckCount:
          type: integer
          required: false
          description: Current red individual checks; known nonnegative count, no default for unavailable data.
        yellowCheckCount:
          type: integer
          required: false
          description: Current yellow individual checks; known nonnegative count, no default for unavailable data.
        greenCheckCount:
          type: integer
          required: false
          description: Current green individual checks; known nonnegative count, no default for unavailable data.
        totalCheckCount:
          type: integer
          required: false
          description: All current individual checks; known nonnegative count, no default for unavailable data.
        addedLineCount:
          type: integer
          required: false
          description: Added lines; known nonnegative count, no default for unavailable data.
        deletedLineCount:
          type: integer
          required: false
          description: Deleted lines; known nonnegative count, no default for unavailable data.
        changedFileCount:
          type: integer
          required: false
          description: Changed files; known nonnegative count, no default for unavailable data.
        commitCount:
          type: integer
          required: false
          description: Commits; known nonnegative count, no default for unavailable data.
    ReviewThread:
      extends: ont:DomainEntity
      description: A discussion thread relevant to review; duration and resolution semantics need clarification.
    CIStatus:
      extends: ont:ValueObject
      description: An observed CI status, including a failing status; source and readiness semantics remain open.
    Metric:
      extends: ont:ValueObject
      description: A measurement for overview; the meaning, scope and units of each metric remain to be specified.
  relations:
    addsRepositoryTo:
      subject: User
      action: AddRepository
      object: Project
      description: The operator adds an existing repository to this project's membership. The Project keeps
        its identity, and the repository can also be a member of other projects.
    versionControlsCode:
      domain: VersionControlSystem
      range: Code
      description: Candidate declaration for a version-control system acting on code; the originating action and
        resulting property require further modeling.
    managesRepository:
      domain: GitHub
      range: Repository
      description: Candidate declaration for GitHub acting as manager of a repository; contextual role and resulting
        property require further modeling.
    projectIncludesRepository:
      domain: Project
      range: Repository
      cardinality:
        min: 1
        max: '*'
      description: Selected membership link. Current product requires the GitHubRepository context; reverse membership
        can span Projects. Does not assert the actor/action that established membership.
    pullRequestRepository:
      domain: PullRequest
      range: Repository
      cardinality:
        min: 1
        max: 1
      description: Selected target/source-host repository context for this PR, restricted to GitHubRepository by
        the contextual contract; not its head-fork identity.
    issueRepository:
      domain: Issue
      range: Repository
      cardinality:
        min: 1
        max: 1
      description: Selected source repository context for this Issue, restricted to GitHubRepository by the contextual
        contract.
    pullRequestIssueLink:
      domain: PullRequest
      range: Issue
      cardinality:
        min: 0
        max: '*'
      description: Selected source link to Issue; no motive or causal attribution inferred.
    issueClosingPullRequest:
      domain: Issue
      range: PullRequest
      cardinality:
        min: 0
        max: '*'
      description: Explicit source closing link, distinct from a mention; no completed outcome inferred.
    issueMentionedPullRequest:
      domain: Issue
      range: PullRequest
      cardinality:
        min: 0
        max: '*'
      description: Source mention without an inferred closing relation or motive.
    issueParent:
      domain: Issue
      range: Issue
      cardinality:
        min: 0
        max: '*'
      description: Selected parent link; hierarchy rules and inverse consistency remain to be specified.
    issueSubIssue:
      domain: Issue
      range: Issue
      cardinality:
        min: 0
        max: '*'
      description: Selected direct sub-issue link, not a transitive work-completion measure.
    issueBlockedBy:
      domain: Issue
      range: Issue
      cardinality:
        min: 0
        max: '*'
      description: Selected link to blocking Issue; unknown blocker state is not proof of active blocking.
    issueBlocks:
      domain: Issue
      range: Issue
      cardinality:
        min: 0
        max: '*'
      description: Selected link to an Issue blocked by this Issue; not an actor action.
  protocols:
    GitHubRepository:
      description: Candidate contextual contract for the same Repository under management by GitHub; not a subclass
        or duplicate repository.
      semanticConstraints:
      - Applicable only in a context where management by GitHub is established; merely naming the protocol is not
        evidence of that relation.
      - Project membership and PR/Issue repository references use the underlying Repository identity in this GitHub-scoped
        context.
      - Repository does not globally implement this protocol; non-GitHub repositories are possible outside the current
        product scope.
      - Where the source confirms the same GitHub repository object, rename and transfer preserve the same Repository,
        its accumulated history and Project memberships.
      - Concrete source identity key/encoding, establishing the management relation and remaining GitHub properties
        are still under review.
  policies:
    GitHubRepositoryContext:
      extends: ont:Policy
      enforceability: manual
      appliesTo:
      - Repository
      - Project
      - PullRequest
      - Issue
      text: 'Review contract: current GitView repository membership/source contexts require management by GitHub.
        GitHubRepository names this contextual contract on the same Repository, not a new identity or a globally
        inferred implementation. Compiler relations used for membership/source links do not establish actor-action-derived
        relation occurrences.'
    PartialObservationBoundary:
      extends: ont:Policy
      enforceability: manual
      appliesTo:
      - Project
      - PullRequest
      - Issue
      text: Candidate fields are optional partial projections, not complete entity snapshots or creation requirements.
        Missing is not zero, false, empty, unchanged, or not applicable. Counts are nonnegative when known; enum/range/availability/freshness
        semantics need separate specifications and are not enforced by scalar typing. No identity from the implicit
        generated id is adopted as the source/project key.
    RepositoryIdentityContinuity:
      extends: ont:Policy
      enforceability: manual
      appliesTo:
      - Repository
      - Project
      text: 'Owner-selected scoped rule: when the source confirms the same GitHub repository object across rename
        or transfer, preserve one Repository, its history and Project memberships. Observed owner, name and address
        can change. This rule does not select a particular API ID/encoding, infer identity solely from a URL, or
        approve the whole ontology.'
