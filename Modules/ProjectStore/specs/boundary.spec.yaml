apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: gitview.project-store
  title: Local project storage boundary
  version: 0.1.0
  status: draft
  authors:
    - name: GitView
intent:
  summary: Persist projects and repository references in an account-scoped local store.
scope:
  boundedContext: Project configuration
  includes:
    - Create nonempty projects and query them by account.
    - Persist repository identity and last observed name and privacy.
  excludes:
    - Repository access verification, synchronization, editing and migration.
provides:
  capabilities:
    - id: gitview.projects.local_storage
      role: primary
      summary: Save and load account-scoped project configuration.
requires:
  capabilities: []
interfaces:
  inbound: []
  outbound: []
constraints: []
effects: {}
evidence: []
provenance:
  confidence: medium
  notes:
    - GITVIEW-SPEC-0045 governs setup outcomes; this module implements only local project persistence.
implementationBindings: []
